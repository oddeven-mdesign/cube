        <button class="btn primary" type="button" data-a="fold">📐 면 모아 접기</button></div>
      <div class="l2-step" data-step="4"><h5><span class="no">4</span>다면체 완성<em class="ck" aria-hidden="true">✓</em></h5>
        <button class="btn primary" type="button" data-a="complete">🧩 다면체 완성</button></div>
    </div>
    <div class="l2-record">
      <div class="l2-rec-head"><h5><span class="no">5</span>정다면체 기록표</h5>
        <div class="l2-found" aria-live="polite"></div></div>
      <div class="l1-table-wrap"><table class="l1-cmp-table l2-rec-table">
        <thead><tr><th>면의 모양</th><th>모은 개수</th><th>내각의 크기의 합</th><th>결과</th><th>이유 / 이름</th></tr></thead>
        <tbody><tr class="empty"><td colspan="5" class="l0-muted">아직 기록이 없어. 위에서 직접 모아 보자!</td></tr></tbody></table></div>
      <div class="l2-hexhint l0-note" hidden></div>
    </div>
    <div class="l2-summary" hidden></div>`;
  const nameEl = $('.l2-name', wrap), kEl = $('.l2-k', wrap), formula = $('.l2-formula', wrap), result = $('.l2-result', wrap), doneMsg = $('.l2-done-msg', wrap);
  const btn = { minus:$('[data-a="minus"]', wrap), plus:$('[data-a="plus"]', wrap), fold:$('[data-a="fold"]', wrap), complete:$('[data-a="complete"]', wrap), reset:$('[data-a="reset"]', wrap) };
  const st = { p:0, k:0, phase:'pick', u:0, uTarget:0, f2:0, f2Target:0, build:0, records:new Map(), found:new Set(), summaryShown:false, hexTried:false };

  const shapeSeg = createSegmented({
    items:[3, 4, 5, 6].map(p => ({ value:p, label:`${L2_POLYS[p].icon} ${L2_POLYS[p].name}` })),
    value:null, label:'면의 모양 고르기',
    onChange:(p) => { st.p = p; st.k = 1; st.phase = 'flat'; st.u = st.uTarget = 0; rebuild(); },
  });
  $('.l2-shapes', wrap).appendChild(shapeSeg.el);

  const viewer = await create3DViewer($('.l2-viewer', wrap), { showInfo:false, tools:['autoRotate', 'reset'] });
  { // 오른쪽 글 상자들의 전체 높이 = 3D 화면 + 관찰 버튼 높이 (넓은 화면)
    const left = $('.l2-viewer', wrap).parentElement, side = $('.l2-info', wrap);
    const fit = () => { const two = getComputedStyle(left.parentElement).gridTemplateColumns.split(' ').length > 1;
      side.style.height = two ? left.offsetHeight + 'px' : ''; side.classList.toggle('fixed', two); };
    if('ResizeObserver' in window) new ResizeObserver(fit).observe(left); fit();
  }
  { // [처음부터]: 관찰 버튼과 같은 줄, 같은 크기
    const rb = el('button', { class:'tool-btn', type:'button', 'data-a':'reset' }, '↺ 처음부터');
    const tb = $('.l2-viewer .viewer-toolbar', wrap); (tb || $('.l2-info', wrap)).appendChild(rb);
    btn.reset = rb;
  }
  const T = viewer.ok ? viewer.THREE : null;
  const H = T ? l1H(T) : null;
  const S = 1.2;                       // 정다각형 한 변의 길이
  const scene = T ? new T.Group() : null;
  const BASE_Y = 0.6;                 // 꼭짓점(원점)을 화면 가운데보다 조금 위에 두어 접힌 면이 아래로 다 보이게
  const NEAR = 4.4;                    // 평면 단계에서 카메라 거리(위에서 내려다보기)
  const lookFromAbove = () => { if(!T) return; viewer.camera.position.set(0.42, 0.68, 0.6).normalize().multiplyScalar(NEAR); viewer.controls.target.set(0, 0, 0); viewer.controls.update(); viewer.requestRender(); };
  if(T){ viewer.extras.add(scene); scene.position.y = BASE_Y; lookFromAbove(); }
  let polys = [], gapObj = null, apexDot = null, solid = null;

  const maxK = p => Math.min(7, Math.floor(360 / L2_POLYS[p].angle) + 1);
  const sum = () => st.k * (st.p ? L2_POLYS[st.p].angle : 0);
  const status = () => st.k < 3 ? 'few' : sum() < 360 ? 'ok' : sum() === 360 ? 'flat' : 'over';

  /* ---- 정다각형 한 장: 꼭짓점 O에서 두 변 e1, e2 사이에 놓기 ---- */
  function polyPoints(p, e1, e2){
    const a = L2_POLYS[p].angle * Math.PI / 180;
    const x = e1.clone().normalize();
    const y = e2.clone().addScaledVector(x, -Math.cos(a)).divideScalar(Math.sin(a));
    const pts = []; let px = 0, py = 0, head = 0;
    for(let m=0;m<p;m++){ pts.push(x.clone().multiplyScalar(px * S).addScaledVector(y, py * S)); px += Math.cos(head); py += Math.sin(head); head += 2*Math.PI/p; }
    return pts;
  }
  /** 접힘 정도 u(0 평평 → 1 다 접힘)에서 k개의 변 방향 */
  function edgeDirs(u){
    const a = L2_POLYS[st.p].angle * Math.PI / 180, k = st.k;
    const closed = 2*Math.PI / k;
    const dphi = status() === 'ok' ? a + (closed - a) * u : a;
    let cos2 = (Math.cos(a) - Math.cos(dphi)) / (1 - Math.cos(dphi));
    cos2 = Math.max(0, Math.min(1, isFinite(cos2) ? cos2 : 0));
    const ct = Math.sqrt(cos2), stt = Math.sqrt(1 - cos2);
    const total = k * dphi, start = Math.PI/2 - total/2;
    return { dirs:Array.from({length:k + 1}, (_, j) => { const f = start + j*dphi; return new T.Vector3(stt*Math.cos(f), -ct, stt*Math.sin(f)); }), start, total };
  }
  function clearScene(){
    if(!scene) return;
    scene.children.slice().forEach(o => { scene.remove(o); l1Dispose(o); });
    polys = []; gapObj = null; apexDot = null; solid = null;
  }
  function rebuild(){
    shapeSeg.set(st.p || null);
    ui();
    if(!T) return;
    clearScene();
    scene.position.y = BASE_Y;
    if(!st.p || st.k < 1) return;
    const info = L2_POLYS[st.p];
    for(let i=0;i<st.k;i++){
      const over = (i + 1) * info.angle > 360;
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.Float32BufferAttribute(new Float32Array((st.p - 2) * 9), 3));
      const shade = new T.Color(info.color).offsetHSL(0, 0, i % 2 ? -0.06 : 0.04);
      const mesh = new T.Mesh(geo, new T.MeshPhongMaterial({ color:over ? '#EF5350' : shade, side:T.DoubleSide, flatShading:true,
        transparent:true, opacity:over ? 0.55 : 0.92, depthWrite:!over, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }));
      const lg = new T.BufferGeometry(); lg.setAttribute('position', new T.Float32BufferAttribute(new Float32Array(st.p * 3), 3));
      const line = new T.LineLoop(lg, new T.LineBasicMaterial({ color:over ? 0xB71C1C : 0x2B3A55 }));
      const lab = H.label2(`${info.angle}°`, new T.Vector3(), 0.62);
      scene.add(mesh, line, lab);
      polys.push({ mesh, line, lab });
    }
    apexDot = H.dot2(new T.Vector3(), 0.06, '#D50000', false); scene.add(apexDot);
    if(status() === 'ok' || status() === 'few'){
      const { start, total } = edgeDirs(0);
      const r = 0.55;
      const g = new T.CircleGeometry(r, 48, start + total, 2*Math.PI - total).rotateX(Math.PI/2);
      const m = new T.Mesh(g, H.mat('#E53935', 0.35, false)); m.renderOrder = 8;
      const mid = start + total + (2*Math.PI - total) / 2;
      const lab = H.label2(`빈 각 ${360 - sum()}°`, new T.Vector3(Math.cos(mid) * (r + 0.35), 0.05, Math.sin(mid) * (r + 0.35)), 0.7);
      gapObj = H.group(m, lab); scene.add(gapObj);
    }
    pose(st.u);
  }
  function pose(u){
    if(!T || !polys.length) return;
    const { dirs } = edgeDirs(u);
    polys.forEach((P, i) => {
      const pts = polyPoints(st.p, dirs[i], dirs[i + 1]);
      const arr = P.mesh.geometry.attributes.position.array;
      for(let t=1;t<pts.length-1;t++){ [pts[0], pts[t], pts[t+1]].forEach((v, k) => { arr.set([v.x, v.y, v.z], ((t - 1) * 3 + k) * 3); }); }
      P.mesh.geometry.attributes.position.needsUpdate = true; P.mesh.geometry.computeBoundingSphere();
      const la = P.line.geometry.attributes.position.array; pts.forEach((v, k) => la.set([v.x, v.y, v.z], k * 3));
      P.line.geometry.attributes.position.needsUpdate = true; P.line.geometry.computeBoundingSphere();
      const bis = dirs[i].clone().add(dirs[i + 1]).normalize();
      P.lab.position.copy(bis.multiplyScalar(0.5 * S)).add(new T.Vector3(0, 0.06, 0));
    });
    if(gapObj) gapObj.visible = u < 0.02;
    viewer.requestRender();
  }

  /* ---- 완성하기: 같은 방식으로 면을 계속 붙여 닫힌 입체 만들기 ---- */
  function buildSolid(){
    const key = `${st.p}-${st.k}`, info = L2_SOLIDS[key];
    let faces = l2Platonic(T, info.kind, S);
    const verts = l1VertsOf(faces);
    const V = verts.reduce((m, p) => p.y > m.y ? p : m, verts[0]).clone();
    const q = new T.Quaternion().setFromUnitVectors(V.clone().normalize(), new T.Vector3(0, 1, 0));
    const center = new T.Vector3().sub(V).applyQuaternion(q);       // 꼭짓점을 원점에 둘 때 입체의 중심
    faces = faces.map(f => f.map(p => p.clone().applyQuaternion(q).sub(V.clone().applyQuaternion(q))));
    const nb = faces.find(f => f.some(p => p.length() < 1e-4));
    const iV = nb.findIndex(p => p.length() < 1e-4), N = nb[(iV + 1) % nb.length];
    const target = edgeDirs(1).start;
    const rot = new T.Matrix4().makeRotationY(Math.atan2(N.z, N.x) - target);
    faces = faces.map(f => f.map(p => p.clone().applyMatrix4(rot)));
    center.applyMatrix4(rot);
    const order = faces.map((f, i) => ({ f, i, y:H.centroid(f).y, top:f.some(p => p.length() < 1e-4) }))
      .sort((a, b) => (b.top - a.top) || (b.y - a.y));
    const g = new T.Group(); const items = [];
    order.forEach((o, n) => {
      const c = H.centroid(o.f);
      const geo = new T.BufferGeometry(); const pos = [];
      for(let t=1;t<o.f.length-1;t++) [o.f[0], o.f[t], o.f[t+1]].forEach(p => pos.push(p.x - c.x, p.y - c.y, p.z - c.z));
      geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
      const shade = new T.Color(L2_POLYS[st.p].color).offsetHSL((n % 5) * 0.02 - 0.04, 0, (n % 2 ? -0.05 : 0.04));
      const mesh = new T.Mesh(geo, new T.MeshPhongMaterial({ color:shade, side:T.DoubleSide, flatShading:true, transparent:true, opacity:0.95 }));
      mesh.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(o.f.map(p => p.clone().sub(c))), new T.LineBasicMaterial({ color:0x2B3A55 })));
      mesh.position.copy(c);
      const shown = o.top;
      mesh.scale.setScalar(shown ? 1 : 0.001); mesh.visible = shown;
      g.add(mesh); items.push({ mesh, shown });
    });
    const radius = Math.max(...faces.flat().map(p => p.distanceTo(center)));
    return { group:g, items, center, info, radius, dist0:viewer.camera.position.length() };
  }

  /* ---- 애니메이션 ---- */
  if(T){
    viewer.onFrame((dt) => {
      let anim = false;
      if(st.u !== st.uTarget){
        const step = L0_REDUCED_MOTION ? 1 : dt / 1.3;
        st.u = st.uTarget > st.u ? Math.min(st.uTarget, st.u + step) : Math.max(st.uTarget, st.u - step);
        const e = st.u < 0.5 ? 2*st.u*st.u : 1 - Math.pow(-2*st.u + 2, 2) / 2;
        pose(e); anim = true;
        if(st.u === st.uTarget && st.uTarget === 1){ st.phase = 'folded'; ui(); }
      }
      // 면이 2개일 때: 두 번째 면이 공유한 변을 축으로 접혀 첫 번째 면 위에 포개진다 → 평면
      if(st.f2 !== st.f2Target && polys.length === 2){
        const step = L0_REDUCED_MOTION ? 1 : dt / 1.2;
        st.f2 = Math.min(st.f2Target, st.f2 + step);
        const e = st.f2 < 0.5 ? 2*st.f2*st.f2 : 1 - Math.pow(-2*st.f2 + 2, 2) / 2;
        const axis = edgeDirs(0).dirs[1].clone().normalize();
        const q = new T.Quaternion().setFromAxisAngle(axis, -Math.PI * e);
        const P = polys[1]; [P.mesh, P.line].forEach(o => o.quaternion.copy(q));
        P.lab.visible = e < 0.5;
        if(gapObj) gapObj.visible = false;
        anim = true;
        if(st.f2 === st.f2Target){
          result.innerHTML = `<div class="l2-res no">➖ <b>두 면이 포개져 붙어서 평면이 돼요.</b> 면이 2개뿐이면 접어도 한 장의 평면이 될 뿐, 입체의 꼭짓점이 생기지 않아. 면이 <b>적어도 3개</b> 필요해!</div>`;
        }
      }
      if(st.phase === 'building' && solid){
        st.build += L0_REDUCED_MOTION ? 999 : dt;
        const per = Math.max(0.12, 2.6 / solid.items.length);
        let all = true;
        solid.items.forEach((it, n) => {
          if(it.shown) return;
          const local = (st.build - n * per) / 0.35;
          if(local <= 0){ all = false; return; }
          it.mesh.visible = true;
          const k = Math.min(1, local); it.mesh.scale.setScalar(0.001 + 0.999 * (1 - Math.pow(1 - k, 3)));
          if(k < 1) all = false;
        });
        const k = Math.min(1, st.build / (per * solid.items.length + 0.4));
        scene.position.y = BASE_Y + (-solid.center.y - BASE_Y) * k;
        const want = Math.max(NEAR, solid.radius * 4);            // 완성된 입체가 화면에 다 들어오게 카메라를 뒤로
        viewer.camera.position.setLength(solid.dist0 + (want - solid.dist0) * k);
        anim = true;
        if(all && k >= 1){ st.phase = 'built'; ui(); celebrate(); }
      }
      return anim;
    });
  }

  /* ---- 기록표 ---- */
  function record(){
    const key = `${st.p}-${st.k}`, s = status(), info = L2_POLYS[st.p];
    const solidInfo = L2_SOLIDS[key];
    let res, why;
    if(s === 'few'){ res = '실패'; why = st.k === 2 ? '두 면이 포개져 붙어서 평면이 돼' : '면이 3개 이상 있어야 입체의 꼭짓점이 돼'; }
    else if(s === 'ok'){ res = '성공'; why = `360°보다 작아서 꼭짓점이 생겨 → <b>${solidInfo.name}</b>`; st.found.add(solidInfo.name); }
    else if(s === 'flat'){ res = '실패'; why = '360°가 되어 평면이 돼'; }
    else { res = '실패'; why = '360°보다 커서 겹쳐'; }
    if(st.p === 6) st.hexTried = true;
    st.records.set(key, { p:st.p, k:st.k, sum:sum(), res, why });
    renderRecords();
  }
  function renderRecords(){
    const tb = $('.l2-rec-table tbody', wrap);
    const rows = [...st.records.values()].sort((a, b) => a.p - b.p || a.k - b.k);
    tb.innerHTML = rows.length ? rows.map(r => `<tr class="${r.res === '성공' ? 'yes' : 'no'}">
        <td>${L2_POLYS[r.p].icon} ${L2_POLYS[r.p].name}</td><td>${r.k}개</td>
        <td>$${L2_POLYS[r.p].angle}^\\circ \\times ${r.k} = ${r.sum}^\\circ$</td>
        <td class="res">${r.res === '성공' ? '⭕ 성공' : '❌ 실패'}</td><td class="why">${r.why}</td></tr>`).join('')
      : `<tr class="empty"><td colspan="5" class="l0-muted">아직 기록이 없어. 위에서 직접 모아 보자!</td></tr>`;
    renderMath(tb);
    $('.l2-found', wrap).setAttribute('aria-label', `찾은 정다면체 ${st.found.size}개 / 5개`);
    $('.l2-found', wrap).innerHTML =
      L2_ORDER.map(n => `<span class="l2-chip ${st.found.has(n) ? 'on' : ''}">${st.found.has(n) ? '✓ ' + n : '?'}</span>`).join('');
    const hh = $('.l2-hexhint', wrap);
    if(st.found.size === 5 && !st.hexTried){
      hh.hidden = false;
      hh.innerHTML = '🤔 다섯 가지를 모두 찾았어! 그런데 <b>정육각형</b>으로는 정다면체를 만들 수 없을까? 정육각형 3개를 모아 [면 모아 접기]를 눌러 확인해 보자.';
    }else hh.hidden = true;
    if(st.found.size === 5 && st.hexTried && !st.summaryShown) showSummary();
  }
  function showSummary(){
    st.summaryShown = true;
    const box = $('.l2-summary', wrap); box.hidden = false;
    box.innerHTML = `<div class="concept-box">
      <span class="concept-title">🏆 정리: 정다면체는 다섯 가지뿐!</span>
      <p>정다면체는 <b>정사면체, 정육면체, 정팔면체, 정십이면체, 정이십면체</b>의 <b>다섯 가지뿐</b>이야.</p>
      <p>한 꼭짓점에 면이 <b>3개 이상</b> 모여야 하고, 모인 내각의 크기의 합이 <b>360°보다 작아야</b> 입체의 꼭짓점이 만들어지기 때문이야.</p>
      <table class="l1-cmp-table l2-sum-table"><thead><tr><th>면의 모양</th><th>한 꼭짓점에 모인 면의 개수</th><th>정다면체</th></tr></thead><tbody>
        <tr><td rowspan="3">△ 정삼각형 (60°)</td><td>3개: $60^\\circ \\times 3 = 180^\\circ$</td><td>정사면체</td></tr>
        <tr><td>4개: $60^\\circ \\times 4 = 240^\\circ$</td><td>정팔면체</td></tr>
        <tr><td>5개: $60^\\circ \\times 5 = 300^\\circ$</td><td>정이십면체</td></tr>
        <tr><td>□ 정사각형 (90°)</td><td>3개: $90^\\circ \\times 3 = 270^\\circ$</td><td>정육면체</td></tr>
        <tr><td>⬠ 정오각형 (108°)</td><td>3개: $108^\\circ \\times 3 = 324^\\circ$</td><td>정십이면체</td></tr>
        <tr class="no"><td>⬡ 정육각형 (120°)</td><td>3개: $120^\\circ \\times 3 = 360^\\circ$</td><td>❌ 만들 수 없음</td></tr>
      </tbody></table>
      <p style="margin-bottom:0">정삼각형 6개($360^\\circ$), 정사각형 4개($360^\\circ$), 정오각형 4개($432^\\circ$)도 안 되고, 정육각형 이상은 3개만 모아도 $360^\\circ$ 이상이 되어 꼭짓점을 만들 수 없어.</p>
    </div>`;
    renderMath(box);
    toast('🏆 정다면체 다섯 가지를 모두 찾았어! 정리 카드를 확인해 보자.', 3500);
    box.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  /* ---- 화면 문구와 버튼 상태 ---- */
  function ui(){
    const has = !!st.p, s = status(), info = has ? L2_POLYS[st.p] : null;
    kEl.textContent = has ? `${st.k}개` : '0개';
    btn.minus.disabled = !has || st.k <= 1 || st.phase === 'building';
    btn.plus.disabled = !has || st.k >= maxK(st.p) || st.phase === 'building';
    btn.fold.disabled = !has || st.phase !== 'flat' || st.u !== 0;
    btn.complete.disabled = st.phase !== 'folded';
    if(has){
      const total = sum();
      const rel = total < 360 ? `<span class="l2-tag ok">360°보다 작아</span> 빈 각: $360^\\circ - ${total}^\\circ = ${360 - total}^\\circ$`
        : total === 360 ? `<span class="l2-tag eq">= 360°</span> 빈틈이 없어` : `<span class="l2-tag over">360°보다 커</span> $${total - 360}^\\circ$만큼 겹쳐`;
      formula.innerHTML = `한 점에 모인 내각의 크기의 합<br><b class="l2-eq">$${info.angle}^\\circ \\times ${st.k} = ${total}^\\circ$</b><br>${rel}`;
      renderMath(formula);
    }else formula.innerHTML = '<span class="l0-muted">먼저 아래 ① 면의 모양에서 도형을 선택하세요.</span>';
    // 단계 표시
    const stepState = { 1:has ? 'done' : 'active', 2:!has ? 'locked' : (st.k >= 3 ? 'done' : 'active'),
      3:!has ? 'locked' : (['folded', 'building', 'built'].includes(st.phase) ? 'done' : 'active'),
      4:['folded'].includes(st.phase) ? 'active' : (['building', 'built'].includes(st.phase) ? 'done' : 'locked') };
    wrap.querySelectorAll('.l2-step').forEach(e => { e.dataset.state = stepState[e.dataset.step]; });
    // 이름표
    // 단계별 설명이 이어 붙는다: ○○ k개가 → 각 꼭짓점마다 ○○ k개가 모인 → 각 꼭짓점마다 합동인 ○○ k개가 모인 ○○면체
    if(!has) nameEl.textContent = '면의 모양을 선택하세요.';
    else if(st.phase === 'built') nameEl.innerHTML = `각 꼭짓점마다 합동인 ${info.name} ${st.k}개가 모인 <b>${L2_SOLIDS[`${st.p}-${st.k}`].name}</b>`;
    else if(['folded', 'building'].includes(st.phase)) nameEl.textContent = `각 꼭짓점마다 ${info.name} ${st.k}개가 모인`;
    else nameEl.textContent = `${info.name} ${st.k}개가`;
    $('.l2-namebox', wrap).classList.toggle('good', st.phase === 'built');
    if(st.phase === 'flat' && st.u === 0) result.innerHTML = '';
    if(st.phase === 'folded') result.innerHTML = `<div class="l2-res ok">⭕ <b>꼭짓점을 만들 수 있어요!</b> 내각의 크기의 합이 360°보다 작아서 틈을 닫으며 접어 올릴 수 있어. [다면체 완성]을 눌러 보자.</div>`;
    if(st.phase === 'building') doneMsg.innerHTML = '같은 방식으로 꼭짓점마다 정다각형을 붙여 나가는 중…';
    else if(st.phase === 'built'){
      const sol = L2_SOLIDS[`${st.p}-${st.k}`];
      doneMsg.innerHTML = `<div class="l2-res ok">🎉 <b>${sol.name}</b> 완성! ${info.name} <b>${sol.faces}개</b>로 둘러싸여 있고, 각 꼭짓점에 면이 <b>${st.k}개</b>씩 모여 있어.</div>`;
    }else doneMsg.innerHTML = '';
  }

  /* ---- 버튼 ---- */
  const toFlat = () => {
    if(solid){ scene.remove(solid.group); l1Dispose(solid.group); solid = null; lookFromAbove(); }
    st.phase = 'flat'; st.u = st.uTarget = 0; st.build = 0; st.f2 = st.f2Target = 0;
  };
  btn.plus.addEventListener('click', () => { if(st.k < maxK(st.p)){ st.k++; toFlat(); rebuild(); } });
  btn.minus.addEventListener('click', () => { if(st.k > 1){ st.k--; toFlat(); rebuild(); } });
  btn.fold.addEventListener('click', () => {
    const s = status();
    record();
    if(s === 'ok' && !T){ st.u = st.uTarget = 1; st.phase = 'folded'; ui(); return; }
    if(s === 'ok'){ st.uTarget = 1; st.phase = 'folding'; viewer.requestRender && viewer.requestRender(); result.innerHTML = '<div class="l2-res">틈을 닫으며 면을 모아 접는 중…</div>'; ui(); return; }
    if(s === 'few' && st.k === 2 && T && polys.length === 2){
      st.f2 = 0; st.f2Target = 1; result.innerHTML = '<div class="l2-res">두 면을 공유한 변을 따라 접는 중…</div>'; viewer.requestRender(); return;
    }
    const msgs = {
      few:`<div class="l2-res no">✋ 면이 ${st.k}개뿐이야. 입체의 꼭짓점이 되려면 면이 <b>적어도 3개</b> 필요해. [➕ 하나 더]를 눌러 보자.</div>`,
      flat:`<div class="l2-res no">➖ <b>평면이 되어 입체가 되지 않아요.</b> 내각의 크기의 합이 정확히 360°라서 빈틈 없이 평평하게 꽉 차. 접어 올릴 틈이 없어!</div>`,
      over:`<div class="l2-res no">❌ <b>겹쳐서 모을 수 없어요.</b> 내각의 크기의 합이 360°보다 커서 도형끼리 겹쳐 버려. (빨간 부분)</div>`,
    };
    result.innerHTML = msgs[s];
    if(T && polys.length){ const g = scene; let t = 0; const off = viewer.onFrame(dt => { t += dt; g.position.x = Math.sin(t * 40) * 0.04 * Math.max(0, 1 - t / 0.4); if(t > 0.4){ g.position.x = 0; off(); } return true; }); }
  });
  btn.complete.addEventListener('click', () => {
    if(st.phase !== 'folded' || !T) return;
    polys.forEach(P => { P.mesh.visible = false; P.line.visible = false; P.lab.visible = false; });
    if(apexDot) apexDot.visible = false;
    solid = buildSolid(); scene.add(solid.group);
    st.phase = 'building'; st.build = 0; ui(); viewer.requestRender();
  });
  btn.reset.addEventListener('click', () => { st.p = 0; st.k = 0; toFlat(); st.phase = 'pick'; rebuild(); });
  rebuild(); renderRecords();
}

/* =====================================================================
   2. 정다면체 (뒷부분)
   ---------------------------------------------------------------------
   시뮬레이션 ② 정다면체 ↔ 전개도 전환 ★ → l2SetupNetSim()
   활동 ③ 정다면체 3D 관찰하기            → l2SetupObserve()  (세어 보기)
          관찰 결과 표(교과서 문제 3)     → l2SetupFactTable()
          정다면체 전시관                 → l2SetupGallery()
   ===================================================================== */
const L2_KINDS = [
  { kind:'tetra',  name:'정사면체' }, { kind:'cube', name:'정육면체' }, { kind:'octa', name:'정팔면체' },
  { kind:'dodeca', name:'정십이면체' }, { kind:'icosa', name:'정이십면체' },
];
const L2_FACTS = {
  tetra:{ shape:'정삼각형', meet:3, F:4, E:6, V:4, color:'#FFB74D' },
  cube:{ shape:'정사각형', meet:3, F:6, E:12, V:8, color:'#4FC3F7' },
  octa:{ shape:'정삼각형', meet:4, F:8, E:12, V:6, color:'#BA68C8' },
  dodeca:{ shape:'정오각형', meet:3, F:12, E:30, V:20, color:'#AED581' },
  icosa:{ shape:'정삼각형', meet:5, F:20, E:30, V:12, color:'#F06292' },
};
const L2_PAIR_COLORS = ['#E53935', '#1E88E5', '#43A047', '#FB8C00', '#8E24AA', '#00ACC1', '#FDD835', '#6D4C41',
  '#D81B60', '#3949AB', '#7CB342', '#F4511E', '#5E35B1', '#00897B', '#C0CA33', '#546E7A', '#EC407A', '#26A69A', '#AB47BC', '#FFA000'];

/* ---------- 전개도: 면 트리 만들기 ---------- */
function l2OutwardNormal(T, H, f){ const n = H.normalOf(f), c = H.centroid(f); if(n.dot(c) < 0) n.negate(); return n; }
function l2PolyOverlap(A, B){
  const axes = [];
  for(const P of [A, B]) for(let i=0;i<P.length;i++){ const a = P[i], b = P[(i+1) % P.length]; axes.push([-(b[1] - a[1]), b[0] - a[0]]); }
  for(const [ax, az] of axes){
    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
    for(const p of A){ const d = p[0]*ax + p[1]*az; a0 = Math.min(a0, d); a1 = Math.max(a1, d); }
    for(const p of B){ const d = p[0]*ax + p[1]*az; b0 = Math.min(b0, d); b1 = Math.max(b1, d); }
    if(a1 <= b0 + 1e-6 || b1 <= a0 + 1e-6) return false;
  }
  return true;
}
/**
 * 정다면체 면 목록과 기준 면(root)으로 전개도 트리 만들기
 * spec: 부모 면 번호 배열(직접 지정) 또는 'bfs' | 'dfs'
 */
function l2BuildNet(T, H, faces0, root, spec){
  const q = new T.Quaternion().setFromUnitVectors(l2OutwardNormal(T, H, faces0[root]), new T.Vector3(0, -1, 0));
  const faces = faces0.map(f => f.map(p => p.clone().applyQuaternion(q)));
  const key = p => [p.x, p.y, p.z].map(v => (Math.round(v * 1e4) / 1e4 + 0).toFixed(4)).join(',');
  const edgeMap = new Map();
  faces.forEach((f, fi) => f.forEach((p, i) => {
    const r = f[(i+1) % f.length]; const k = [key(p), key(r)].sort().join('|');
    if(!edgeMap.has(k)) edgeMap.set(k, { pts:[p, r], faces:[] });
    edgeMap.get(k).faces.push(fi);
  }));
  const nbrs = faces.map(() => []);
  edgeMap.forEach((e, k) => { if(e.faces.length === 2){ nbrs[e.faces[0]].push({ g:e.faces[1], k }); nbrs[e.faces[1]].push({ g:e.faces[0], k }); } });
  const parent = new Array(faces.length).fill(-1), hingeKey = new Array(faces.length).fill(null);
  if(Array.isArray(spec)){
    spec.forEach((pf, fi) => { if(fi === root || pf < 0) return; parent[fi] = pf; const nb = nbrs[fi].find(n => n.g === pf); hingeKey[fi] = nb ? nb.k : null; });
  }else if(spec === 'dfs'){
    const seen = new Set([root]);
    const go = (f) => nbrs[f].forEach(n => { if(!seen.has(n.g)){ seen.add(n.g); parent[n.g] = f; hingeKey[n.g] = n.k; go(n.g); } });
    go(root);
  }else{
    const seen = new Set([root]), queue = [root];
    while(queue.length){ const f = queue.shift(); nbrs[f].forEach(n => { if(!seen.has(n.g)){ seen.add(n.g); parent[n.g] = f; hingeKey[n.g] = n.k; queue.push(n.g); } }); }
  }
  // 부모 → 자식 순서
  const order = [root], children = faces.map(() => []);
  parent.forEach((pf, fi) => { if(pf >= 0) children[pf].push(fi); });
  for(let i=0;i<order.length;i++) children[order[i]].forEach(c => order.push(c));
  const valid = order.length === faces.length && hingeKey.every((k, fi) => fi === root || k);
  const normals = faces.map(f => l2OutwardNormal(T, H, f));
  const hinge = faces.map((f, fi) => {
    if(fi === root || !hingeKey[fi]) return null;
    const [p, r] = edgeMap.get(hingeKey[fi]).pts, a = r.clone().sub(p).normalize();
    const nc = normals[fi], np = normals[parent[fi]];
    return { p, a, theta:Math.atan2(a.dot(new T.Vector3().crossVectors(nc, np)), nc.dot(np)) };
  });
  const tmp = new T.Matrix4(), rot = new T.Matrix4(), back = new T.Matrix4();
  function matrices(t){
    const W = faces.map(() => new T.Matrix4());
    order.forEach(fi => {
      if(fi === root) return;
      const h = hinge[fi];
      tmp.makeTranslation(h.p.x, h.p.y, h.p.z);
      rot.makeRotationAxis(h.a, h.theta * t);
      back.makeTranslation(-h.p.x, -h.p.y, -h.p.z);
      W[fi].copy(W[parent[fi]]).multiply(tmp).multiply(rot).multiply(back);
    });
    return W;
  }
  // 다 펼친 모양 검사(겹침 여부)와 크기
  let ok = valid, minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity, flat = [];
  if(valid){
    const W = matrices(1);
    flat = faces.map((f, fi) => f.map(p => p.clone().applyMatrix4(W[fi])));
    flat.flat().forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); });
    const poly2 = flat.map(f => { const c = f.reduce((s, p) => s.add(p), new T.Vector3()).multiplyScalar(1 / f.length);
      return f.map(p => [c.x + (p.x - c.x) * 0.97, c.z + (p.z - c.z) * 0.97]); });
    for(let i=0;i<poly2.length && ok;i++) for(let j=i+1;j<poly2.length;j++) if(l2PolyOverlap(poly2[i], poly2[j])){ ok = false; break; }
  }
  const hingeSet = new Set(hingeKey.filter(Boolean));
  const cutKeys = [...edgeMap.keys()].filter(k => !hingeSet.has(k));
  return { faces, root, parent, order, matrices, ok, edgeMap, key, hingeSet, cutKeys,
    rootY:faces[root][0].y, center:new T.Vector3((minX + maxX) / 2, 0, (minZ + maxZ) / 2),
    size:{ w:maxX - minX, d:maxZ - minZ }, area:(maxX - minX) * (maxZ - minZ),
    radius:Math.max(...faces.flat().map(p => p.length())) };
}
/** 정육면체의 면 이름(B 아래, T 위, F 앞, K 뒤, R 오른쪽, L 왼쪽) */
function l2CubeLabels(T, H, faces){
  return faces.map(f => { const n = l2OutwardNormal(T, H, f);
    if(n.y < -0.9) return 'B'; if(n.y > 0.9) return 'T'; if(n.z > 0.9) return 'F'; if(n.z < -0.9) return 'K'; if(n.x > 0.9) return 'R'; return 'L'; });
}
const L2_CUBE_NETS = [
  { name:'십자 모양', parents:{ F:'B', K:'B', R:'B', L:'B', T:'F' } },
  { name:'1-4-1 엇갈린 모양', parents:{ F:'B', T:'F', K:'T', R:'B', L:'T' } },
  { name:'계단 모양', parents:{ F:'B', R:'F', T:'R', K:'T', L:'K' } },
];
/** 겹치지 않으면서 가장 반듯한(넓이가 작은) 전개도 고르기 */
function l2BestNet(T, H, faces){
  let best = null;
  for(let r=0;r<faces.length;r++) for(const mode of ['bfs', 'dfs']){
    const n = l2BuildNet(T, H, faces, r, mode);
    if(n.ok && (!best || n.area < best.area - 1e-6)) best = n;
  }
  return best;
}

/* =====================================================================
   시뮬레이션 ② 정다면체 ↔ 전개도 전환 ★
   ===================================================================== */
async function l2SetupNetSim(wrap){
  wrap.innerHTML = `
    <div class="l0-tabs l2-net-tabs" role="tablist" aria-label="정다면체 고르기">
      ${L2_KINDS.map((k, i) => `<button role="tab" type="button" aria-selected="${i === 0}" data-k="${k.kind}">${k.name}</button>`).join('')}
    </div>
    <div class="l0-gal-grid">
      <div>
        <div class="l2-net-viewer"></div>
      </div>
      <div class="l0-side l2-net-side">
        <div class="l2-net-variants"></div>
        <div class="l2-net-slider"></div>
        <div class="sim-row l2-net-btns"><button class="btn primary" type="button" data-a="open">📂 펼치기</button><button class="btn" type="button" data-a="close">📦 접기</button></div>
        <button class="btn l2-meet" type="button" aria-pressed="false">🎨 만나는 모서리 보기 <span class="tb">꺼짐</span></button>
        <div class="l0-note l2-net-info" aria-live="polite"></div>
      </div>
    </div>`;
  const st = { kind:'tetra', variant:0, t:0, target:0, meet:false, playing:false };
  const info = $('.l2-net-info', wrap), meetBtn = $('.l2-meet', wrap);
  const openBtn = $('[data-a="open"]', wrap);
  const setOpenLabel = run => { openBtn.textContent = run ? '⏸ 멈춤' : '📂 펼치기'; openBtn.dataset.run = run ? '1' : ''; openBtn.classList.toggle('is-running', !!run); };
  const slider = createSlider({ label:'펼친 정도', min:0, max:100, step:1, value:0, unit:'%',
    onInput:v => { st.playing = false; st.t = st.target = v / 100; apply(true); } });
  $('.l2-net-slider', wrap).appendChild(slider.el);
  const sliderInput = $('input', slider.el), sliderOut = $('output', slider.el);
  const viewer = await create3DViewer($('.l2-net-viewer', wrap), { showInfo:false, tools:['autoRotate', 'reset'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  let net = null, grp = null, cutObjs = [];
  const FOLD_DIR = new T.Vector3(0.62, 0.48, 0.92).normalize(), TOP_DIR = new T.Vector3(0, 1, 0.03).normalize();

  /* 정다면체마다 서로 다른 전개도 여러 개 (정육면체는 정해 둔 3가지, 나머지는 겹치지 않는 전개도를 찾아 모양이 다른 것 3개까지) */
  const netCache = {};
  function netsFor(kind){
    if(netCache[kind]) return netCache[kind];
    const faces = l2Platonic(T, kind, 1.1);
    let list = [];
    if(kind === 'cube'){
      const labels = l2CubeLabels(T, H, faces), idx = l => labels.indexOf(l);
      list = L2_CUBE_NETS.map(N => l2BuildNet(T, H, faces, idx('B'), labels.map(l => l === 'B' ? -1 : idx(N.parents[l]))));
    }else{
      // 이웃한 면 찾기 → 여러 가지 펼치는 방법(넓게 퍼지기, 길게 잇기, 무작위 순서)을 만들어 겹치지 않는 것만
      const key = p => [p.x, p.y, p.z].map(v => v.toFixed(3)).join(',');
      const ek = new Map(); faces.forEach((f, fi) => f.forEach((p, i) => { const k = [key(p), key(f[(i+1) % f.length])].sort().join('|'); if(!ek.has(k)) ek.set(k, []); ek.get(k).push(fi); }));
      const nb = faces.map(() => []); ek.forEach(a => { if(a.length === 2){ nb[a[0]].push(a[1]); nb[a[1]].push(a[0]); } });
      let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const cands = [];
      for(let r=0;r<faces.length;r++) for(const mode of ['bfs', 'dfs']) cands.push(l2BuildNet(T, H, faces, r, mode));
      for(let t=0;t<40;t++){
        const root = Math.floor(rnd() * faces.length), par = faces.map(() => -1), seen = new Set([root]), front = [root];
        while(front.length){ const i = Math.floor(rnd() * front.length), f = front[i]; const free = nb[f].filter(g => !seen.has(g));
          if(!free.length){ front.splice(i, 1); continue; } const g = free[Math.floor(rnd() * free.length)]; seen.add(g); par[g] = f; front.push(g); }
        cands.push(l2BuildNet(T, H, faces, root, par));
      }
      // 모양이 같은(돌리거나 뒤집으면 겹치는) 전개도는 하나로: 펼친 면 중심 사이 거리들의 모음으로 비교
      const sig = n => { const W = n.matrices(1); const c = n.faces.map((f, fi) => f.reduce((a, p) => a.add(p.clone().applyMatrix4(W[fi])), new T.Vector3()).multiplyScalar(1 / f.length));
        const d = []; for(let i=0;i<c.length;i++) for(let j=i+1;j<c.length;j++) d.push(Math.round(c[i].distanceTo(c[j]) * 50));
        return d.sort((a, b) => a - b).join(','); };
      const seenSig = new Set();
      cands.filter(n => n && n.ok).sort((a, b) => a.area - b.area).forEach(n => { const k = sig(n); if(seenSig.has(k) || list.length >= 3) return; seenSig.add(k); list.push(n); });
    }
    return (netCache[kind] = list);
  }
  function variantsUI(){
    const box = $('.l2-net-variants', wrap); box.innerHTML = '';
    const list = netsFor(st.kind), kname = L2_KINDS.find(k => k.kind === st.kind).name;
    if(list.length < 2) return;
    const seg = createSegmented({ items:list.map((n, i) => ({ value:i, label:`전개도 ${i + 1}` })), value:st.variant, label:`${kname} 전개도 선택`,
      onChange:v => { st.variant = v; build(); } });
    box.appendChild(el('b', {}, `${kname} 전개도 선택`));
    box.appendChild(seg.el);
  }
  function build(){
    if(grp){ viewer.extras.remove(grp); l1Dispose(grp); }
    net = netsFor(st.kind)[st.variant] || netsFor(st.kind)[0];
    // 만나는 모서리 쌍 번호
    const pairOf = new Map(); net.cutKeys.forEach((k, i) => pairOf.set(k, i));
    grp = new T.Group(); cutObjs = [];
    const base = L2_FACTS[st.kind].color;
    net.faces.forEach((f, fi) => {
      const pos = []; for(let i=1;i<f.length-1;i++) [f[0], f[i], f[i+1]].forEach(p => pos.push(p.x, p.y, p.z));
      const geo = new T.BufferGeometry(); geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
      const col = new T.Color(base).offsetHSL(((fi * 7) % 5) * 0.025 - 0.05, 0, (fi % 3) * 0.05 - 0.04);
      if(fi === net.root) col.offsetHSL(0, 0, -0.12);
      const mesh = new T.Mesh(geo, new T.MeshPhongMaterial({ color:col, side:T.DoubleSide, flatShading:true, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }));
      mesh.matrixAutoUpdate = false;
      const c = H.centroid(f), n = l2OutwardNormal(T, H, f);
      f.forEach((p, i) => {
        const r = f[(i+1) % f.length], k = [net.key(p), net.key(r)].sort().join('|');
        mesh.add(H.tube2(p, r, 0.014, '#2B3A55'));
        if(pairOf.has(k)){
          const pi = pairOf.get(k), color = L2_PAIR_COLORS[pi % L2_PAIR_COLORS.length];
          const tube = H.tube2(p, r, 0.04, color); tube.visible = st.meet; mesh.add(tube); cutObjs.push(tube);
          const mid = p.clone().add(r).multiplyScalar(0.5).lerp(c, 0.22).addScaledVector(n, 0.02);
          const lab = H.label2(String(pi + 1), mid, 0.55, true); lab.visible = st.meet; mesh.add(lab); cutObjs.push(lab);
        }
      });
      grp.add(mesh);
    });
    viewer.extras.add(grp);
    const kname = L2_KINDS.find(k => k.kind === st.kind).name, F = L2_FACTS[st.kind];
    info.innerHTML = `<b>${kname}의 전개도</b>: ${F.shape} <b>${F.F}개</b>로 이루어져 있어.<br>
      펼치기 전에 붙어 있던 모서리 ${F.E}개 중 <b>${F.F - 1}개</b>는 접는 선이 되고, 나머지 <b>${F.E - F.F + 1}쌍</b>은 접을 때 서로 만나는 모서리야.
      ${st.kind === 'cube' ? '<br>💡 정육면체의 전개도는 모두 <b>11가지</b>나 있어! 위에서 다른 전개도도 골라 보자.' : '<br>💡 같은 정다면체라도 전개도는 여러 가지야. 위에서 다른 전개도도 골라 보자.'}
      <br><span class="l0-muted">진한 색 면은 펼칠 때 바닥에 그대로 있는 기준 면이야.</span>`;
    st.t = st.target = 0; slider.set(0); setOpenLabel(false);
    apply(true); fitInfo();
  }
  // 세부 설명 상자: 아래 끝을 관찰 버튼 아래 끝에 맞추고, 글이 길면 글자·줄 간격을 줄여 상자 안에 들어가게
  function fitInfo(){
    info.style.fontSize = ''; info.style.lineHeight = ''; info.style.letterSpacing = '';
    if(!info.classList.contains('fixed')) return;
    // 상자를 넉넉히 쓰도록 크게(줄 간격·자간 넓게) 시작해서, 넘치면 조금씩 줄인다
    let fs = 1.0, lh = 2.0, ls = 0.04;
    const set = () => { info.style.fontSize = fs + 'rem'; info.style.lineHeight = lh; info.style.letterSpacing = ls + 'em'; };
    set();
    const over = () => info.scrollHeight > info.clientHeight + 1;
    for(let n=0;n<80 && over();n++){
      if(lh > 1.5) lh -= 0.02; else if(ls > 0) ls = Math.max(0, ls - 0.005); else if(lh > 1.3) lh -= 0.02; else fs -= 0.01;
      set();
    }
  }
  { const left = $('.l2-net-viewer', wrap).parentElement, side = $('.l2-net-side', wrap);
    const fit = () => { const two = getComputedStyle(left.parentElement).gridTemplateColumns.split(' ').length > 1;
      side.style.height = two ? left.offsetHeight + 'px' : ''; info.classList.toggle('fixed', two); fitInfo(); };
    if('ResizeObserver' in window) new ResizeObserver(fit).observe(left); requestAnimationFrame(fit); }
  const ease = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
  function apply(driveCam){
    if(!net) return;
    const e = ease(st.t);
    const W = net.matrices(e);
    grp.children.forEach((m, fi) => { m.matrix.copy(W[fi]); m.matrixWorldNeedsUpdate = true; });
    grp.position.set(-net.center.x * e, -net.rootY * e, -net.center.z * e);
    if(driveCam){
      // 지금 모양(펼치는 중간 포함)이 화면에 다 들어오도록 카메라 거리·중심을 맞춘다
      const fov = viewer.camera.fov * Math.PI / 180, aspect = viewer.camera.aspect || 4/3;
      const box = new T.Box3();
      net.faces.forEach((f, fi) => f.forEach(p => box.expandByPoint(p.clone().applyMatrix4(W[fi]).add(grp.position))));
      const c = box.getCenter(new T.Vector3()), half = box.getSize(new T.Vector3()).multiplyScalar(0.5).length();
      const fovMin = Math.min(fov, 2 * Math.atan(Math.tan(fov / 2) * aspect));
      const dSphere = half / Math.sin(fovMin / 2);
      const dNet = Math.max(net.size.d / (2 * Math.tan(fov / 2)), net.size.w / (2 * Math.tan(fov / 2) * aspect)) * 1.15 + 0.4;
      const dist = Math.max(dSphere * (1 - 0.3 * e), dNet * e);
      const dir = FOLD_DIR.clone().lerp(TOP_DIR, e).normalize();
      viewer.controls.target.copy(c);
      viewer.camera.position.copy(c).addScaledVector(dir, dist);
      viewer.controls.update();
    }
    viewer.requestRender();
  }
  viewer.onFrame(dt => {
    if(st.t === st.target){ if(openBtn.dataset.run) setOpenLabel(false); return false; }
    const step = L0_REDUCED_MOTION ? 1 : dt / 2.4;
    st.t = st.target > st.t ? Math.min(st.target, st.t + step) : Math.max(st.target, st.t - step);
    if(st.t === st.target) setOpenLabel(false);
    sliderInput.value = Math.round(st.t * 100); sliderOut.textContent = Math.round(st.t * 100) + '%';
    sliderInput.style.setProperty('--p', (st.t * 100) + '%');
    apply(true); return true;
  });
  // [펼치기] ↔ [멈춤]: 펼치는 동안 누르면 그 자리에서 멈춤
  openBtn.addEventListener('click', () => {
    viewer.setAutoRotate(false);
    if(openBtn.dataset.run){ st.target = st.t; setOpenLabel(false); viewer.requestRender(); return; }
    if(st.t >= 1) return;
    st.target = 1; setOpenLabel(true); viewer.requestRender();
  });
  $('[data-a="close"]', wrap).addEventListener('click', () => { viewer.setAutoRotate(false); st.target = 0; setOpenLabel(false); viewer.requestRender(); });
  meetBtn.addEventListener('click', () => {
    st.meet = !st.meet; meetBtn.setAttribute('aria-pressed', String(st.meet)); $('.tb', meetBtn).textContent = st.meet ? '켜짐' : '꺼짐';
    cutObjs.forEach(o => { o.visible = st.meet; }); viewer.requestRender();
    if(st.meet) toast('같은 색·같은 번호의 모서리가 접을 때 서로 만나! 천천히 접어 보자.');
  });
  wrap.querySelectorAll('.l2-net-tabs [role=tab]').forEach(t => t.addEventListener('click', () => {
    st.kind = t.dataset.k; st.variant = 0;
    wrap.querySelectorAll('.l2-net-tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    variantsUI(); build();
  }));
  variantsUI(); build();
}

/* =====================================================================
   활동 ③ 정다면체 3D 관찰하기: 세어 보기
   ===================================================================== */
async function l2SetupObserve(wrap){
  wrap.innerHTML = `
    <div class="l0-tabs l2-obs-tabs" role="tablist" aria-label="관찰할 정다면체">
      ${L2_KINDS.map((k, i) => `<button role="tab" type="button" aria-selected="${i === 0}" data-k="${k.kind}">${k.name}</button>`).join('')}
    </div>
    <div class="l0-gal-grid">
      <div><div class="l2-obs-viewer"></div></div>
      <div class="l0-side">
        <div class="l2-obs-fb l0-note" aria-live="polite"></div>
        <ul class="l1-status l2-obs-status" aria-live="polite"></ul>
        <div class="l1-ex-findbox"><p class="ttl">🔎 면, 모서리, 꼭짓점 찾기</p><div class="l2-obs-mode"></div></div>
        <div class="sim-row l1-ex-btns"><button class="btn" type="button" data-a="reset">↺ 처음부터</button><button class="btn primary l2-done-btn" type="button" data-a="done">찾기 완료</button></div>
      </div>
    </div>`;
  const KIND = { face:{ label:'면', icon:'▢', color:'#FFB300', key:'F' }, edge:{ label:'모서리', icon:'╱', color:'#E91E63', key:'E' }, vertex:{ label:'꼭짓점', icon:'●', color:'#1E5BFF', key:'V' } };
  const st = { kind:'tetra', mode:'face' };
  const HINT = () => `🏷️ <b>${L2_KINDS.find(k => k.kind === st.kind).name}</b>의 면, 모서리, 꼭짓점을 모두 찾아 각각의 개수를 확인해 보자.`;
  const found = { face:new Set(), edge:new Set(), vertex:new Set() };
  const fb = $('.l2-obs-fb', wrap);
  const modeSeg = createSegmented({ items:Object.entries(KIND).map(([k, v]) => ({ value:k, label:v.label })), value:'face', label:'찾을 것',
    onChange:v => { st.mode = v; } });
  $('.l2-obs-mode', wrap).appendChild(modeSeg.el);
  const viewer = await create3DViewer($('.l2-obs-viewer', wrap), { showInfo:false, color:'#E7ECF4', vertexColor:'#8E24AA', tools:['autoRotate', 'reset', 'transparent'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  viewer.setToggle('faceColor', false);
  let data = null, triFace = null;
  const layer = new T.Group(); viewer.extras.add(layer);

  function load(){
    const faces = l2Platonic(T, st.kind, 1.25);
    data = { faces, edges:l1EdgesOf(faces), verts:l1VertsOf(faces) };
    const g = l1Geometry(T, faces); triFace = g.triFace;
    viewer.setShape(g.geometry, { title:L2_KINDS.find(k => k.kind === st.kind).name });
    Object.values(found).forEach(s => s.clear());
    layer.children.slice().forEach(o => { layer.remove(o); l1Dispose(o); });
    fb.innerHTML = HINT(); fb.classList.remove('done'); status(); fitFb();
  }
  /* 오른쪽: 찾기 상자 아래 끝 ≈ 관찰 버튼 아래 끝, 설명 상자는 남는 높이를 채우고 크기 고정 (넓은 화면) */
  const obsLeft = $('.l2-obs-viewer', wrap).parentElement, obsSide = $('.l0-side', wrap), obsRow = $('.l1-ex-btns', wrap);
  function fitFb(){
    fb.style.fontSize = ''; fb.style.lineHeight = ''; fb.style.setProperty('--li-pad', '');
    if(!fb.classList.contains('fixed')) return;
    let fs = 0.95, lh = 1.7, pad = 6;
    const set = () => { fb.style.fontSize = fs + 'rem'; fb.style.lineHeight = lh; fb.style.setProperty('--li-pad', pad + 'px'); };
    set();
    for(let n=0;n<60 && fb.scrollHeight > fb.clientHeight + 1;n++){ if(lh > 1.35) lh -= 0.03; else if(pad > 2) pad -= 1; else fs -= 0.02; set(); }
  }
  function fitSide(){
    const two = getComputedStyle(obsLeft.parentElement).gridTemplateColumns.split(' ').length > 1;
    const gap = parseFloat(getComputedStyle(obsSide).rowGap) || 12;
    obsSide.style.height = two ? (obsLeft.offsetHeight + obsRow.offsetHeight + gap) + 'px' : '';
    fb.classList.toggle('fixed', two); fitFb();
  }
  if('ResizeObserver' in window) new ResizeObserver(fitSide).observe(obsLeft);
  requestAnimationFrame(fitSide);
  function status(){
    $('.l2-obs-status', wrap).innerHTML = Object.entries(KIND).map(([k, v]) => `<li style="--pc:${v.color}"><span>${v.icon} ${v.label}</span><b>${found[k].size}개 찾음</b></li>`).join('');
  }
  l1Pick(viewer, () => triFace, ({ face, point }) => {
    const m = st.mode; let idx, best = Infinity;
    if(m === 'face') idx = face;
    else if(m === 'edge'){ data.edges.forEach(([a, b], i) => { const d = l1SegDist(point, a, b); if(d < best){ best = d; idx = i; } }); if(best > 0.22){ toast('모서리 가까이를 눌러 보자!'); return; } }
    else { data.verts.forEach((v, i) => { const d = v.distanceTo(point); if(d < best){ best = d; idx = i; } }); if(best > 0.28){ toast('꼭짓점 가까이를 눌러 보자!'); return; } }
    if(found[m].has(idx)){ toast(`이미 표시한 ${KIND[m].label}이야!`); return; }
    found[m].add(idx);
    if(m === 'face'){
      const f = data.faces[idx], c = H.centroid(f), n = l2OutwardNormal(T, H, f);
      layer.add(H.polyMesh(f, KIND.face.color, 0.8));
      layer.add(H.label2(String(found.face.size), c.clone().addScaledVector(n, 0.08), 0.7, true));
    }else if(m === 'edge'){ const [a, b] = data.edges[idx]; layer.add(H.tube2(a, b, 0.035, KIND.edge.color)); }
    else layer.add(H.dot2(data.verts[idx], 0.07, KIND.vertex.color));
    viewer.requestRender(); status(); fb.innerHTML = HINT(); fb.classList.remove('done'); fitFb();
  });
  $('[data-a="done"]', wrap).addEventListener('click', () => {
    const F = L2_FACTS[st.kind], name = L2_KINDS.find(k => k.kind === st.kind).name;
    const rows = Object.entries(KIND).map(([k, v]) => {
      const mine = found[k].size, ans = F[v.key], ok = mine === ans;
      return `<li class="${ok ? 'ok' : 'ng'}">${ok ? '✓' : '✗'} ${v.label}: <b>${ans}개</b> 중 <b>${mine}개</b> 찾음</li>`;
    });
    const all = Object.entries(KIND).every(([k, v]) => found[k].size === F[v.key]);
    fb.classList.add('done');
    fb.innerHTML = `<b>${name}</b> 면, 모서리, 꼭짓점 찾기 결과<ul class="l2-obs-res">${rows.join('')}</ul>` +
      (all ? '🎉 모두 찾았어! 아래 [관찰 확인하기]를 눌러 표에 정리해 보자.' : '💡 돌려 가며 아직 찾지 못한 것을 찾아보자. 뒤쪽도 잊지 마!');
    fitFb();
  });
  $('[data-a="reset"]', wrap).addEventListener('click', load);
  wrap.querySelectorAll('.l2-obs-tabs [role=tab]').forEach(t => t.addEventListener('click', () => {
    st.kind = t.dataset.k; wrap.querySelectorAll('.l2-obs-tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x === t))); load();
  }));
  load();
}

/* ---------- 관찰 결과 표 (교과서 문제 3) ---------- */
function l2SetupFactTable(wrap){
  const ROWS = [
    { key:'shape', label:'면의 모양', type:'select' },
    { key:'meet', label:'한 꼭짓점에 모인 면의 개수', type:'num' },
    { key:'F', label:'면의 개수', type:'num' },
    { key:'E', label:'모서리의 개수', type:'num' },
    { key:'V', label:'꼭짓점의 개수', type:'num' },
  ];
  const SHAPES = ['정삼각형', '정사각형', '정오각형', '정육각형'];
  let mode = 'solve';
  wrap.innerHTML = `
    <div class="l1-table-wrap"></div>
    <div class="sim-row l2-fact-checkrow"><button class="btn" type="button" data-a="clear">↺ 다시 채우기</button><button class="btn primary" type="button" data-a="check">✓ 확인</button></div>
    <div class="l1-cmp-fb" aria-live="polite"></div>`;
  const fb = $('.l1-cmp-fb', wrap);
  function render(){
    let h = `<table class="l1-cmp-table l2-fact-table"><caption class="sr-only">정다면체 관찰 결과 표</caption>
      <thead><tr><th scope="col">구분</th>${L2_KINDS.map(k => `<th scope="col">${k.name}</th>`).join('')}</tr></thead><tbody>`;
    ROWS.forEach(r => {
      h += `<tr><th scope="row">${r.label}</th>`;
      L2_KINDS.forEach(k => {
        const ans = L2_FACTS[k.kind][r.key];
        if(mode === 'answer') h += `<td class="ans"><b>${ans}${r.type === 'num' ? '' : ''}</b></td>`;
        else if(r.type === 'select') h += `<td data-c="${r.key}|${k.kind}"><select aria-label="${k.name}의 ${r.label}"><option value="">고르기</option>${SHAPES.map(s => `<option>${s}</option>`).join('')}</select><span class="mk"></span></td>`;
        else h += `<td data-c="${r.key}|${k.kind}"><input type="text" inputmode="numeric" autocomplete="off" placeholder="?" aria-label="${k.name}의 ${r.label}"><span class="mk"></span></td>`;
      });
      h += `</tr>`;
    });
    $('.l1-table-wrap', wrap).innerHTML = h + '</tbody></table>';
    $('[data-a="check"]', wrap).disabled = $('[data-a="clear"]', wrap).disabled = mode === 'answer';
    fb.innerHTML = mode === 'answer' ? '👀 정답을 보고 있어. 위의 세어 보기로 직접 확인해 봐도 좋아.' : '';
  }
  // [관찰 확인하기]로 표를 펼치고, [정답 보기]는 그 옆에서 정답 ↔ 다시 채우기 전환 (비교 관찰과 같은 방식)
  const sec = wrap.closest('section'), more = $('.l2-fact-more', sec), openBtn = $('[data-a="fopen"]', sec), ansBtn = $('[data-fm="answer"]', sec);
  openBtn.addEventListener('click', () => {
    const open = more.hidden; more.hidden = !open; openBtn.setAttribute('aria-expanded', String(open));
    openBtn.textContent = open ? '🙈 관찰 확인 닫기' : '🔍 관찰 확인하기';
    openBtn.classList.toggle('l0c-checkbtn', !open); openBtn.classList.toggle('quiz-next', open);
    ansBtn.hidden = !open;
    if(open) more.scrollIntoView({ behavior:'smooth', block:'nearest' });
  });
  ansBtn.addEventListener('click', () => {
    mode = mode === 'answer' ? 'solve' : 'answer';
    ansBtn.setAttribute('aria-pressed', String(mode === 'answer')); ansBtn.textContent = mode === 'answer' ? '✏️ 다시 채우기로' : '👀 정답 보기';
    render();
  });
  $('[data-a="clear"]', wrap).addEventListener('click', render);
  $('[data-a="check"]', wrap).addEventListener('click', () => {
    let right = 0, total = 0, empty = 0;
    wrap.querySelectorAll('td[data-c]').forEach(td => {
      const [rk, kk] = td.dataset.c.split('|'), ans = L2_FACTS[kk][rk], inp = td.querySelector('select, input'), v = inp.value.trim();
      total++;
      if(!v){ empty++; td.classList.remove('ok', 'ng'); $('.mk', td).textContent = ''; return; }
      const ok = rk === 'shape' ? v === ans : toNumber(normalizeAnswer(v)) === ans;
      td.classList.toggle('ok', ok); td.classList.toggle('ng', !ok); $('.mk', td).textContent = ok ? '✓' : '✗';
      if(ok) right++;
    });
    if(right === total){ fb.innerHTML = '🎉 <b>25칸 모두 정답!</b> 정다면체의 특징을 완벽하게 관찰했어.'; celebrate(); }
    else fb.innerHTML = `${total}칸 중 <b>${right}칸</b> 정답!${empty ? ` (빈칸 ${empty}개)` : ''} ✗ 표시된 칸은 위의 3D 모델로 다시 세어 보자.`;
  });
  render();
}

/* ---------- 정다면체 전시관: 다섯 가지를 한 화면에서 함께 돌리기 ---------- */
async function l2SetupGallery(wrap){
  wrap.innerHTML = `<div class="l2-gallery-viewer"></div>
    <div class="sim-row" style="margin-top:8px"><span class="l0-muted">다섯 정다면체의 <b>모서리 길이는 모두 같아</b>. 크기와 모양을 비교해 보자.</span></div>`;
  const viewer = await create3DViewer($('.l2-gallery-viewer', wrap), { showInfo:false, tools:['autoRotate', 'reset'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  const board = new T.Group(); viewer.extras.add(board);
  const POS = [[-1.9, 1.05], [0, 1.05], [1.9, 1.05], [-1.0, -0.95], [1.0, -0.95]];
  const spinners = [];
  L2_KINDS.forEach((k, i) => {
    const faces = l2Platonic(T, k.kind, 0.55);
    const rad = Math.max(...faces.flat().map(p => p.length()));
    const g = l1Geometry(T, faces).geometry;
    const holder = new T.Group(); holder.position.set(POS[i][0], POS[i][1], 0);
    const solid = new T.Mesh(g, new T.MeshPhongMaterial({ color:L2_FACTS[k.kind].color, flatShading:true, transparent:true, opacity:0.92, side:T.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }));
    solid.add(new T.LineSegments(new T.EdgesGeometry(g, 10), new T.LineBasicMaterial({ color:0x2B3A55 })));
    solid.rotation.set(0.4 + i * 0.3, i * 0.7, 0.2);
    holder.add(solid);
    holder.add(H.label2(k.name, new T.Vector3(0, -(rad + 0.2), 0), 0.7));
    board.add(holder); spinners.push(solid);
  });
  viewer.resetView();                                   // 기본 카메라 위치로 옮긴 뒤
  board.lookAt(viewer.camera.position);                 // 전시판이 카메라를 바라보게
  board.scale.setScalar(0.9); board.position.y = 0.25;  // 아래 줄 이름표까지 화면에 들어오게
  let spin = true;
  viewer.onFrame(dt => { if(!spin) return false; spinners.forEach((s, i) => { s.rotation.y += dt * 0.6; s.rotation.x += dt * 0.15 * (i % 2 ? 1 : -1); }); return true; });
  const play = createPlayButton({ playing:true, playLabel:'함께 돌리기', pauseLabel:'멈추기', onToggle:on => { spin = on; viewer.requestRender(); } });
  $('.sim-row', wrap).prepend(play.el);
}

/* =====================================================================
   3. 회전체 (lesson-3)
   ---------------------------------------------------------------------
   공통 엔진 : l3Profile(도형, 축) → 회전 단면 / l3Classify → 이름 / l3Revolver(뷰어) → 돌리기 애니메이션
   생각 열기 : 막대에 붙인 종이 돌리기 + 예상하고 확인하기 → l3SetupThink()
   시뮬레이션: ① 회전체 만들기(도형 카드·직접 그리기·축 고르기·각도) → l3SetupMaker()
               ② 두 축 비교                                       → l3SetupCompare()
               ③ 교과서 문제 1 (보고 고르기 → 돌려서 확인)         → l3SetupProblem()
               ④ 원뿔을 잘라 원뿔대 만들기 (+사다리꼴, 전개도)     → l3SetupConeCut()
               ⑤ 회전체의 단면 관찰하기 (+생각 상자, 함께하기 표)  → l3SetupSection()
   ===================================================================== */
const L3_ARC = (cx, cy, r, a0, a1, n) => Array.from({length:n + 1}, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; });
const L3_SHAPES = [
  { key:'rect',  name:'직사각형', pts:[[0,0],[2,0],[2,3],[0,3]] },
  { key:'rtri',  name:'직각삼각형', pts:[[0,0],[2,0],[0,3]] },
  { key:'semi',  name:'반원', curved:true, pts:L3_ARC(0, 1.5, 1.5, -Math.PI/2, Math.PI/2, 36), selectOnly:'last' },
  { key:'trap',  name:'사다리꼴', sub:'두 각이 직각', pts:[[0,0],[2.5,0],[1.5,3],[0,3]] },
  { key:'circle',name:'원', curved:true, pts:L3_ARC(1.4, 1.5, 1.2, 0, 2*Math.PI, 48).slice(0, 48), selectOnly:'none' },
  { key:'kite',  name:'직각삼각형 2개', sub:'붙인 모양', pts:[[0,0],[1.6,2],[0,4]], deco:[[0,2],[1.6,2]] },
  { key:'house', name:'직사각형 + 직각삼각형', pts:[[0,0],[1.6,0],[1.6,2],[0,3.4]], deco:[[0,2],[1.6,2]] },
  { key:'step',  name:'계단 모양', pts:[[0,0],[2.4,0],[2.4,1.2],[1.2,1.2],[1.2,3],[0,3]] },
];
const l3Shape = key => L3_SHAPES.find(s => s.key === key);
const l3EdgeSelectable = (shape, i) => !shape.selectOnly ? true : shape.selectOnly === 'none' ? false : i === shape.pts.length - 1;

/* ---------- 도형 + 축 → 회전 단면(r: 축까지 거리, y: 축 방향 위치) ---------- */
function l3Profile(shape, axis){
  if(!shape || !axis) return { ok:false, reason:'회전축을 정해 보자.' };
  const P = shape.pts, n = P.length;
  let A, d;
  if(axis.type === 'edge'){
    const a = P[axis.i], b = P[(axis.i + 1) % n], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    A = a; d = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
    // 3D에서 위쪽이 그림의 위쪽(또는 오른쪽)과 같도록 축 방향을 맞춘다
    if(d[1] < -1e-9 || (Math.abs(d[1]) < 1e-9 && d[0] < 0)){ A = b; d = [-d[0], -d[1]]; }
  }else{ A = [axis.x, 0]; d = [0, 1]; }
  const per = P.map(p => d[0] * (p[1] - A[1]) - d[1] * (p[0] - A[0]));
  const along = P.map(p => (p[0] - A[0]) * d[0] + (p[1] - A[1]) * d[1]);
  const eps = 1e-6;
  const allPos = per.every(v => v >= -eps), allNeg = per.every(v => v <= eps);
  if(!allPos && !allNeg) return { ok:false, reason:'회전축이 도형을 가로질러. 도형이 축의 한쪽에만 있도록 축을 정해 보자.' };
  const prof = P.map((p, i) => [Math.abs(per[i]) < eps ? 0 : Math.abs(per[i]), along[i]]);
  return { ok:true, prof, gap:Math.min(...prof.map(p => p[0])) };
}
/** 회전 단면을 보고 회전체 이름 정하기 */
function l3Classify(shape, prof){
  const eps = 1e-6, n = prof.length;
  const onAxis = i => prof[i][0] < eps && prof[(i+1) % n][0] < eps && Math.abs(prof[i][1] - prof[(i+1) % n][1]) > eps;
  const minR = Math.min(...prof.map(p => p[0]));
  if(minR > eps) return shape.key === 'circle'
    ? { name:'원환체', note:'원을 떨어진 축으로 돌리면 도넛 모양의 회전체가 돼.', icon:'torus' }
    : { name:'회전체', note:'도형과 회전축 사이에 틈이 있어서 가운데가 빈 회전체가 돼.', icon:'hollow' };
  const start = prof.findIndex((_, i) => onAxis(i));
  if(start < 0) return { name:'회전체', note:shape.key === 'circle' ? '축에 한 점만 닿아서 가운데가 막힌 도넛 모양이 돼.' : '이름이 따로 없는 회전체야.', icon:'hollow' };
  if(shape.key === 'semi') return { name:'구', note:'반원의 지름을 회전축으로 돌리면 구가 돼.', icon:'sphere' };
  if(shape.curved) return { name:'회전체', note:'이름이 따로 없는 회전체야.' };
  // 축 위에 있지 않은 경계(사슬) 모으기
  let chain = [], i = (start + 1) % n; chain.push(prof[i]);
  for(let guard=0; guard<n && !onAxis(i); guard++){ const j = (i + 1) % n; chain.push(prof[j]); i = j; }
  // 한 직선 위의 점 합치기
  const merged = [chain[0]];
  for(let k=1;k<chain.length;k++){
    const p = chain[k];
    if(merged.length >= 2){
      const a = merged[merged.length - 2], b = merged[merged.length - 1];
      if(Math.abs((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0])) < 1e-6){ merged[merged.length - 1] = p; continue; }
    }
    merged.push(p);
  }
  const types = merged.slice(1).map((p, k) => { const a = merged[k]; return Math.abs(a[1] - p[1]) < eps ? 'H' : Math.abs(a[0] - p[0]) < eps ? 'V' : 'S'; }).join('');
  const ys = merged.map(p => p[1]);
  const mono = ys.every((y, k) => k === 0 || y >= ys[k-1] - eps) || ys.every((y, k) => k === 0 || y <= ys[k-1] + eps);
  if(!mono) return { name:'회전체', note:'이름이 따로 없는 회전체야.' };
  const MAP = {
    HVH:{ name:'원기둥', icon:'cylinder', note:'직사각형의 한 변을 회전축으로 돌리면 원기둥이 돼.' },
    HS:{ name:'원뿔', icon:'cone', note:'직각삼각형의 직각을 낀 한 변을 회전축으로 돌리면 원뿔이 돼.' },
    SH:{ name:'원뿔', icon:'cone', note:'직각삼각형의 직각을 낀 한 변을 회전축으로 돌리면 원뿔이 돼.' },
    HSH:{ name:'원뿔대', icon:'frustum', note:'두 각이 직각인 사다리꼴을 직각인 변을 축으로 돌리면 원뿔대가 돼.' },
    SS:{ name:'회전체', sub:'원뿔 두 개를 붙인 모양', icon:'dcone', note:'원뿔 두 개의 밑면을 붙인 모양이야.' },
    HVS:{ name:'회전체', sub:'원기둥과 원뿔을 붙인 모양', icon:'cylcone', note:'원기둥 위에 원뿔을 올린 모양이야.' },
    SVH:{ name:'회전체', sub:'원기둥과 원뿔을 붙인 모양', icon:'cylcone', note:'원기둥 위에 원뿔을 올린 모양이야.' },
    HVHVH:{ name:'회전체', sub:'원기둥 두 개를 쌓은 모양', icon:'cylinder', note:'크기가 다른 원기둥 두 개를 쌓은 모양이야.' },
  };
  return MAP[types] || { name:'회전체', note:'이름이 따로 없는 회전체야.' };
}
const l3Title = c => c.sub ? `${c.name} (${c.sub})` : c.name;

/* ---------- 회전체 아이콘 ---------- */
function l3Icon(kind){

  else if(kind === 'dcone') s = `<path d="M50 8 L20 50 L50 92 L80 50 Z" fill="#F6C1D3" ${st}/><path d="M20 50 A30 8 0 0 0 80 50" fill="none" stroke="#2B3A55" stroke-width="1.8"/><path d="M20 50 A30 8 0 0 1 80 50" ${dash}/>`;
  else if(kind === 'cylcone') s = `<path d="M24 46 V82 A26 8 0 0 0 76 82 V46 Z" fill="#BBD7F8" ${st}/><path d="M24 46 L50 10 L76 46 A26 8 0 0 1 24 46" fill="#F6C1D3" ${st}/><path d="M24 46 A26 8 0 0 0 76 46" fill="none" stroke="#2B3A55" stroke-width="1.8"/><path d="M24 82 A26 8 0 0 1 76 82" ${dash}/>`;
  else if(kind === 'torus') s = `<ellipse cx="50" cy="52" rx="40" ry="22" fill="#FFE0B2" ${st}/><ellipse cx="50" cy="50" rx="15" ry="7" fill="#F6F8FC" ${st}/>`;
  else s = `<ellipse cx="50" cy="30" rx="34" ry="10" fill="#E3F2FD" ${st}/><path d="M16 30 V72 A34 10 0 0 0 84 72 V30" fill="none" ${st}/><ellipse cx="50" cy="30" rx="14" ry="4" fill="#fff" ${st}/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">${s}</svg>`;
}

/* ---------- 2D 그림: 평면도형 + 회전축 ---------- */
function l3Bounds(pts){ const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) }; }
function l3ShapeSVG(shape, axis, opt={}){
  const b = l3Bounds(shape.pts), pad = opt.pad ?? 1;
  const x0 = Math.floor(b.minX - pad), x1 = Math.ceil(b.maxX + pad), y0 = Math.floor(b.minY - pad), y1 = Math.ceil(b.maxY + pad);
  const U = 40, W = (x1 - x0) * U, Hh = (y1 - y0) * U;
  const X = x => (x - x0) * U, Y = y => (y1 - y) * U;
  let g = '';
  if(opt.grid !== false){ for(let x=x0;x<=x1;x++) g += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${Hh}" class="grid"/>`; for(let y=y0;y<=y1;y++) g += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" class="grid"/>`; }
  const poly = shape.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ');
  let deco = '';
  if(shape.deco){ const [a, c] = shape.deco; deco = `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}" stroke="#7A5A1E" stroke-width="1.5" stroke-dasharray="4 3"/>`; }
  let ax = '';
  if(axis){
    let a, c;
    if(axis.type === 'edge'){ a = shape.pts[axis.i]; c = shape.pts[(axis.i + 1) % shape.pts.length]; }
    else { a = [axis.x, 0]; c = [axis.x, 1]; }
    const dx = c[0] - a[0], dy = c[1] - a[1], L = 40;
    ax = `<line x1="${X(a[0] - dx*L)}" y1="${Y(a[1] - dy*L)}" x2="${X(a[0] + dx*L)}" y2="${Y(a[1] + dy*L)}" class="axis"/>`;
  }
  (opt.axes || []).forEach(A => {   // 여러 회전축을 색을 달리해 표시 + 이름표
    const a = shape.pts[A.i], c = shape.pts[(A.i + 1) % shape.pts.length], dx = c[0] - a[0], dy = c[1] - a[1], L = 40;
    ax += `<line x1="${X(a[0] - dx*L)}" y1="${Y(a[1] - dy*L)}" x2="${X(a[0] + dx*L)}" y2="${Y(a[1] + dy*L)}" stroke="${A.color}" stroke-width="3" stroke-dasharray="7 5"/>`;
    ax += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}" stroke="${A.color}" stroke-width="5" stroke-linecap="round"/>`;
    const len = Math.hypot(dx, dy) || 1, ox = -dy / len, oy = dx / len, mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
    const tx = X(mx + ox * A.off), ty = Y(my + oy * A.off);
    ax += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="${A.color}" paint-order="stroke" stroke="#fff" stroke-width="4">${A.label}</text>`;
  });
  const dims = (opt.dims || []).map(d => `<text x="${X(d[0])}" y="${Y(d[1])}" class="dim">${d[2]}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${Hh}" class="l3-svg" role="img" aria-label="${shape.name}${axis ? '과 회전축' : ''}">${g}<polygon points="${poly}" class="shape"/>${deco}${ax}${dims}</svg>`;
}

/* ---------- 3D: 도형을 축 둘레로 돌리는 장치 ---------- */
function l3Revolver(viewer, opt={}){
  const T = viewer.THREE, H = l1H(T);
  const g = new T.Group(); viewer.extras.add(g);
  // 옆면과 밑면을 서로 다른 파스텔 색으로 (갤러리와 같은 밝고 산뜻한 톤) → 입체감이 분명하게
  const SIDE_PASTEL = { '#F48FB1':'#FFB3D9', '#4FC3F7':'#9FD8FF', '#FFB74D':'#FFC79A', '#AED581':'#A6EDC0', '#9575CD':'#C9B8FF', '#80DEEA':'#9FEBDF' };
  const sideColor = SIDE_PASTEL[opt.color] || '#9FD8FF', baseColor = '#FFE98A';
  const mkMat = color => { const m = new T.MeshPhongMaterial({ color, side:T.DoubleSide, transparent:true, opacity:0.5, depthWrite:false, shininess:18, specular:0x222222,
    polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }); m.userData.pastel = true; return m; };   // 이미 파스텔이라 셰이더 섞기는 하지 않음
  const sideMat = mkMat(sideColor), baseMat = mkMat(baseColor);
  let prof = null, phi = 0, lathe = null, moving = null;
  const api = { group:g, get phi(){ return phi; } };
  let bare = false, bareObjs = [];
  /** 회전축·처음 자리 도형을 숨기고 입체도형만 보이기 */
  api.bare = v => { bare = !!v; bareObjs.forEach(o => { o.visible = !bare; }); viewer.requestRender(); };
  function clear(){ g.children.slice().forEach(o => { g.remove(o); l1Dispose(o); }); lathe = moving = null; }
  function shapeMesh(color, opacity){
    const shp = new T.Shape(prof.map(p => new T.Vector2(p[0], p[1])));
    const geo = new T.ShapeGeometry(shp).rotateY(-Math.PI / 2);
    const m = new T.Mesh(geo, new T.MeshBasicMaterial({ color, side:T.DoubleSide, transparent:opacity < 1, opacity, depthWrite:opacity >= 1, polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-1 }));
    m.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(prof.map(p => new T.Vector3(0, p[1], p[0]))), new T.LineBasicMaterial({ color:0x8D3B1F })));
    return m;
  }
  api.set = (profile) => {
    clear(); prof = profile;
    if(!prof){ viewer.requestRender(); return; }
    const rmax = Math.max(...prof.map(p => p[0])), ys = prof.map(p => p[1]);
    const ymin = Math.min(...ys), ymax = Math.max(...ys);
    const sc = (opt.size || 2.6) / Math.max(2 * rmax, ymax - ymin, 0.5);
    g.scale.setScalar(sc); g.position.y = -(ymin + ymax) / 2 * sc;
    const ghost = shapeMesh('#FFAB91', 0.3); g.add(ghost);   // 처음 자리(흐리게)
    moving = shapeMesh('#FF7043', 1); g.add(moving);          // 돌아가는 도형
    const ax = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0, ymin - 0.6 / sc, 0), new T.Vector3(0, ymax + 0.6 / sc, 0)]),
      new T.LineDashedMaterial({ color:0xD32F2F, dashSize:0.12 / sc, gapSize:0.08 / sc }));
    ax.computeLineDistances(); g.add(ax);
    const lab = H.label2('회전축', new T.Vector3(0, ymax + 0.85 / sc, 0), 0.7); lab.scale.divideScalar(sc); g.add(lab);
    bareObjs = [ghost, ax, lab]; bareObjs.forEach(o => { o.visible = !bare; });
    api.setPhi(phi);
  };
  api.setPhi = (a) => {
    phi = Math.max(0, Math.min(2 * Math.PI, a));
    if(!prof) return;
    if(lathe){ g.remove(lathe); lathe.children.forEach(c => { c.geometry.dispose(); if(c.isLine) c.material.dispose(); }); lathe = null; }
    if(phi > 0.002){
      // 단면의 변마다 따로 돌려서: 회전축에 수직인 변이 만든 면은 밑면 색, 나머지는 옆면 색
      lathe = new T.Group();
      const n = prof.length, seg = Math.max(2, Math.ceil(80 * phi / (2 * Math.PI)));
      for(let i=0;i<n;i++){
        const a = prof[i], b = prof[(i + 1) % n];
        if(Math.abs(a[0]) < 1e-6 && Math.abs(b[0]) < 1e-6) continue;          // 회전축 위의 변은 면을 만들지 않음
        const flat = Math.abs(a[1] - b[1]) < 1e-6;
        const geo = new T.LatheGeometry([new T.Vector2(a[0], a[1]), new T.Vector2(b[0], b[1])], seg, 0, phi);
        lathe.add(new T.Mesh(geo, flat ? baseMat : sideMat));
        if(flat) [a, b].forEach(q => { if(q[0] > 1e-6){   // 밑면의 테두리(원)를 선으로 → 옆면과 밑면의 경계가 또렷하게
          const pts = []; for(let k=0;k<=seg;k++){ const t = phi * k / seg; pts.push(new T.Vector3(q[0] * Math.sin(t), q[1], q[0] * Math.cos(t))); }
          lathe.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({ color:0x5C6B8A })));
        } });
      }
      g.add(lathe);
    }
    const full = phi >= 2 * Math.PI - 1e-3;
    [sideMat, baseMat].forEach(m => { m.opacity = full ? 0.9 : 0.5; m.depthWrite = full; m.needsUpdate = true; });
    moving.rotation.y = phi; moving.visible = !full || !!opt.keepShape;
    viewer.requestRender();
  };
  /** 지금 각도에서 360°까지 돌리기 (sec초) */
  let anim = null;
  viewer.onFrame(dt => {
    if(!anim) return false;
    anim.t += L0_REDUCED_MOTION ? 99 : dt;
    const k = Math.min(1, anim.t / anim.dur);
    api.setPhi(anim.from + (2 * Math.PI - anim.from) * k);
    anim.onStep && anim.onStep(phi);
    if(k >= 1){ const done = anim.onDone; anim = null; done && done(); }
    return true;
  });
  api.play = (dur=3, onStep, onDone) => { const from = phi >= 2 * Math.PI - 1e-3 ? 0 : phi; anim = { t:0, dur:dur * (1 - from / (2 * Math.PI)), from, onStep, onDone }; viewer.requestRender(); };
  api.stop = () => { anim = null; };
  api.visible = (v) => { g.visible = v; viewer.requestRender(); };
  return api;
}

async function l3SetupThink(){
  const box = document.getElementById('l3-think'); if(!box) return;
  const ITEMS = [
    { key:'rtri', label:'직각삼각형', axis:{ type:'edge', i:2 }, ans:'원뿔', expl:'직각삼각형의 직각을 낀 한 변을 축으로 돌리면 <b>원뿔</b>이 돼.' },
    { key:'semi', label:'반원', axis:{ type:'edge', i:L3_SHAPES[2].pts.length - 1 }, ans:'구', expl:'반원의 지름을 축으로 돌리면 <b>구</b>가 돼.' },
  ];
  const OPTS = [['원기둥', 'cylinder'], ['원뿔', 'cone'], ['구', 'sphere'], ['원뿔대', 'frustum']];
  box.innerHTML = `
    <div class="l0-gal-grid l3-th-grid">
      <div><div class="l3-th-viewer"></div></div>
      <div class="l0-side l3-th-side">
        <div class="l1-big l3-th-namebox" aria-live="polite"><span class="l3-th-name">막대에 붙인 종이</span></div>
        <div class="l3-paper-ui">
          <div class="l0-note l3-th-note">종이를 돌려 보자. 빠르게 돌리면 어떤 입체도형처럼 보일까?</div>
          <div class="l3-speed"><button class="btn" type="button" data-s="slow">🐢 천천히 돌리기</button><button class="btn primary" type="button" data-s="fast">🚀 빠르게 돌리기</button><button class="btn" type="button" data-s="stop">⏸ 멈추기</button></div>
        </div>
        <div class="l3-predict" hidden>
          <p class="l3-pred-q">🤔 <b>추론</b> 주어진 평면도형을 그림의 회전축으로 돌리면?</p>
          ${ITEMS.map((it, i) => `<div class="l3-pred" data-i="${i}">
              <div class="fig">${l3ShapeSVG(l3Shape(it.key), it.axis, { pad:0.6 })}<b>${it.label}</b></div>
              <div class="opts">${OPTS.map(o => `<button class="btn l3-opt" type="button" aria-pressed="false" data-v="${o[0]}">${l3Icon(o[1])}<span>${o[0]}</span></button>`).join('')}</div>
              <button class="btn primary" type="button" data-a="check" disabled>▶ 돌려서 확인하기</button>
              <p class="fb" aria-live="polite"></p></div>`).join('')}
        </div>
      </div>
      <div class="l3-infer" role="group" aria-label="활동 고르기"><button class="btn" type="button" data-inf="-1" aria-pressed="true">📄 종이 돌리기</button>${ITEMS.map((it, i) => `<button class="btn" type="button" data-inf="${i}" aria-pressed="false">🔍 추론 ${i + 1}</button>`).join('')}</div>
    </div>`;
  const viewer = await create3DViewer($('.l3-th-viewer', box), { showInfo:false, tools:['autoRotate', 'reset'], toolLabels:{ reset:'🎯 처음 위치' } });
  const nameEl = $('.l3-th-name', box), note = $('.l3-th-note', box);
  let rev = null, demo = null, speed = 0, target = 0;
  if(viewer.ok){
    const T = viewer.THREE;
    viewer.resetView();
    demo = new T.Group(); viewer.extras.add(demo);
    const stick = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 3.4, 16), new T.MeshPhongMaterial({ color:'#8D6E63' }));
    demo.add(stick);
    const paperG = new T.Group(); demo.add(paperG);
    const paper = new T.Mesh(new T.PlaneGeometry(1.1, 1.8).translate(0.55, 0, 0), new T.MeshPhongMaterial({ color:'#FFCC80', side:T.DoubleSide }));
    paper.add(new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(1.1, 1.8).translate(0.55, 0, 0)), new T.LineBasicMaterial({ color:0x8D3B1F })));
    paperG.add(paper);
    const ghostMat = new T.MeshPhongMaterial({ color:'#FFCC80', transparent:true, opacity:0, side:T.DoubleSide, depthWrite:false });
    const ghost = new T.Mesh(new T.CylinderGeometry(1.1, 1.1, 1.8, 64, 1, true), ghostMat); demo.add(ghost);
    const capMat = ghostMat.clone();
    [0.9, -0.9].forEach(y => { const c = new T.Mesh(new T.CircleGeometry(1.1, 64).rotateX(-Math.PI/2).translate(0, y, 0), capMat); demo.add(c); });
    rev = l3Revolver(viewer, { color:'#F48FB1' }); rev.visible(false);
    viewer.onFrame(dt => {
      if(speed === target && speed === 0) return false;
      speed += (target - speed) * Math.min(1, dt * 2.2);
      if(Math.abs(speed - target) < 0.01) speed = target;
      paperG.rotation.y += speed * dt;
      const blur = Math.max(0, Math.min(1, (speed - 6) / 14));
      ghostMat.opacity = blur * 0.75; capMat.opacity = blur * 0.55; paper.material.opacity = 1 - blur * 0.6; paper.material.transparent = blur > 0;
      if(blur > 0.9 && target > 10){ nameEl.textContent = '원기둥처럼 보여!'; note.innerHTML = '🎉 빠르게 돌리니 종이가 지나간 자리가 겹쳐 보여서 <b>원기둥</b>처럼 보이지? 이렇게 평면도형을 한 직선을 축으로 돌리면 입체도형이 생겨.'; }
      return true;
    });
  }
  /* [회전체 추론 1·2]: 오른쪽 단을 그 예상 문제로 바꾸고, 3D 화면에는 돌릴 평면도형을 보여 준다. 다시 누르면 종이 돌리기로 */
  const paperUI = $('.l3-paper-ui', box), predict = $('.l3-predict', box);
  const infBtns = [...box.querySelectorAll('[data-inf]')];
  function showInfer(i){
    infBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.inf === i)));
    requestAnimationFrame(() => fitPred && fitPred());
    const on = i >= 0;
    paperUI.hidden = on; predict.hidden = !on;
    predict.querySelectorAll('.l3-pred').forEach(r => { r.hidden = +r.dataset.i !== i; });
    target = 0; speed = 0;
    if(!on){ if(rev){ rev.stop(); rev.visible(false); } if(demo) demo.visible = true; nameEl.textContent = '막대에 붙인 종이'; viewer.requestRender && viewer.requestRender(); return; }
    const it = ITEMS[i];
    if(demo) demo.visible = false;
    if(rev){ const pr = l3Profile(l3Shape(it.key), it.axis); rev.stop(); rev.visible(true); rev.set(pr.prof); rev.setPhi(0); }
    nameEl.textContent = `${it.label}을 돌리면?`;
  }
  infBtns.forEach(b => b.addEventListener('click', () => showInfer(+b.dataset.inf)));
  // 넓은 화면: 오른쪽 단 높이 = 3D 화면 + 관찰 버튼 높이 (추론 문제 상자 크기 고정, 결과가 나와도 그대로)
  const thLeft = $('.l3-th-viewer', box).parentElement, thSide = $('.l3-th-side', box);
  function fitPred(){
    predict.querySelectorAll('.l3-pred').forEach(r => { r.style.fontSize = ''; const fbx = $('.fb', r); fbx.style.fontSize = ''; fbx.style.lineHeight = ''; });
    if(!thSide.classList.contains('fixed') || predict.hidden) return;
    const r = predict.querySelector('.l3-pred:not([hidden])'); if(!r) return;
    const fbx = $('.fb', r); let fs = 0.9, lh = 1.45;
    const set = () => { fbx.style.fontSize = fs + 'rem'; fbx.style.lineHeight = lh; };
    set();
    for(let n=0;n<40 && r.scrollHeight > r.clientHeight + 1;n++){ if(lh > 1.2) lh -= 0.05; else fs -= 0.03; set(); }
  }
  function fitTh(){
    const two = getComputedStyle(thLeft.parentElement).gridTemplateColumns.split(' ').length > 1;
    thSide.style.height = two ? thLeft.offsetHeight + 'px' : ''; thSide.classList.toggle('fixed', two); fitPred();
  }
  if('ResizeObserver' in window) new ResizeObserver(fitTh).observe(thLeft); requestAnimationFrame(fitTh);
  new MutationObserver(() => requestAnimationFrame(fitPred)).observe(predict, { subtree:true, childList:true, characterData:true });
  box.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
    if(rev){ rev.visible(false); rev.stop(); } if(demo) demo.visible = true;
    target = { slow:2, fast:26, stop:0 }[b.dataset.s];
    nameEl.textContent = '막대에 붙인 종이';
    if(b.dataset.s === 'slow') note.textContent = '천천히 돌리면 종이 한 장이 돌아가는 게 그대로 보여.';
    if(b.dataset.s === 'fast') note.textContent = '점점 빨라지고 있어… 어떤 모양처럼 보이니?';
    viewer.requestRender && viewer.requestRender();
  }));
  box.querySelectorAll('.l3-pred').forEach(row => {
    const it = ITEMS[+row.dataset.i]; let pick = null;
    const chk = $('[data-a="check"]', row), fb = $('.fb', row);
    row.querySelectorAll('.l3-opt').forEach(b => b.addEventListener('click', () => {
      pick = b.dataset.v; row.querySelectorAll('.l3-opt').forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.classList.remove('ok', 'ng'); });
      chk.disabled = false; fb.textContent = '';
    }));
    chk.addEventListener('click', () => {
      target = 0; speed = 0; if(demo) demo.visible = false;
      const pr = l3Profile(l3Shape(it.key), it.axis);
      const finish = () => {
        const ok = pick === it.ans;
        row.querySelectorAll('.l3-opt').forEach(x => { if(x.dataset.v === it.ans) x.classList.add('ok'); else if(x.dataset.v === pick) x.classList.add('ng'); });
        fb.className = 'fb ' + (ok ? 'ok' : 'ng');
        fb.innerHTML = (ok ? '✓ 예상이 맞았어! ' : `✗ 예상과 달랐네. `) + it.expl;
        nameEl.textContent = `${it.label} → ${it.ans}`; row.dataset.tried = '1';
      };
      if(rev){ rev.visible(true); rev.set(pr.prof); rev.setPhi(0); nameEl.textContent = `${it.label}을 돌리는 중…`; rev.play(2.6, null, finish); }
      else finish();
    });
  });
}

          <div class="l3-line-slider" hidden></div>
          <p class="l3-axis-msg l0-note" aria-live="polite"></p>
        </div>
      </div>
    </div>`;
  const st = { shape:null, mode:'edge', edge:null, lineX:0, custom:null, drawPts:[] };
  const nameEl = $('.l3-mk-name', wrap), nameBox = $('.l3-mk-namebox', wrap), result = $('.l3-mk-result', wrap), axisMsg = $('.l3-axis-msg', wrap), editor = $('.l3-editor', wrap);
  const modeSeg = createSegmented({ items:[{ value:'edge', label:'변' }, { value:'line', label:'직선 $\\ell$' }], value:'edge', label:'회전축 정하는 방법',
    onChange:v => { st.mode = v; if(v === 'line' && st.shape) st.lineX = l3Bounds(st.shape.pts).minX - 1; refresh(); } });
  $('.l3-axis-mode', wrap).appendChild(modeSeg.el); renderMath(modeSeg.el);   // 교과서처럼 기울어진 수식 문자 l
  let lineSlider = null;
  const angle = createSlider({ label:'<span class="l3-rot-no">3</span>회전 각도', min:0, max:360, step:1, value:0, unit:'°', onInput:v => { rev && rev.stop(); rev && rev.setPhi(v * Math.PI / 180); badge(); } });
  $('.l3-mk-angle', wrap).appendChild(angle.el);
  const angleInput = $('input', angle.el), angleOut = $('output', angle.el);
  const syncAngle = (deg) => { angleInput.value = Math.round(deg); angleOut.textContent = Math.round(deg) + '°'; angleInput.style.setProperty('--p', (deg / 3.6) + '%'); };

  const viewer = await create3DViewer($('.l3-mk-viewer', wrap), { showInfo:false, tools:['autoRotate', 'reset'], toolLabels:{ reset:'🎯 처음 위치' } });
  const rev = viewer.ok ? l3Revolver(viewer, { color:'#4FC3F7' }) : null;
  { // 평면도형 선택: 좌우 버튼으로 넘겨 보기
    const track = $('.l3-car-track', wrap);
    const step = () => { const c = track.querySelector('.l3-card'); return c ? c.offsetWidth + 8 : 120; };
    const upd = () => { const a = track.scrollLeft <= 2, z = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      wrap.querySelector('[data-car="-1"]').disabled = a; wrap.querySelector('[data-car="1"]').disabled = z; };
    wrap.querySelectorAll('[data-car]').forEach(bt => bt.addEventListener('click', () => { track.scrollBy({ left:+bt.dataset.car * step(), behavior:'smooth' }); setTimeout(upd, 400); }));
    track.addEventListener('scroll', () => requestAnimationFrame(upd)); requestAnimationFrame(upd);
    if('ResizeObserver' in window) new ResizeObserver(upd).observe(track);
  }
  if(viewer.ok) viewer.resetView();

  function axis(){ if(!st.shape) return null; return st.mode === 'edge' ? (st.edge == null ? null : { type:'edge', i:st.edge }) : { type:'line', x:st.lineX }; }
  function current(){ const a = axis(); return a ? l3Profile(st.shape, a) : { ok:false }; }
  function badge(){

    if(!st.shape){ nameEl.textContent = '① 도형을 골라 보자'; result.innerHTML = ''; return; }
    if(!pr.ok){ nameEl.textContent = '② 회전축을 정해 보자'; result.innerHTML = ''; return; }
    if(deg < 359.5){ nameEl.textContent = deg < 0.5 ? '③ 슬라이더를 움직이거나 [1회전]을 눌러 보자' : `회전 중… ${Math.round(deg)}°`; nameBox.classList.remove('good'); result.innerHTML = ''; return; }
    const c = l3Classify(st.shape, pr.prof);
    nameEl.textContent = `🎉 ${l3Title(c)}`; nameBox.classList.add('good');
    result.innerHTML = `<div class="l3-result"><span class="ic">${l3Icon(c.icon || 'hollow')}</span><div><b>④ 완성!</b> ${st.shape.name}을(를) 1회전 시켰더니 <b>${l3Title(c)}</b>이(가) 생겼어.<br><span class="l0-muted">${c.note}</span><br>🖐️ 3D 화면을 끌어서 완성된 회전체를 돌려 보자.</div></div>`;
  }
  function refresh(){
    renderEditor();
    const pr = current();
    // 변/직선 l 모두 같은 틀: 직선 l일 때만 슬라이더가 보이고, 변일 때는 자리만 남긴다
    const ls = $('.l3-line-slider', wrap); ls.hidden = !st.shape; ls.style.visibility = st.mode === 'line' ? '' : 'hidden';
    if(st.shape){
      const b = l3Bounds(st.shape.pts);
      const box = $('.l3-line-slider', wrap); box.innerHTML = '';
      lineSlider = createSlider({ label:'회전축의 위치', min:Math.floor(b.minX) - 3, max:Math.ceil(b.maxX) + 3, step:0.5, value:st.lineX,
        format:v => { const gap = v <= b.minX ? b.minX - v : v >= b.maxX ? v - b.maxX : null; return gap == null ? '도형 안' : gap === 0 ? '도형에 붙음' : `틈 ${gap}칸`; },
        onInput:v => { st.lineX = v; renderEditor(); apply(); } });
      box.appendChild(lineSlider.el);
    }
    apply();
  }
  function apply(){
    const pr = current();
    if(!st.shape) axisMsg.innerHTML = '먼저 평면도형을 그려 주세요.';
    else if(st.mode === 'edge' && st.edge == null) axisMsg.innerHTML = st.shape.selectOnly === 'none'
      ? '원에는 변이 없어. <b>[직선 $\\ell$]</b>을 골라 도형 밖의 직선을 축으로 정해 보자.'
      : '👆 그림에서 <b>회전축으로 할 변</b>을 눌러 보자. (굵게 표시된 선)';
    else if(!pr.ok) axisMsg.innerHTML = `⚠️ ${pr.reason}`;
    else axisMsg.innerHTML = pr.gap > 1e-6 ? `✓ 축이 정해졌어. 도형과 축 사이에 <b>틈</b>이 있어! 어떤 회전체가 생길까?` : '✓ 축이 정해졌어. 3D 화면 아래에서 돌려 보자!';
    renderMath(axisMsg);
    if(rev){ rev.stop(); rev.set(pr.ok ? pr.prof : null); rev.setPhi(0); }
    syncAngle(0); angleInput.disabled = !pr.ok; $('[data-a="play"]', wrap).disabled = !pr.ok; $('[data-a="zero"]', wrap).disabled = !pr.ok;
    badge();
  }
  function renderEditor(){
    if(!st.shape){ editor.innerHTML = '<div class="placeholder"><b>📐</b>도형을 고르면 여기에 나타나.</div>'; return; }
    const s = st.shape, b = l3Bounds(s.pts);
    const x0 = Math.floor(b.minX) - 3.5, x1 = Math.ceil(b.maxX) + 3.5, y0 = Math.floor(b.minY) - 1, y1 = Math.ceil(b.maxY) + 1;   // 변/직선 l 모두 같은 크기의 격자
    const U = 36, W = (x1 - x0) * U, Hh = (y1 - y0) * U, X = x => (x - x0) * U, Y = y => (y1 - y) * U;
    let h = `<svg viewBox="0 0 ${W} ${Hh}" class="l3-svg l3-edit" role="img" aria-label="${s.name}">`;
    for(let x=Math.ceil(x0);x<=x1;x++) h += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${Hh}" class="grid"/>`;
    for(let y=y0;y<=y1;y++) h += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" class="grid"/>`;
    h += `<polygon points="${s.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" class="shape"/>`;
    if(s.deco){ const [a, c] = s.deco; h += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}" stroke="#7A5A1E" stroke-width="1.5" stroke-dasharray="4 3"/>`; }
    const ax = axis();
    if(ax){
      let a, c; if(ax.type === 'edge'){ a = s.pts[ax.i]; c = s.pts[(ax.i + 1) % s.pts.length]; } else { a = [ax.x, 0]; c = [ax.x, 1]; }
      const dx = c[0] - a[0], dy = c[1] - a[1], L = 40;
      h += `<line x1="${X(a[0] - dx*L)}" y1="${Y(a[1] - dy*L)}" x2="${X(a[0] + dx*L)}" y2="${Y(a[1] + dy*L)}" class="axis"/>`;
      if(ax.type === 'line') h += `<text x="${X(ax.x) + 6}" y="18" class="lab red l3-math-l">ℓ</text>`;
    }
    if(st.mode === 'edge'){
      s.pts.forEach((p, i) => {
        if(!l3EdgeSelectable(s, i)) return;
        const q = s.pts[(i + 1) % s.pts.length];
        const sel = st.edge === i;
        h += `<line x1="${X(p[0])}" y1="${Y(p[1])}" x2="${X(q[0])}" y2="${Y(q[1])}" class="edge ${sel ? 'sel' : ''}"/>`;
        h += `<line x1="${X(p[0])}" y1="${Y(p[1])}" x2="${X(q[0])}" y2="${Y(q[1])}" class="edge-hit" data-i="${i}" tabindex="0" role="button" aria-label="${i + 1}번째 변을 회전축으로"/>`;
      });
    }
    editor.innerHTML = h + '</svg>';
    editor.querySelectorAll('.edge-hit').forEach(e => {
      const go = () => { st.edge = +e.dataset.i; renderEditor(); apply(); };
      e.addEventListener('click', go); e.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); go(); } });
    });
  }
  function choose(shape){
