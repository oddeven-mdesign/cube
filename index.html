function l0ShapeMini(key){
  const box = (w, h, d) => `<svg viewBox="0 0 40 34" style="width:30px;height:26px" aria-hidden="true"><polygon points="${20 - w / 2},${30 - h} ${20 + w / 2 - d},${30 - h} ${20 + w / 2 - d},30 ${20 - w / 2},30" fill="#BBD7F8" stroke="#2B3A55" stroke-width="1.6" stroke-linejoin="round"/><polygon points="${20 - w / 2},${30 - h} ${20 - w / 2 + d},${30 - h - d * 0.75} ${20 + w / 2},${30 - h - d * 0.75} ${20 + w / 2 - d},${30 - h}" fill="#E9F2FD" stroke="#2B3A55" stroke-width="1.6" stroke-linejoin="round"/><polygon points="${20 + w / 2 - d},${30 - h} ${20 + w / 2},${30 - h - d * 0.75} ${20 + w / 2},${30 - d * 0.75} ${20 + w / 2 - d},30" fill="#A6C5EC" stroke="#2B3A55" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  if(key === 'cube') return box(26, 18, 8);        // 정육면체: 가로 = 세로 = 높이
  if(key === 'cuboid') return box(36, 14, 8);      // 직육면체: 가로가 긴 상자
  const map = { cube:['prism',4], cuboid:['prism',4], sqpyramid:['pyramid',4], cylinder:['cylinder'], cone:['cone'], sphere:['sphere'] };
  const [k, n] = map[key];
  return l0IconSVG(k, n).replace('<svg ', '<svg style="width:26px;height:26px" ');
}

/* =====================================================================
   ① 3D 도형 갤러리
   ===================================================================== */
const L0_PART_COLORS = {
  face:'#FFB300', base:'#FFB300', side:'#00ACC1', edge:'#E91E63', vertex:'#FF6F00', height:'#3949AB',
  apex:'#D50000', slant:'#8E24AA', center:'#D50000', radius:'#3949AB',
};

/** 3D 강조용 도우미 (선분 막대, 점, 면, 글자 표지) */
function l0Helpers(T){
  const mat = (color, opacity=0.8) => {
    const m = new T.MeshBasicMaterial({ color, transparent:true, opacity, depthTest:false, depthWrite:false, side:T.DoubleSide });
    m.userData.base = opacity; return m;
  };
  const tube = (p, q, r, color, opacity=1) => {
    const d = new T.Vector3().subVectors(q, p); const len = d.length();
    const m = new T.Mesh(new T.CylinderGeometry(r, r, len, 12, 1), mat(color, opacity));
    m.position.addVectors(p, q).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    m.renderOrder = 12; return m;
  };
  const dashed = (p, q, r, color) => {
    const g = new T.Group(); const len = p.distanceTo(q); const n = Math.max(3, Math.round(len / 0.14));
    for(let i=0;i<n;i+=2){
      const a = p.clone().lerp(q, i/n), b = p.clone().lerp(q, Math.min(1, (i+1)/n));
      g.add(tube(a, b, r, color));
    }
    return g;
  };
  const dot = (p, r, color) => {
    const m = new T.Mesh(new T.SphereGeometry(r, 20, 14), mat(color, 1));
    m.position.copy(p); m.renderOrder = 13; return m;
  };
  const fill = (tris, color, opacity=0.6) => {   // tris: [[a,b,c], ...] 삼각형 목록
    const arr = new Float32Array(tris.length * 9);
    tris.forEach((t, i) => t.forEach((v, k) => { arr[i*9 + k*3] = v.x; arr[i*9 + k*3 + 1] = v.y; arr[i*9 + k*3 + 2] = v.z; }));
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(arr, 3));
    const m = new T.Mesh(g, mat(color, opacity)); m.renderOrder = 11; return m;
  };
  const fan = (pts, color, opacity) => fill(pts.slice(1, -1).map((p, i) => [pts[0], p, pts[i+2]]), color, opacity);
  const label = (text, pos, color='#1F2A44') => {
    const c = document.createElement('canvas'); const ctx = c.getContext('2d');
    const font = 'bold 44px Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    // ½·⅓·⅔는 교과서처럼 위아래 분수로 그린다
    const FR = { '½':['1', '2'], '⅓':['1', '3'], '⅔':['2', '3'] }, segs = String(text).split(/([½⅓⅔])/).filter(x => x !== ''), hasFr = segs.some(x => FR[x]);
    const sFont = 'bold 30px "Times New Roman", Times, serif';
    const segW = x => { if(FR[x]){ ctx.font = sFont; return Math.max(...FR[x].map(d => ctx.measureText(d).width)) + 14; } ctx.font = font; return ctx.measureText(x).width; };
    ctx.font = font; const tw = segs.reduce((a, x) => a + segW(x), 0), w = Math.ceil(tw) + 36; const h = hasFr ? 84 : 64;
    const DPR = 2; c.width = w * DPR; c.height = h * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // 2배 해상도로 그려 또렷하게
    ctx.font = font; ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = color; ctx.lineWidth = 5;
    const r = 18; ctx.beginPath();
    ctx.moveTo(r, 3); ctx.lineTo(w-r, 3); ctx.quadraticCurveTo(w-3, 3, w-3, r); ctx.lineTo(w-3, h-r); ctx.quadraticCurveTo(w-3, h-3, w-r, h-3);
    ctx.lineTo(r, h-3); ctx.quadraticCurveTo(3, h-3, 3, h-r); ctx.lineTo(3, r); ctx.quadraticCurveTo(3, 3, r, 3); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1F2A44'; ctx.textBaseline = 'middle';
    if(!hasFr){ ctx.textAlign = 'center'; ctx.fillText(text, w/2, h/2 + 2); }
    else { let x = 18; ctx.textAlign = 'left';
      segs.forEach(sg => { const sw = segW(sg);
        if(FR[sg]){ ctx.font = sFont; ctx.textAlign = 'center'; const cx = x + sw / 2;
          ctx.fillText(FR[sg][0], cx, h / 2 - 15); ctx.fillText(FR[sg][1], cx, h / 2 + 19);
          ctx.fillRect(x + 4, h / 2 + 1, sw - 8, 3); ctx.textAlign = 'left'; }
        else { ctx.font = font; ctx.fillText(sg, x, h / 2 + 2); }
        x += sw; }); }
    const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace;
    const sm = new T.SpriteMaterial({ map:tex, transparent:true, depthTest:false, depthWrite:false });
    sm.userData.base = 1;
    const s = new T.Sprite(sm); s.position.copy(pos); s.scale.set(0.3 * w / 64, 0.3 * h / 64, 1); s.renderOrder = 30;
    return s;
  };
  const group = (...objs) => { const g = new T.Group(); objs.flat().forEach(o => o && g.add(o)); return g; };
  return { tube, dashed, dot, fill, fan, label, group };
}

/** 정다각형 기둥/뿔의 꼭짓점 좌표 (뷰어와 같은 위치가 되도록 가운데로 옮김) */
function l0PolyFrame(T, n, r, h){
  const raw = Array.from({length:n}, (_, k) => { const t = 2*Math.PI*k/n; return [r*Math.sin(t), r*Math.cos(t)]; });
  const xs = raw.map(p => p[0]), zs = raw.map(p => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
  const at = (k, y) => new T.Vector3(raw[k][0] - cx, y, raw[k][1] - cz);
  // 처음 카메라 방향에서 가장 잘 보이는 옆면 번호
  const view = new T.Vector3(0.62, 0, 0.92).normalize();
  let front = 0, best = -Infinity;
  for(let k=0;k<n;k++){
    const t = 2*Math.PI*(k + 0.5)/n; const d = Math.sin(t)*view.x + Math.cos(t)*view.z;
    if(d > best){ best = d; front = k; }
  }
  return { cx, cz, at, front, center:(y) => new T.Vector3(-cx, y, -cz) };
}

/**
 * 갤러리에 쓰는 도형 정보
 * kind: 'cuboid' | 'cube' | 'prism' | 'pyramid' | 'cylinder' | 'cone' | 'sphere'
 * 반환: { title, parts:[[key,label]], build(T), make(T, H, key) }
 */
function l0ShapeSpec(kind, n=4){
  const C = L0_PART_COLORS;
  if(kind === 'cuboid' || kind === 'cube'){
    const [a, c, b] = kind === 'cube' ? [1.6, 1.6, 1.6] : [2.2, 1.3, 1.4];   // 가로, 높이, 세로
    return {
      title: kind === 'cube' ? '정육면체' : '직육면체',
      parts:[['face','면'], ['edge','모서리'], ['vertex','꼭짓점']],
      build:(T) => new T.BoxGeometry(a, c, b),
      make(T, H, key){
        const V = []; for(const x of [-a/2, a/2]) for(const y of [-c/2, c/2]) for(const z of [-b/2, b/2]) V.push(new T.Vector3(x, y, z));
        const r = 0.035;
        if(key === 'face'){
          const z = b/2 + 0.004;
          const q = [new T.Vector3(-a/2,-c/2,z), new T.Vector3(a/2,-c/2,z), new T.Vector3(a/2,c/2,z), new T.Vector3(-a/2,c/2,z)];
          return H.group(H.fan(q, C.face, 0.65), H.label('면', new T.Vector3(0, 0, z + 0.05)));
        }
        if(key === 'edge'){
          const E = [];
          for(let i=0;i<8;i++) for(let j=i+1;j<8;j++){
            const d = V[i].clone().sub(V[j]); const diff = [d.x, d.y, d.z].filter(v => Math.abs(v) > 1e-6).length;
            if(diff === 1) E.push(H.tube(V[i], V[j], r, C.edge));
          }
          return H.group(E, H.label('모서리', new T.Vector3(0, c/2 + 0.28, b/2)));
        }
        if(key === 'vertex'){
          return H.group(V.map(p => H.dot(p, 0.08, C.vertex)), H.label('꼭짓점', new T.Vector3(a/2 + 0.25, c/2 + 0.3, b/2)));
        }
      },
    };
  }
  if(kind === 'prism' || kind === 'pyramid'){
    const isPrism = kind === 'prism';
    const r = isPrism ? 1 : 1.1, h = 1.6;
    return {
      title: `${L0_POLY[n]}${isPrism ? '기둥' : '뿔'}`,
      parts: isPrism
        ? [['base','밑면'], ['side','옆면'], ['edge','모서리'], ['vertex','꼭짓점'], ['height','높이']]
        : [['base','밑면'], ['side','옆면'], ['edge','모서리'], ['vertex','꼭짓점'], ['apex','각뿔의 꼭짓점'], ['height','높이']],
      build:(T) => {
        const F = l0PolyFrame(T, n, r, h);
        return new T.CylinderGeometry(isPrism ? r : 0, r, h, n, 1).translate(-F.cx, 0, -F.cz);
      },
      make(T, H, key){
        const F = l0PolyFrame(T, n, r, h);
        const B = Array.from({length:n}, (_, k) => F.at(k, -h/2));
        const U = isPrism ? Array.from({length:n}, (_, k) => F.at(k, h/2)) : null;
        const A = F.center(h/2);              // 각뿔의 꼭짓점
        const nx = k => (k + 1) % n;
        const fk = F.front;
        const out = (p, d=0.25) => { const c = F.center(p.y); return p.clone().add(p.clone().sub(c).setY(0).normalize().multiplyScalar(d)); };
        if(key === 'base'){
          const g = H.group(H.fan(B, C.base, 0.7), H.label('밑면', F.center(-h/2 - 0.3)));
          if(isPrism){ g.add(H.fan(U, C.base, 0.7)); g.add(H.label('밑면', F.center(h/2 + 0.3))); }
          return g;
        }
        if(key === 'side'){
          const tris = [];
          for(let k=0;k<n;k++){
            if(isPrism){ tris.push([B[k], B[nx(k)], U[nx(k)]], [B[k], U[nx(k)], U[k]]); }
            else tris.push([B[k], B[nx(k)], A]);
          }
          const mid = isPrism ? B[fk].clone().add(B[nx(fk)]).multiplyScalar(0.5)
                              : B[fk].clone().add(B[nx(fk)]).add(A).multiplyScalar(1/3);
          const lp = out(mid, 0.3); lp.y = isPrism ? -h/4 : mid.y;
          return H.group(H.fill(tris, C.side, 0.5), H.label('옆면', lp));
        }
        if(key === 'edge'){
          const R = 0.032, E = [];
          for(let k=0;k<n;k++){
            E.push(H.tube(B[k], B[nx(k)], R, C.edge));
            if(isPrism){ E.push(H.tube(U[k], U[nx(k)], R, C.edge)); E.push(H.tube(B[k], U[k], R, C.edge)); }
            else E.push(H.tube(B[k], A, R, C.edge));
          }
          const m = isPrism ? B[fk].clone().add(U[fk]).multiplyScalar(0.5) : B[fk].clone().add(A).multiplyScalar(0.5);
          return H.group(E, H.label('모서리', out(m, 0.4)));
        }
        if(key === 'vertex'){
          const pts = isPrism ? [...B, ...U] : [...B, A];
          const lp = isPrism ? out(U[fk], 0.35).setY(h/2 + 0.25) : out(B[fk], 0.35).setY(-h/2 - 0.25);
          return H.group(pts.map(p => H.dot(p, 0.075, C.vertex)), H.label('꼭짓점', lp));
        }
        if(key === 'apex'){
          return H.group(H.dot(A, 0.12, C.apex), H.label('각뿔의 꼭짓점', A.clone().add(new T.Vector3(0, 0.32, 0))));
        }
        if(key === 'height'){
          const top = isPrism ? F.center(h/2) : A, bot = F.center(-h/2);
          const g = H.group(H.dashed(bot, top, 0.03, C.height), H.dot(bot, 0.05, C.height), H.dot(top, 0.05, C.height));
          g.add(H.label('높이', top.clone().lerp(bot, 0.5).add(new T.Vector3(0.38, isPrism ? 0.25 : 0, 0.2))));
          return g;
        }
      },
    };
  }
  if(kind === 'cylinder'){
    const r = 1, h = 1.8;
    return {
      title:'원기둥', parts:[['base','밑면'], ['side','옆면'], ['height','높이']],
      build:(T, S) => S.cylinder(r, h),
      make(T, H, key){
        if(key === 'base'){
          const g = H.group();
          [h/2 + 0.004, -h/2 - 0.004].forEach((y, i) => {
            const geo = new T.CircleGeometry(r * 1.003, 64).rotateX(-Math.PI/2).translate(0, y, 0);
            const pos = geo.toNonIndexed().attributes.position; const tris = [];
            for(let k=0;k<pos.count;k+=3) tris.push([0,1,2].map(j => new T.Vector3().fromBufferAttribute(pos, k + j)));
            g.add(H.fill(tris, C.base, 0.7));
            g.add(H.label('밑면', new T.Vector3(0, y + (i === 0 ? 0.3 : -0.3), 0)));
          });
          return g;
        }
        if(key === 'side'){
          const geo = new T.CylinderGeometry(r * 1.01, r * 1.01, h, 64, 1, true).toNonIndexed();
          const pos = geo.attributes.position; const tris = [];
          for(let k=0;k<pos.count;k+=3) tris.push([0,1,2].map(j => new T.Vector3().fromBufferAttribute(pos, k + j)));
          return H.group(H.fill(tris, C.side, 0.45), H.label('옆면 (굽은 면)', new T.Vector3(0.6, 0, 1.15)));
        }
        if(key === 'height'){
          const a = new T.Vector3(0, -h/2, 0), b = new T.Vector3(0, h/2, 0);
          return H.group(H.dashed(a, b, 0.03, C.height), H.dot(a, 0.05, C.height), H.dot(b, 0.05, C.height), H.label('높이', new T.Vector3(0.4, 0, 0.2)));
        }
      },
    };
  }
  if(kind === 'cone'){
    const r = 1.1, h = 1.8;
    return {
      title:'원뿔', parts:[['base','밑면'], ['side','옆면'], ['apex','원뿔의 꼭짓점'], ['slant','모선'], ['height','높이']],
      build:(T, S) => S.cone(r, h),
      make(T, H, key){
        const A = new T.Vector3(0, h/2, 0), O = new T.Vector3(0, -h/2, 0);
        const triList = (geo) => { const pos = geo.toNonIndexed().attributes.position; const t = [];
          for(let k=0;k<pos.count;k+=3) t.push([0,1,2].map(j => new T.Vector3().fromBufferAttribute(pos, k + j))); return t; };
        if(key === 'base'){
          return H.group(H.fill(triList(new T.CircleGeometry(r * 1.003, 64).rotateX(Math.PI/2).translate(0, -h/2 - 0.004, 0)), C.base, 0.7),
                         H.label('밑면', new T.Vector3(0, -h/2 - 0.3, 0)));
        }
        if(key === 'side'){
          return H.group(H.fill(triList(new T.ConeGeometry(r * 1.012, h, 64, 1, true)), C.side, 0.45),
                         H.label('옆면 (굽은 면)', new T.Vector3(0.75, -0.2, 0.9)));
        }
        if(key === 'apex'){
          return H.group(H.dot(A, 0.11, C.apex), H.label('원뿔의 꼭짓점', A.clone().add(new T.Vector3(0, 0.32, 0))));
        }
        if(key === 'slant'){
          const g = H.group();
          [0.45, -0.95].forEach((phi, i) => {
            const P = new T.Vector3(r * Math.sin(phi), -h/2, r * Math.cos(phi));
            g.add(H.tube(A, P, 0.035, C.slant)); g.add(H.dot(P, 0.06, C.slant));
            if(i === 0) g.add(H.label('모선', A.clone().lerp(P, 0.55).add(new T.Vector3(0.35, 0, 0.25))));
          });
          return g;
        }
        if(key === 'height'){
          return H.group(H.dashed(O, A, 0.03, C.height), H.dot(O, 0.05, C.height), H.label('높이', new T.Vector3(-0.42, -0.1, 0.1)));
        }
      },
    };
  }
  if(kind === 'sphere'){
    const r = 1.2;
    return {
      title:'구', parts:[['center','구의 중심'], ['radius','반지름']],
      build:(T, S) => S.sphere(r),
      make(T, H, key){
        const O = new T.Vector3();
        if(key === 'center') return H.group(H.dot(O, 0.09, C.center), H.label('구의 중심', new T.Vector3(0, -0.3, 0)));
        if(key === 'radius'){
          const P = new T.Vector3(0.83, 0.12, -0.56).normalize().multiplyScalar(r);   // 처음 보는 방향과 수직이라 길이가 잘 보임
          return H.group(H.tube(O, P, 0.035, C.radius), H.dot(P, 0.06, C.radius), H.label('반지름', O.clone().lerp(P, 0.5).add(new T.Vector3(0, 0.28, 0))));
        }
      },
    };
  }
}

async function l0SetupGallery(wrap){
  const TABS = [
    { key:'box', label:'직육면체·정육면체' }, { key:'prism', label:'각기둥' },
    { key:'pyramid', label:'각뿔' }, { key:'round', label:'원기둥·원뿔·구' },
  ];
  wrap.innerHTML = `
    <div class="l0-tabs" role="tablist" aria-label="도형 종류">
      ${TABS.map((t, i) => `<button role="tab" type="button" id="l0-tab-${t.key}" aria-selected="${i === 0}" aria-controls="l0-gal-panel" tabindex="${i === 0 ? 0 : -1}" data-tab="${t.key}">${t.label}</button>`).join('')}
    </div>
    <div class="l0-gal-grid2" id="l0-gal-panel" role="tabpanel" aria-labelledby="l0-tab-box">
      <div class="ga-stage"><div class="l0-gal-viewer"></div></div>
      <div class="ga-side l0-side"></div>
      <div class="ga-tools"></div>
      <div class="ga-parts"><div class="l0-parts" role="group" aria-label="구성 요소 보기"></div></div>
    </div>
    <div class="l0-gal-note"></div>`;
  // 오른쪽: 표 → 도형 고르기·슬라이더 → 구성 요소 켜 보기 / 아래: 설명 (화면 폭 전체)
  const side = $('.l0-side', wrap), partsBox = $('.l0-parts', wrap), panelEl = $('#l0-gal-panel', wrap), noteBox = $('.l0-gal-note', wrap);
  const viewer = await create3DViewer($('.l0-gal-viewer', wrap), { build:(T) => new T.BoxGeometry(2.2, 1.3, 1.4), title:'직육면체',
    infoInline:true, showInfo:false, bright:true, opacity:0.5, tools:['autoRotate', 'reset', 'faceColor', 'edges', 'vertices', 'transparent'] });
  // 관찰 도구 버튼을 그림 아래 칸으로 옮겨, 오른쪽 '구성 요소 보기'와 같은 높이에서 시작하게 한다
  { const tb = $('.l0-gal-viewer .viewer-toolbar', wrap); if(tb) $('.ga-tools', wrap).appendChild(tb); }

  const st = { tab:'box', kind:'cuboid', n:{ prism:5, pyramid:4 }, active:new Set(), seen:{} };
  const partObjs = new Map();   // key → Object3D
  let H = null, fly = null;
  if(viewer.ok){
    H = l0Helpers(viewer.THREE);
    viewer.onFrame((dt) => {
      let anim = false; const now = performance.now();
      partObjs.forEach(o => {
        const t = (now - o.userData.start) / 1000;
        const blinking = !L0_REDUCED_MOTION && t < 2.7;
        const f = blinking ? 0.2 + 0.8 * (0.5 + 0.5 * Math.cos(t * Math.PI * 2 * 1.3)) : 1;
        o.traverse(c => { if(c.material && c.material.userData.base != null) c.material.opacity = c.material.userData.base * f; });
        if(blinking) anim = true;
        else if(o.userData.lastF !== 1){ anim = true; }
        o.userData.lastF = f;
      });
      if(fly){
        const cam = viewer.camera;
        cam.position.lerp(fly, Math.min(1, dt * 5));
        viewer.controls.target.set(0, 0, 0);
        if(cam.position.distanceTo(fly) < 0.01){ cam.position.copy(fly); fly = null; }
        anim = true;
      }
      return anim;
    });
  }

  const spec = () => l0ShapeSpec(st.kind, st.kind === 'prism' || st.kind === 'pyramid' ? st.n[st.kind] : undefined);

  function clearParts(){
    partObjs.forEach(o => { viewer.extras.remove(o); o.traverse(c => { c.geometry && c.geometry.dispose(); if(c.material){ c.material.map && c.material.map.dispose(); c.material.dispose(); } }); });
    partObjs.clear();
  }
  function addPart(key, blink){
    if(!viewer.ok) return;
    const o = spec().make(viewer.THREE, H, key); if(!o) return;
    o.userData.start = blink ? performance.now() : -1e9;
    viewer.extras.add(o); partObjs.set(key, o); viewer.requestRender();
  }
  function removePart(key){
    const o = partObjs.get(key); if(!o) return;
    viewer.extras.remove(o); o.traverse(c => { c.geometry && c.geometry.dispose(); if(c.material){ c.material.map && c.material.map.dispose(); c.material.dispose(); } });
    partObjs.delete(key); viewer.requestRender();
  }
  function renderPartButtons(){
    const sp = spec();
    [...st.active].forEach(k => { if(!sp.parts.some(p => p[0] === k)) st.active.delete(k); });
    partsBox.innerHTML = `<p class="ttl">🔦 구성 요소 보기</p><div class="l0-parts-grid"></div>`;
    const grid = $('.l0-parts-grid', partsBox);
    sp.parts.forEach(([key, label]) => {
      const b = el('button', { class:'btn', type:'button', 'aria-pressed':String(st.active.has(key)) }, `<span class="sw" aria-hidden="true"></span>${label}`);
      b.style.setProperty('--pc', L0_PART_COLORS[key]);
      b.addEventListener('click', () => {
        if(st.active.has(key)){ st.active.delete(key); removePart(key); b.setAttribute('aria-pressed', 'false'); }
        else{ st.active.add(key); addPart(key, true); b.setAttribute('aria-pressed', 'true'); }
      });
      grid.appendChild(b);
    });
    const off = el('button', { class:'btn ghost l0-parts-off', type:'button' }, '모두 끄기');
    off.addEventListener('click', () => { st.active.clear(); clearParts(); renderPartButtons(); });
    partsBox.appendChild(off);
  }
  function drawShape(keepView){
    const sp = spec();
    clearParts();
    viewer.setShape(sp.build, { title:sp.title, keepView });
    // 각기둥·각뿔: 구성 요소 이름표(밑면·꼭짓점 등)가 화면 밖으로 잘리지 않도록 카메라를 조금 뒤로
    if(viewer.ok && !keepView && (st.kind === 'prism' || st.kind === 'pyramid')){ viewer.camera.position.multiplyScalar(1.3); viewer.controls.update(); viewer.requestRender(); }
    st.active.forEach(k => addPart(k, false));
  }

  /* 오른쪽 패널 */
  function countTable(kind, n){
    const isPrism = kind === 'prism';
    const rows = isPrism
      ? [['면', '$n+2$', n + 2, `밑면 2 + 옆면 ${n}`], ['모서리', '$3n$', 3*n, `위 ${n} + 아래 ${n} + 옆 ${n}`], ['꼭짓점', '$2n$', 2*n, `위 ${n} + 아래 ${n}`]]
      : [['면', '$n+1$', n + 1, `밑면 1 + 옆면 ${n}`], ['모서리', '$2n$', 2*n, `밑면 ${n} + 옆 ${n}`], ['꼭짓점', '$n+1$', n + 1, `밑면 ${n} + 각뿔의 꼭짓점 1`]];
    return `<table class="l0-table" aria-live="polite">
      <caption class="sr-only">${L0_POLY[n]}${isPrism ? '기둥' : '뿔'}의 면, 모서리, 꼭짓점의 개수</caption>
      <thead><tr><th>구성 요소</th><th>${L0_POLY[n]}${isPrism ? '기둥' : '뿔'}</th></tr></thead>
      <tbody>${rows.map(r => `<tr><th>${r[0]}</th><td class="val"><span class="v">${r[2]}</span>개</td></tr>
        <tr><td colspan="2" class="why">↳ ${r[3]}</td></tr>`).join('')}</tbody></table>`;
  }
  function bumpValues(){
    side.querySelectorAll('.v').forEach(v => { v.classList.remove('l0-bump'); void v.offsetWidth; v.classList.add('l0-bump'); });
  }

  function renderSide(){
    side.innerHTML = ''; noteBox.innerHTML = '';
    const ctl = el('div', { class:'l0-ctl' });
    if(st.tab === 'box'){
      const seg = createSegmented({ items:[{ value:'cuboid', label:'직육면체' }, { value:'cube', label:'정육면체' }], value:st.kind, label:'도형 고르기',
        onChange:(v) => { st.kind = v; drawShape(false); renderPartButtons(); renderSide(); } });
      side.insertAdjacentHTML('beforeend', `
        <table class="l0-table"><thead><tr><th></th><th>직육면체</th><th>정육면체</th></tr></thead><tbody>
          <tr><th>면의 모양</th><td>직사각형</td><td>정사각형</td></tr>
          <tr><th>면</th><td class="val">6개</td><td class="val">6개</td></tr>
          <tr><th>모서리</th><td class="val">12개</td><td class="val">12개</td></tr>
          <tr><th>꼭짓점</th><td class="val">8개</td><td class="val">8개</td></tr></tbody></table>`);
      ctl.appendChild(seg.el);
      noteBox.innerHTML = `<div class="l0-note">💡 정육면체는 모든 면이 정사각형인 <b>특별한 직육면체</b>야. 그래서 면, 모서리, 꼭짓점의 개수가 같아.</div>`;
    }else if(st.tab === 'prism' || st.tab === 'pyramid'){
      const isPrism = st.tab === 'prism';
      const slider = createSlider({ label:'밑면의 변의 수 $n$', min:3, max:8, step:1, value:st.n[st.tab],
        format:(v) => `${v} (${L0_POLY[v]}형)`,
        onInput:(v) => {
          if(v === st.n[st.tab]) return;
          st.n[st.tab] = v; drawShape(true);
          $('.l0-count', side).innerHTML = countTable(st.tab, v); renderMath($('.l0-count', side)); bumpValues();
        } });
      side.insertAdjacentHTML('beforeend', `<div class="l0-count">${countTable(st.tab, st.n[st.tab])}</div>`);
      ctl.appendChild(slider.el);
      noteBox.innerHTML = `<div class="l0-note">${isPrism
          ? '💡 각기둥은 밑면이 <b>2개</b>라서 꼭짓점이 밑면의 꼭짓점의 개수의 <b>2배</b>야.'
          : '💡 각뿔은 밑면이 <b>1개</b>이고, 위에 <b>각뿔의 꼭짓점</b>이 하나 더 있어.'} 3D 화면의 <b>개수 보기</b>를 클릭하고 관찰한 내용을 확인해 보자!</div>`;
    }else{
      const seg = createSegmented({ items:[{ value:'cylinder', label:'원기둥' }, { value:'cone', label:'원뿔' }, { value:'sphere', label:'구' }], value:st.kind, label:'도형 고르기',
        onChange:(v) => { st.kind = v; drawShape(false); renderPartButtons(); renderSide(); } });
      ctl.appendChild(seg.el);
      const views = el('div', { class:'sim-row l0-views', role:'group', 'aria-label':'보는 방향' });
      const VIEW = [
        { key:'top', label:'⬇️ 위에서 본 모양', dir:[0, 1, 0.0008] },
        { key:'front', label:'➡️ 앞에서 본 모양', dir:[0, 0, 1] },
        { key:'free', label:'🎯 비스듬히 보기', dir:[0.62, 0.48, 0.92] },
      ];
      VIEW.forEach(v => {
        const b = el('button', { class:'btn', type:'button' }, v.label);
        b.addEventListener('click', () => {
          if(viewer.ok){
            viewer.setAutoRotate(false);
            const d = viewer.camera.position.length();
            fly = new viewer.THREE.Vector3(...v.dir).normalize().multiplyScalar(d);
            viewer.requestRender();
          }
          if(v.key !== 'free'){ st.seen[st.kind + '-' + v.key] = true; renderViewTable(); }
        });
        views.appendChild(b);
      });
      ctl.appendChild(views);
      side.insertAdjacentHTML('beforeend', `<div class="l0-viewtable"></div>`);
      noteBox.innerHTML = `<div class="l0-note">💡 입체도형을 선택하고 관찰 각도를 선택하면 <b>?</b>를 채울 수 있어. 세 도형을 비교해 보자!</div>`;
      renderViewTable();
    }
    side.appendChild(ctl);
    renderMath(side);
  }
  const VIEW_ANS = {
    cylinder:{ top:'⭕ 원', front:'▭ 직사각형' },
    cone:{ top:'⭕ 원', front:'△ 삼각형' },
    sphere:{ top:'⭕ 원', front:'⭕ 원' },
  };
  function renderViewTable(){
    const box = $('.l0-viewtable', side); if(!box) return;
    const name = { cylinder:'원기둥', cone:'원뿔', sphere:'구' };
    box.innerHTML = `<table class="l0-table"><thead><tr><th></th><th>위에서 본 모양</th><th>앞에서 본 모양</th></tr></thead><tbody>
      ${Object.keys(VIEW_ANS).map(k => `<tr${k === st.kind ? ' style="outline:2px solid var(--accent);outline-offset:-2px"' : ''}><th>${k === st.kind ? '▸ ' : ''}${name[k]}</th>
        ${['top', 'front'].map(v => st.seen[k + '-' + v] ? `<td><b>${VIEW_ANS[k][v]}</b></td>` : `<td class="hid">?</td>`).join('')}</tr>`).join('')}
      </tbody></table>`;
    const allSeen = Object.keys(VIEW_ANS).every(k => st.seen[k + '-top'] && st.seen[k + '-front']);
    if(allSeen) box.insertAdjacentHTML('beforeend', `<div class="l0-note" style="margin-top:8px">🎉 세 도형 모두 <b>위에서 보면 원</b>이야! 하지만 앞에서 보면 원기둥은 직사각형, 원뿔은 삼각형, 구는 원으로 달라.</div>`);
  }

  function selectTab(key, focus){
    st.tab = key;
    wrap.querySelectorAll('[role=tab]').forEach(t => {
      const on = t.dataset.tab === key;
      t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
      if(on && focus) t.focus();
    });
    panelEl.setAttribute('aria-labelledby', 'l0-tab-' + key);
    st.kind = key === 'box' ? 'cuboid' : key === 'round' ? 'cylinder' : key;
    st.active.clear(); fly = null;
    // 개수 보기는 기본으로 숨김 (학생이 도형 이름 옆 [개수 보기]를 눌러 확인)
    drawShape(false); renderPartButtons(); renderSide();
  }
  const tabs = [...wrap.querySelectorAll('[role=tab]')];
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => selectTab(t.dataset.tab));
    t.addEventListener('keydown', e => {
      if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        e.preventDefault();
        const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
        selectTab(tabs[j].dataset.tab, true);
      }
    });
  });
  renderPartButtons(); renderSide();
}

/* =====================================================================
   ② 전개도 펼치기 (펼치기/접기 애니메이션)
   ===================================================================== */
/** 전개도 접기·펼치기 모형. kind: 'cuboid'|'cube'|'prism'|'pyramid'|'cylinder'|'cone'|'sphere', n: 밑면의 변의 수
 *  apply(p): p = 0 접힌 입체도형 → 1 평평한 전개도 / ext: 펼친 전개도의 크기(카메라 맞춤용) */
function l0BuildNet(T, kind, n=4){
  const root = new T.Group(), H = l0Helpers(T), deg = Math.PI / 180;
  const clamp = x => Math.max(0, Math.min(1, x));
  const mkMat = color => new T.MeshPhongMaterial({ color, side:T.DoubleSide, transparent:true, opacity:0.88, flatShading:true,
    polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });
  const BASE = '#FFE08A', SIDE = ['#B3DEFF', '#B9F3C9', '#FFC6E7', '#D4C2FF', '#FFD8A8', '#B8EDE3', '#C8D2FF', '#FFB3BA'];
  const labels = []; root.userData.labels = labels;
  const label = (parent, text, pos, sc=0.78) => { const s = H.label(text, pos); s.scale.multiplyScalar(sc); parent.add(s); labels.push(s); return s; };
  const face = (parent, geo, color, text, lp) => {
    const m = new T.Mesh(geo, mkMat(color));
    m.add(new T.LineSegments(new T.EdgesGeometry(geo), new T.LineBasicMaterial({ color:0x2B3A55 })));
    parent.add(m); if(text) label(m, text, lp); return m;
  };
  const pivot = (parent, x, y, z) => { const p = new T.Group(); p.position.set(x, y, z); parent.add(p); return p; };
  const flatPoly = pts => {   // [x,z] 꼭짓점 → 바닥(y=0)에 놓인 다각형
    const pos = []; for(let i = 1; i < pts.length - 1; i++) [pts[0], pts[i], pts[i + 1]].forEach(q => pos.push(q[0], 0, q[1]));
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
  };
  const rectZ = (w, d, sign=1) => new T.PlaneGeometry(w, d).rotateX(-Math.PI / 2).translate(0, 0, sign * d / 2);
  const rectX = (w, d, sign=1) => new T.PlaneGeometry(w, d).rotateX(-Math.PI / 2).translate(sign * w / 2, 0, 0);
  let update = () => {}, ext = 2;

  if(kind === 'cuboid' || kind === 'cube'){
    const [a, b, c] = kind === 'cube' ? [1.1, 1.1, 1.1] : [1.6, 1.0, 0.8];   // 가로, 세로, 높이
    const base = new T.Group(); root.add(base);
    face(base, new T.PlaneGeometry(a, b).rotateX(-Math.PI / 2), BASE, '밑면', new T.Vector3(0, 0.02, 0));
    const pF = pivot(base, 0, 0, b / 2);  face(pF, rectZ(a, c, 1), SIDE[0], '옆면', new T.Vector3(0, 0.02, c / 2));
    const pB = pivot(base, 0, 0, -b / 2); face(pB, rectZ(a, c, -1), SIDE[1], '옆면', new T.Vector3(0, 0.02, -c / 2));
    const pR = pivot(base, a / 2, 0, 0);  face(pR, rectX(c, b, 1), SIDE[2], '옆면', new T.Vector3(c / 2, 0.02, 0));
    const pL = pivot(base, -a / 2, 0, 0); face(pL, rectX(c, b, -1), SIDE[3], '옆면', new T.Vector3(-c / 2, 0.02, 0));
    const pT = pivot(pB, 0, 0, -c);       face(pT, rectZ(a, b, -1), BASE, '밑면', new T.Vector3(0, 0.02, -b / 2));
    ext = Math.max(a + 2 * c, 2 * b + 2 * c) / 2 + 0.3;
    update = p => {
      const top = 1 - clamp(p / 0.45), sides = 1 - clamp((p - 0.35) / 0.65);
      pF.rotation.x = -90 * deg * sides; pB.rotation.x = 90 * deg * sides;
      pR.rotation.z = 90 * deg * sides;  pL.rotation.z = -90 * deg * sides;
      pT.rotation.x = 90 * deg * top;
      root.position.y = 0; root.position.z = 0.3 * p;
    };
  }else if(kind === 'prism'){
    // 옆면 n개를 한 줄로 이은 띠 + 가운데 옆면에 붙은 밑면 2개 (접으면 옆으로 누운 각기둥)
    const R = 1, s = 2 * R * Math.sin(Math.PI / n), ap = R * Math.cos(Math.PI / n), h = 1.6;
    face(root, new T.PlaneGeometry(s, h).rotateX(-Math.PI / 2), SIDE[0], '옆면', new T.Vector3(0, 0.02, 0));
    const nR = Math.floor((n - 1) / 2), nL = n - 1 - nR, rights = [], lefts = [];
    let par = root;
    for(let k = 0; k < nR; k++){ const pv = pivot(par, k === 0 ? s / 2 : s, 0, 0); face(pv, new T.PlaneGeometry(s, h).rotateX(-Math.PI / 2).translate(s / 2, 0, 0), SIDE[(1 + k) % 8], '옆면', new T.Vector3(s / 2, 0.02, 0)); rights.push(pv); par = pv; }
    par = root;
    for(let k = 0; k < nL; k++){ const pv = pivot(par, k === 0 ? -s / 2 : -s, 0, 0); face(pv, new T.PlaneGeometry(s, h).rotateX(-Math.PI / 2).translate(-s / 2, 0, 0), SIDE[(1 + nR + k) % 8], '옆면', new T.Vector3(-s / 2, 0.02, 0)); lefts.push(pv); par = pv; }
    const a0 = -Math.PI / 2 + Math.PI / n;   // 아래 변이 옆면과 맞닿도록
    const gon = sign => Array.from({ length:n }, (_, j) => { const t = a0 + 2 * Math.PI * j / n; return [R * Math.cos(t), sign * (ap + R * Math.sin(t))]; });
    const pBot = pivot(root, 0, 0, -h / 2), pTop = pivot(root, 0, 0, h / 2);
    face(pBot, flatPoly(gon(-1)), BASE, '밑면', new T.Vector3(0, 0.02, -ap));
    face(pTop, flatPoly(gon(1)), BASE, '밑면', new T.Vector3(0, 0.02, ap));
    ext = Math.max(n * s, h + 4 * ap) / 2 + 0.3;
    update = p => {
      const sides = 1 - clamp((p - 0.35) / 0.65), bases = 1 - clamp(p / 0.4), th = 2 * Math.PI / n * sides;
      rights.forEach(pv => { pv.rotation.z = th; }); lefts.forEach(pv => { pv.rotation.z = -th; });
      pBot.rotation.x = 90 * deg * bases; pTop.rotation.x = -90 * deg * bases;
      root.position.x = 0;
    };
  }else if(kind === 'pyramid'){
    // 밑면(가운데)과 각 변에 붙은 삼각형 옆면 n개 (접으면 서 있는 각뿔)
    const R = 1, Hh = 1.5, s = 2 * R * Math.sin(Math.PI / n), ap = R * Math.cos(Math.PI / n), l = Math.hypot(ap, Hh), phi = Math.atan2(Hh, ap);
    const P = Array.from({ length:n }, (_, k) => { const t = Math.PI / 2 + Math.PI / n + 2 * Math.PI * k / n; return new T.Vector3(R * Math.cos(t), 0, R * Math.sin(t)); });
    face(root, flatPoly(P.map(q => [q.x, q.z])), BASE, '밑면', new T.Vector3(0, 0.02, 0));
    const hinges = [];
    for(let k = 0; k < n; k++){
      const A = P[k], B = P[(k + 1) % n], M = A.clone().add(B).multiplyScalar(0.5);
      let x = B.clone().sub(A).normalize(); const z = M.clone().setY(0).normalize(); let y = z.clone().cross(x);
      if(y.y < 0){ x.negate(); y = z.clone().cross(x); }
      const pv = pivot(root, M.x, 0, M.z); pv.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(x, y, z));
      const hg = new T.Group(); pv.add(hg); hinges.push(hg);
      const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute([-s / 2, 0, 0, s / 2, 0, 0, 0, 0, l], 3)); g.computeVertexNormals();
      face(hg, g, SIDE[k % 8], '옆면', new T.Vector3(0, 0.02, l / 3));
    }
    ext = ap + l + 0.3;
    update = p => { const f = 1 - p; hinges.forEach(hg => { hg.rotation.x = -(Math.PI - phi) * f; }); };
  }else if(kind === 'cylinder'){
    // 옆면(직사각형)이 둥글게 말리고, 밑면인 원 2개가 양 끝을 덮는다 (접으면 옆으로 누운 원기둥)
    const r = 0.7, h = 1.6, W = 2 * Math.PI * r, SEG = 48;
    const sheetG = new T.BufferGeometry(), pos = new Float32Array((SEG + 1) * 2 * 3), idx = [];
    for(let i = 0; i < SEG; i++){ const a = i * 2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, c, b, b, c, d); }
    sheetG.setAttribute('position', new T.BufferAttribute(pos, 3)); sheetG.setIndex(idx);
    const sheet = new T.Mesh(sheetG, mkMat(SIDE[0])); root.add(sheet);
    const lineG = new T.BufferGeometry(), lpos = new Float32Array((2 * (SEG + 1) + 1) * 3); lineG.setAttribute('position', new T.BufferAttribute(lpos, 3));
    root.add(new T.Line(lineG, new T.LineBasicMaterial({ color:0x2B3A55 })));
    const sLab = label(root, '옆면', new T.Vector3(0, 0.05, 0));
    const disc = () => new T.CircleGeometry(r, 48).rotateX(-Math.PI / 2);
    const pBot = pivot(root, 0, 0, -h / 2), pTop = pivot(root, 0, 0, h / 2);
    face(pBot, disc().translate(0, 0, -r), BASE, '밑면', new T.Vector3(0, 0.02, -r));
    face(pTop, disc().translate(0, 0, r), BASE, '밑면', new T.Vector3(0, 0.02, r));
    ext = Math.max(W, h + 4 * r) / 2 + 0.3;
    update = p => {
      const f = 1 - clamp((p - 0.35) / 0.65), sw = 1 - clamp(p / 0.4), TH = 2 * Math.PI * f;
      const at = u => { if(TH < 1e-4) return [u * W, 0]; const rho = W / TH, t = u * TH; return [rho * Math.sin(t), rho * (1 - Math.cos(t))]; };
      for(let i = 0; i <= SEG; i++){ const [x, y] = at(i / SEG - 0.5); pos.set([x, y, -h / 2, x, y, h / 2], i * 6); }
      sheetG.attributes.position.needsUpdate = true; sheetG.computeVertexNormals(); sheetG.computeBoundingSphere();
      let k = 0; for(let i = 0; i <= SEG; i++){ const [x, y] = at(i / SEG - 0.5); lpos.set([x, y, -h / 2], k++ * 3); }
      for(let i = SEG; i >= 0; i--){ const [x, y] = at(i / SEG - 0.5); lpos.set([x, y, h / 2], k++ * 3); }
      const [x0, y0] = at(-0.5); lpos.set([x0, y0, -h / 2], k * 3);
      lineG.attributes.position.needsUpdate = true; lineG.computeBoundingSphere();
      pBot.rotation.x = 90 * deg * sw; pTop.rotation.x = -90 * deg * sw;
    };
  }else if(kind === 'cone'){
    // 옆면(부채꼴)이 말려 원뿔이 되고, 밑면인 원이 아래를 덮는다
    const l = 1.8, r = 0.7, PHI = 2 * Math.PI * r / l, RS = 10, AS = 40;
    const sectG = new T.BufferGeometry(), pos = new Float32Array((RS + 1) * (AS + 1) * 3), idx = [];
    for(let i = 0; i < RS; i++) for(let j = 0; j < AS; j++){ const a = i * (AS + 1) + j, b = a + 1, c = a + AS + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
    sectG.setAttribute('position', new T.BufferAttribute(pos, 3)); sectG.setIndex(idx);
    const body = new T.Group(); root.add(body);
    body.add(new T.Mesh(sectG, mkMat(SIDE[2])));
    const lineG = new T.BufferGeometry(), lpos = new Float32Array((AS + 3) * 3); lineG.setAttribute('position', new T.BufferAttribute(lpos, 3));
    body.add(new T.Line(lineG, new T.LineBasicMaterial({ color:0x2B3A55 })));
    const sLab = label(body, '옆면', new T.Vector3());
    const circ = new T.Mesh(new T.CircleGeometry(r, 48), mkMat(BASE));
    circ.add(new T.LineSegments(new T.EdgesGeometry(new T.CircleGeometry(r, 48)), new T.LineBasicMaterial({ color:0x2B3A55 })));
    body.add(circ); const cLab = label(body, '밑면', new T.Vector3());
    ext = (l + 2 * r) / 2 + 0.6;
    update = p => {
      const f = 1 - clamp((p - 0.35) / 0.65), sw = 1 - clamp(p / 0.4);
      const PSI = PHI + f * (2 * Math.PI - PHI), rc = PHI * l / PSI, hc = Math.sqrt(Math.max(0, l * l - rc * rc));
      const at = (rho, ph) => { const ps = ph * PSI / PHI; return [rho / l * rc * Math.cos(ps), -hc * rho / l, rho / l * rc * Math.sin(ps)]; };
      for(let i = 0; i <= RS; i++) for(let j = 0; j <= AS; j++){ const v = at(l * i / RS, -PHI / 2 + PHI * j / AS); pos.set(v, (i * (AS + 1) + j) * 3); }
      sectG.attributes.position.needsUpdate = true; sectG.computeVertexNormals(); sectG.computeBoundingSphere();
      lpos.set([0, 0, 0], 0); for(let j = 0; j <= AS; j++) lpos.set(at(l, -PHI / 2 + PHI * j / AS), (j + 1) * 3); lpos.set([0, 0, 0], (AS + 2) * 3);
      lineG.attributes.position.needsUpdate = true; lineG.computeBoundingSphere();
      sLab.position.set(...at(l * 0.6, 0)).add(new T.Vector3(0, 0.05, 0));
      // 밑면인 원: 호의 가운데에 붙어 있다가 안쪽으로 접힘
      const Tp = new T.Vector3(rc, -hc, 0), gam = Math.atan2(-hc, rc), ang = gam + sw * (-Math.PI - gam);
      const dir = new T.Vector3(Math.cos(ang), Math.sin(ang), 0), nrm = new T.Vector3(-Math.sin(ang), Math.cos(ang), 0);
      circ.position.copy(Tp).addScaledVector(dir, r); circ.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), nrm);
      cLab.position.copy(circ.position).add(new T.Vector3(0, 0.06, 0));
      body.position.y = hc; body.position.x = -(l + 2 * r) / 2 * clamp(p);
    };
  }else{   // 구: 전개도를 그릴 수 없다
    const m = new T.Mesh(new T.SphereGeometry(1, 48, 32), new T.MeshPhongMaterial({ color:'#D4C2FF', transparent:true, opacity:0.85, shininess:40 }));
    m.position.y = 1; root.add(m); ext = 2.6;
  }
  const apply = p => update(p);
  apply(0);
  return { root, apply, ext };
}

async function l0SetupNet(wrap){
  const TABS = [{ key:'box', label:'직육면체·정육면체' }, { key:'prism', label:'각기둥' }, { key:'pyramid', label:'각뿔' }, { key:'round', label:'원기둥·원뿔·구' }];
  wrap.innerHTML = `
    <div class="l0-tabs" role="tablist" aria-label="전개도 도형 종류">
      ${TABS.map((t, i) => `<button role="tab" type="button" id="l0n-tab-${t.key}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-tab="${t.key}">${t.label}</button>`).join('')}
    </div>
    <div class="l0-gal-grid2">
      <div class="ga-stage"><div class="l0-net-viewer"></div></div>
      <div class="ga-side l0-side l0-net-side"></div>
      <div class="ga-tools"></div>
    </div>
    <div class="l0-net-fold"></div>
    <div class="l0-gal-note"></div>`;
  const side = $('.l0-net-side', wrap), foldBox = $('.l0-net-fold', wrap), noteBox = $('.l0-gal-note', wrap);
  const viewer = await create3DViewer($('.l0-net-viewer', wrap), { tools:['autoRotate', 'reset'], showInfo:false, bright:true, pastel:false });
  { const tb = $('.l0-net-viewer .viewer-toolbar', wrap); if(tb) $('.ga-tools', wrap).appendChild(tb); }
  const st = { tab:'box', kind:'cuboid', n:{ prism:5, pyramid:4 }, labels:true };
  let net = null, p = 0, target = 0;
  const applyLabels = () => { if(net) net.root.userData.labels.forEach(l => { l.visible = st.labels; }); viewer.requestRender && viewer.requestRender(); };
  const labBtn = el('button', { class:'tool-btn', type:'button', 'aria-pressed':'true' }, '🏷️ 면 이름 <span class="tb-state">켜짐</span>');
  labBtn.addEventListener('click', () => { st.labels = !st.labels; labBtn.setAttribute('aria-pressed', String(st.labels)); $('.tb-state', labBtn).textContent = st.labels ? '켜짐' : '꺼짐'; applyLabels(); });
  { const tb = $('.ga-tools .viewer-toolbar', wrap); (tb || $('.ga-tools', wrap)).appendChild(labBtn); }

  /* 펼치기·접기 (활동 내용은 그대로) */
  foldBox.innerHTML = `<p class="ttl">📂 전개도 펼치기</p><div class="l0-fold-btns l2-net-btns"><button class="btn primary" type="button" data-a="open">📂 펼치기</button><button class="btn" type="button" data-a="close">📦 접기</button></div>`;
  const slider = createSlider({ label:'펼친 정도', min:0, max:100, step:1, value:0, unit:'%', onInput:v => { p = target = v / 100; setOpenLabel(false); if(net) net.apply(p); viewer.requestRender && viewer.requestRender(); } });
  foldBox.appendChild(slider.el);
  const openBtn = $('[data-a="open"]', foldBox), closeBtn = $('[data-a="close"]', foldBox);
  const setOpenLabel = run => { openBtn.textContent = run ? '⏸ 멈춤' : '📂 펼치기'; openBtn.dataset.run = run ? '1' : ''; openBtn.classList.toggle('is-running', !!run); };
  // [펼치기] ↔ [멈춤]: 펼치는 동안 누르면 그 자리에서 멈춤 (정다면체 전개도와 같은 방식)
  openBtn.addEventListener('click', () => {
    if(openBtn.dataset.run){ target = p; setOpenLabel(false); viewer.requestRender && viewer.requestRender(); return; }
    if(p >= 1) return;
    target = 1; setOpenLabel(true); viewer.requestRender && viewer.requestRender();
  });
  closeBtn.addEventListener('click', () => { target = 0; setOpenLabel(false); viewer.requestRender && viewer.requestRender(); });

  const POLY = n => `${L0_POLY[n]}형`;
  const SPEC = () => {
    const k = st.kind, n = st.n[st.tab];
    return {
      cuboid:{ name:'직육면체', rows:[['밑면', '직사각형', 2], ['옆면', '직사각형', 4]], info:'<b>직육면체의 전개도</b>는 직사각형 <b>6개</b>로 이루어져 있어. 마주 보는 면은 모양과 크기가 같아.' },
      cube:{ name:'정육면체', rows:[['밑면', '정사각형', 2], ['옆면', '정사각형', 4]], info:'<b>정육면체의 전개도</b>는 모양과 크기가 같은 정사각형 <b>6개</b>로 이루어져 있어.' },
      prism:{ name:`${L0_POLY[n]}기둥`, rows:[['밑면', POLY(n), 2], ['옆면', '직사각형', n]], info:`<b>${L0_POLY[n]}기둥의 전개도</b>는 밑면인 <b>${POLY(n)} 2개</b>와 옆면인 <b>직사각형 ${n}개</b>로 이루어져 있어. 옆면을 이어 붙이면 하나의 큰 직사각형이 돼.` },
      pyramid:{ name:`${L0_POLY[n]}뿔`, rows:[['밑면', POLY(n), 1], ['옆면', '삼각형', n]], info:`<b>${L0_POLY[n]}뿔의 전개도</b>는 밑면인 <b>${POLY(n)} 1개</b>와 옆면인 <b>삼각형 ${n}개</b>로 이루어져 있어. 접으면 삼각형의 꼭짓점이 한 점(각뿔의 꼭짓점)에서 만나.` },
      cylinder:{ name:'원기둥', rows:[['밑면', '원', 2], ['옆면', '직사각형', 1]], info:'<b>원기둥의 전개도</b>는 밑면인 <b>원 2개</b>와 옆면인 <b>직사각형 1개</b>로 이루어져 있어. 직사각형의 가로는 밑면인 원의 둘레와 같아.' },
      cone:{ name:'원뿔', rows:[['밑면', '원', 1], ['옆면', '부채꼴', 1]], info:'<b>원뿔의 전개도</b>는 밑면인 <b>원 1개</b>와 옆면인 <b>부채꼴 1개</b>로 이루어져 있어. 부채꼴의 호의 길이는 밑면인 원의 둘레와 같아.' },
      sphere:{ name:'구', rows:null, info:'<b>구는 전개도를 그릴 수 없어.</b> 공 모양의 굽은 면은 평면으로 펼치면 겹치거나 찢어지기 때문이야.' },
    }[k];
  };
  function renderSide(){
    const sp = SPEC();
    side.innerHTML = sp.rows ? '' : `<div class="l0-note">🙅 ${sp.info}</div>`;
    const ctl = el('div', { class:'l0-ctl' });
    if(st.tab === 'box' || st.tab === 'round'){
      const items = st.tab === 'box' ? [{ value:'cuboid', label:'직육면체' }, { value:'cube', label:'정육면체' }] : [{ value:'cylinder', label:'원기둥' }, { value:'cone', label:'원뿔' }, { value:'sphere', label:'구' }];
      ctl.appendChild(createSegmented({ items, value:st.kind, label:'도형 고르기', onChange:v => { st.kind = v; build(); } }).el);
    }else{
      ctl.appendChild(createSlider({ label:'밑면의 변의 수 $n$', min:3, max:8, step:1, value:st.n[st.tab], format:v => `${v} (${POLY(v)})`,
        onInput:v => { if(v === st.n[st.tab]) return; st.n[st.tab] = v; build(true); } }).el);
    }
    side.appendChild(ctl); side.appendChild(foldBox); renderMath(side);
    renderNote(sp);
    const noNet = !sp.rows; openBtn.disabled = closeBtn.disabled = noNet; $('input', slider.el).disabled = noNet;
    foldBox.classList.toggle('is-off', noNet);
  }
  function renderNote(sp){
    noteBox.innerHTML = sp.rows ? `<div class="l0-note">💡 ${sp.info}</div><div class="l0-note" style="margin-top:10px">🤔 전개도를 접었을 때 <b>서로 만나는 모서리</b>는 어디일까? 천천히 접으며 찾아보자.
      <span class="l0-muted">(전개도는 ‘기둥과 뿔의 겉넓이’ 학습에서 더 자세히 다룰 거야.)</span></div>` : '';
  }
  function build(keepSide){
    if(!keepSide) renderSide(); else renderNote(SPEC());
    if(!viewer.ok) return;
    if(net){ viewer.extras.remove(net.root); net.root.traverse(c => { c.geometry && c.geometry.dispose(); if(c.material){ c.material.map && c.material.map.dispose(); c.material.dispose(); } }); }
    net = l0BuildNet(viewer.THREE, st.kind, st.n[st.tab] || 4);
    viewer.extras.add(net.root);
    p = target = 0; net.apply(0); slider.set(0); applyLabels();
    // 카메라: 펼친 전개도 크기에 맞추기 (보이지 않는 상자로 처음 위치를 정함)
    const e = net.ext;
    viewer.setShape(TT => new TT.BoxGeometry(1.25 * e, 0.5 * e, 1.25 * e).translate(0, e / 4, 0), { title:'' });
    viewer.root.children.forEach(c => { c.visible = false; });
    viewer.requestRender();
  }
  function selectTab(key){
    st.tab = key; st.kind = key === 'box' ? 'cuboid' : key === 'round' ? 'cylinder' : key;
    wrap.querySelectorAll('.l0-tabs [role=tab]').forEach(t => { const on = t.dataset.tab === key; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
    build();
  }
  wrap.querySelectorAll('.l0-tabs [role=tab]').forEach(t => t.addEventListener('click', () => selectTab(t.dataset.tab)));
  if(viewer.ok){
    viewer.onFrame(dt => {
      if(!net || p === target){ if(openBtn.dataset.run) setOpenLabel(false); return false; }
      const step = L0_REDUCED_MOTION ? 1 : dt / 1.8;
      p = target > p ? Math.min(target, p + step) : Math.max(target, p - step);
      if(p === target) setOpenLabel(false);
      net.apply(p);
      const sl = $('input', slider.el); sl.value = Math.round(p * 100); sl.style.setProperty('--p', (p * 100) + '%');
      $('output', slider.el).textContent = Math.round(p * 100) + '%';
      return true;
    });
  }
  selectTab('box');
}

const L0_SORT_ITEMS = [
  { name:'삼각기둥', cat:'기둥', icon:['prism', 3] }, { name:'직육면체', cat:'기둥', icon:['prism', 4] },
  { name:'오각기둥', cat:'기둥', icon:['prism', 5] }, { name:'육각기둥', cat:'기둥', icon:['prism', 6] },
  { name:'원기둥', cat:'기둥', icon:['cylinder'] },
  { name:'삼각뿔', cat:'뿔', icon:['pyramid', 3] },   { name:'사각뿔', cat:'뿔', icon:['pyramid', 4] },
  { name:'오각뿔', cat:'뿔', icon:['pyramid', 5] },   { name:'원뿔', cat:'뿔', icon:['cone'] },
  { name:'구', cat:'구', icon:['sphere'] },
];
const L0_SORT_HINT = {
  기둥:'밑면이 2개이고 서로 평행하면 <b>기둥</b>이야.',
  뿔:'밑면이 1개이고 뾰족한 꼭짓점이 있으면 <b>뿔</b>이야.',
  구:'공처럼 어느 쪽에서 봐도 둥근 도형이 <b>구</b>야.',
};

function l0SetupSort(wrap){
  const BINS = [
    { key:'기둥', icon:'🥫', hint:'밑면이 2개, 서로 평행' },
    { key:'뿔', icon:'🍦', hint:'밑면이 1개, 뾰족한 꼭짓점' },
    { key:'구', icon:'⚽', hint:'공 모양' },
  ];
  wrap.innerHTML = `
    <div class="sim-row" style="justify-content:space-between">
      <span class="l0-muted">카드를 상자로 <b>끌어다 놓거나</b>, 카드를 <b>누른 뒤 상자를 눌러</b> 보자.</span>
      <span class="l0-score l0-sort-score" aria-live="polite">0 / 10</span>
    </div>
    <div class="l0-sort-cards" role="group" aria-label="분류할 입체도형 카드"></div>
    <div class="l0-bins">
      ${BINS.map(b => `<div class="l0-bin" role="button" tabindex="0" data-bin="${b.key}" aria-label="${b.key} 상자">
        <h5><span aria-hidden="true">${b.icon}</span>${b.key}</h5><span class="hint">${b.hint}</span><div class="items"></div></div>`).join('')}
    </div>
    <div class="l0-sort-fb" aria-live="polite"></div>
    <div class="sim-row l0-sort-again"><button class="btn" type="button" data-a="again">↺ 다시 하기</button></div>`;
  const cardsBox = $('.l0-sort-cards', wrap), fb = $('.l0-sort-fb', wrap), score = $('.l0-sort-score', wrap);
  const bins = [...wrap.querySelectorAll('.l0-bin')];
  let selected = null, placed = 0;

  function reset(){
    placed = 0; selected = null; fb.textContent = ''; fb.className = 'l0-sort-fb'; score.textContent = `0 / ${L0_SORT_ITEMS.length}`;
    bins.forEach(b => { $('.items', b).innerHTML = ''; b.classList.remove('armed'); });
    cardsBox.innerHTML = '';
    const items = [...L0_SORT_ITEMS].sort(() => Math.random() - 0.5);
    items.forEach(it => {
      const c = el('button', { class:'l0-card', type:'button', 'aria-pressed':'false', 'data-cat':it.cat, 'aria-label':it.name },
        `${l0IconSVG(it.icon[0], it.icon[1])}<span>${it.name}</span>`);
      attachDrag(c);
      cardsBox.appendChild(c);
    });
  }
  function select(card){
    selected = card;
    cardsBox.querySelectorAll('.l0-card').forEach(c => c.setAttribute('aria-pressed', String(c === card)));
    bins.forEach(b => b.classList.toggle('armed', !!card));
    if(card) { fb.className = 'l0-sort-fb'; fb.innerHTML = `<b>${card.getAttribute('aria-label')}</b> 카드를 골랐어. 어느 상자에 넣을까?`; }
  }
  function drop(card, bin){
    if(!card || !bin || card.classList.contains('placed')) return;
    const name = card.getAttribute('aria-label');
    if(card.dataset.cat === bin.dataset.bin){
      card.classList.add('placed'); card.setAttribute('aria-pressed', 'false'); card.disabled = true;
      card.setAttribute('aria-label', `${name}, ${bin.dataset.bin} 상자에 넣음`);
      $('.items', bin).appendChild(card);
      placed++; score.textContent = `${placed} / ${L0_SORT_ITEMS.length}`;
      fb.className = 'l0-sort-fb ok';
      fb.innerHTML = placed === L0_SORT_ITEMS.length
        ? '🎉 모두 바르게 분류했어! 원기둥은 기둥, 원뿔은 뿔 무리에 들어간다는 것도 기억해 두자.'
        : `✓ 맞았어! <b>${name}</b>은(는) <b>${bin.dataset.bin}</b>이야.`;
    }else{
      card.classList.remove('l0-shake'); void card.offsetWidth; card.classList.add('l0-shake');
      fb.className = 'l0-sort-fb ng';
      fb.innerHTML = `✗ 다시 생각해 보자. ${L0_SORT_HINT[card.dataset.cat]}`;
    }
    select(null);
  }

  function attachDrag(card){
    let start = null, ghost = null, dragging = false, hoverBin = null, suppressClick = false;
    const binAt = (x, y) => { const e = document.elementFromPoint(x, y); return e && e.closest ? e.closest('.l0-bin') : null; };
    card.addEventListener('pointerdown', e => {
      if(card.classList.contains('placed') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      start = { x:e.clientX, y:e.clientY, id:e.pointerId };
      try{ card.setPointerCapture(e.pointerId); }catch(err){}
    });
    card.addEventListener('pointermove', e => {
      if(!start || e.pointerId !== start.id) return;
      if(!dragging && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8){
        dragging = true;
        ghost = card.cloneNode(true); ghost.classList.add('l0-ghost'); ghost.removeAttribute('id'); ghost.setAttribute('aria-hidden', 'true');
        document.body.appendChild(ghost); card.classList.add('src-dragging');
      }
      if(dragging){
        ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
        const b = binAt(e.clientX, e.clientY);
        if(b !== hoverBin){ hoverBin && hoverBin.classList.remove('hover'); hoverBin = b; b && b.classList.add('hover'); }
      }
    });
    const end = (e, cancel) => {
      if(!start) return;
      if(dragging){
        const b = cancel ? null : binAt(e.clientX, e.clientY);
        ghost && ghost.remove(); ghost = null; card.classList.remove('src-dragging');
        hoverBin && hoverBin.classList.remove('hover'); hoverBin = null;
        suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
        if(b) drop(card, b);
      }
      dragging = false; start = null;
    };
    card.addEventListener('pointerup', e => end(e, false));
    card.addEventListener('pointercancel', e => end(e, true));
    card.addEventListener('click', () => {
      if(suppressClick || card.classList.contains('placed')) return;
      select(selected === card ? null : card);
    });
  }
  bins.forEach(b => {
    const act = () => { if(selected) drop(selected, b); else { fb.className = 'l0-sort-fb'; fb.textContent = '먼저 위에서 카드를 하나 골라 보자!'; } };
    b.addEventListener('click', act);
    b.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
  });
  $('[data-a="again"]', wrap).addEventListener('click', reset);
  reset();
}

/* =====================================================================
   1. 다면체와 각뿔대 (lesson-1)
   ---------------------------------------------------------------------
   생각 열기 : 주령구 면 세기                 → l1SetupJury()
   개념      : ① 다면체(개념 확인하기: setupWordCheck) ② 다면체 탐색(면·모서리·꼭짓점 눌러 찾기) → l1SetupExplorer()
               ② 다면체인가요? O/X 카드      → l1SetupOX()
               ③ 단면 관찰(직육면체 자르기)  → l1SetupSection()
   시뮬레이션: ① 각뿔을 잘라 각뿔대 만들기   → l1SetupFrustum()
               (여담) 계단식 피라미드        → l1SetupMastaba()
               ② 각기둥·각뿔·각뿔대 비교    → l1SetupCompare()
   ===================================================================== */
const L1_NUM = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구', '십', '십일', '십이', '십삼', '십사'];
const L1_POLYGON = { 3:'삼각형', 4:'사각형', 5:'오각형', 6:'육각형', 7:'칠각형', 8:'팔각형' };
const l1Hedron = (f) => (L1_NUM[f] || f) + '면체';

/* ---------- 다면체 데이터 만들기 (면 = 꼭짓점 배열) ---------- */
function l1SortAround(T, pts, normal){
  const c = pts.reduce((s, p) => s.add(p), new T.Vector3()).multiplyScalar(1 / pts.length);
  const u = pts[0].clone().sub(c).normalize();
  const v = new T.Vector3().crossVectors(normal, u).normalize();
  const ang = p => { const d = p.clone().sub(c); return Math.atan2(d.dot(v), d.dot(u)); };
  return pts.slice().sort((p, q) => ang(p) - ang(q));
}
function l1Uniq(pts, tol=1e-5){
  const out = [];
  pts.forEach(p => { if(!out.some(q => q.distanceTo(p) < tol)) out.push(p); });
  return out;
}
function l1CleanFace(f, tol=1e-5){
  const out = [];
  f.forEach(p => { if(!out.length || out[out.length - 1].distanceTo(p) > tol) out.push(p); });
  while(out.length > 1 && out[0].distanceTo(out[out.length - 1]) < tol) out.pop();
  return out;
}
/** 정n각형 꼭짓점(xz 평면). 한 변이 앞(+z)을 보도록 놓고, 가운데로 옮긴다. */
function l1Ngon(T, n, r){
  const raw = Array.from({length:n}, (_, k) => { const a = Math.PI/2 + Math.PI/n + 2*Math.PI*k/n; return [r*Math.cos(a), r*Math.sin(a)]; });
  const xs = raw.map(p => p[0]), zs = raw.map(p => p[1]);
  const ox = (Math.min(...xs) + Math.max(...xs)) / 2, oz = (Math.min(...zs) + Math.max(...zs)) / 2;
  return { pts: raw.map(p => [p[0] - ox, p[1] - oz]), axis: [-ox, -oz] };
}
function l1Prism(T, n, r=1, h=1.6){
  const g = l1Ngon(T, n, r);
  const B = g.pts.map(p => new T.Vector3(p[0], -h/2, p[1])), U = g.pts.map(p => new T.Vector3(p[0], h/2, p[1]));
  const faces = [B.slice().reverse(), U.slice()];
  for(let k=0;k<n;k++){ const j = (k+1) % n; faces.push([B[k], B[j], U[j], U[k]]); }
  return { faces, verts:[...B, ...U] };
}
function l1Pyramid(T, n, r=1.1, h=1.8){
  const g = l1Ngon(T, n, r);
  const B = g.pts.map(p => new T.Vector3(p[0], -h/2, p[1]));
  const A = new T.Vector3(g.axis[0], h/2, g.axis[1]);
  const faces = [B.slice().reverse()];
  for(let k=0;k<n;k++){ const j = (k+1) % n; faces.push([B[k], B[j], A]); }
  return { faces, verts:[...B, A], base:B, apex:A };
}
function l1Frustum(T, n, r1=1.15, r2=0.6, h=1.3){
  const g1 = l1Ngon(T, n, r1);
  const cx = g1.axis[0], cz = g1.axis[1];
  const raw2 = Array.from({length:n}, (_, k) => { const a = Math.PI/2 + Math.PI/n + 2*Math.PI*k/n; return [r2*Math.cos(a) + cx, r2*Math.sin(a) + cz]; });
  const B = g1.pts.map(p => new T.Vector3(p[0], -h/2, p[1])), U = raw2.map(p => new T.Vector3(p[0], h/2, p[1]));
  const faces = [B.slice().reverse(), U.slice()];
  for(let k=0;k<n;k++){ const j = (k+1) % n; faces.push([B[k], B[j], U[j], U[k]]); }
  return { faces, verts:[...B, ...U] };
}
function l1Box(T, a, h, d){
  const V = (x, y, z) => new T.Vector3(x*a/2, y*h/2, z*d/2);
  const faces = [
    [V(-1,-1,-1), V(1,-1,-1), V(1,-1,1), V(-1,-1,1)], [V(-1,1,-1), V(-1,1,1), V(1,1,1), V(1,1,-1)],
    [V(-1,-1,1), V(1,-1,1), V(1,1,1), V(-1,1,1)],     [V(-1,-1,-1), V(-1,1,-1), V(1,1,-1), V(1,-1,-1)],
    [V(1,-1,-1), V(1,1,-1), V(1,1,1), V(1,-1,1)],     [V(-1,-1,-1), V(-1,-1,1), V(-1,1,1), V(-1,1,-1)],
  ];
  return { faces };
}
/** 주령구: 정육면체의 꼭짓점 8개를 잘라 낸 모양(정사각형 6개 + 육각형 8개) */
function l1Jury(T, a=1, b=1.62){
  const c = b - a, verts = [];
  const perms = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  for(const [i, j] of perms) for(const s1 of [1,-1]) for(const s2 of [1,-1]){
    const v = [0,0,0]; v[i] = s1*a; v[j] = s2*c; verts.push(new T.Vector3(...v));
  }
  const faces = [], types = [];
  for(let ax=0;ax<3;ax++) for(const s of [1,-1]){
    const nrm = new T.Vector3(); nrm.setComponent(ax, s);
    faces.push(l1SortAround(T, verts.filter(v => Math.abs(v.getComponent(ax) - s*a) < 1e-6), nrm)); types.push('square');
  }
  for(const sx of [1,-1]) for(const sy of [1,-1]) for(const sz of [1,-1]){
    const nrm = new T.Vector3(sx, sy, sz);
    faces.push(l1SortAround(T, verts.filter(v => Math.abs(v.dot(nrm) - (a + c)) < 1e-6), nrm.clone().normalize())); types.push('hex');
  }
  return { faces, types };
}
/** 면 목록 → 뷰어용 BufferGeometry (+ 삼각형→면 번호 표). anchors: 크기 기준점(넓이 0인 삼각형) */
function l1Geometry(T, faces, anchors=[]){
  const pos = [], triFace = [];
  faces.forEach((f, fi) => { for(let i=1;i<f.length-1;i++){ [f[0], f[i], f[i+1]].forEach(p => pos.push(p.x, p.y, p.z)); triFace.push(fi); } });
  anchors.forEach(a => { for(let k=0;k<3;k++) pos.push(a.x, a.y, a.z); triFace.push(-1); });
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  return { geometry:g, triFace };
}
function l1EdgesOf(faces){
  const key = p => [p.x, p.y, p.z].map(v => v.toFixed(4)).join(',');
  const map = new Map();
  faces.forEach(f => f.forEach((p, i) => {
    const q = f[(i+1) % f.length]; const k1 = key(p), k2 = key(q); if(k1 === k2) return;
    const k = k1 < k2 ? k1 + '|' + k2 : k2 + '|' + k1;
    if(!map.has(k)) map.set(k, [p, q]);
  }));
  return [...map.values()];
}
function l1VertsOf(faces){ return l1Uniq(faces.flat(), 1e-4); }
/** 볼록 다면체를 평면 n·p = d 로 자르기 → { below, above, cap } */
function l1Clip(T, faces, n, d){
  const below = [], above = [], cut = [], eps = 1e-7;
  faces.forEach(f => {
    const B = [], A = [];
    for(let i=0;i<f.length;i++){
      const p = f[i], q = f[(i+1) % f.length];
      const dp = n.dot(p) - d, dq = n.dot(q) - d;
      if(dp <= eps) B.push(p);
      if(dp >= -eps) A.push(p);
      if(Math.abs(dp) <= eps) cut.push(p);
      if((dp < -eps && dq > eps) || (dp > eps && dq < -eps)){
        const x = p.clone().lerp(q, dp / (dp - dq)); B.push(x); A.push(x); cut.push(x);
      }
    }
    const b = l1CleanFace(B), a = l1CleanFace(A);
    if(b.length >= 3) below.push(b);
    if(a.length >= 3) above.push(a);
  });
  const u = l1Uniq(cut, 1e-5);
  const cap = u.length >= 3 ? l1SortAround(T, u, n) : [];
  if(cap.length >= 3){ below.push(cap); above.push(cap.slice().reverse()); }
  return { below, above, cap };
}
function l1Dispose(o){
  o.traverse(c => { c.geometry && c.geometry.dispose(); if(c.material){ c.material.map && c.material.map.dispose(); c.material.dispose(); } });
}

/* ---------- 3D 표시 도우미 (0번 학습의 l0Helpers 확장) ---------- */
function l1H(T){
  const L0 = l0Helpers(T);
  const mat = (color, opacity=1, depthTest=true) => {
    const m = new T.MeshBasicMaterial({ color, transparent:true, opacity, depthTest, depthWrite:false, side:T.DoubleSide,
      polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
    m.userData.base = opacity; return m;
  };
  const normalOf = f => {
    const n = new T.Vector3();
    for(let i=0;i<f.length;i++){ const a = f[i], b = f[(i+1) % f.length];
      n.x += (a.y - b.y) * (a.z + b.z); n.y += (a.z - b.z) * (a.x + b.x); n.z += (a.x - b.x) * (a.y + b.y); }
    return n.normalize();
  };
  const centroid = f => f.reduce((s, p) => s.add(p), new T.Vector3()).multiplyScalar(1 / f.length);
  const polyMesh = (f, color, opacity=0.85, depthTest=true, lift=0.006) => {
    const n = normalOf(f), c = centroid(f); if(n.dot(c) < 0) n.negate();
    const pts = f.map(p => p.clone().addScaledVector(n, lift));
    const pos = []; for(let i=1;i<pts.length-1;i++) [pts[0], pts[i], pts[i+1]].forEach(p => pos.push(p.x, p.y, p.z));
    const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    const m = new T.Mesh(g, mat(color, opacity, depthTest)); m.renderOrder = depthTest ? 3 : 15; return m;
  };
  const tube = (p, q, r, color, depthTest=true) => {
    const d = new T.Vector3().subVectors(q, p); const len = d.length();
    const m = new T.Mesh(new T.CylinderGeometry(r, r, len, 10, 1), mat(color, 1, depthTest));
    m.position.addVectors(p, q).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
    m.renderOrder = depthTest ? 4 : 16; return m;
  };
  const dot = (p, r, color, depthTest=true) => { const m = new T.Mesh(new T.SphereGeometry(r, 18, 12), mat(color, 1, depthTest)); m.position.copy(p); m.renderOrder = depthTest ? 5 : 17; return m; };
  const label = (text, pos, scale=1, depthTest=false) => { const s = L0.label(text, pos); s.scale.multiplyScalar(scale); s.material.depthTest = depthTest; return s; };
  return { ...L0, mat, normalOf, centroid, polyMesh, tube2:tube, dot2:dot, label2:label };
}
/** 3D 강조 깜박임 관리 */
function l1Blink(viewer){
  const items = new Map();
  viewer.onFrame(() => {
    let anim = false; const now = performance.now();
    items.forEach(o => {
      const t = (now - o.userData.start) / 1000;
      const bl = !L0_REDUCED_MOTION && t < 2.7;
      const f = bl ? 0.2 + 0.8 * (0.5 + 0.5 * Math.cos(t * Math.PI * 2 * 1.3)) : 1;
      if(bl || o.userData.lastF !== 1){
        o.traverse(c => { if(c.material && c.material.userData.base != null) c.material.opacity = c.material.userData.base * f; });
        anim = true;
      }
      o.userData.lastF = f;
    });
    return anim;
  });
  const api = {
    add(key, obj){ api.remove(key); obj.userData.start = performance.now(); viewer.extras.add(obj); items.set(key, obj); viewer.requestRender(); },
    remove(key){ const o = items.get(key); if(o){ viewer.extras.remove(o); l1Dispose(o); items.delete(key); viewer.requestRender(); } },
    clear(){ [...items.keys()].forEach(k => api.remove(k)); },
  };
  return api;
}
/** 3D 도형을 '톡' 눌렀을 때(끌기 제외) 어느 면의 어느 점인지 알려 줌 */
function l1Pick(viewer, getTriFace, onPick){
  const T = viewer.THREE, dom = viewer.dom, ray = new T.Raycaster();
  let down = null;
  dom.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
  dom.addEventListener('pointerup', e => {
    if(!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if(moved > 7) return;
    const rect = dom.getBoundingClientRect();
    const ndc = new T.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, viewer.camera);
    const mesh = viewer.root.children.find(c => c.isMesh && !c.isInstancedMesh);
    if(!mesh) return;
    const hit = ray.intersectObject(mesh, false)[0];
    const triFace = getTriFace();
    if(!hit || !triFace) return;
    const face = triFace[hit.faceIndex];
    if(face == null || face < 0) return;
    onPick({ face, point:hit.point.clone() });
  });
}
function l1SegDist(p, a, b){
  const ab = b.clone().sub(a), t = Math.max(0, Math.min(1, p.clone().sub(a).dot(ab) / ab.lengthSq()));
  return a.clone().addScaledVector(ab, t).distanceTo(p);
}
/** 각뿔대 아이콘 */
function l1FrustumIcon(n=4){
  const cx = 50, cy = 74, R = 32, r = 17, k = 0.42, H = 40;
  const rot = Math.PI/2 + Math.PI/n;
  const ts = Array.from({length:n}, (_, i) => rot + 2*Math.PI*i/n);
  const B = ts.map(t => [cx + R*Math.cos(t), cy + R*k*Math.sin(t)]), U = ts.map(t => [cx + r*Math.cos(t), cy + r*k*Math.sin(t) - H]);
  const st = 'stroke="#2B3A55" stroke-width="2.2" stroke-linejoin="round"';
  const poly = (pts, fill) => `<polygon points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="${fill}" ${st}/>`;
  const faces = ts.map((t, i) => ({ i, d: Math.sin(t) + Math.sin(ts[(i+1) % n]) })).sort((a, b) => a.d - b.d);
  let s = poly(B, '#DDEFD9');
  faces.forEach(f => { const j = (f.i+1) % n; s += poly([B[f.i], B[j], U[j], U[f.i]], f.d > 0 ? '#C5E6BE' : '#ADD8A4'); });
  s += poly(U, '#EAF6E7');
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">${s}</svg>`;
}

      <div class="concept-box l1-sec-concept">
        <span class="concept-title">단면의 모양</span>
