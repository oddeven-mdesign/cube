    if(st.mode === 'line') st.lineX = Math.floor(l3Bounds(shape.pts).minX) - 1;
    refresh();
  }
  wrap.querySelectorAll('.l3-card').forEach(c => c.addEventListener('click', () => {
    wrap.querySelectorAll('.l3-card').forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    const drawBox = $('.l3-draw', wrap);
    if(c.dataset.k === 'custom'){ drawBox.hidden = false; st.shape = st.custom; st.edge = null; renderDraw(); refresh(); return; }
    drawBox.hidden = true; choose(l3Shape(c.dataset.k));
  }));

  /* ---- 직접 그리기 ---- */
  const N = 6;
  function renderDraw(){
    const U = 44, P = 18, S = N * U + 2 * P, X = x => P + x * U, Y = y => P + (N - y) * U;
    let h = `<svg viewBox="0 0 ${S} ${S}" class="l3-svg l3-drawsvg" role="img" aria-label="점을 찍어 다각형 그리기">`;
    for(let i=0;i<=N;i++){ h += `<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(N)}" class="grid"/><line x1="${X(0)}" y1="${Y(i)}" x2="${X(N)}" y2="${Y(i)}" class="grid"/>`; }
    const pts = st.drawPts;
    if(st.custom) h += `<polygon points="${st.custom.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" class="shape"/>`;
    else if(pts.length) h += `<polyline points="${pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="#E65100" stroke-width="3"/>`;
    for(let x=0;x<=N;x++) for(let y=0;y<=N;y++){
      const idx = pts.findIndex(p => p[0] === x && p[1] === y);
      h += `<circle cx="${X(x)}" cy="${Y(y)}" r="${idx === 0 ? 9 : idx > 0 ? 7 : 5}" class="gpt ${idx === 0 ? 'first' : idx > 0 ? 'on' : ''}" data-x="${x}" data-y="${y}"/>`;
    }
    $('.l3-draw-grid', wrap).innerHTML = h + '</svg>';
    $('.l3-draw-grid', wrap).querySelectorAll('.gpt').forEach(c => c.addEventListener('click', () => {
      const x = +c.dataset.x, y = +c.dataset.y;
      if(st.custom){ st.custom = null; st.drawPts = []; st.shape = null; refresh(); }
      if(st.drawPts.length >= 3 && st.drawPts[0][0] === x && st.drawPts[0][1] === y){ finishDraw(); return; }
      if(st.drawPts.some(p => p[0] === x && p[1] === y)){ toast('이미 찍은 점이야.'); return; }
      st.drawPts.push([x, y]); renderDraw();
    }));
  }
  function segX(a, b, c, d){
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
  }
  function finishDraw(){
    const msg = $('.l3-draw-msg', wrap);
    let pts = st.drawPts.slice();
    // 한 직선 위의 점 정리
    pts = pts.filter((p, i) => { const a = pts[(i - 1 + pts.length) % pts.length], c = pts[(i + 1) % pts.length]; return (p[0] - a[0]) * (c[1] - a[1]) - (p[1] - a[1]) * (c[0] - a[0]) !== 0; });
    if(pts.length < 3){ msg.textContent = '⚠️ 점을 3개 이상(한 직선 위에 있지 않게) 찍어 보자.'; return; }
    const n = pts.length;
    for(let i=0;i<n;i++) for(let j=i+2;j<n;j++){
      if(i === 0 && j === n - 1) continue;
      if(segX(pts[i], pts[(i+1) % n], pts[j], pts[(j+1) % n])){ msg.textContent = '⚠️ 선이 서로 엇갈렸어. 변이 겹치지 않게 다시 그려 보자.'; return; }
    }
    st.custom = { key:'custom', name:'직접 그린 도형', pts };
    msg.textContent = `✓ ${n}각형을 그렸어! 이제 회전축을 정해 보자.`;
    st.drawPts = pts; st.edge = null; st.shape = st.custom;
    if(st.mode === 'line') st.lineX = l3Bounds(pts).minX - 1;
    renderDraw(); refresh();
  }
  wrap.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
    const d = b.dataset.d;
    if(d === 'undo'){ if(st.custom){ st.custom = null; st.shape = null; refresh(); } st.drawPts.pop(); renderDraw(); }
    if(d === 'clear'){ st.custom = null; st.drawPts = []; st.shape = null; renderDraw(); refresh(); $('.l3-draw-msg', wrap).textContent = ''; }
    if(d === 'done') finishDraw();
  }));

  $('[data-a="play"]', wrap).addEventListener('click', () => { if(!rev) return; rev.play(3, ph => { syncAngle(ph * 180 / Math.PI); badge(); }, badge); });
  $('[data-a="zero"]', wrap).addEventListener('click', () => { if(!rev) return; rev.stop(); rev.setPhi(0); syncAngle(0); badge(); });
  // 처음에는 직사각형을 골라 둔 상태로
  wrap.querySelector('.l3-card[data-k="rect"]').click();
}

/* =====================================================================
   시뮬레이션 ② 두 축 비교
   ===================================================================== */
async function l3SetupCompare(wrap){
  const EX = [
    { key:'rtri', label:'직각삼각형', A:{ i:2, name:'높이를 축으로' }, B:{ i:0, name:'밑변을 축으로' } },
    { key:'rect', label:'직사각형', A:{ i:3, name:'세로 변을 축으로' }, B:{ i:0, name:'가로 변을 축으로' } },
    { key:'trap', label:'사다리꼴', A:{ i:3, name:'직각인 변을 축으로' }, B:{ i:0, name:'아랫변을 축으로' } },
  ];
  const AX = [{ k:'A', label:'회전축 ①', color:'#F57C00' }, { k:'B', label:'회전축 ②', color:'#2E7D32' }];
  wrap.innerHTML = `
    <div class="l0-note l3-cmp-note"></div>
    <div class="l3-cmp3">
      ${AX.map((a, j) => `<figure class="l1-cmp-fig l3-cmp-fig" data-k="${a.k}"><figcaption class="l1-cmp-cap"><span class="l3-ax-dot" style="--ac:${a.color}"></span>회전축 ${'①②'[j]}</figcaption><div class="l3-cmp-v"></div><p class="l3-cmp-name" aria-live="polite"></p></figure>`).join('')}
      <div class="l3-cmp-col">
        <p class="l1-cmp-cap l3-cmp-cap3">평면도형</p>
        <div class="l3-cmp-panel">
          <div class="l3-cmp-ex"></div>
          <div class="l3-cmp-2d"></div>
        </div>
        <div class="l3-cmp-btns"><button class="btn" type="button" data-a="zero">↺ 처음으로</button><button class="btn primary" type="button" data-a="play">▶ 1회전</button></div>
      </div>
    </div>`;
  let ex = EX[0];
  const seg = createSegmented({ items:EX.map((e, i) => ({ value:i, label:e.label })), value:0, label:'비교할 도형', onChange:v => { ex = EX[v]; load(); } });
  $('.l3-cmp-ex', wrap).appendChild(seg.el);
  const figs = ['A', 'B'].map(k => $(`.l1-cmp-fig[data-k="${k}"]`, wrap));
  const viewers = await Promise.all(figs.map(f => create3DViewer($('.l3-cmp-v', f), { showInfo:false, tools:['autoRotate', 'reset'] })));
  const revs = viewers.map((v, i) => { if(!v.ok) return null; v.resetView(); return l3Revolver(v, { color:i ? '#AED581' : '#FFB74D' }); });
  // 회전축 이름표가 도형 바깥쪽에 오도록 (도형 중심의 반대쪽으로 비켜 둠)
  const axOff = (s, i) => { const a = s.pts[i], c = s.pts[(i + 1) % s.pts.length], b = l3Bounds(s.pts);
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2, dx = c[0] - a[0], dy = c[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const side = (-dy / len) * (cx - (a[0] + c[0]) / 2) + (dx / len) * (cy - (a[1] + c[1]) / 2); const d = Math.abs(dy) > Math.abs(dx) ? 1.0 : 0.45; return side > 0 ? -d : d; };   // 세로 축은 글자 폭만큼 더 비켜 둠
  function names(){ return ['A', 'B'].map(k => l3Title(l3Classify(l3Shape(ex.key), l3Profile(l3Shape(ex.key), { type:'edge', i:ex[k].i }).prof))); }
  function load(){
    const s = l3Shape(ex.key);
    $('.l3-cmp-2d', wrap).innerHTML = l3ShapeSVG(s, null, { pad:1.9, axes:AX.map(a => ({ i:ex[a.k].i, color:a.color, label:a.label, off:axOff(s, ex[a.k].i) })) });
    figs.forEach((f, j) => {
      const k = j ? 'B' : 'A';
      $('.l3-cmp-name', f).textContent = '';
      if(revs[j]){ revs[j].stop(); revs[j].set(l3Profile(s, { type:'edge', i:ex[k].i }).prof); revs[j].setPhi(0); }
    });
    $('.l3-cmp-note', wrap).innerHTML = '같은 평면도형에 대하여 회전축이 달라지면 회전체도 달라질까요? 확인해 봅시다.';
  }
  $('[data-a="play"]', wrap).addEventListener('click', () => {
    const nm = names(); let done = 0;
    revs.forEach((r, j) => { if(!r) return; r.setPhi(0); r.play(3, null, () => { $('.l3-cmp-name', figs[j]).innerHTML = `→ <b>${nm[j]}</b>`; if(++done === 2) note(nm); }); });
    if(!revs[0]){ figs.forEach((f, j) => { $('.l3-cmp-name', f).innerHTML = `→ <b>${nm[j]}</b>`; }); note(nm); }
  });
  $('[data-a="zero"]', wrap).addEventListener('click', load);
  /* 평면도형 상자 높이 = 3D 화면 높이, 버튼은 관찰 버튼과 같은 높이·위치 */
  const panel = $('.l3-cmp-panel', wrap), btns = $('.l3-cmp-btns', wrap);
  function fit(){
    const stg = $('.viewer-stage', figs[0]), tb = $('.viewer-toolbar', figs[0]);
    const wide = getComputedStyle($('.l3-cmp3', wrap)).gridTemplateColumns.split(' ').length >= 3;
    panel.style.height = ''; panel.style.marginTop = ''; btns.style.marginTop = ''; btns.querySelectorAll('.btn').forEach(b => { b.style.height = ''; });
    if(!wide || !stg || !tb || !stg.offsetHeight) return;
    panel.style.marginTop = '';
    panel.style.height = stg.offsetHeight + 'px';
    const dp = stg.getBoundingClientRect().top - panel.getBoundingClientRect().top;
    if(Math.abs(dp) > 0.5) panel.style.marginTop = dp + 'px';
    const tbb = tb.querySelector('.btn'); if(tbb) btns.querySelectorAll('.btn').forEach(b => { b.style.height = tbb.offsetHeight + 'px'; });
    const d = tb.getBoundingClientRect().top - btns.getBoundingClientRect().top;
    btns.style.marginTop = (parseFloat(getComputedStyle(btns).marginTop) + d) + 'px';
  }
  if(window.ResizeObserver){ let lw = 0, lh = 0, raf = 0;   // 3D 화면의 크기가 바뀔 때만 다음 프레임에 맞춤
    new ResizeObserver(() => { const stg = $('.viewer-stage', figs[0]); const w = figs[0].clientWidth, h = stg ? stg.clientHeight : 0;
      if(w === lw && h === lh) return; lw = w; lh = h; cancelAnimationFrame(raf); raf = requestAnimationFrame(fit); }).observe(figs[0]); }
  function note(nm){
    $('.l3-cmp-note', wrap).innerHTML = nm[0] === nm[1]
      ? `두 경우 모두 <b>${nm[0]}</b>이지만, 밑면의 반지름과 높이가 서로 바뀌어서 <b>크기와 모양이 달라</b>.`
      : `한쪽은 <b>${nm[0]}</b>, 다른 쪽은 <b>${nm[1]}</b>! 같은 도형이라도 회전축에 따라 전혀 다른 회전체가 생겨.`;
  }
  load();

   시뮬레이션 ④ 원뿔을 잘라 원뿔대 만들기 ★
   ===================================================================== */
function l3FrustumNetSVG(R, r, h, unit=''){
  const s = Math.hypot(h, R - r), L = s * R / (R - r), l = L - s, th = 2 * Math.PI * R / L;
  const W = 340, cx = W / 2;
  const scale = 150 / (L + 2 * R);
  const k = v => v * scale;
  const cy = 20;
  const a0 = Math.PI / 2 - th / 2, a1 = Math.PI / 2 + th / 2;
  const P = (rad, a) => [cx + k(rad) * Math.cos(a), cy + k(rad) * Math.sin(a)];
  const big = th > Math.PI ? 1 : 0;
  const [o0x, o0y] = P(L, a0), [o1x, o1y] = P(L, a1), [i0x, i0y] = P(l, a0), [i1x, i1y] = P(l, a1);
  const ann = `M${o0x} ${o0y} A${k(L)} ${k(L)} 0 ${big} 1 ${o1x} ${o1y} L${i1x} ${i1y} A${k(l)} ${k(l)} 0 ${big} 0 ${i0x} ${i0y} Z`;
  const small = `M${cx} ${cy} L${i0x} ${i0y} A${k(l)} ${k(l)} 0 ${big} 1 ${i1x} ${i1y} Z`;
  const Hh = cy + k(L) + 2 * k(R) + 30;
  return `<svg viewBox="0 0 ${W} ${Hh}" class="l3-svg" role="img" aria-label="원뿔대의 전개도">
    <path d="${small}" fill="none" stroke="#9AA6BC" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="${ann}" fill="#B2EBF2" stroke="#006064" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy + k(L) + k(R)}" r="${k(R)}" fill="#FFE082" stroke="#8D6E00" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy + k(l) - k(r)}" r="${k(r)}" fill="#FFE082" stroke="#8D6E00" stroke-width="2.5"/>
    <text x="${cx}" y="${cy + (k(l) + k(L)) / 2 + 4}" class="lab" text-anchor="middle">옆면</text>
    <text x="${cx}" y="${cy + k(L) + k(R) + 5}" class="lab" text-anchor="middle">밑면</text>
    <text x="${cx}" y="${cy + k(l) - k(r) + 5}" class="lab small" text-anchor="middle">밑면</text>
    <text x="${cx - 10}" y="${cy + 6}" class="lab muted" text-anchor="end">잘라 낸 작은 부채꼴 →</text>
  </svg>`;
}

/* 원뿔대 전개도 접기·펼치기 모형 (R: 아래 밑면, r: 위 밑면, h: 높이 / 단위 그대로) — apply(p): 0 접힘 → 1 펼침 */

  for(let i = 0; i < RS; i++) for(let j = 0; j < AS; j++){ const a = i * (AS + 1) + j, b = a + 1, c = a + AS + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  sectG.setAttribute('position', new T.BufferAttribute(pos, 3)); sectG.setIndex(idx);
  body.add(new T.Mesh(sectG, mkMat('#B2EBF2')));
  const NL = 2 * (AS + 1) + 1, lineG = new T.BufferGeometry(), lpos = new Float32Array(NL * 3); lineG.setAttribute('position', new T.BufferAttribute(lpos, 3));
  body.add(new T.Line(lineG, new T.LineBasicMaterial({ color:0x2B3A55 })));
  const disc = rad => { const m = new T.Mesh(new T.CircleGeometry(rad, 64), mkMat('#FFE082')); m.add(new T.LineSegments(new T.EdgesGeometry(new T.CircleGeometry(rad, 64)), new T.LineBasicMaterial({ color:0x2B3A55 }))); body.add(m); return m; };
  const bot = disc(R), top = disc(r);
  const lab = text => { const sp = H.label(text, new T.Vector3()); sp.scale.multiplyScalar(0.78 / k); body.add(sp); return sp; };
  const sLab = lab('옆면'), bLab = lab('밑면'), tLab = lab('밑면');
  const hinge = (circ, Tp, gam, folded, rad) => {   // 원을 호의 가운데(Tp)에 붙여 접었다 폈다
    return sw => { const ang = gam + sw * (folded - gam), dir = new T.Vector3(Math.cos(ang), Math.sin(ang), 0), nrm = new T.Vector3(-Math.sin(ang), Math.cos(ang), 0);

  };
  const apply = p => {
    const f = 1 - clamp((p - 0.35) / 0.65), sw = 1 - clamp(p / 0.4);
    const PSI = PHI + f * (2 * Math.PI - PHI), rc = PHI * L / PSI, hc = Math.sqrt(Math.max(0, L * L - rc * rc));
    const at = (rho, ph) => { const ps = ph * PSI / PHI; return [rho / L * rc * Math.cos(ps), -hc * rho / L, rho / L * rc * Math.sin(ps)]; };
    for(let i = 0; i <= RS; i++) for(let j = 0; j <= AS; j++){ const v = at(li + s * i / RS, -PHI / 2 + PHI * j / AS); pos.set(v, (i * (AS + 1) + j) * 3); }
    sectG.attributes.position.needsUpdate = true; sectG.computeVertexNormals(); sectG.computeBoundingSphere();
    let n = 0; for(let j = 0; j <= AS; j++) lpos.set(at(li, -PHI / 2 + PHI * j / AS), (n++) * 3);
    for(let j = AS; j >= 0; j--) lpos.set(at(L, -PHI / 2 + PHI * j / AS), (n++) * 3);
    lpos.set(at(li, -PHI / 2), (n++) * 3);
    lineG.attributes.position.needsUpdate = true; lineG.computeBoundingSphere();
    sLab.position.set(...at(li + s * 0.5, 0)).add(new T.Vector3(0, 0.05 / k, 0));
    // 아래 밑면: 바깥 호에 붙어 있다가 아래로 접혀 바닥을 덮음 / 위 밑면: 안쪽 호에 붙어 있다가 위를 덮음
    const Tb = new T.Vector3(rc, -hc, 0), Tt = new T.Vector3(rc * li / L, -hc * li / L, 0);
    hinge(bot, Tb, Math.atan2(-hc, rc), -Math.PI, R)(sw);
    hinge(top, Tt, Math.atan2(hc, -rc), Math.PI, r)(sw);
    bLab.position.copy(bot.position).add(new T.Vector3(0, 0.06 / k, 0)); tLab.position.copy(top.position).add(new T.Vector3(0, 0.06 / k, 0));
    body.position.set(-cxF * k * clamp(p), hc * k - h * k / 2 * (1 - clamp(p)), -czF * k * clamp(p));
  };
  apply(0);
  return { root, apply };
}

async function l3FruNet(wrap){
  wrap.innerHTML = `
    <p class="lead">두 밑면의 반지름과 높이를 정해 원뿔대를 만들고, [펼치기]를 눌러 전개도를 살펴보자.</p>

  let sR, sr, net = null;
  const shapeChanged = () => { st.t = st.target = 0; setOpenLabel(false); syncOpen(); build(); };
  sR = createSlider({ label:'밑면(아래)의 반지름', min:2, max:6, step:0.5, value:st.R, format:v => `${v} cm`, onInput:v => { st.R = v; if(st.r > v - 1){ st.r = v - 1; sr.set(st.r); return; } shapeChanged(); } });
  sr = createSlider({ label:'밑면(위)의 반지름', min:1, max:5, step:0.5, value:st.r, format:v => `${v} cm`, onInput:v => { st.r = v; if(v > st.R - 1){ st.R = v + 1; sR.set(st.R); return; } shapeChanged(); } });
  const sh = createSlider({ label:'높이', min:2, max:8, step:0.5, value:st.h, format:v => `${v} cm`, onInput:v => { st.h = v; shapeChanged(); } });
  const so = createSlider({ label:'펼친 정도', min:0, max:100, step:1, value:0, unit:'%', onInput:v => { st.t = st.target = v / 100; setOpenLabel(false); if(net){ net.apply(st.t); viewer.requestRender(); } info(); } });

  const soIn = $('input', so.el), soOut = $('output', so.el);

  const NOTE = {
    open:s => `원뿔대의 전개도는 크기가 다른 <b>원 2개</b>(두 밑면)와, 큰 부채꼴에서 <b>작은 부채꼴을 떼어 낸 모양</b>(옆면)으로 이루어져 있어. <span class="l0-muted">모선의 길이 ≈ ${s} cm</span>`,
    mid:() => '원뿔대를 펼치는 중이야. 두 밑면과 옆면이 어떻게 펼쳐지는지 살펴보자.',
    start:() => `밑면(아래)의 반지름 ${st.R} cm, 밑면(위)의 반지름 ${st.r} cm, 높이 ${st.h} cm인 <b>원뿔대</b>야. [📂 펼치기]를 눌러 보자!`,
  };
  function info(){
    const s = Math.round(Math.hypot(st.h, st.R - st.r) * 10) / 10;

  }
  /* 설명 글상자 높이: 가장 긴 글이 들어가는 높이로 고정 (오른쪽 칸 너비가 바뀔 때만 다음 프레임에 계산) */
  function fitNote(){
    if(!note.offsetWidth) return;
    const cur = note.innerHTML; note.style.height = 'auto'; let mx = 0;

  build();

   4. 놀이: 가로세로 낱말 퍼즐 (lesson-4)  — 교과서 222쪽 '도전! 가로세로 낱말 퍼즐' 격자
   ---------------------------------------------------------------------
   격자·단어 데이터 : L4_ROWS, L4_COLS, L4_WORDS

   화면             : setupLesson4Sim()   (퍼즐 자체가 퀴즈 역할 → 별도 퀴즈 없음)

const L4_ROWS = 11, L4_COLS = 12;
const L4_WORDS = [
  // 가로 (d:'A') / 세로 (d:'D'), r·c: 첫 글자 칸 (0부터)

  { d:'A', n:10, w:'회전체',     r:3,  c:9,  clue:'평면도형을 한 직선을 축으로 하여 1회전 시킬 때 생기는 입체도형', shape:'lathe' },

  { d:'A', n:18, w:'정십이면체', r:10, c:7,  clue:'면이 정오각형인 정다면체', shape:'dodeca' },
  { d:'D', n:1,  w:'대각',       r:0,  c:1,  clue:'삼각형에서 한 변과 마주 보는 각' },
  { d:'D', n:2,  w:'정육각형',   r:0,  c:4,  clue:'변의 길이와 내각의 크기가 각각 모두 같은 육각형' },

  { d:'D', n:6,  w:'직각삼각형', r:5,  c:0,  clue:'한 내각의 크기가 90°인 삼각형' },
  { d:'D', n:8,  w:'원뿔대',     r:6,  c:2,  clue:'원뿔을 밑면에 평행한 평면으로 자를 때 생기는 두 입체도형 중에서 원뿔이 아닌 부분', shape:'conefrustum' },
  { d:'D', n:9,  w:'입체도형',   r:2,  c:11, clue:'부피를 가지는 도형', shape:'cube' },
  { d:'D', n:11, w:'수직이등분선', r:2, c:7, clue:'선분의 중점을 지나고 그 선분에 수직인 직선' },
  { d:'D', n:13, w:'삼각기둥',   r:5,  c:9,  clue:'면이 5개인 기둥 모양의 입체도형', shape:'prism3' },
  { d:'D', n:14, w:'교점',       r:7,  c:6,  clue:'선과 선 또는 선과 면이 만나서 생기는 점' },
  { d:'D', n:15, w:'맞꼭지각',   r:7,  c:4,  clue:'두 직선이 만나서 생기는 교각 중에서 서로 마주 보는 각' },
  { d:'D', n:19, w:'사면체',     r:8,  c:11, clue:'면의 개수가 가장 적은 다면체', shape:'tetra' },
];
const l4Key = (r, c) => `${r},${c}`;
const l4Cells = W => Array.from(W.w, (_, i) => W.d === 'D' ? [W.r + i, W.c] : [W.r, W.c + i]);
const L4_DIRNAME = { A:'가로', D:'세로' };

/** 배치 검사: 교차 칸 글자 일치, 격자 범위, 의도하지 않은 단어(붙은 글자) 여부를 콘솔에 출력 */
function l4ValidatePuzzle(){
  const grid = new Map(), problems = [];
  L4_WORDS.forEach(W => l4Cells(W).forEach(([r, c], i) => {
    if(r < 0 || r >= L4_ROWS || c < 0 || c >= L4_COLS) problems.push(`범위 밖: ${W.w}`);
    const k = l4Key(r, c), ch = W.w[i];
    if(grid.has(k) && grid.get(k) !== ch) problems.push(`교차 불일치 (${k}): ${grid.get(k)} ≠ ${ch} (${L4_DIRNAME[W.d]} ${W.n} ${W.w})`);
    grid.set(k, ch);
  }));
  // 가로·세로로 이어진 글자 묶음이 모두 단어 목록에 있는지
  const listed = new Set(L4_WORDS.map(W => W.d + W.w)), runs = [];
  for(let r=0;r<L4_ROWS;r++){ let s = ''; for(let c=0;c<=L4_COLS;c++){ const ch = c < L4_COLS ? grid.get(l4Key(r, c)) : null; if(ch) s += ch; else { if(s.length >= 2) runs.push('A' + s); s = ''; } } }
  for(let c=0;c<L4_COLS;c++){ let s = ''; for(let r=0;r<=L4_ROWS;r++){ const ch = r < L4_ROWS ? grid.get(l4Key(r, c)) : null; if(ch) s += ch; else { if(s.length >= 2) runs.push('D' + s); s = ''; } } }
  runs.filter(x => !listed.has(x)).forEach(x => problems.push(`의도하지 않은 단어: ${L4_DIRNAME[x[0]]} '${x.slice(1)}'`));
  [...listed].filter(x => !runs.includes(x)).forEach(x => problems.push(`격자에서 확인되지 않는 단어: ${x.slice(1)}`));
  // 같은 번호의 가로·세로 단어는 첫 글자 칸을 공유하는지
  const byNum = {}; L4_WORDS.forEach(W => (byNum[W.n] = byNum[W.n] || []).push(W));
  Object.values(byNum).filter(a => a.length === 2).forEach(([a, b]) => { if(a.r !== b.r || a.c !== b.c) problems.push(`${a.n}번 가로·세로 첫 칸 불일치`); });
  let crossings = 0; const count = new Map();
  L4_WORDS.forEach(W => l4Cells(W).forEach(([r, c]) => { const k = l4Key(r, c); count.set(k, (count.get(k) || 0) + 1); }));
  count.forEach(v => { if(v > 1) crossings++; });
  const ok = problems.length === 0;
  const log = ok ? console.info : console.warn;
  log(`[낱말 퍼즐 검사] ${ok ? '✓ 통과' : '✗ 문제 있음'} — 단어 ${L4_WORDS.length}개, 글자 칸 ${grid.size}개, 교차 칸 ${crossings}개` + (ok ? '' : '\n' + problems.join('\n')));
  return { ok, problems, grid };
}

/* ---------- 정답 단어의 3D 미리보기 팝업 ---------- */
let l4Popup = null;
function l4ClosePopup(){
  if(!l4Popup) return;
  clearTimeout(l4Popup.timer);
  l4Popup.viewer && l4Popup.viewer.dispose && l4Popup.viewer.dispose();
  l4Popup.el.remove(); l4Popup = null;
}
async function l4ShowPopup(W){
  if(!W.shape) return;
  l4ClosePopup();
  const CAP = {
    polyhedron:'정다면체의 예: 정이십면체', frustum:'각뿔대의 예: 사각뿔대', lathe:'회전체의 예: 꽃병 모양', dodeca:'정오각형 12개로 둘러싸인 정십이면체',
    conefrustum:'원뿔대: 두 밑면이 크기가 다른 원', cube:'입체도형의 예: 정육면체', prism3:'면이 5개인 삼각기둥', tetra:'면이 4개인 사면체',
  };
  const box = el('div', { class:'l4-pop', role:'dialog', 'aria-label':`${W.w} 3D 미리보기` },
    `<div class="l4-pop-head"><b>🎉 ‘${W.w}’ 정답!</b><button class="btn" type="button" aria-label="미리보기 닫기">✕</button></div>
     <div class="l4-pop-v"></div><p class="l4-pop-cap">${CAP[W.shape] || ''}</p>`);
  document.body.appendChild(box);
  l4Popup = { el:box, viewer:null, timer:setTimeout(l4ClosePopup, 12000) };
  $('button', box).addEventListener('click', l4ClosePopup);
  const me = l4Popup;
  const viewer = await create3DViewer($('.l4-pop-v', box), { showInfo:false, autoRotate:true, tools:['autoRotate'] });
  if(l4Popup !== me){ viewer.dispose && viewer.dispose(); return; }
  me.viewer = viewer;
  if(!viewer.ok) return;
  const T = viewer.THREE;
  const geo = {
    polyhedron:() => l1Geometry(T, l2Platonic(T, 'icosa', 1.1)).geometry,
    dodeca:() => l1Geometry(T, l2Platonic(T, 'dodeca', 0.9)).geometry,
    tetra:() => l1Geometry(T, l2Platonic(T, 'tetra', 1.6)).geometry,
    frustum:() => l1Geometry(T, l1Frustum(T, 4, 1.2, 0.6, 1.2).faces).geometry,
    prism3:() => l1Geometry(T, l1Prism(T, 3, 1.0, 1.7).faces).geometry,
    cube:() => new T.BoxGeometry(1.5, 1.5, 1.5),
    conefrustum:(S) => S.coneFrustum(1.2, 0.6, 1.4),
    lathe:() => { const g = new T.LatheGeometry([[0,-1],[0.7,-1],[0.85,-0.6],[0.45,0.2],[0.4,0.7],[0.65,1],[0,1]].map(p => new T.Vector2(p[0], p[1])), 64);
      g.userData = { curved:true, vertices:[], info:{ faces:'—', edges:'—', vertices:'—' } }; return g; },
  }[W.shape];
  viewer.setShape((TT, S) => geo(S), { title:W.w });
}

  const board = $('.l4-board', container), input = $('.l4-input', container), fb = $('.l4-fb', container);
  const clueTxt = $('.l4-clue .txt', container), clueTag = $('.l4-clue .tag', container);
  const st = { letters:new Map(), solved:new Set(), hinted:new Set(), wrong:new Set(), sel:null, cur:null, hints:0, start:0, elapsed:0, timer:null, done:false, composing:false };
  const wordsAt = new Map();                                   // 칸 → 그 칸을 지나는 단어들
  L4_WORDS.forEach(W => l4Cells(W).forEach(([r, c]) => { const k = l4Key(r, c); (wordsAt.get(k) || wordsAt.set(k, []).get(k)).push(W); }));
  const nums = new Map(); L4_WORDS.forEach(W => nums.set(l4Key(W.r, W.c), W.n));
  const answer = k => { const W = wordsAt.get(k)[0]; const i = l4Cells(W).findIndex(([r, c]) => l4Key(r, c) === k); return W.w[i]; };

  /* 열쇠 목록 */
  ['A', 'D'].forEach(d => {
    const ol = container.querySelector(`.l4-list[data-d="${d}"]`);
    L4_WORDS.filter(W => W.d === d).forEach(W => {
      const li = el('li', {}, `<button type="button" class="l4-li"><b class="n">${W.n}</b><span>${W.clue}</span><em class="st"></em></button>`);
      W.li = li; $('button', li).addEventListener('click', () => select(W, l4Key(W.r, W.c), true));

  function startTimer(){

  const fmt = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

  function render(preview){
    const selCells = st.sel ? l4Cells(st.sel).map(([r, c]) => l4Key(r, c)) : [];
    cellEl.forEach((b, k) => {
      const pv = preview && preview.has(k) ? preview.get(k) : null;
      $('.ch', b).textContent = pv != null ? pv : (st.letters.get(k) || '');

    L4_WORDS.forEach(W => {

    $('.l4-hints', container).textContent = st.hints;

    $('.l4-hleft', container).textContent = `(${left}회)`; hb.disabled = left === 0 || st.done;
  }
  function select(W, k, focus){

    clueTag.textContent = `${L4_DIRNAME[W.d]} ${W.n}`;
    clueTxt.innerHTML = `${W.clue} <small>(${W.w.length}글자)</small>`;
    $('.l4-len', container).textContent = `· ${L4_DIRNAME[W.d]} ${W.n}번, ${W.w.length}글자`;
    input.disabled = st.solved.has(W) || st.done;

    fb.textContent = ''; fb.className = 'l4-fb';

  }
  function clickCell(k){
    const list = wordsAt.get(k);

  }
  /* 입력: 한글 조합 중에는 미리 보기만, 조합이 끝나면(compositionend) 칸에 확정 */
  function typed(){ return [...input.value.replace(/\s+/g, '')]; }
  function previewMap(){
    const m = new Map(); if(!st.sel) return m;
    const chars = typed();
    l4Cells(st.sel).forEach(([r, c], i) => { const k = l4Key(r, c); if(i < chars.length && !locked(k)) m.set(k, chars[i]); });
    return m;
  }
  function commit(){

    l4Cells(st.sel).forEach(([r, c], i) => {

  input.addEventListener('input', (e) => { startTimer(); if(st.composing || e.isComposing) render(previewMap()); else commit(); });
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.isComposing && !st.composing){ e.preventDefault(); commit(); checkWord(st.sel); } });
  $('[data-a="clear"]', container).addEventListener('click', () => {
    if(!st.sel || st.solved.has(st.sel)) return;
    input.value = '';
    l4Cells(st.sel).forEach(([r, c]) => { const k = l4Key(r, c); if(!locked(k)){ st.letters.delete(k); st.hinted.delete(k); st.wrong.delete(k); } });

  /* 채점 */
  const isFull = W => l4Cells(W).every(([r, c]) => st.letters.get(l4Key(r, c)));
  const isRight = W => l4Cells(W).every(([r, c], i) => st.letters.get(l4Key(r, c)) === W.w[i]);
  function solve(W, popup){
    st.solved.add(W);
    l4Cells(W).forEach(([r, c]) => st.wrong.delete(l4Key(r, c)));
    // 이 단어 덕분에 함께 완성된 단어도 자동으로 정답 처리
    L4_WORDS.forEach(X => { if(!st.solved.has(X) && isRight(X)) st.solved.add(X); });
    if(popup) l4ShowPopup(W);

  }
  function checkWord(W, quiet){
    if(!W){ toast('먼저 칸이나 열쇠를 골라 보자!'); return; }
    if(st.solved.has(W)){ fb.className = 'l4-fb ok'; fb.textContent = '✓ 이미 맞힌 단어야.'; return; }
    if(!isFull(W)){ fb.className = 'l4-fb'; fb.textContent = `아직 빈칸이 있어. ${W.w.length}글자를 모두 채워 보자.`; return; }
    if(isRight(W)){

    }else{
      l4Cells(W).forEach(([r, c], i) => { const k = l4Key(r, c); if(st.letters.get(k) !== W.w[i]) st.wrong.add(k); });
      fb.className = 'l4-fb ng'; fb.textContent = '✗ 아쉬워! ✗ 표시된 칸을 다시 생각해 보자. 교차하는 단어를 먼저 풀면 도움이 돼.';

    if(st.hints >= L4_HINT_MAX){ toast(`한 글자 힌트는 ${L4_HINT_MAX}번까지만 쓸 수 있어!`); return; }
    const target = l4Cells(W).map(([r, c], i) => ({ k:l4Key(r, c), ch:W.w[i] })).find(o => st.letters.get(o.k) !== o.ch);
    if(!target) return;
    startTimer();
    st.letters.set(target.k, target.ch); st.hinted.add(target.k); st.wrong.delete(target.k); st.hints++;

    L4_WORDS.forEach(W => {
      if(st.solved.has(W)){ right++; return; }

      const any = l4Cells(W).some(([r, c]) => st.letters.get(l4Key(r, c)));

    fb.innerHTML = right === L4_WORDS.length ? '🎉 전부 정답!' : `📋 ${L4_WORDS.length}개 중 <b>${right}개</b> 정답 · 다시 볼 단어 ${wrongWords}개 · 빈 단어 ${empty}개`;

    clearTimeout(resetTimer); resetArmed = false; btn.textContent = '↺ 다시 하기'; btn.classList.remove('armed');
    clearInterval(st.timer);
    Object.assign(st, { letters:new Map(), solved:new Set(), hinted:new Set(), wrong:new Set(), sel:null, cur:null, hints:0, start:0, elapsed:0, timer:null, done:false });
    $('.l4-time', container).textContent = '00:00'; $('.l4-done', container).hidden = true;

    celebrate(); completeLesson('lesson-4');

    const a = b.dataset.a;

    if(a === 'check') b.addEventListener('click', () => { commit(); checkWord(st.sel); });

  });
  // 다른 학습으로 넘어가면 팝업 닫기
  document.addEventListener('click', e => {
    if(e.target.closest && e.target.closest('.nav-item, .pager .btn, .quiz-actions .btn'))

  });

  render();
}

/* =====================================================================
   5. 기둥의 부피 (lesson-5) — 활동 ①→②→③→④ 단계형
   ---------------------------------------------------------------------
   ① 직육면체의 부피(단위 정육면체 쌓기)         → l5Act1()
   ② 직육면체를 나누어 삼각기둥의 부피 구하기    → l5Act2()
   ③ 각기둥을 삼각기둥으로 나누어 부피 구하기    → l5Act3()
   ④ 밑면을 쌓아 각기둥의 부피 구하기(+원기둥)  → l5Act4()
   정리 카드·예제 따라 하기                      → l5ConceptHTML(), l5SetupExamples()
   단계 진행 저장: safeStorage 'ipche-l5-steps'
   ===================================================================== */
const L5_KEY = 'ipche-l5-steps';
const L5_COLORS = ['#FFB74D', '#4FC3F7', '#AED581', '#F48FB1', '#BA68C8', '#4DB6AC', '#FFD54F', '#90A4AE'];

/* ---------- 공통 도우미 ---------- */
/** 밑면 다각형(xz 좌표 [[x,z],...])으로 기둥의 면 목록 만들기 */
function l5PrismFaces(T, pts, y0, y1){
  const B = pts.map(p => new T.Vector3(p[0], y0, p[1])), U = pts.map(p => new T.Vector3(p[0], y1, p[1]));
  const faces = [B.slice().reverse(), U.slice()];
  for(let i=0;i<pts.length;i++){ const j = (i + 1) % pts.length; faces.push([B[i], B[j], U[j], U[i]]); }
  return faces;
}
function l5Solid(T, faces, color, opacity=0.92){
  const g = l1Geometry(T, faces).geometry;
  const m = new T.Mesh(g, new T.MeshPhongMaterial({ color, flatShading:true, side:T.DoubleSide, transparent:opacity < 1, opacity, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }));
  m.add(new T.LineSegments(new T.EdgesGeometry(g, 10), new T.LineBasicMaterial({ color:0x2B3A55 })));
  return m;
}
/** 교과서처럼 길이 표시: 선분 양 끝을 잇는 점선 호 + 길이 (off: 선분에서 바깥쪽으로 띄울 거리, 부호로 방향) */
function svgDim(x1, y1, x2, y2, off, label, lab=12){
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;                       // 선분의 법선
  const cx = mx + nx * off * 2, cy = my + ny * off * 2;   // 2차 곡선의 조절점 → 꼭대기는 off만큼
  const tx = mx + nx * (off + Math.sign(off) * lab), ty = my + ny * (off + Math.sign(off) * lab) + 5;
  return `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="#5C6B8A" stroke-width="1.3" stroke-dasharray="2 3"/>`
    + `<text x="${tx}" y="${ty}" class="dim dimv">${label}</text>`;
}
/** 3D 화면 아래 관찰 버튼 줄에 [↺ 초기화] 버튼 넣기 (data-a로 기존 동작을 그대로 연결) */
function l5InitBtn(holder, a, label='↺ 초기화'){
  const b = el('button', { class:'tool-btn l5-init', type:'button', 'data-a':a }, label);
  const tb = $('.viewer-toolbar', holder); (tb || holder).appendChild(b); return b;
}
/** 정리 카드 */
function l5Card(title, html){ return `<div class="concept-box l5-sum"><span class="concept-title">📌 ${title}</span>${html}</div>`; }
const l5Ease = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;

/* ---------- 학습 목표 / 생각 열기 / 정리 HTML ---------- */
function l5GoalHTML(){
  return `<div class="concept-box dashed" style="margin-top:6px"><span class="concept-title">🎯 이번 시간의 목표</span>

async function l5Act1(body, done){
  body.classList.add('l5-a1');
  body.innerHTML = `
    <p class="lead l5-lead l5-a1-lead">한 모서리가 1 cm인 정육면체 블럭의 부피는 <b>1 cm³</b>이랍니다. 부피가 1 cm³인 블럭으로 직육면체를 채워 부피를 구해 봅시다.</p>
    <div class="l0-gal-grid">
      <div><div class="l5-a1-v"></div></div>
      <div class="l0-side">
        <div class="l1-big l5-name l5-a1-name" aria-live="polite">1 × 1 × 1 = 1개</div>
        <div class="l5-a1-sl"></div>
        <div class="sim-row l5-a1-btns"><button class="btn primary" type="button" data-a="play">한 층씩 쌓기</button></div>
        <div class="l5-count" aria-live="polite"></div>
      </div>
    </div>
    <div class="l5-out"></div>`;
  const st = { a:1, b:1, c:1, shown:-1, t:0, playing:false };
  const cnt = $('.l5-count', body), out = $('.l5-out', body), nameEl = $('.l5-a1-name', body);
  const sl = ['a', 'b', 'c'].map((k, i) => createSlider({ label:['가로', '세로', '높이'][i], min:1, max:6, step:1, value:st[k], unit:' cm', onInput:v => { st[k] = v; st.playing = false; st.shown = -1; build(); } }));
  sl.forEach(s => $('.l5-a1-sl', body).appendChild(s.el));
  const viewer = await create3DViewer($('.l5-a1-v', body), { showInfo:false, tools:['autoRotate', 'reset'] });
  l5InitBtn($('.l5-a1-v', body), 'init');
  let mesh = null, frame = null, grp = null, labs = [];
  const T = viewer.ok ? viewer.THREE : null, H = T ? l1H(T) : null;
  if(T){ viewer.resetView(); grp = new T.Group(); viewer.extras.add(grp);
    mesh = new T.InstancedMesh(new T.BoxGeometry(0.9, 0.9, 0.9), new T.MeshPhongMaterial({ color:0xffffff }), 216); grp.add(mesh); }
  function total(){ return st.a * st.b * st.c; }
  function build(){
    const { a, b, c } = st;
    if(T){
      const m = new T.Matrix4(), col = new T.Color(); let i = 0;
      for(let k=0;k<c;k++) for(let j=0;j<b;j++) for(let x=0;x<a;x++){
        m.makeTranslation(x - (a - 1) / 2, k - (c - 1) / 2, j - (b - 1) / 2); mesh.setMatrixAt(i, m);
        col.set(k === 0 ? '#FFB300' : L5_COLORS[1 + (k % 6)]); mesh.setColorAt(i, col); i++;
      }
      mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
      mesh.count = st.shown < 0 ? total() : st.shown;
      const s = 2.6 / 6; grp.scale.setScalar(s);   // 크기를 바꿔도 블럭 크기(비율)는 그대로 — 확대·축소는 3D 화면에서
      if(frame){ grp.remove(frame); l1Dispose(frame); }
      frame = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(a, c, b)), new T.LineBasicMaterial({ color:0x2B3A55 })); grp.add(frame);
      labs.forEach(l => { grp.remove(l); l1Dispose(l); }); labs = [];
      const l1 = H.label2(`한 층 = ${a}×${b} = ${a*b}개`, new T.Vector3(0, -c / 2 - 0.55, b / 2 + 0.2), 0.75); l1.scale.divideScalar(s);
      const l2 = H.label2(`${c}층`, new T.Vector3(a / 2 + 0.7, 0, b / 2), 0.75); l2.scale.divideScalar(s);
      labs = [l1, l2]; grp.add(l1, l2);
      viewer.requestRender();
    }
    count();
  }
  function count(){
    const { a, b, c } = st, n = st.shown < 0 ? total() : st.shown, layer = Math.min(c, Math.ceil(n / (a * b)) || 0);
    cnt.innerHTML = `<div class="l5-row"><span>한 층에 놓인 개수</span><b>${a} × ${b} = ${a*b}개</b><em>밑넓이 ${a*b} cm²</em></div>
      <div class="l5-row"><span>층의 수</span><b>${st.shown < 0 ? c : layer}층</b><em>높이 ${c} cm</em></div>
      <div class="l5-row big"><span>쌓인 정육면체</span><b>${n}개</b><em>부피 ${n} cm³</em></div>`;
    nameEl.textContent = st.playing ? `${layer}층 쌓는 중… (${n}개)` : `${a} × ${b} × ${c} = ${total()}개`;
  }
  if(T){
    viewer.onFrame(dt => {
      if(!st.playing) return false;
      st.t += dt; const per = Math.max(0.02, 0.5 / (st.a * st.b));
      const n = Math.min(total(), Math.floor(st.t / per));
      if(n !== st.shown){ st.shown = n; mesh.count = n; count(); }
      if(n >= total()){ st.playing = false; st.shown = -1; count(); finish(); }
      return true;
    });
  }
  function finish(){
    const { a, b, c } = st;
    out.innerHTML = l5Card('직육면체의 부피', `
      <p>한 층에 놓인 정육면체의 개수는 <b>밑넓이</b>와 같고, 층의 수는 <b>높이</b>와 같아.</p>
      <p class="l5-big">(직육면체의 부피) $=$ (가로) $\\times$ (세로) $\\times$ (높이) $=$ (밑넓이) $\\times$ (높이)</p>

    renderMath(out); done();
  }
  $('[data-a="init"]', body).addEventListener('click', () => {
    st.playing = false; st.shown = -1; ['a', 'b', 'c'].forEach(k => { st[k] = 1; }); sl.forEach(x => x.set(1));

  });
  $('[data-a="play"]', body).addEventListener('click', () => {
    if(!T){ finish(); return; }
    st.shown = 0; st.t = 0; st.playing = true; mesh.count = 0; viewer.requestRender();
  });
  build();
}

  const LINES = [

  const st = { phase:'whole', t:0, nl:0 };
  const viewer = await create3DViewer($('.l5-a2-v', body), { showInfo:false, tools:['autoRotate', 'reset'] });
  l5InitBtn($('.l5-a2-v', body), 'reset');
  const T = viewer.ok ? viewer.THREE : null, HH2 = T ? l1H(T) : null;
  const W = 2.0, D = 1.5, Hh = 1.0;          // 화면 크기 (실제 길이: 가로 4 cm, 세로 3 cm, 높이 2 cm)
  const LEN = { a:4, b:3, c:2 };
  let hl = null;                              // 식 한 줄씩 보기와 연동되는 표시
  let A = null, Bp = null, Bc = null, knife = null, dirA = null;
  if(T){
    viewer.resetView();
    const triA = [[-W/2, -D/2], [W/2, -D/2], [W/2, D/2]], triB = [[-W/2, -D/2], [W/2, D/2], [-W/2, D/2]];
    A = l5Solid(T, l5PrismFaces(T, triA, -Hh/2, Hh/2), '#F48FB1');
    Bp = new T.Group(); Bc = l5Solid(T, l5PrismFaces(T, triB, -Hh/2, Hh/2), '#F8BBD0'); Bp.add(Bc);
    viewer.extras.add(A, Bp);
    const cA = new T.Vector3((triA[0][0] + triA[1][0] + triA[2][0]) / 3, 0, (triA[0][1] + triA[1][1] + triA[2][1]) / 3);
    dirA = cA.normalize();
    knife = new T.Mesh(new T.PlaneGeometry(Math.hypot(W, D) * 1.15, Hh * 2.2), new T.MeshBasicMaterial({ color:0x1E88E5, transparent:true, opacity:0.25, side:T.DoubleSide, depthWrite:false }));

  const SEP = 0.45;
  function pose(){
    if(!T) return;

      // 들어 올리기 → 반 바퀴 돌리기 → 내려놓기 (원점을 지나는 세로축으로 180° 돌리면 다른 조각과 정확히 겹친다)

  const MSG2 = {
    whole:'밑면의 대각선을 포함하는 평면으로 잘라 보자.',
    cutting:'자르는 중…',
    cut:'직육면체가 <b>삼각기둥 2개</b>로 나뉘었어. [⚖️ 부피 비교]를 눌러 한 조각을 돌려 겹쳐 보자!',
    flipping:'한 조각을 들어 올려 반 바퀴 돌리는 중…',
    flipped:'🎉 두 조각이 <b>완전히 겹쳐!</b> 모양과 크기가 같은 삼각기둥이니까 하나의 부피는 직육면체 부피의 $\\dfrac{1}{2}$이야. [삼각기둥 부피식 한 줄씩 보기]를 눌러 보자.',
  };
  /* 안내 글상자 높이: 가장 긴 글이 들어가는 높이로 고정 */
  function fitMsg2(){
    if(!msg.offsetWidth) return;
    const cur = msg.innerHTML; msg.style.height = 'auto'; let mx = 0;
    Object.values(MSG2).forEach(h => { msg.innerHTML = h; renderMath(msg); mx = Math.max(mx, msg.offsetHeight); });

  }
  if(window.ResizeObserver){ let lw = 0, raf = 0; new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if(!w || w === lw) return; lw = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(fitMsg2); }).observe(msg.parentElement); }
  /* 식 한 줄씩 보기 ↔ 3D 화면 표시 */
  function showLine(k){
    if(!T) return;
    if(hl){ viewer.extras.remove(hl); l1Dispose(hl); }
    hl = new T.Group(); hl.position.copy(A.position); viewer.extras.add(hl);
    const H = HH2, y0 = -Hh / 2, y1 = Hh / 2, { a, b, c } = LEN;
    const V = (x, y, z) => new T.Vector3(x, y, z);
    const lab = (t, p, sc=0.62) => hl.add(H.label2(t, p, sc));
    const heightMark = () => { const x = W / 2 + 0.02, z = D / 2 + 0.02; hl.add(H.tube2(V(x, y0, z), V(x, y1, z), 0.025, '#3949AB', false)); lab(`높이 ${c} cm`, V(x + 0.62, y1 - 0.12, z)); };
    if(k === 1){
      const box = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(W, Hh, D)), new T.LineDashedMaterial({ color:0x5C6B8A, dashSize:0.08, gapSize:0.06 }));

      lab(`삼각기둥 ${a * b * c / 2} cm³`, V(W / 4, 0.05, -D / 6), 0.6);
    }else if(k === 2){
      hl.add(H.polyMesh([V(-W/2, y0, -D/2), V(W/2, y0, -D/2), V(W/2, y0, D/2), V(-W/2, y0, D/2)], '#FF7043', 0.6, false, 0.01));
      lab(`직육면체의 밑넓이 ${a}×${b} = ${a * b} cm²`, V(0, y0 - 0.32, D / 2), 0.6);
      lab(`½ × ${a * b} = ${a * b / 2} cm²`, V(0, y0 - 0.62, D / 2), 0.6);
      heightMark();
    }else if(k === 3){
      hl.add(H.polyMesh([V(-W/2, y0, -D/2), V(W/2, y0, -D/2), V(W/2, y0, D/2)], '#FF7043', 0.75, false, 0.01));
      lab(`삼각기둥의 밑넓이 ${a * b / 2} cm²`, V(W / 6, y0 - 0.42, -D / 6), 0.62);
      heightMark();

  function ui(){

/* =====================================================================
   ③ 각기둥을 삼각기둥으로 나누어 부피 구하기
   ===================================================================== */
async function l5Act3(body, done){
  body.innerHTML = `
    <p class="lead l5-lead">각기둥을 여러 개의 삼각기둥으로 나누어 각기둥의 부피를 구해 봅시다.</p>
    <div class="l0-gal-grid">
      <div><div class="l5-a3-v"></div></div>
      <div class="l0-side">
        <div class="l1-big l5-name l5-a3-name" aria-live="polite">사각기둥</div>
        <div class="l5-top2d"><b>⬇️ 밑면을 위에서 본 모양</b><div class="l5-a3-svg"></div><p class="l5-a3-eq" aria-live="polite"></p></div>
        <div class="l5-a3-sl"></div>
        <div class="sim-row l5-btnrow"><button class="btn" type="button" data-a="join">🧲 합치기</button><button class="btn primary" type="button" data-a="split">✂️ 나누기</button></div>
      </div>
    </div>
    <div class="l5-out"></div>`;
  const st = { n:4, u:0, target:0, didSplit:false };
  const out = $('.l5-out', body), nameEl = $('.l5-a3-name', body);
  const slider = createSlider({ label:'밑면의 변의 수', min:4, max:8, step:1, value:4, format:v => `${v} (${L1_POLYGON[v]})`, onInput:v => { st.n = v; st.u = st.target = 0; build(); } });
  $('.l5-a3-sl', body).appendChild(slider.el);
  const viewer = await create3DViewer($('.l5-a3-v', body), { showInfo:false, tools:['autoRotate', 'reset'] });
  const T = viewer.ok ? viewer.THREE : null;
  let pieces = [];
  if(T) viewer.resetView();
  const R = 1.25, Hh = 1.4;
  function tris(){ const g = l1Ngon(null, st.n, R); return { pts:g.pts, list:Array.from({length:st.n - 2}, (_, i) => [g.pts[0], g.pts[i + 1], g.pts[i + 2]]) }; }
  function build(){
    const { pts, list } = tris();
    nameEl.textContent = `${L0_POLY[st.n]}기둥` + (st.u > 0 ? ` → 삼각기둥 ${st.n - 2}개` : '');
    if(T){
      pieces.forEach(p => { viewer.extras.remove(p.m); l1Dispose(p.m); }); pieces = [];
      const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cz = pts.reduce((s, p) => s + p[1], 0) / pts.length;
      list.forEach((t, i) => {
        const m = l5Solid(T, l5PrismFaces(T, t, -Hh/2, Hh/2), '#90CAF9');
        const gx = (t[0][0] + t[1][0] + t[2][0]) / 3 - cx, gz = (t[0][1] + t[1][1] + t[2][1]) / 3 - cz, L = Math.hypot(gx, gz) || 1;
        viewer.extras.add(m); pieces.push({ m, dir:new T.Vector3(gx / L, 0, gz / L), color:L5_COLORS[i % L5_COLORS.length] });
      });
      pose();
    }
    draw2D();
  }
  function pose(){
    if(!T) return;
    const e = l5Ease(st.u);
    pieces.forEach(p => {
      p.m.position.copy(p.dir).multiplyScalar(0.35 * e);
      p.m.material.color.set(e > 0.02 ? p.color : '#90CAF9');
    });
    viewer.requestRender();
  }
  /* 설명 글 높이: 가장 긴 글(팔각형을 나눈 경우)에 맞춰 고정 */
  const eqText = (n, u) => {
    if(!(u > 0)) return '[나누기]를 누르면 한 꼭짓점에서 그은 대각선으로 밑면이 삼각형으로 나뉘어.';
    const sum = Array.from({ length:n - 2 }, (_, i) => `S_${i + 1}`).join(' + ');
    return `$$\\begin{aligned}\\textbf{(밑넓이)} &= (\\text{${L1_POLYGON[n]}의 넓이})\\\\ &= ${sum}\\end{aligned}$$<span class="l0-muted">빨간 점(한 꼭짓점)에서 그은 대각선으로 삼각형 ${n - 2}개가 생겼어.</span>`;
  };
  function fitEq(){
    const eq = $('.l5-a3-eq', body); if(!eq.offsetWidth) return;
    const cur = eq.innerHTML; eq.style.minHeight = '0'; let mx = 0;
    [eqText(8, 1), eqText(4, 0)].forEach(h => { eq.innerHTML = h; renderMath(eq); mx = Math.max(mx, eq.offsetHeight); });
    eq.innerHTML = cur; eq.style.minHeight = mx + 'px';
  }
  if(window.ResizeObserver){ let lw = 0, raf = 0; new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if(!w || w === lw) return; lw = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(fitEq); }).observe($('.l5-top2d', body)); }
  function draw2D(){
    const { pts, list } = tris(), S = 220, k = 75, c = S / 2;
    const P = p => `${c + p[0] * k},${c + p[1] * k}`;
    const sub = i => '₁₂₃₄₅₆'[i];
    let h = `<svg viewBox="0 0 ${S} ${S}" class="l3-svg" role="img" aria-label="밑면을 삼각형으로 나눈 그림">`;
    list.forEach((t, i) => {
      h += `<polygon points="${t.map(P).join(' ')}" fill="${st.u > 0 ? L5_COLORS[i % L5_COLORS.length] : '#BBDEFB'}" stroke="#2B3A55" stroke-width="1.5" opacity=".9"/>`;
      const gx = (t[0][0] + t[1][0] + t[2][0]) / 3, gz = (t[0][1] + t[1][1] + t[2][1]) / 3;
      if(st.u > 0) h += `<text x="${c + gx * k}" y="${c + gz * k + 5}" class="lab" text-anchor="middle">S${sub(i)}</text>`;
    });
    h += `<polygon points="${pts.map(P).join(' ')}" fill="none" stroke="#0D47A1" stroke-width="3"/><circle cx="${c + pts[0][0] * k}" cy="${c + pts[0][1] * k}" r="4" fill="#D32F2F"/></svg>`;
    $('.l5-a3-svg', body).innerHTML = h;
    $('.l5-a3-eq', body).innerHTML = eqText(st.n, st.u); renderMath($('.l5-a3-eq', body));
  }
  if(T){
    viewer.onFrame(dt => {
      if(st.u === st.target) return false;
      const s = L0_REDUCED_MOTION ? 1 : dt / 0.9;
      st.u = st.target > st.u ? Math.min(st.target, st.u + s) : Math.max(st.target, st.u - s);
      pose(); if(st.u === 1 || st.u === 0){ draw2D(); nameEl.textContent = `${L0_POLY[st.n]}기둥` + (st.u > 0 ? ` → 삼각기둥 ${st.n - 2}개` : ''); if(st.u === 1) finish(); }
      return true;
    });
  }
  function finish(){
    if(st.didSplit) return; st.didSplit = true;
    out.innerHTML = l5Card('각기둥의 부피', `
      <p>각기둥은 한 꼭짓점에서 그은 대각선으로 높이가 같은 삼각기둥 여러 개로 나눌 수 있어.</p>
      <p class="l5-big">(각기둥의 부피) $=$ (삼각기둥 부피의 합) $=$ (삼각형 넓이의 합) $\\times$ (높이) $=$ (밑넓이) $\\times$ (높이)</p>`);
    renderMath(out); done();
  }
  $('[data-a="split"]', body).addEventListener('click', () => { st.target = 1; if(!T){ st.u = 1; draw2D(); finish(); } viewer.requestRender && viewer.requestRender(); });
  $('[data-a="join"]', body).addEventListener('click', () => { st.target = 0; if(!T){ st.u = 0; draw2D(); } viewer.requestRender && viewer.requestRender(); });
  build();
}

  const [viewer, cview] = await Promise.all([
    create3DViewer($('.l5-a4-v', body), { showInfo:false, tools:['autoRotate', 'reset'] }),
    create3DViewer($('.l5-a4-cv', cylBody), { showInfo:false, tools:['autoRotate', 'reset', 'transparent'] }),
  ]);
  l5InitBtn($('.l5-a4-v', body), 'clear');
  const T = viewer.ok ? viewer.THREE : null;
  let plates = null, ghost = null;
  const scaleG = 0.75;
  if(T){ viewer.resetView(); plates = new T.Group(); plates.scale.setScalar(scaleG); viewer.extras.add(plates); }
  const radiusFor = n => n ? Math.sqrt(2 * AREA / (n * Math.sin(2 * Math.PI / n))) : Math.sqrt(AREA / Math.PI);
  function plateGeo(){
    const n = st.shape, r = radiusFor(n);
    const g = new T.CylinderGeometry(r, r, THICK * 0.9, n || 64, 1);
    if(n === 4) g.rotateY(Math.PI / 4);
    return g;
  }
  function build(){
    st.n = 0; st.auto = false;
    if(T){
      plates.children.slice().forEach(o => { plates.remove(o); l1Dispose(o); });
      const geo = plateGeo();
      ghost = new T.Mesh(new T.CylinderGeometry(radiusFor(st.shape), radiusFor(st.shape), MAXN * THICK, st.shape || 64, 1, true).rotateY(st.shape === 4 ? Math.PI / 4 : 0),
        new T.MeshBasicMaterial({ color:0x90A4AE, wireframe:true, transparent:true, opacity:0.18 }));
      ghost.position.y = MAXN * THICK / 2 - 1.5; plates.add(ghost);
      plates.userData.geo = geo;
      viewer.requestRender();
    }
    count();
  }
  function addPlate(){
    if(st.n >= MAXN) return false;
    if(T){
      const m = new T.Mesh(plates.userData.geo, new T.MeshPhongMaterial({ color:L5_COLORS[st.n % 2 ? 1 : 6], flatShading:st.shape !== 0 }));
      m.position.y = -1.5 + THICK * (st.n + 0.5); plates.add(m); viewer.requestRender();
    }
    st.n++; count();
    if(st.n >= MAXN && !st.stacked){ st.stacked = true; check(); }
    return true;
  }
  function count(){
    const h = +(st.n * THICK).toFixed(1), V = +(AREA * h).toFixed(1);
    const sname = st.shape ? L1_POLYGON[st.shape] : '원';
    if(nameEl) nameEl.textContent = st.n >= MAXN ? `${sname} 밑면의 기둥 완성!` : `${sname} 판 ${st.n}장`;
    $('.l5-a4-count', body).innerHTML = `<div class="l5-row"><span>밑넓이 (${sname})</span><b>${AREA} cm²</b><em>판 한 장의 두께 ${THICK} cm</em></div>
      <div class="l5-row"><span>쌓은 높이</span><b>${st.n}장 → ${h} cm</b></div>
      <div class="l5-row big"><span>부피</span><b>${AREA} × ${h} = ${V} cm³</b></div>`;
    // 높이-부피 그래프(비례)
    const W = 240, Hc = 120, px = x => 30 + x / (MAXN * THICK) * (W - 40), py = y => Hc - 20 - y / (AREA * MAXN * THICK) * (Hc - 30);
    const ptsAll = Array.from({length:st.n + 1}, (_, i) => `${px(i * THICK)},${py(AREA * i * THICK)}`).join(' ');
    $('.l5-a4-chart', body).innerHTML = `<svg viewBox="0 0 ${W} ${Hc}" class="l3-svg" role="img" aria-label="높이에 따른 부피 그래프">
      <line x1="30" y1="${Hc - 20}" x2="${W - 6}" y2="${Hc - 20}" stroke="#9AA6BC"/><line x1="30" y1="6" x2="30" y2="${Hc - 20}" stroke="#9AA6BC"/>
      <line x1="${px(0)}" y1="${py(0)}" x2="${px(MAXN * THICK)}" y2="${py(AREA * MAXN * THICK)}" stroke="#CBD3E1" stroke-dasharray="4 3"/>
      <polyline points="${ptsAll}" fill="none" stroke="#E65100" stroke-width="3"/>
      <circle cx="${px(h)}" cy="${py(V)}" r="4" fill="#E65100"/>
      <text x="${W - 8}" y="${Hc - 6}" class="lab small" text-anchor="end">높이(cm)</text><text x="34" y="14" class="lab small">부피(cm³)</text></svg>
      <p class="l0-muted" style="margin:2px 0 0;font-size:.85rem">높이가 2배, 3배가 되면 부피도 2배, 3배가 돼. (정비례)</p>`;
  }
  if(T){
    viewer.onFrame(dt => {
      if(!st.auto) return false;
      st.t += L0_REDUCED_MOTION ? 99 : dt;
      while(st.t > 0.08){ st.t -= 0.08; if(!addPlate()){ st.auto = false; break; } }
      return true;
    });
  }
  $('[data-a="one"]', body).addEventListener('click', () => { st.auto = false; addPlate(); });
  $('[data-a="auto"]', body).addEventListener('click', () => {
    if(st.n >= MAXN) build();
    if(!T){ while(addPlate()); return; }
    st.auto = true; st.t = 0; viewer.requestRender();
  });
  $('[data-a="clear"]', body).addEventListener('click', build);

  /* 원기둥 확장 */
  const r = 1.1, hc = 2.0;
  const csl = createSlider({ label:'각기둥 밑면의 변의 수', min:3, max:60, step:1, value:6, onInput:v => { st.cn = v; drawCyl(); } });
  $('.l5-a4-csl', cylBody).appendChild(csl.el);
  let cylMesh = null, prismMesh = null;
  if(cview.ok){
    const CT = cview.THREE; cview.resetView();
    cylMesh = new CT.Mesh(new CT.CylinderGeometry(r, r, hc, 96, 1), new CT.MeshPhongMaterial({ color:'#BBDEFB', transparent:true, opacity:0.28, depthWrite:false, side:CT.DoubleSide }));
    cylMesh.add(new CT.LineSegments(new CT.EdgesGeometry(new CT.CylinderGeometry(r, r, hc, 96, 1), 30), new CT.LineBasicMaterial({ color:0x1565C0 })));
    cview.extras.add(cylMesh);
  }
  function drawCyl(){
    const n = st.cn, Sn = n / 2 * r * r * Math.sin(2 * Math.PI / n), Sc = Math.PI * r * r, pct = Sn / Sc * 100;
    if(cview.ok){
      const CT = cview.THREE;
      if(prismMesh){ cview.extras.remove(prismMesh); l1Dispose(prismMesh); }
      const g = new CT.CylinderGeometry(r * 0.999, r * 0.999, hc * 0.999, n, 1);
      prismMesh = new CT.Mesh(g, new CT.MeshPhongMaterial({ color:'#FFB74D', flatShading:true }));
      prismMesh.add(new CT.LineSegments(new CT.EdgesGeometry(g, 10), new CT.LineBasicMaterial({ color:0x8D3B1F, transparent:true, opacity:n > 30 ? 0.25 : 0.8 })));
      cview.extras.add(prismMesh); cview.requestRender();
    }
    $('.l5-a4-cname', cylBody).textContent = n >= 30 ? `정${n}각기둥 ≈ 원기둥` : `정${n}각기둥`;
    $('.l5-a4-ccount', cylBody).innerHTML = `<div class="l5-row"><span>정${n}각형 밑넓이</span><b>${Sn.toFixed(3)}</b></div>
      <div class="l5-row"><span>원의 넓이 (πr²)</span><b>${Sc.toFixed(3)}</b></div>
      <div class="l5-row big"><span>원 넓이에 대한 비율</span><b>${pct.toFixed(1)}%</b></div>`;
    if(n >= 30 && !st.cyl){ st.cyl = true; check(); }
  }
  function check(){
    const cout = $('.l5-cout', cylBody);
    if(st.cyl && !cout.innerHTML){
      cout.innerHTML = l5Card('원기둥의 부피', `
        <p>밑면의 변의 수를 늘리면 각기둥이 원기둥에 가까워져. 그래서 원기둥의 부피도 (밑넓이) × (높이)로 구할 수 있어.<br>밑면인 원의 반지름을 $r$, 원기둥의 높이를 $h$라고 할 때,</p>
        <p class="l5-big" style="margin-bottom:0">(원기둥의 부피) $=$ (밑넓이) $\\times$ (높이) $= \\pi r^2 h$</p>`);
      renderMath(cout); body._cylDone && body._cylDone();
    }
    if(st.stacked && !out.innerHTML){
      out.innerHTML = l5Card('기둥의 부피', `
        <p>밑면 모양의 얇은 판을 높이만큼 쌓으면 기둥이 돼. 밑면 모양과 관계없이 기둥의 부피는 밑넓이에 높이를 곱한 것과 같아.</p>
        <p class="l5-big" style="margin-bottom:0">(기둥의 부피) $=$ (밑넓이) $\\times$ (높이)</p>`);
      renderMath(out); done();
    }
  }
  build(); drawCyl(); check();
}

/* ---------- 그릇 모양 만들기 (단위: cm) ---------- */
const L6_N = { tri:3, sq:4, pent:5 };
/** 3D 화면 이름표: 분수(교과서 수식 글자체). de가 1이면 정수 */
function l6FracLabel(T, nu, de, pos, scale=1){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const one = de === 1, w = one ? 64 : 72, h = one ? 64 : 116;
  c.width = w; c.height = h;
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = '#1F2A44'; ctx.lineWidth = 5;
  const r = 16; ctx.beginPath(); ctx.moveTo(r, 3); ctx.lineTo(w - r, 3); ctx.quadraticCurveTo(w - 3, 3, w - 3, r); ctx.lineTo(w - 3, h - r); ctx.quadraticCurveTo(w - 3, h - 3, w - r, h - 3);
  ctx.lineTo(r, h - 3); ctx.quadraticCurveTo(3, h - 3, 3, h - r); ctx.lineTo(3, r); ctx.quadraticCurveTo(3, 3, r, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1F2A44'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '44px "Times New Roman", Times, "Nimbus Roman", "Liberation Serif", serif';
  if(one) ctx.fillText(String(nu), w / 2, h / 2 + 2);
  else { ctx.fillText(String(nu), w / 2, 32); ctx.fillRect(16, h / 2 - 2, w - 32, 4); ctx.fillText(String(de), w / 2, h - 30); }
  const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace;
  const sm = new T.SpriteMaterial({ map:tex, transparent:true, depthTest:false, depthWrite:false }); sm.userData.base = 1;
  const sp = new T.Sprite(sm); sp.position.copy(pos); sp.scale.set(0.3 * w / 64 * scale, 0.3 * h / 64 * scale, 1); sp.renderOrder = 30;
  return sp;
}
function l6Shapes(T, kind, size, h){
  const n = L6_N[kind], seg = n || 64, R = n ? size / (2 * Math.sin(Math.PI / n)) : size;   // 각뿔: size = 밑면의 한 변, 원뿔: size = 반지름
  const fix = g => (kind === 'sq' ? g.rotateY(Math.PI / 4) : g);
  return {
    R, seg, area:n ? n * size * size / (4 * Math.tan(Math.PI / n)) : Math.PI * size * size,
    prismShell:() => fix(new T.CylinderGeometry(R, R, h, seg, 1, true).translate(0, h / 2, 0)),
    prismBottom:() => fix(new T.CircleGeometry(R, seg).rotateX(-Math.PI / 2)),
    pyrShell:() => fix(new T.ConeGeometry(R, h, seg, 1, true).rotateX(Math.PI).translate(0, h / 2, 0)),   // 꼭짓점이 아래(원점), 위가 열린 그릇
    pyrSand:() => fix(new T.ConeGeometry(R * 0.97, h * 0.97, seg, 1).rotateX(Math.PI).translate(0, h * 0.97 / 2, 0)),
    prismSand:() => fix(new T.CylinderGeometry(R * 0.97, R * 0.97, 1, seg, 1).translate(0, 0.5, 0)),
  };
}
const l6Glass = T => new T.MeshPhongMaterial({ color:'#B3E5FC', transparent:true, opacity:0.22, side:T.DoubleSide, depthWrite:false, shininess:80 });
const l6SandMat = T => new T.MeshPhongMaterial({ color:'#E0B062', flatShading:false, shininess:10 });
function l6Edges(T, g, color=0x01579B){ return new T.LineSegments(new T.EdgesGeometry(g, 30), new T.LineBasicMaterial({ color })); }

  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T); viewer.resetView();

  const S = l6Shapes(T, 'sq', 4, 6);
  const pyr = new T.Mesh(new T.ConeGeometry(S.R, 6, 4, 1).rotateY(Math.PI / 4).translate(0, 3, 0), new T.MeshPhongMaterial({ color:'#F48FB1', transparent:true, opacity:0.7, flatShading:true }));
  pyr.add(l6Edges(T, pyr.geometry, 0x880E4F)); pyr.position.set(-3.4, -3, 0);
  const pri = new T.Mesh(new T.CylinderGeometry(S.R, S.R, 6, 4, 1).rotateY(Math.PI / 4).translate(0, 3, 0), new T.MeshPhongMaterial({ color:'#81D4FA', transparent:true, opacity:0.55, flatShading:true }));
  pri.add(l6Edges(T, pri.geometry)); pri.position.set(3.4, -3, 0);

/* =====================================================================
   기둥과 뿔의 부피 비교 (모래 붓기) ★
   ===================================================================== */
async function l6SetupPour(wrap){
  wrap.innerHTML = `
    <div class="l6-tabs" role="tablist" aria-label="도형 고르기">
      ${[['tri', '삼각뿔'], ['sq', '사각뿔'], ['pent', '오각뿔'], ['circ', '원뿔']].map(([k, t], i) => `<button class="btn l6-tab" role="tab" type="button" aria-selected="${i === 1}" data-k="${k}">${t}</button>`).join('')}
    </div>
    <div class="l0-gal-grid">
      <div><div class="l6-pour-v"></div><div class="l6-bars"></div></div>
      <div class="l0-side l6-side">
        <div class="l0-note l6-msg" aria-live="polite"></div>
        <div class="l1-big l6-countbox" aria-live="polite">부은 횟수 <b class="l6-cnt">0</b>번</div>
        <div class="l6-sliders"></div>
        <div class="sim-row l6-pbtns"><button class="btn primary" type="button" data-a="fill">⏳ 뿔에 모래 채우기</button><button class="btn primary" type="button" data-a="pour" disabled>🫗 기둥에 붓기</button></div>
      </div>
    </div>`;
  const st = { kind:'sq', size:4, h:6, count:0, pyrK:0, level:0, phase:'idle', t:0, from:0 };
  const msg = $('.l6-msg', wrap), countEl = $('.l6-cnt', wrap);
  const btnFill = $('[data-a="fill"]', wrap), btnPour = $('[data-a="pour"]', wrap);
  const slBox = $('.l6-sliders', wrap);
  function sliders(){
    slBox.innerHTML = '';
    const a = st.kind !== 'circ'
      ? createSlider({ label:'밑면의 한 변의 길이', min:2, max:6, step:0.5, value:st.size, unit:' cm', onInput:v => { st.size = v; build(); } })
      : createSlider({ label:'밑면의 반지름', min:1, max:3, step:0.25, value:st.size, unit:' cm', onInput:v => { st.size = v; build(); } });
    const b = createSlider({ label:'높이', min:3, max:8, step:0.5, value:st.h, unit:' cm', onInput:v => { st.h = v; build(); } });
    slBox.append(a.el, b.el);
  }
  const viewer = await create3DViewer($('.l6-pour-v', wrap), { showInfo:false, tools:['autoRotate', 'reset'] });
  l5InitBtn($('.l6-pour-v', wrap), 'empty', '↺ 모래 비우기');
  const T = viewer.ok ? viewer.THREE : null, H = T ? l1H(T) : null;
  const SC = 0.26;
  const NAME = { tri:['삼각뿔', '삼각기둥'], sq:['사각뿔', '사각기둥'], pent:['오각뿔', '오각기둥'], circ:['원뿔', '원기둥'] };
  let world, pyrG, pyrSand, prismSand, stream, prismX, pyrHome;
  if(T){ viewer.resetView(); world = new T.Group(); world.scale.setScalar(SC); world.position.y = -0.45; viewer.extras.add(world); }   // 붓는 뿔 그릇이 위로 올라가도 화면 안에
  function build(){
    st.count = 0; st.pyrK = 0; st.level = 0; st.phase = 'idle';
    if(T){
      world.children.slice().forEach(o => { world.remove(o); l1Dispose(o); });
      const S = l6Shapes(T, st.kind, st.size, st.h), y0 = -st.h / 2;
      prismX = S.R + 1.2; const pyrX = -(S.R + 1.2);
      // 기둥 그릇
      const shell = new T.Mesh(S.prismShell(), l6Glass(T)); shell.add(l6Edges(T, shell.geometry));
      const bottom = new T.Mesh(S.prismBottom(), l6Glass(T));
      const pg = new T.Group(); pg.position.set(prismX, y0, 0); pg.add(shell, bottom);
      prismSand = new T.Mesh(S.prismSand(), l6SandMat(T)); prismSand.scale.y = 0.0001; prismSand.visible = false; pg.add(prismSand);
      // 눈금 ⅓, ⅔, 1
      [[1, 3], [2, 3], [1, 1]].forEach(([nu, de], i) => {
        const y = st.h * (i + 1) / 3, x0 = S.R + 0.05;
        const line = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(x0, y, 0), new T.Vector3(x0 + 0.7, y, 0)]), new T.LineBasicMaterial({ color:0xD32F2F }));
        const lab = l6FracLabel(T, nu, de, new T.Vector3(x0 + 1.3, y, 0), 0.7); lab.scale.divideScalar(SC);
        pg.add(line, lab);
      });
      world.add(pg);
      // 뿔 그릇 (꼭짓점이 아래)
      pyrG = new T.Group(); pyrHome = new T.Vector3(pyrX, y0, 0); pyrG.position.copy(pyrHome);
      const ps = new T.Mesh(S.pyrShell(), l6Glass(T)); ps.add(l6Edges(T, ps.geometry, 0x880E4F));
      pyrSand = new T.Mesh(S.pyrSand(), l6SandMat(T)); pyrSand.scale.setScalar(0.0001); pyrSand.visible = false;
      pyrG.add(ps, pyrSand); world.add(pyrG);
      const n1 = H.label2(NAME[st.kind][0] + ' 그릇', new T.Vector3(pyrX, y0 - 1.2, 0), 0.75); n1.scale.divideScalar(SC);
      const n2 = H.label2(NAME[st.kind][1] + ' 그릇', new T.Vector3(prismX, y0 - 1.2, 0), 0.75); n2.scale.divideScalar(SC);
      world.add(n1, n2);
      stream = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 1, 8), l6SandMat(T)); stream.visible = false; world.add(stream);
      viewer.requestRender();
    }
    ui(); bars();
  }
  function bars(){
    const nn = L6_N[st.kind], S = nn ? nn * st.size * st.size / (4 * Math.tan(Math.PI / nn)) : Math.PI * st.size * st.size;
    const Vc = S * st.h, Vp = Vc / 3, approx = st.kind === 'tri' || st.kind === 'pent';
    // 정확한 값으로 표시: 나누어떨어지지 않으면 분수(…/3), 원은 π를 붙여서
    const coef = st.kind === 'sq' ? st.size * st.size * st.h : st.size * st.size * st.h;
    const num = x => +x.toFixed(4);
    const fmt = v => {
      if(approx) return `$\\approx ${num(+v.toFixed(2))}$`;
      const c = v === Vc ? coef : coef / 3, pi = st.kind === 'sq' ? '' : '\\pi';
      if(v === Vc || Math.abs(c - Math.round(c * 100) / 100) < 1e-9) return `$${num(c)}${pi}$`;
      return `$\\dfrac{${num(coef)}}{3}${pi}$`;
    };
    $('.l6-bars', wrap).innerHTML = `
      <div class="l6-bar"><span>기둥</span><div class="track"><i style="width:100%"></i><b class="seg" style="left:33.3%"></b><b class="seg" style="left:66.6%"></b></div><em>${fmt(Vc)} cm³</em></div>
      <div class="l6-bar pyr"><span>뿔</span><div class="track"><i style="width:33.33%"></i></div><em>${fmt(Vp)} cm³</em></div>
      <p class="l0-muted" style="margin:2px 0 0;font-size:.85rem">밑넓이 ${st.kind === 'sq' ? `${st.size}×${st.size} = ${+S.toFixed(2)}` : st.kind === 'circ' ? `π×${st.size}² = ${+(st.size * st.size).toFixed(4)}π` : `≈ ${S.toFixed(2)}`} cm², 높이 ${st.h} cm · 크기를 바꿔도 항상 <b>(기둥) : (뿔) $= 1 : \\dfrac{1}{3}$</b></p>`;
    renderMath($('.l6-bars', wrap));
  }
  function ui(){
    countEl.textContent = st.count;
    const busy = st.phase !== 'idle';
    btnFill.disabled = busy || st.pyrK > 0.99 || st.count >= 3;
    btnPour.disabled = busy || st.pyrK < 0.99 || st.count >= 3;
    if(st.count >= 3 && st.phase === 'idle'){
      const p = L6.pred;
      msg.innerHTML = `🎉 <b>3번</b> 부었더니 기둥이 가득 찼어!<br><b>뿔의 부피는 기둥 부피의 $\\dfrac{1}{3}$!</b><br>` +
        (p == null ? '생각 열기에서 먼저 횟수를 추측해 봐도 좋아.' : p === 3 ? `처음 추측 <b>3번</b> — ✓ 추측이 맞았어!` : `처음 추측 <b>${p}번</b> — 실제로는 <b>3번</b>이었어.`) +
        `<br><span class="l0-muted">슬라이더로 밑면의 크기와 높이를 바꿔도 항상 3번인지 확인해 보자.</span>`;
      renderMath(msg);
    }else if(st.phase === 'idle'){
      msg.innerHTML = st.pyrK > 0.99 ? '뿔 그릇에 모래가 가득 찼어. [기둥에 붓기]를 눌러 보자!' : st.count === 0 ? '[뿔에 모래 채우기]를 눌러 시작해 보자.' : `기둥에 ${st.count}번 부었어. 다시 뿔에 모래를 채워 보자.`;
    }
  }
  const ease = l5Ease;
  if(T){
    viewer.onFrame(dt => {
      if(st.phase === 'idle') return false;
      st.t += L0_REDUCED_MOTION ? 9 : dt;
      if(st.phase === 'filling'){
        const k = Math.min(1, st.t / 1.0); st.pyrK = k; pyrSand.visible = true; pyrSand.scale.setScalar(Math.max(0.0001, k));
        if(k >= 1){ st.phase = 'idle'; ui(); }
      }else if(st.phase === 'pouring'){
        const t = st.t, S = l6Shapes(T, st.kind, st.size, st.h);
        // 뿔 그릇의 입구가 기둥 그릇 윗면보다 위에 오도록 (그릇끼리 겹치지 않게)
        const th = 1.95, sn = Math.sin(th), cs = Math.cos(th);
        const My = st.h / 2 + sn * S.R + 0.35, Mx = prismX - S.R * 0.2;
        const target = new T.Vector3(Mx - st.h * sn, My - st.h * cs, 0);
        const a = ease(Math.min(1, t / 0.7)), b = Math.max(0, Math.min(1, (t - 0.7) / 1.1)), c = ease(Math.max(0, Math.min(1, (t - 1.8) / 0.7)));
        const go = a * (1 - c);
        pyrG.position.lerpVectors(pyrHome, target, go);
        pyrG.rotation.z = -th * go;
        st.pyrK = 1 - b; pyrSand.scale.setScalar(Math.max(0.0001, st.pyrK)); pyrSand.visible = st.pyrK > 0.01;
        st.level = (st.from + b) / 3; prismSand.visible = true; prismSand.scale.y = Math.max(0.0001, st.level * st.h * 0.985);
        // 모래 줄기
        if(b > 0 && b < 1){
          pyrG.updateMatrixWorld(true); world.updateMatrixWorld(true);
          const mouth = pyrG.localToWorld(new T.Vector3(0, st.h, 0)); world.worldToLocal(mouth);
          const land = new T.Vector3(prismX, -st.h / 2 + st.level * st.h, 0);
          const d = new T.Vector3().subVectors(land, mouth), L = d.length();
          stream.visible = true; stream.position.addVectors(mouth, land).multiplyScalar(0.5);
          stream.scale.set(1, L, 1); stream.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
        }else stream.visible = false;
        if(t >= 2.5){ st.phase = 'idle'; st.count = st.from + 1; pyrG.position.copy(pyrHome); pyrG.rotation.z = 0; stream.visible = false;
          if(st.count >= 3){ celebrate(); }
          ui(); }
        countEl.textContent = st.count;
      }
      return true;
    });
  }
  btnFill.addEventListener('click', () => { if(!T){ st.pyrK = 1; ui(); return; } st.phase = 'filling'; st.t = 0; ui(); viewer.requestRender(); });
  btnPour.addEventListener('click', () => {
    if(!T){ st.count++; st.pyrK = 0; ui(); return; }
    st.phase = 'pouring'; st.t = 0; st.from = st.count; ui(); msg.innerHTML = `🫗 ${st.count + 1}번째로 붓는 중… 기둥의 모래가 얼마나 올라갈까?`; viewer.requestRender();
  });
  $('[data-a="empty"]', wrap).addEventListener('click', build);
  /* 안내 글상자 높이 고정 (가장 긴 글 기준) */
  function fitMsg6(){
    if(!msg.offsetWidth) return;
    const cur = msg.innerHTML; msg.style.height = 'auto'; let mx = 0;
    ['🎉 <b>3번</b> 부었더니 기둥이 가득 찼어!<br><b>뿔의 부피는 기둥 부피의 $\\dfrac{1}{3}$!</b><br>처음 추측 <b>4번</b> — 실제로는 <b>3번</b>이었어.<br><span class="l0-muted">슬라이더로 밑면의 크기와 높이를 바꿔도 항상 3번인지 확인해 보자.</span>'].forEach(h => { msg.innerHTML = h; renderMath(msg); mx = Math.max(mx, msg.offsetHeight); });
    msg.innerHTML = cur; msg.style.height = mx + 'px';
  }
  if(window.ResizeObserver){ let lw = 0, raf = 0; new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if(!w || w === lw) return; lw = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(fitMsg6); }).observe($('.l6-side', wrap)); }
  wrap.querySelectorAll('.l6-tabs [role=tab]').forEach(t => t.addEventListener('click', () => {
    st.kind = t.dataset.k; st.size = st.kind === 'circ' ? 2 : 4;
    wrap.querySelectorAll('.l6-tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    sliders(); build();
  }));
  L6.onPred.push(() => { if(st.count >= 3) ui(); });
  sliders(); build();
}

/* ---------- 더 알아보기: 정육면체를 합동인 사각뿔 3개로 ---------- */
async function l6SetupCubeSplit(wrap){
  wrap.innerHTML = `
    <div class="l0-gal-grid">
      <div><div class="l6-cube-v"></div></div>
      <div class="l0-side">
        <div class="l0-note">정육면체의 한 꼭짓점(●)을 꼭짓점으로 하고, 그 꼭짓점과 만나지 않는 세 면을 밑면으로 하는 <b>사각뿔 3개</b>로 나눌 수 있어.
        세 사각뿔은 모두 <b>합동</b>이야. 그러니까 사각뿔 1개의 부피는 정육면체 부피의 <b>$\\dfrac{1}{3}$</b>!</div>
        <div class="l6-cube-eq">$$\\begin{aligned}&(\\text{사각뿔 1개의 부피})\\\\ &\\quad= \\dfrac{1}{3} \\times (\\text{정육면체의 부피})\\\\ &\\quad= \\dfrac{1}{3} \\times (\\text{밑넓이}) \\times (\\text{높이})\\end{aligned}$$</div>
        <div class="sim-row l6-pbtns"><button class="btn primary" type="button" data-a="split">💥 분해</button><button class="btn" type="button" data-a="join">🧩 조립</button></div>
      </div>
    </div>`;
  renderMath(wrap);
  const viewer = await create3DViewer($('.l6-cube-v', wrap), { showInfo:false, tools:['autoRotate', 'reset'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T); viewer.resetView();
  const s = 0.68, A = new T.Vector3(s, s, s);
  const V = (x, y, z) => new T.Vector3(x * s, y * s, z * s);
  const DEF = [
    { base:[V(-1,-1,-1), V(-1,1,-1), V(-1,1,1), V(-1,-1,1)], dir:new T.Vector3(-1, 0, 0), color:'#FF8A65' },
    { base:[V(-1,-1,-1), V(-1,-1,1), V(1,-1,1), V(1,-1,-1)], dir:new T.Vector3(0, -1, 0), color:'#4FC3F7' },
    { base:[V(-1,-1,-1), V(1,-1,-1), V(1,1,-1), V(-1,1,-1)], dir:new T.Vector3(0, 0, -1), color:'#AED581' },
  ];
  const parts = DEF.map(d => {
    const faces = [d.base.slice().reverse(), ...d.base.map((p, i) => [p, d.base[(i + 1) % 4], A])];
    const m = l5Solid(T, faces, d.color, 0.88); viewer.extras.add(m); return { m, dir:d.dir };
  });
  viewer.extras.add(H.dot2(A, 0.07, '#D50000', false));
  let u = 0, target = 0;
  viewer.onFrame(dt => {
    if(u === target) return false;
    const st = L0_REDUCED_MOTION ? 1 : dt / 1.0;
    u = target > u ? Math.min(target, u + st) : Math.max(target, u - st);
    parts.forEach(p => p.m.position.copy(p.dir).multiplyScalar(0.7 * l5Ease(u)));
    return true;
  });
  $('[data-a="split"]', wrap).addEventListener('click', () => { target = 1; viewer.requestRender(); });
  $('[data-a="join"]', wrap).addEventListener('click', () => { target = 0; viewer.requestRender(); });
}

const L7_BASE = '#64B5F6', L7_SIDE = ['#FFB74D', '#FFA726', '#FFCC80', '#FB8C00'];
const l7f = v => { const x = Math.round(v * 100) / 100; return Number.isInteger(x) ? String(x) : String(x); };
/* 빈칸 상태로는 [제출]·[확인]을 누를 수 없게 (모든 활동 공통)
   - 버튼에서 3단계 위까지 올라가며 글자 입력 칸이 있는 가장 가까운 묶음을 찾아, 보이는 입력 칸이 모두 채워졌는지 본다 */

function l0FillInputs(btn){

}

/* [정답 보기]·[풀이 보기]는 같은 묶음의 [제출]·[확인]을 한 번 누르기 전까지 막는다 */

const l0AnsLocked = b => { const c = l0AnsCheckBtn(b); return !!c && !c.dataset.l0Checked; };

}
let l0FillRaf = 0; const l0FillLater = () => { if(!l0FillRaf) l0FillRaf = setTimeout(() => requestAnimationFrame(() => { l0FillRaf = 0; l0FillSync(); }), 120); };
document.addEventListener('click', e => {

/* π 버튼(.l7-pi): 같은 줄의 입력 칸 커서 자리에 π 넣기 (문서 전체에 한 번만 연결) */
const L7_PI = '<button class="btn pi-btn l7-pi" type="button" aria-label="파이 기호 넣기">π</button>';
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.l7-pi'); if(!b || b.disabled) return;
  const host = b.closest('.l7-pi-host, label, td, .l7-row-in'); const inp = host && host.querySelector('input[type="text"]'); if(!inp || inp.disabled || inp.readOnly) return;
  const a = inp.selectionStart ?? inp.value.length, z = inp.selectionEnd ?? a;
  inp.value = inp.value.slice(0, a) + 'π' + inp.value.slice(z); inp.focus(); try { inp.setSelectionRange(a + 1, a + 1); } catch(_){}
  inp.dispatchEvent(new Event('input', { bubbles:true }));
});
const l7val = (num, pi=false) => ({ num, pi:!!pi, str:pi ? `${l7f(num) === '1' ? '' : l7f(num)}π` : l7f(num), tex:pi ? `${l7f(num)}\\pi` : l7f(num) });

const L7_DIMS = {
  rtprism:[{ k:'a', label:'밑면의 직각을 낀 한 변', min:1, max:8 }, { k:'b', label:'밑면의 직각을 낀 다른 변', min:1, max:8 }, { k:'h', label:'높이', min:1, max:10 }],
  rectprism:[{ k:'a', label:'밑면의 가로', min:1, max:8 }, { k:'b', label:'밑면의 세로', min:1, max:8 }, { k:'h', label:'높이', min:1, max:10 }],
  regprism:[{ k:'a', label:'밑면의 한 변', min:1, max:5 }, { k:'h', label:'높이', min:1, max:10 }],
  cylinder:[{ k:'r', label:'밑면의 반지름', min:1, max:5 }, { k:'h', label:'높이', min:1, max:10 }],
  regpyramid:[{ k:'a', label:'밑면의 한 변의 길이', min:1, max:6 }, { k:'s', label:'옆면 삼각형의 높이', min:1, max:10 }],
  cone:[{ k:'r', label:'밑면의 반지름', min:1, max:5 }, { k:'l', label:'모선의 길이', min:1, max:12 }],
};
const L7_NAME = { rtprism:'삼각기둥', rectprism:'사각기둥', regprism:'오각기둥', cylinder:'원기둥', regpyramid:'각뿔', cone:'원뿔' };

/** 넓이 계산 (밑넓이·옆넓이·겉넓이와 면마다의 식) */
function l7Calc(shape, d){
  const tanN = n => Math.tan(Math.PI / n);
  if(shape === 'rtprism'){
    const c = Math.hypot(d.a, d.b), B = d.a * d.b / 2, P = d.a + d.b + c, S = P * d.h;
    return { base:l7val(B), side:l7val(S), total:l7val(2 * B + S), perim:P, bases:2,
      baseF:`${l0Fx('½')} × ${d.a} × ${d.b} = ${l7f(B)}`, sideLens:[d.a, d.b, c], h:d.h,
      sideNote:`(${d.a} + ${d.b} + ${l7f(c)}) × ${d.h} = ${l7f(S)}` };
  }
  if(shape === 'rectprism'){
    const B = d.a * d.b, P = 2 * (d.a + d.b), S = P * d.h;
    return { base:l7val(B), side:l7val(S), total:l7val(2 * B + S), perim:P, bases:2, baseF:`${d.a} × ${d.b} = ${l7f(B)}`,
      sideLens:[d.a, d.b, d.a, d.b], h:d.h, sideNote:`(${d.a} + ${d.b} + ${d.a} + ${d.b}) × ${d.h} = ${l7f(S)}` };
  }
  if(shape === 'regprism'){
    const n = d.n || 5, B = Math.round(n * d.a * d.a / (4 * tanN(n)) * 100) / 100, P = n * d.a, S = P * d.h;
    return { base:l7val(B), side:l7val(S), total:l7val(2 * B + S), perim:P, bases:2, baseF:`정${n}각형의 넓이(주어진 값) ${l7f(B)}`,
      sideLens:Array(n).fill(d.a), h:d.h, sideNote:`(${d.a} × ${n}) × ${d.h} = ${l7f(S)}`, approx:true };
  }
  if(shape === 'cylinder'){
    return { base:l7val(d.r * d.r, true), side:l7val(2 * d.r * d.h, true), total:l7val(2 * d.r * d.r + 2 * d.r * d.h, true), bases:2,
      baseF:`π × ${d.r}² = ${l7f(d.r * d.r)}π`, sideF:`(2π × ${d.r}) × ${d.h} = ${l7f(2 * d.r * d.h)}π`, perimTex:`2\\pi \\times ${d.r} = ${l7f(2 * d.r)}\\pi` };
  }
  if(shape === 'regpyramid'){
    const n = d.n || 4, B = n === 4 ? d.a * d.a : Math.round(n * d.a * d.a / (4 * tanN(n)) * 100) / 100, T1 = d.a * d.s / 2, S = n * T1;
    return { base:l7val(B), side:l7val(S), total:l7val(B + S), bases:1, baseF:n === 4 ? `${d.a} × ${d.a} = ${l7f(B)}` : `정${n}각형의 넓이(주어진 값) ${l7f(B)}`,
      triF:`${l0Fx('½')} × ${d.a} × ${d.s} = ${l7f(T1)}`, sideNote:`(${l0Fx('½')} × ${d.a} × ${d.s}) × ${n} = ${l7f(S)}`, approx:n !== 4 };

/** 풀이 한 줄: 식이 길어 줄이 바뀔 때는 등호(=) 앞에서만 바뀌도록 등호 단위로 묶는다.
    $...$ 안의 맨 바깥 등호에서 식을 나누고, 등호로 시작하는 조각마다 새 묶음(줄바꿈 가능 지점)을 만든다. */
function l7EqBreak(src){
  const atoms = [];   // { t:'math'|'text', s }
  String(src).split(/(\$[^$]+\$)/).forEach(seg => {
    if(!seg) return;
    if(!/^\$[^$]+\$$/.test(seg)){ atoms.push({ t:'text', s:seg }); return; }
    const m = seg.slice(1, -1); let depth = 0, lr = 0, last = 0; const parts = [];
    for(let i = 0; i < m.length; i++){
      const c = m[i];
      if(c === '\\'){ if(m.startsWith('\\left', i)) lr++; else if(m.startsWith('\\right', i)) lr--; i++; continue; }
      if(c === '{') depth++; else if(c === '}') depth--;
      else if(c === '=' && depth === 0 && lr === 0){ parts.push(m.slice(last, i)); last = i; }
    }
    parts.push(m.slice(last));
    parts.forEach(pt => { const x = pt.trim(); if(x) atoms.push({ t:'math', s:`$${x}$` }); });
  });
  const groups = []; let cur = null;
  atoms.forEach(a => {
    const startsEq = a.t === 'math' && /^\$\s*=/.test(a.s);
    if(!cur || startsEq){ cur = []; groups.push(cur); }
    cur.push(a);
  });
  return groups.map(g => {
    const txtLen = g.filter(a => a.t === 'text').reduce((n, a) => n + a.s.trim().length, 0);
    const html = g.map(a => a.s).join(' ').replace(/\s+/g, ' ').trim();
    return txtLen <= 16 ? `<span class="l7-eqc">${html}</span>`
      : g.map(a => a.t === 'math' ? `<span class="l7-eqc">${a.s}</span>` : a.s).join(' ').replace(/\s+/g, ' ').trim();   // 긴 설명 글은 줄바꿈 허용, 식만 묶기
  }).join(' ');
}

    const fit = () => { if(tb.offsetHeight) cb.style.height = tb.offsetHeight + 'px'; };
