<script type="module">
/* =====================================================================
   입체도형, 그것이 알고 싶다!! — 앱 뼈대 + 공통 부품
   ---------------------------------------------------------------------
   [공통 부품]
     create3DViewer(container, options) → Promise<viewer>
     createQuiz(container, questions, { lessonId })
     createSlider / createStepper / createPlayButton / createSegmented
   [내용 채우는 곳]
     LESSON_CONTENT['lesson-N'] = { goal, think, concept, sim(el), quiz:[...] }
   ===================================================================== */

/* ---------------------------------------------------------------------
   0. 설정값
   --------------------------------------------------------------------- */
const TEACHER_PASSWORD = '1234';          // ← 수업 전에 바꿔 두세요
const STORAGE_KEY = 'ipche-explorer-v1';

/* 8번 학습 실험 영상 주소 ← 여기만 바꾸면 돼요
   · SPHERE_VOLUME_VIDEO: 구의 부피 실험 영상 (시뮬레이션 카드 첫 소활동)
   · SPHERE_SURFACE_VIDEOS: 구의 겉넓이 실험 영상들 (구의 겉넓이 카드 첫 소활동, 여러 개면 나란히)
   · YouTube 주소는 일반 주소(watch?v=), 짧은 주소(youtu.be), shorts·embed 주소 모두 자동으로 embed 주소로 바뀝니다.
   · 학교에서 찍은 영상 파일이면 'videos/orange.mp4'처럼 mp4 파일 경로를 넣으면 <video> 태그로 재생됩니다.
   · 빈 문자열('')이면 영상 대신 안내 문구와 애니메이션만 보입니다. */
// 영상 파일은 이 HTML 파일과 같은 위치의 videos 폴더에 둔다
const SPHERE_VOLUME_VIDEO = 'videos/sphere-volume.mp4';
const SPHERE_SURFACE_VIDEOS = ['videos/sphere-surface-1.mp4', 'videos/sphere-surface-2.mp4'];
const SPHERE_VIDEO_URL = SPHERE_SURFACE_VIDEOS[0];

const LESSONS = [
  { id:'lesson-0', num:0, title:'복습(초등수학)', short:'복습', icon:'📦', color:'#FF8A65' },
  { id:'lesson-1', num:1, title:'다면체와 각뿔대',   short:'다면체',   icon:'🔺', color:'#29B6F6' },
  { id:'lesson-2', num:2, title:'정다면체',          short:'정다면체', icon:'💎', color:'#9575CD' },
  { id:'lesson-3', num:3, title:'회전체',            short:'회전체',   icon:'🌀', color:'#26A69A' },
  { id:'lesson-4', num:4, title:'낱말 퍼즐 놀이', short:'놀이', icon:'🧩', color:'#FFA726' },
  { id:'lesson-5', num:5, title:'기둥의 부피',        short:'부피',     icon:'🧊', color:'#42A5F5' },
  { id:'lesson-6', num:6, title:'뿔의 부피',          short:'부피',     icon:'🍦', color:'#EC407A' },
  { id:'lesson-7', num:7, title:'기둥과 뿔의 겉넓이', short:'겉넓이',   icon:'🎁', color:'#66BB6A' },
  { id:'lesson-8', num:8, title:'구의 부피와 겉넓이', short:'구',       icon:'⚽', color:'#5C6BC0' },
];

const PARTS = [
  { key:'goal',    icon:'🎯', title:'학습 목표' },
  { key:'think',   icon:'💭', title:'생각 열기' },
  { key:'concept', icon:'📘', title:'개념' },
  { key:'sim',     icon:'🔬', title:'시뮬레이션' },
  { key:'quiz',    icon:'✅', title:'확인 퀴즈' },
];

/* ---------------------------------------------------------------------
   1. 저장소 (localStorage가 막혀도 앱이 멈추지 않게)
   --------------------------------------------------------------------- */
const memoryStore = {};
const safeStorage = {
  get(key){
    try{ const v = window.localStorage.getItem(key); return v === null ? (memoryStore[key] ?? null) : v; }
    catch(e){ return memoryStore[key] ?? null; }
  },
  set(key, value){
    memoryStore[key] = value;
    try{ window.localStorage.setItem(key, value); }catch(e){ /* 저장 불가 환경: 메모리에만 보관 */ }
  },
  remove(key){
    delete memoryStore[key];
    try{ window.localStorage.removeItem(key); }catch(e){}
  }
};

const state = { completed:{}, scores:{}, steps:{}, teacher:false, current:0 };   // steps: 학습별 소활동 진행 { cur, reached }   // scores: 학습별 퀴즈 점수 { first, best, total, rounds }
function loadProgress(){
  try{
    const raw = safeStorage.get(STORAGE_KEY);
    if(raw){ const data = JSON.parse(raw);
      if(data && typeof data.completed === 'object') state.completed = data.completed;
      if(data && data.scores && typeof data.scores === 'object') state.scores = data.scores;
      if(data && data.steps && typeof data.steps === 'object') state.steps = data.steps; }
  }catch(e){ state.completed = {}; state.scores = {}; state.steps = {}; }
}
function saveProgress(){
  try{ safeStorage.set(STORAGE_KEY, JSON.stringify({ completed:state.completed, scores:state.scores, steps:state.steps, savedAt:Date.now() })); }catch(e){}
}
function isCompleted(i){ return !!state.completed[LESSONS[i].id]; }
function isUnlocked(i){ const base = state.teacher || i === 0 || isCompleted(i-1) || isCompleted(i); return typeof clsLessonOpen === 'function' ? clsLessonOpen(i, base) : base; }

/* ---------------------------------------------------------------------
   2. 작은 도우미
   --------------------------------------------------------------------- */
const $ = (sel, root=document) => root.querySelector(sel);
function el(tag, attrs={}, html=''){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === 'class') e.className = v;
    else if(k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  if(html) e.innerHTML = html;
  return e;
}
/**
 * 주소창의 #해시 바꾸기. 미리보기 창·샌드박스 iframe(about:srcdoc) 등에서는 history API가
 * SecurityError를 내므로, 실패해도 앱이 멈추지 않게 조용히 넘어간다.
 */
function setHash(hash){
  try{ if(location.hash !== hash) history.replaceState(null, '', hash || (location.pathname + location.search)); }
  catch(e){ /* 주소를 바꿀 수 없는 환경: 화면 이동은 그대로 진행 */ }
}
/** ½·⅓·⅔ 같은 글자 분수를 교과서처럼 KaTeX 분수로 바꾼 HTML (KaTeX가 없으면 그대로) */
const L0_FX_TEX = { '½':'\\dfrac{1}{2}', '⅓':'\\dfrac{1}{3}', '⅔':'\\dfrac{2}{3}' }, L0_FX_CACHE = {};
function l0Fx(str){
  return String(str).replace(/[½⅓⅔]/g, ch => {
    if(L0_FX_CACHE[ch]) return L0_FX_CACHE[ch];
    try{ if(window.katex){ return (L0_FX_CACHE[ch] = window.katex.renderToString(L0_FX_TEX[ch], { throwOnError:false })); } }catch(e){}
    return ch;
  });
}
/** $...$, $$...$$, \(...\) 안의 LaTeX를 KaTeX로 그린다. KaTeX가 없으면 그대로 둔다. */
function renderMath(root){
  try{
    if(window.renderMathInElement){
      window.renderMathInElement(root, {
        delimiters:[
          {left:'$$', right:'$$', display:true},
          {left:'\\(', right:'\\)', display:false},
          {left:'$', right:'$', display:false},
        ],
        throwOnError:false,
      });
      // 문자 n은 교과서처럼 굵은 기울임 로마체(개념 활동의 i.mv와 같은 글자체)로
      root.querySelectorAll('.katex .mathnormal').forEach(e => { if(e.textContent === 'n') e.classList.add('mv-n'); });
    }
  }catch(e){ console.warn('수식 표시 오류', e); }
}
let toastTimer;
function toast(msg, ms=2600){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), ms);
}
function celebrate(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = el('div', {class:'confetti', 'aria-hidden':'true'});
  const items = ['🎉','⭐','🔺','🧊','💎','⚽','✨','🟦','🟨'];
  for(let i=0;i<36;i++){
    const s = el('i'); s.textContent = items[i % items.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    s.style.animationDelay = (Math.random()*0.5) + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4200);
}
const placeholder = (text='이 부분은 다음 단계에서 채워질 거야.') =>
  `<div class="placeholder"><b>🛠️ 준비 중</b>${text}</div>`;

/* =====================================================================
   공통 부품 1: 3D 뷰어
   ===================================================================== */
let THREE = null, OrbitControls = null, threePromise = null;
function loadThree(){
  if(!threePromise){
    threePromise = Promise.all([ import('three'), import('three/addons/controls/OrbitControls.js') ])
      .then(([T, OC]) => { THREE = T; OrbitControls = OC.OrbitControls; return T; });
  }
  return threePromise;
}

/** 밝고 맑은 면 색 (3D 도형 갤러리) */
const BRIGHT_FACES = ['#FFADC0', '#FFD98C', '#FFF39A', '#A9F0C4', '#A6DCFF', '#CDBDFF', '#FFBDE9', '#A8F0E4', '#FFCBA3', '#BCCBFF', '#DDF7A3', '#FFBDB2'];   // 맑은 파스텔
const PASTELS = ['#FFB3BA','#FFD8A8','#FFF3A3','#B9F3C9','#B3DEFF','#D4C2FF','#FFC6E7','#B8EDE3','#FFE0B8','#C8D2FF','#E6F7B0','#F7C8C8'];

/**
 * 입체도형 모양 만들기 도우미. build 함수의 두 번째 인자로 전달된다.
 * 각 함수는 THREE.BufferGeometry를 돌려주고, userData에 기본 설정(curved, vertices, info)을 담는다.
 */
function makeShapes(T){
  const withData = (g, data) => { g.userData = Object.assign({}, g.userData, data); return g; };
  return {
    box:(w=2, h=1.4, d=1.2) => new T.BoxGeometry(w, h, d),
    cube:(a=1.6) => new T.BoxGeometry(a, a, a),
    prism:(n=3, r=1, h=1.8) => new T.CylinderGeometry(r, r, h, n, 1),            // n각기둥
    pyramid:(n=4, r=1.1, h=1.8) => new T.CylinderGeometry(0, r, h, n, 1),        // n각뿔
    frustum:(n=4, rBottom=1.2, rTop=0.6, h=1.3) => new T.CylinderGeometry(rTop, rBottom, h, n, 1), // n각뿔대
    tetrahedron:(r=1.3) => new T.TetrahedronGeometry(r, 0),
    octahedron:(r=1.3) => new T.OctahedronGeometry(r, 0),
    dodecahedron:(r=1.3) => new T.DodecahedronGeometry(r, 0),
    icosahedron:(r=1.3) => new T.IcosahedronGeometry(r, 0),
    cylinder:(r=1, h=1.8) => withData(new T.CylinderGeometry(r, r, h, 64, 1), {
      curved:true, vertices:[], info:{ faces:'밑면 2 · 옆면(곡면) 1', edges:'—', vertices:'—' }, infoNote:'옆면이 굽은 면(곡면)이야.' }),
    cone:(r=1.1, h=1.8) => withData(new T.ConeGeometry(r, h, 64, 1), {
      curved:true, vertices:[[0, h/2, 0]], info:{ faces:'밑면 1 · 옆면(곡면) 1', edges:'—', vertices:'꼭짓점 1' }, infoNote:'원뿔의 꼭대기 점을 원뿔의 꼭짓점이라고 해.' }),
    coneFrustum:(rBottom=1.2, rTop=0.6, h=1.3) => withData(new T.CylinderGeometry(rTop, rBottom, h, 64, 1), {
      curved:true, vertices:[], info:{ faces:'밑면 2 · 옆면(곡면) 1', edges:'—', vertices:'—' } }),
    sphere:(r=1.2) => withData(new T.SphereGeometry(r, 48, 32), {
      curved:true, vertices:[], info:{ faces:'곡면 1', edges:'—', vertices:'—' }, infoNote:'구는 어느 방향에서 봐도 원 모양이야.' }),
  };
}

/* ---------------------------------------------------------------------
   수학적인 면·모서리·꼭짓점 세기 (뷰어 정보 패널과 개수 검사가 함께 사용)
   · 면   : 같은 평면 위의 삼각형을 하나의 면으로 묶는다 (허용 오차로 비교)
   · 모서리: 두 면이 만나는 선(EdgesGeometry) 중 한 직선 위에 이어진 조각은 하나로 합친다
   · 꼭짓점: 모서리 끝점 중 서로 다른 점
   --------------------------------------------------------------------- */
function solidFaceGroups(T, g, size, curved){
  const pos = g.attributes.position; const triCount = pos.count / 3;
  const triGroup = new Int32Array(triCount); const groupSize = [];
  const a = new T.Vector3(), b = new T.Vector3(), c = new T.Vector3(), n = new T.Vector3(), ab = new T.Vector3(), ac = new T.Vector3();
  const keyToGroup = new Map(), planes = [];
  for(let t=0;t<triCount;t++){
    a.fromBufferAttribute(pos, t*3); b.fromBufferAttribute(pos, t*3+1); c.fromBufferAttribute(pos, t*3+2);
    ab.subVectors(b, a); ac.subVectors(c, a); n.crossVectors(ab, ac);
    if(n.length() < 1e-9 * size * size){ triGroup[t] = -1; continue; }   // 넓이 0인 삼각형(뿔 꼭대기)
    n.normalize();
    const d = n.dot(a) / size;
    let gi = -1;
    if(curved){          // 곡면: 삼각형이 많아 빠른 키 비교
      const key = [n.x, n.y, n.z, d].map(v => (Math.round(v*500)/500 + 0).toFixed(3)).join(',');
      if(!keyToGroup.has(key)){ keyToGroup.set(key, groupSize.length); groupSize.push(0); }
      gi = keyToGroup.get(key);
    }else{               // 다면체: 반올림 경계에 걸려 한 면이 둘로 나뉘지 않도록 허용 오차로 비교
      gi = planes.findIndex(q => q.n.dot(n) > 0.99995 && Math.abs(q.d - d) < 2e-3);
      if(gi < 0){ gi = planes.length; planes.push({ n:n.clone(), d }); groupSize.push(0); }
    }
    triGroup[t] = gi; groupSize[gi]++;
  }
  // 곡면 도형: 작은 조각(삼각형 1~2개)은 하나의 '곡면'으로 묶는다
  let flatFaces = groupSize.length;
  const remap = groupSize.map((s, i) => i);
  if(curved){
    let next = 1; flatFaces = 0;
    for(let i=0;i<groupSize.length;i++){
      if(groupSize[i] <= 2) remap[i] = 0; else { remap[i] = next++; flatFaces++; }
    }
  }
  return { triGroup, remap, faceCount: flatFaces };
}
function solidEdges(T, src, curved, threshold, size){
  const eg = new T.EdgesGeometry(src, threshold);
  const ep = eg.attributes.position; let segs = [];
  for(let i=0;i<ep.count;i+=2) segs.push([ new T.Vector3().fromBufferAttribute(ep, i), new T.Vector3().fromBufferAttribute(ep, i+1) ]);
  eg.dispose();
  const key = p => [p.x, p.y, p.z].map(v => (Math.round(v/size*1000)/1000 + 0).toFixed(3)).join(',');
  if(!curved && segs.length < 600){
    // 한 직선 위에 이어진 모서리 조각 합치기 (예: 면을 나눈 삼각형 때문에 모서리 중간에 생긴 점)
    for(let guard=0; guard<500; guard++){
      const adj = new Map();
      segs.forEach((sg, i) => sg.forEach((p, j) => { const k = key(p); if(!adj.has(k)) adj.set(k, []); adj.get(k).push([i, j]); }));
      let merged = false;
      for(const arr of adj.values()){
        if(arr.length !== 2 || arr[0][0] === arr[1][0]) continue;
        const [[i1, j1], [i2, j2]] = arr;
        const A = segs[i1][1-j1], M = segs[i1][j1], B = segs[i2][1-j2];
        const d1 = M.clone().sub(A).normalize(), d2 = B.clone().sub(M).normalize();
        if(d1.dot(d2) > 0.99995){ segs[i1] = [A, B]; segs.splice(i2, 1); merged = true; break; }
      }
      if(!merged) break;
    }
  }
  const seen = new Map();
  if(!curved) segs.flat().forEach(p => { const k = key(p); if(!seen.has(k)) seen.set(k, p.clone()); });
  return { segs, pts:[...seen.values()] };
}
/** 도형 하나의 수학적인 면·모서리·꼭짓점 개수 (뷰어와 같은 계산) */
function countSolid(T, geometry, { curved=false, threshold=15 } = {}){
  const src = geometry.clone();
  src.computeBoundingBox(); const center = new T.Vector3(); src.boundingBox.getCenter(center);
  src.translate(-center.x, -center.y, -center.z); src.computeBoundingSphere();
  const size = src.boundingSphere.radius || 1;
  const { segs, pts } = solidEdges(T, src, curved, curved ? 30 : threshold, size);
  const g = src.index ? src.toNonIndexed() : src;
  const grp = solidFaceGroups(T, g, size, curved);
  src.dispose(); if(g !== src) g.dispose();
  return { faces:grp.faceCount, edges:segs.length, vertices:pts.length };
}

/**
 * 3D 뷰어 만들기
 * @param {HTMLElement} container
 * @param {Object} options
 *   build(THREE, SHAPES) → BufferGeometry   보여 줄 입체도형
 *   title       정보 패널 제목 (예: '삼각기둥')
 *   curved      곡면이 있는 도형이면 true (회전체)
 *   vertices    꼭짓점 좌표 배열 [[x,y,z],...] (생략하면 자동 계산)
 *   info        { faces, edges, vertices } 개수를 직접 지정 (생략하면 자동 계산)
 *   infoNote    정보 패널 아래 한 줄 설명
 *   color       '면 색칠'을 끈 상태의 면 색
 *   autoRotate  처음부터 자동 회전할지
 *   showInfo    정보 패널을 처음에 보여 줄지 (기본 true)
 *   opacity     반투명일 때의 불투명도 (기본 0.55)
 *   tools       보여 줄 도구 버튼 목록 (기본: 전부)
 * @returns {Promise<Object>} viewer API
 */
async function create3DViewer(container, options={}){
  const opt = Object.assign({
    build:null, title:'', curved:undefined, vertices:undefined, info:undefined, infoNote:'',
    color:'#E4EAF3', autoRotate:false, showInfo:true, opacity:0.55, edgeThreshold:15,
    tools:['autoRotate','reset','faceColor','edges','vertices','transparent','info'],
    infoInline:false,   // true: '개수 보기'를 도구 막대 대신 정보 패널의 도형 이름 옆 작은 버튼으로
    pastel:true,        // 직접 만든 메시의 면 색도 파스텔 톤으로 (복습 전개도처럼 이미 파스텔이면 false)
    bright:true,        // 기본: 갤러리와 같은 밝고 맑은 파스텔 면 색(BRIGHT_FACES)과 밝은 조명 (false: 예전 색)
  }, options);

  container.classList.add('viewer');
  container.innerHTML = `
    <div class="viewer-stage" role="img" aria-label="3D 입체도형. 끌어서 돌려 보고, 두 손가락이나 마우스 휠로 확대·축소해 보자.">
      <div class="viewer-loading">3D 장면을 불러오는 중이야… ⏳</div>
      <div class="viewer-info" hidden></div>
      <div class="viewer-hint" aria-hidden="true">👆 끌어서 돌리기 · ✌️ 벌려서 확대</div>
    </div>
    <div class="viewer-toolbar" role="toolbar" aria-label="3D 보기 도구"></div>`;
  const stage = $('.viewer-stage', container);
  const loading = $('.viewer-loading', container);
  const infoBox = $('.viewer-info', container);
  const toolbar = $('.viewer-toolbar', container);

  const failed = (msg) => { loading.textContent = msg; toolbar.remove(); return { ok:false, setShape(){}, onFrame(){}, setAutoRotate(){}, resetView(){}, setToggle(){}, dispose(){} }; };
  try{ await loadThree(); }catch(e){ return failed('3D 도구를 불러오지 못했어. 인터넷 연결을 확인하고 새로 고침해 보자. 🌐'); }

  /* WebGL 화면(renderer)은 필요할 때만 만든다.
     브라우저가 동시에 쓸 수 있는 3D 화면 수에는 한계(크롬 약 16개)가 있어서,
     지금 보고 있는 학습이 아닌 화면은 suspend()로 내려놓고 돌아오면 resume()으로 다시 만든다. */
  let renderer = null, contextLost = false;
  function makeRenderer(){
    const r = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); contextLost = true; });
    stage.prepend(r.domElement);
    return r;
  }
  try{ renderer = makeRenderer(); }
  catch(e){ return failed('이 기기에서는 3D 화면을 그릴 수 없어. 다른 브라우저로 열어 보자.'); }
  loading.remove();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 4/3, 0.01, 1000);
  scene.add(new THREE.AmbientLight(0xffffff, opt.bright ? 2.3 : 0.75));   // bright: 물리 단위 조명(three r155+)에 맞춰 더 밝게
  const sun = new THREE.DirectionalLight(0xffffff, opt.bright ? 1.3 : 0.9); sun.position.set(3, 5, 4); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, opt.bright ? 0.5 : 0.35); fill.position.set(-4, -2, -3); scene.add(fill);

  const controls = new OrbitControls(camera, stage);   // 캔버스가 바뀌어도 조작은 그대로 유지되도록 무대(stage)에 연결
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.rotateSpeed = 0.9;
  controls.autoRotateSpeed = 2.2;
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };   // 한 손가락 회전, 두 손가락 확대·축소

  const root = new THREE.Group(); scene.add(root);          // 도형이 들어가는 그룹
  const extras = new THREE.Group(); scene.add(extras);      // 다음 단계에서 추가할 보조 물체(회전축, 화살표 등)

  const toggles = { autoRotate:!!opt.autoRotate, faceColor:true, edges:false, vertices:false, transparent:true, info:!!opt.showInfo };
  let current = null;            // { geometry, mesh, edgeMesh, vertMesh, size, segs, pts, info, ... }
  let homePos = new THREE.Vector3(3, 2.4, 4.2);
  const frameCallbacks = [];
  /* 활동마다 직접 만든 입체도형(면 색을 따로 정한 메시)도 갤러리처럼 맑은 파스텔 톤으로:
     셰이더에서 면 색을 흰색 쪽으로 섞는다. 색을 나중에 바꿔도 그대로 적용된다. (선·글자·강조용 MeshBasic은 그대로) */
  // 3~8 학습의 입체도형은 갤러리처럼 더 밝은 파스텔 톤 (흰색을 더 많이 섞는다)
  const lessonNo = (() => { const L = container.closest && container.closest('.lesson'); const m = L && /lesson-(\d+)/.exec(L.id); return m ? +m[1] : -1; })();
  const PASTEL_MIX = lessonNo >= 3 ? 0.46 : 0.32;
  function pastelize(){
    scene.traverse(o => {
      if(!o.isMesh || o.isInstancedMesh || !o.material) return;   // 모서리·꼭짓점 표시(InstancedMesh)는 그대로
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        if(m.userData.pastel || m.vertexColors || !(m.isMeshPhongMaterial || m.isMeshLambertMaterial || m.isMeshStandardMaterial)) return;
        m.userData.pastel = true;
        const prev = m.onBeforeCompile;
        m.onBeforeCompile = (sh, r) => {
          prev && prev.call(m, sh, r);
          sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>\n  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.0), ${PASTEL_MIX.toFixed(2)});`);
        };
        const pk = m.customProgramCacheKey ? m.customProgramCacheKey.bind(m) : () => '';
        m.customProgramCacheKey = () => pk() + '|pastel';
        m.needsUpdate = true;
      });
    });
  }

  /* ---- 도형 만들기 ---- */
  function groupFaces(g, size, curved){ return solidFaceGroups(THREE, g, size, curved); }

  function paintFaces(){
    if(!current) return;
    const { geometry, triGroup, remap, curved } = current;
    const colors = geometry.attributes.color;
    const base = new THREE.Color(opt.color); const tmp = new THREE.Color();
    for(let t=0;t<triGroup.length;t++){
      const gi = triGroup[t] < 0 ? 0 : remap[triGroup[t]];
      if(toggles.faceColor){
        const pal = opt.bright ? BRIGHT_FACES : PASTELS;
        if(curved && gi === 0) tmp.set(opt.bright ? '#A6DCFF' : '#B3DEFF');
        else tmp.set(pal[gi % pal.length]);
      }else tmp.copy(base);
      for(let k=0;k<3;k++) colors.setXYZ(t*3+k, tmp.r, tmp.g, tmp.b);
    }
    colors.needsUpdate = true;
  }

  function buildEdgeMesh(){
    if(!current) return;
    if(current.edgeMesh){ root.remove(current.edgeMesh); current.edgeMesh.geometry.dispose(); current.edgeMesh.material.dispose(); }
    const segs = current.segs; if(!segs.length){ current.edgeMesh = null; return; }
    const r = current.size * (toggles.edges ? 0.022 : 0.009);
    const geo = new THREE.CylinderGeometry(1, 1, 1, 8, 1, true);
    const mat = new THREE.MeshBasicMaterial({ color: toggles.edges ? 0xD81B60 : 0x2B3A55 });
    const mesh = new THREE.InstancedMesh(geo, mat, segs.length);
    const up = new THREE.Vector3(0,1,0), dir = new THREE.Vector3(), mid = new THREE.Vector3(), q = new THREE.Quaternion(), m = new THREE.Matrix4(), s = new THREE.Vector3();
    segs.forEach(([p, q2], i) => {
      dir.subVectors(q2, p); const len = dir.length(); dir.normalize();
      mid.addVectors(p, q2).multiplyScalar(0.5);
      q.setFromUnitVectors(up, dir); s.set(r, len, r);
      m.compose(mid, q, s); mesh.setMatrixAt(i, m);
    });
    mesh.instanceMatrix.needsUpdate = true;
    root.add(mesh); current.edgeMesh = mesh;
  }

  function buildVertMesh(){
    if(!current) return;
    if(current.vertMesh){ root.remove(current.vertMesh); current.vertMesh.geometry.dispose(); current.vertMesh.material.dispose(); }
    const pts = current.pts; if(!pts.length){ current.vertMesh = null; return; }
    const r = current.size * (toggles.vertices ? 0.05 : 0.025);
    const geo = new THREE.SphereGeometry(1, 16, 12);
    const mat = new THREE.MeshPhongMaterial({ color: toggles.vertices ? 0xFF6F00 : (opt.vertexColor || 0x2B3A55), shininess:60 });
    const mesh = new THREE.InstancedMesh(geo, mat, pts.length);
    const m = new THREE.Matrix4();
    pts.forEach((p, i) => { m.makeScale(r, r, r).setPosition(p); mesh.setMatrixAt(i, m); });
    mesh.instanceMatrix.needsUpdate = true;
    root.add(mesh); current.vertMesh = mesh;
  }

  function applyMaterial(){
    if(!current) return;
    const mat = current.mesh.material;
    mat.transparent = toggles.transparent;
    mat.opacity = toggles.transparent ? opt.opacity : 1;
    mat.depthWrite = !toggles.transparent;
    mat.needsUpdate = true;
  }

  let infoLocked = false;   // true: 정보 패널의 [개수 보기]를 잠시 끔 (활동을 한 뒤에 켜지도록)
  function renderInfo(){
    if(!current){ infoBox.hidden = true; return; }
    const fmt = v => typeof v === 'number' ? `${v}개` : v;
    const i = current.info;
    if(opt.infoInline){
      infoBox.hidden = false; infoBox.classList.toggle('collapsed', !toggles.info);
      if(infoLocked) toggles.info = false;
      infoBox.innerHTML = `<h4 class="vi-head"><span>${current.title || '도형'}</span><button class="vi-tg" type="button" aria-pressed="${toggles.info}"${infoLocked ? ' disabled title="먼저 활동을 해 보자"' : ''}>${toggles.info ? '개수 숨기기' : '개수 보기'}</button></h4>
        ${toggles.info ? `<dl><dt>▢ 면</dt><dd>${fmt(i.faces)}</dd><dt>╱ 모서리</dt><dd>${fmt(i.edges)}</dd><dt>● 꼭짓점</dt><dd>${fmt(i.vertices)}</dd></dl>
        ${current.infoNote ? `<div class="note">${current.infoNote}</div>` : ''}` : ''}`;
      const tg = $('.vi-tg', infoBox);
      tg.addEventListener('pointerdown', e => e.stopPropagation());
      tg.addEventListener('click', e => { e.stopPropagation(); setToggle('info', !toggles.info); });
      renderMath(infoBox); return;
    }
    infoBox.hidden = !toggles.info;
    infoBox.innerHTML = `
      ${current.title ? `<h4>${current.title}</h4>` : ''}
      <dl>
        <dt>▢ 면</dt><dd>${fmt(i.faces)}</dd>
        <dt>╱ 모서리</dt><dd>${fmt(i.edges)}</dd>
        <dt>● 꼭짓점</dt><dd>${fmt(i.vertices)}</dd>
      </dl>
      ${current.infoNote ? `<div class="note">${current.infoNote}</div>` : ''}`;
    renderMath(infoBox);
  }

  function disposeCurrent(){
    if(!current) return;
    [current.mesh, current.edgeMesh, current.vertMesh].forEach(o => {
      if(!o) return; root.remove(o); o.geometry.dispose(); o.material.dispose();
    });
    current = null;
  }

  /**
   * 보여 줄 도형을 바꾼다.
   * @param {Function|BufferGeometry} build  (THREE, SHAPES) => geometry  또는 geometry
   * @param {Object} shapeOpts  { title, curved, vertices, info, infoNote, keepView }
   */
  function setShape(build, shapeOpts={}){
    const SH = makeShapes(THREE);
    let src = typeof build === 'function' ? build(THREE, SH) : build;
    if(!src) return;
    const ud = src.userData || {};
    const so = Object.assign({ title:opt.title, curved:opt.curved, vertices:opt.vertices, info:opt.info, infoNote:opt.infoNote }, ud, shapeOpts);
    const curved = !!so.curved;

    disposeCurrent();
    src.computeBoundingBox();
    const center = new THREE.Vector3(); src.boundingBox.getCenter(center);
    src.translate(-center.x, -center.y, -center.z);
    src.computeBoundingSphere();
    const size = src.boundingSphere.radius || 1;

    // 모서리·꼭짓점 (삼각형 메시가 아니라 수학적인 모서리·꼭짓점: solidEdges 참고)
    const se = solidEdges(THREE, src, curved, curved ? 30 : opt.edgeThreshold, size);
    const segs = se.segs;
    let pts = [];
    if(Array.isArray(so.vertices)){
      pts = so.vertices.map(v => new THREE.Vector3(v[0]-center.x, v[1]-center.y, v[2]-center.z));
    }else if(!curved) pts = se.pts;
    // 면
    const g = src.index ? src.toNonIndexed() : src.clone();
    if(src !== g) src.dispose();
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 3), 3));
    const grp = groupFaces(g, size, curved);
    const mat = new THREE.MeshPhongMaterial({
      vertexColors:true, side:THREE.DoubleSide, flatShading:!curved, shininess:opt.bright ? 12 : 30,
      polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1,
    });
    if(opt.bright){ mat.emissive.set(0xffffff); mat.emissiveIntensity = 0.0; mat.specular.set(0x222222); }   // 밝고 맑은 색: 약한 자체 발광으로 탁해지지 않게
    const mesh = new THREE.Mesh(g, mat);
    mesh.renderOrder = 1;
    root.add(mesh);

    const autoInfo = { faces: curved ? '—' : grp.faceCount, edges: curved ? '—' : segs.length, vertices: curved ? pts.length || '—' : pts.length };
    // 자동 검사: 다면체는 오일러 공식(V − E + F = 2), 직접 넣은 개수(info)는 자동으로 센 값과 같아야 한다
    if(!curved){
      const eu = autoInfo.vertices - autoInfo.edges + autoInfo.faces;
      if(eu !== 2) console.warn(`[3D 개수 검사] '${so.title || '도형'}': V−E+F = ${eu} (2가 아님)`, autoInfo);
      if(so.info) ['faces', 'edges', 'vertices'].forEach(k => {
        if(typeof so.info[k] === 'number' && so.info[k] !== autoInfo[k]) console.warn(`[3D 개수 검사] '${so.title || '도형'}' ${k}: 표시 ${so.info[k]} ≠ 실제 ${autoInfo[k]}`);
      });
    }
    current = {
      geometry:g, mesh, size, segs, pts, curved, title:so.title || '', infoNote:so.infoNote || '',
      triGroup:grp.triGroup, remap:grp.remap,
      info:Object.assign({}, autoInfo, so.info || {}),
    };
    paintFaces(); applyMaterial(); buildEdgeMesh(); buildVertMesh(); renderInfo();

    // 카메라 맞추기
    const dist = size / Math.sin(THREE.MathUtils.degToRad(camera.fov/2)) * 1.15;
    homePos = new THREE.Vector3(0.62, 0.48, 0.92).normalize().multiplyScalar(dist);
    controls.minDistance = size * 1.3; controls.maxDistance = size * 7;
    if(!shapeOpts.keepView) resetView();
    requestRender();
  }

  function resetView(){
    camera.position.copy(homePos); controls.target.set(0,0,0); camera.up.set(0,1,0);
    controls.update(); requestRender();
  }

  /* ---- 도구 버튼 ---- */
  const TOOL_DEFS = {
    autoRotate:{ label:'🔄 자동 회전', toggle:true },
    reset:{ label:'🎯 처음 위치로', toggle:false },
    faceColor:{ label:'🎨 면 색칠', toggle:true },
    edges:{ label:'✏️ 모서리 강조', toggle:true },
    vertices:{ label:'🔴 꼭짓점 강조', toggle:true },
    transparent:{ label:'👻 투명도', toggle:true },
    info:{ label:'📋 개수 보기', toggle:true },
  };
  const toolBtns = {};
  opt.tools.forEach(key => {
    const def0 = TOOL_DEFS[key]; if(!def0) return;
    const def = opt.toolLabels && opt.toolLabels[key] ? { ...def0, label:opt.toolLabels[key] } : def0;   // 화면별 버튼 이름 바꾸기
    const b = el('button', { class:'tool-btn', type:'button' });
    if(def.toggle){
      b.setAttribute('aria-pressed', String(!!toggles[key]));
      b.innerHTML = `${def.label} <span class="tb-state">${toggles[key] ? '켜짐' : '꺼짐'}</span>`;
      b.addEventListener('click', () => setToggle(key, !toggles[key]));
    }else{
      b.innerHTML = def.label;
      b.addEventListener('click', resetView);
    }
    toolbar.appendChild(b); toolBtns[key] = b;
  });

  function setToggle(key, val){
    toggles[key] = !!val;
    const b = toolBtns[key];
    if(b){ b.setAttribute('aria-pressed', String(toggles[key])); const s = $('.tb-state', b); if(s) s.textContent = toggles[key] ? '켜짐' : '꺼짐'; }
    if(key === 'autoRotate') controls.autoRotate = toggles.autoRotate;
    if(key === 'faceColor') paintFaces();
    if(key === 'edges') buildEdgeMesh();
    if(key === 'vertices') buildVertMesh();
    if(key === 'transparent') applyMaterial();
    if(key === 'info') renderInfo();
    api.onToggle && api.onToggle(key, toggles[key]);
    requestRender();
  }
  controls.autoRotate = toggles.autoRotate;

  /* ---- 렌더링: 화면에 보일 때만 ---- */
  let visible = false, needRender = true, lastW = 0, lastH = 0;
  const clock = new THREE.Clock();
  function requestRender(){ needRender = true; }
  controls.addEventListener('change', requestRender);
  function tick(){
    const dt = clock.getDelta();
    controls.update();                           // 감속(damping)·자동 회전
    frameCallbacks.forEach(fn => { try{ if(fn(dt) !== false) needRender = true; }catch(e){ console.error(e); } });
    if(contextLost){ restart(); return; }
    if(renderer && (needRender || controls.autoRotate)){ if(opt.pastel) pastelize(); renderer.render(scene, camera); needRender = false; }
  }
  function updateLoop(){
    if(!renderer) return;
    const run = visible && !document.hidden;
    renderer.setAnimationLoop(run ? tick : null);
    if(run) clock.getDelta();
  }
  function fitSize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    if(!renderer || !w || !h) return;
    lastW = w; lastH = h;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    requestRender();
  }
  /** 3D 화면을 잠시 내려놓기 (장면·카메라·조작 상태는 그대로 보관) */
  function suspend(){
    if(!renderer) return;
    renderer.setAnimationLoop(null);
    const r = renderer; renderer = null;
    try{ r.dispose(); r.forceContextLoss(); }catch(e){}
    r.domElement.remove();
  }
  /** 내려놓았던 3D 화면을 다시 만들기 */
  function resume(){
    if(renderer) return;
    try{ renderer = makeRenderer(); }catch(e){ return; }
    contextLost = false; lastW = 0; lastH = 0;
    fitSize(); updateLoop();
  }
  function restart(){ suspend(); contextLost = false; setTimeout(resume, 0); }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { visible = e.isIntersecting; });
    updateLoop();
  }, { threshold:0.01 });
  io.observe(stage);
  // 화면에서 멀리 벗어난 뷰어는 WebGL 화면을 내려놓아(GPU 자원 정리) 여러 뷰어가 있어도 느려지지 않게 하고,
  // 다시 화면 가까이 오면 장면·카메라 상태 그대로 되살린다.
  let near = true, farTimer = 0;
  const ioNear = new IntersectionObserver(entries => {
    entries.forEach(e => { near = e.isIntersecting; });
    clearTimeout(farTimer);
    if(near){ if(viewerInActiveLesson(container)) resume(); }
    else farTimer = setTimeout(() => { if(!near) suspend(); }, 1500);
  }, { rootMargin:'300px 0px' });
  ioNear.observe(stage);
  const onVis = () => updateLoop();
  document.addEventListener('visibilitychange', onVis);

  const ro = new ResizeObserver(() => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if(!w || !h || (w === lastW && h === lastH)) return;   // 숨겨진 화면(크기 0)은 건너뜀
    fitSize();
  });
  ro.observe(stage);

  function dispose(){
    suspend(); io.disconnect(); ioNear.disconnect(); clearTimeout(farTimer); ro.disconnect(); VIEWER_REGISTRY.delete(entry);
    document.removeEventListener('visibilitychange', onVis);
    disposeCurrent(); controls.dispose(); container.innerHTML = '';
  }

  const api = {
    ok:true, THREE, scene, camera, controls, root, extras,
    get renderer(){ return renderer; },
    dom:stage,                    // 눌러 고르기(pick) 등 포인터 이벤트는 이 요소에 연결
    suspend, resume,
    setShape, resetView, setToggle,
    setAutoRotate:(v) => setToggle('autoRotate', v),
    getToggles:() => ({ ...toggles }),
    /** 매 프레임 실행할 함수 등록 (애니메이션용). 함수가 false를 돌려주면 그 프레임은 다시 그리지 않음 */
    onFrame:(fn) => { frameCallbacks.push(fn); return () => { const i = frameCallbacks.indexOf(fn); if(i >= 0) frameCallbacks.splice(i, 1); }; },
    setInfoLock:(v) => { if(infoLocked === !!v) return; infoLocked = !!v; renderInfo(); requestRender(); },
    setInfo:(info, note) => { if(!current) return; Object.assign(current.info, info); if(note !== undefined) current.infoNote = note; renderInfo(); },
    requestRender, dispose, onToggle:null,
  };

  if(opt.build) setShape(opt.build);
  const entry = { container, suspend, resume, isNear:() => near };
  VIEWER_REGISTRY.add(entry);
  if(!viewerInActiveLesson(container)) suspend();   // 다른 학습으로 이미 넘어갔다면 바로 내려놓기
  return api;
}

/* ---------- 3D 화면 관리: 지금 학습의 화면만 살려 두기 ---------- */
const VIEWER_REGISTRY = new Set();
function viewerInActiveLesson(container){
  const sec = container.closest('.lesson');
  return !sec || sec.classList.contains('active');
}
function syncViewersToLesson(){
  VIEWER_REGISTRY.forEach(v => { if(!viewerInActiveLesson(v.container)) v.suspend(); else if(v.isNear()) v.resume(); });
}

/* =====================================================================
   공통 부품 2: 확인 퀴즈
   ===================================================================== */
/**
 * 답 비교용 정리: 공백·단위·'pi' 표기 차이를 없앤다.
 * 예) '54π', '54πcm³', '54 π', '54pi', '54 pi cm^3' → '54π'
 */
function normalizeAnswer(raw){
  let s = String(raw ?? '').normalize('NFKC').toLowerCase();       // ㎤→cm3, ³→3, 전각→반각
  s = s.replace(/\s+/g, '');
  s = s.replace(/\\pi|pi|ㅠ|파이/g, 'π');
  s = s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');   // \frac{a}{b} → a/b
  s = s.replace(/(\d+)분의(\d+)/g, '$2/$1');                         // 3분의1 → 1/3
  s = s.replace(/[{}$\\]/g, '').replace(/\((\w+)\)/g, '$1');
  s = s.replace(/(입니다|이에요|예요|이다|이야)$/, '');
  // 끝에 붙은 단위 지우기 (여러 번)
  for(let k=0;k<3;k++){
    s = s.replace(/(mm|cm|km|m)(\^?[23])?$/, '')
         .replace(/(개|도|°|배|번|가지|쪽|면)$/, '');
  }
  s = s.replace(/[·×*]/g, '×');
  return s;
}
function toNumber(s){
  if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m && parseFloat(m[2]) !== 0) return parseFloat(m[1]) / parseFloat(m[2]);
  return null;
}
function isInputCorrect(user, answer){
  const u = normalizeAnswer(user);
  if(!u) return false;
  const answers = Array.isArray(answer) ? answer : [answer];
  return answers.some(a => {
    const n = normalizeAnswer(a);
    if(u === n) return true;
    const un = toNumber(u), an = toNumber(n);
    if(un !== null && an !== null) return Math.abs(un - an) < 1e-9;
    // 'π54'처럼 순서만 다른 경우는 오답, 대신 '54×π'처럼 곱셈 기호는 허용
    return u.replace(/×/g, '') === n.replace(/×/g, '');
  });
}

/** 퀴즈 점수 기록: 처음 전체 풀이 점수(first), 가장 좋은 전체 풀이 점수(best), 푼 횟수(rounds) */
function recordQuizScore(lessonId, right, total, fullRound){
  if(!lessonId) return;
  const sc = state.scores[lessonId] || { first:null, best:null, total:0, rounds:0 };
  sc.rounds++;
  if(fullRound){ sc.total = total; if(sc.first === null) sc.first = right; sc.best = Math.max(sc.best ?? 0, right); }
  state.scores[lessonId] = sc; saveProgress();
}
/**
 * 퀴즈 만들기
 * 문항: { type:'choice'|'ox'|'input', question, options, answer, explanation, hint }
 *   choice: options 배열, answer = 정답 번호(0부터)
 *   ox:     answer = 'O' 또는 'X' (true/false도 가능)
 *   input:  answer = 문자열 또는 문자열 배열(여러 정답 허용), placeholder(선택)
 * 질문·보기·해설에는 $...$ LaTeX를 쓸 수 있다. 예) '$\\frac{1}{3}\\pi r^2 h$'
 */
function createQuiz(container, questions, opts={}){
  const lessonId = opts.lessonId;
  let qs = questions || [];
  let solved = new Array(qs.length).fill(false);
  let order = qs.map((_, i) => i);     // 이번 회차에 풀 문제 번호들
  let pos = 0;
  let roundResults = [];
  container.classList.add('quiz');

  if(!qs.length){ container.innerHTML = placeholder('퀴즈 문항이 아직 없어.'); return; }

  const typeLabel = { choice:'객관식', ox:'O / X', input:'주관식' };
  const MARKS = ['①','②','③','④','⑤','⑥'];

  function start(indices){ order = indices; pos = 0; roundResults = []; showQuestion(); }

  function showQuestion(){
    const qi = order[pos]; const q = qs[qi];
    let selected = null; let submitted = false;
    const passedNote = lessonId && state.completed[lessonId] ? `<div class="quiz-passed">✓ 이미 통과한 퀴즈야. 다시 풀며 복습해 봐도 좋아!</div>` : '';
    container.innerHTML = `
      ${passedNote}
      <div class="quiz-head">
        <span class="quiz-count">문제 ${pos+1} / ${order.length}</span>
        <span class="quiz-type">${typeLabel[q.type] || ''}</span>
      </div>
      <div class="quiz-meter" aria-hidden="true"><span style="width:${(pos)/order.length*100}%"></span></div>
      <p class="quiz-q">Q${qi+1}. ${q.question}</p>
      <div class="quiz-body"></div>
      <div class="quiz-feedback" aria-live="polite"></div>
      <div class="quiz-actions"><button class="btn quiz-submit" type="button" data-act="submit">제출하기</button></div>`;
    const body = $('.quiz-body', container);
    const fb = $('.quiz-feedback', container);
    const btn = $('[data-act="submit"]', container);
    let optionBtns = []; let input = null;

    if(q.type === 'choice' || q.type === 'ox'){
      const opts2 = q.type === 'ox'
        ? [{ v:'O', html:OX_O, aria:'O, 맞아' }, { v:'X', html:OX_X, aria:'X, 아니야' }]
        : (q.options || []).map((o, i) => ({ v:i, html:`<span class="mark">${MARKS[i] || i+1}</span><span>${o}</span>` }));
      // 선택지가 짧으면 가로로 나란히 (모두 한 줄 또는 2열)
      let optCls = '';
      if(q.type !== 'ox'){
        const lens = (q.options || []).map(o => String(o).replace(/\$[^$]*\$/g, 'xxx').replace(/<[^>]+>/g, '').trim().length);
        const mx = Math.max(0, ...lens), n = lens.length;
        if(mx <= 8 && n <= 5) optCls = ' cols-' + n; else if(mx <= 18 && n % 2 === 0) optCls = ' cols-2';
      }
      const wrap = el('div', { class: q.type === 'ox' ? 'quiz-ox' : 'quiz-options' + optCls, role:'group', 'aria-label':'보기' });
      opts2.forEach(o => {
        const b = el('button', { class:'quiz-opt', type:'button', 'aria-pressed':'false', ...(o.aria ? { 'aria-label':o.aria } : {}) }, o.html + '<span class="tag"></span>');
        b.dataset.v = o.v;
        b.addEventListener('click', () => {
          if(submitted) return;
          selected = o.v;
          optionBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        });
        wrap.appendChild(b); optionBtns.push(b);
      });
      body.appendChild(wrap);
    }else if(q.type === 'input'){
      // 숫자 답이면 π 버튼·단위 안내, 용어 답이면 용어 안내만 보여 준다
      const ansList = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(String);
      const numeric = ansList.some(a => /\d/.test(a)), hasPi = ansList.some(a => /π|pi/i.test(a));
      body.innerHTML = `
        <div class="quiz-input-row">
          <input class="quiz-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="${q.placeholder || '답을 입력해 보자'}" aria-label="답 입력">
          ${numeric ? '<button class="btn pi-btn" type="button" aria-label="파이 기호 넣기">π</button>' : ''}
        </div>
        ${numeric ? `<div class="quiz-help">💡 ${hasPi ? 'π는 [π] 버튼을 누르거나 <b>pi</b>라고 써도 돼. ' : ''}단위(cm, cm³ 등)는 써도 되고 안 써도 돼.</div>`
                  : '<div class="quiz-help">💡 알맞은 용어를 한글로 써 보자. 띄어쓰기는 상관없어.</div>'}`;
      input = $('.quiz-input', body);
      $('.pi-btn', body) && $('.pi-btn', body).addEventListener('click', () => {
        if(submitted) return;
        const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
        input.value = input.value.slice(0, s) + 'π' + input.value.slice(e);
        input.focus(); input.setSelectionRange(s+1, s+1);
      });
      input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); btn.click(); } });
    }
    renderMath(container);

    btn.addEventListener('click', () => {
      if(!submitted){
        // 채점
        let ok = false, answerText = '';
        if(q.type === 'choice'){
          if(selected === null){ toast('보기 중 하나를 골라 보자!'); return; }
          ok = Number(selected) === Number(q.answer);
          answerText = `${MARKS[q.answer] || ''} ${q.options[q.answer]}`;
        }else if(q.type === 'ox'){
          if(selected === null){ toast('O 또는 X를 골라 보자!'); return; }
          const ans = (q.answer === true || String(q.answer).toUpperCase() === 'O') ? 'O' : 'X';
          ok = selected === ans; answerText = ans;
        }else{
          if(!input.value.trim()){ toast('답을 입력해 보자!'); input.focus(); return; }
          ok = isInputCorrect(input.value, q.answer);
          answerText = q.answerDisplay || (Array.isArray(q.answer) ? q.answer[0] : q.answer);
        }
        submitted = true;
        roundResults.push({ qi, ok });
        if(ok) solved[qi] = true;

        // 보기 표시 (색 + 글자)
        optionBtns.forEach(b => {
          b.disabled = true;
          const v = q.type === 'choice' ? Number(b.dataset.v) : b.dataset.v;
          const isAns = q.type === 'choice' ? v === Number(q.answer) : v === answerText;
          const tag = $('.tag', b);
          if(isAns){ b.classList.add('is-correct'); tag.textContent = '✓ 정답'; }
          else if(String(v) === String(selected)){ b.classList.add('is-wrong'); tag.textContent = '✗ 내 답'; }
        });
        if(input){ input.disabled = true; input.classList.add(ok ? 'is-correct' : 'is-wrong'); const pb = $('.pi-btn', container); if(pb) pb.disabled = true; }

        fb.className = 'quiz-feedback ' + (ok ? 'ok' : 'ng');
        fb.innerHTML = `
          <span class="verdict">${ok ? '✓ 정답이야! 잘했어 👏' : '✗ 아쉬워! 해설을 보고 다시 생각해 보자.'}</span>
          ${!ok && q.type === 'input' ? `<div>정답: <b>${answerText}</b></div>` : ''}
          ${q.explanation ? `<div>${q.explanation}</div>` : ''}`;
        renderMath(fb);
        btn.textContent = pos < order.length - 1 ? '다음 문제 ▶' : '결과 보기 🏁';
        btn.classList.remove('quiz-submit'); btn.classList.add('quiz-next');
        btn.focus();
      }else{
        pos++;
        if(pos < order.length) showQuestion(); else showSummary();
      }
    });
  }

  function showSummary(){
    const right = roundResults.filter(r => r.ok).length;
    const total = roundResults.length;
    const allSolved = solved.every(Boolean);
    recordQuizScore(lessonId, right, total, total === qs.length);
    const wrong = roundResults.filter(r => !r.ok).map(r => r.qi);
    const stars = '⭐'.repeat(Math.round(right / total * 3)) || '💪';
    // passOnFinish: 끝까지 풀면 점수와 관계없이 학습 완료(다음 학습 열림). 만점이 아니면 다시 풀지 고를 수 있다
    let passed = allSolved || (opts.passOnFinish && total === qs.length);
    // 학생 모드: 정답률 50% 이상이면 다음 활동이 열린다 (틀린 문제 다시 풀기 회차는 지금까지 맞힌 문제 수로 계산)
    const rate = Math.round((total === qs.length ? right : solved.filter(Boolean).length) / qs.length * 100);
    if(typeof isStudent === 'function' && isStudent()){
      passed = rate >= 50;
      clsReport(lessonId + ':quiz', null, { correct:total === qs.length ? right : solved.filter(Boolean).length, total:qs.length, score:rate });
    }
    container.innerHTML = `
      <div class="quiz-summary">
        <div class="stars" aria-hidden="true">${stars}</div>
        <div class="score">${total}문제 중 ${right}문제 정답!</div>
        <ul aria-label="문제별 결과">
          ${roundResults.map(r => `<li class="${r.ok ? 'ok' : 'ng'}">Q${r.qi+1} ${r.ok ? '✓ 정답' : '✗ 오답'}</li>`).join('')}
        </ul>
        <p class="praise">${allSolved
          ? '🎉 <b>모든 문제를 맞혔어! 정말 멋져!</b><br>이 학습을 완료했어. 다음 학습으로 출발해 보자!'
          : passed
            ? `✅ <b>${typeof isStudent === 'function' && isStudent() ? `정답률 ${rate}%!` : '복습을 마쳤어!'}</b> 다음 학습이 열렸어.<br>틀린 문제가 ${solved.filter(x=>!x).length}개 있어. 원하면 <b>확인 퀴즈를 다시 풀어</b> 만점에 도전해 보자!`
            : `틀린 문제가 ${solved.filter(x=>!x).length}개 남았어. 해설을 떠올리며 다시 도전해 보자! 💪`}</p>
        <div class="quiz-actions"></div>
      </div>`;
    const act = $('.quiz-actions', container);
    if(!allSolved){
      const retry = el('button', { class:'btn primary', type:'button' }, '🔁 틀린 문제 다시 풀기');
      retry.addEventListener('click', () => start(solved.map((s, i) => s ? -1 : i).filter(i => i >= 0)));
      act.appendChild(retry);
    }
    const again = el('button', { class:'btn', type:'button' }, typeof opts.regen === 'function' ? '↺ 처음부터 다시 풀기 (새 문제)' : '↺ 처음부터 다시 풀기');
    again.addEventListener('click', () => {
      if(typeof opts.regen === 'function'){ qs = opts.regen(); solved = new Array(qs.length).fill(false); }   // 비슷한 다른 문제로 바꾸기
      else if(!allSolved) solved.fill(false);
      start(qs.map((_, i) => i));
    });
    act.appendChild(again);
    if(passed){
      if(lessonId) completeLesson(lessonId);
      const nextIdx = LESSONS.findIndex(l => l.id === lessonId) + 1;
      if(opts.noNextButton){ /* 복습: 다음 학습 버튼 없음 (페이지 아래 이동 버튼·메뉴로 이동) */ }
      else if(nextIdx > 0 && nextIdx < LESSONS.length){
        const go = el('button', { class:'btn primary', type:'button' }, `다음 학습: ${LESSONS[nextIdx].title} ▶`);
        go.addEventListener('click', () => goTo(nextIdx));
        act.prepend(go);
      }else if(LESSONS.every((_, i) => isCompleted(i))){
        const go = el('button', { class:'btn primary', type:'button' }, '🏆 활동 기록 화면 보기');
        go.addEventListener('click', () => showFinish());
        act.prepend(go);
      }
    }
    if(typeof opts.onFinish === 'function') opts.onFinish({ right, total, allSolved });
    if(typeof isStudent === 'function' && isStudent() && !passed && lessonId){   // 50% 미만: 다시 풀지 묻기
      const nextIdx = LESSONS.findIndex(l => l.id === lessonId) + 1;
      const m = clsModal(`<h3>📊 확인 퀴즈 결과</h3><p class="cls-rate">정답률 <b>${rate}%</b></p>
        <p>정답률이 50%보다 낮아요. 해설을 떠올리며 <b>다시 풀어 볼까요?</b></p>
        <div class="cls-row cls-two"><button class="btn primary" type="button" data-a="retry">🔁 재도전</button><button class="btn" type="button" data-a="next">${nextIdx < LESSONS.length ? '다음 활동 ▶' : '마치기 ▶'}</button></div>`, 'cls-top');
      $('[data-a="retry"]', m).addEventListener('click', () => { m.remove(); if(!allSolved) solved.fill(false); start(qs.map((_, i) => i)); });
      $('[data-a="next"]', m).addEventListener('click', () => { m.remove(); completeLesson(lessonId); if(nextIdx < LESSONS.length) goTo(nextIdx); });
    }
  }

  start(order);
}

/** 슬라이더: createSlider({ label, min, max, step, value, unit, format, onInput }) → { el, get, set } */
function createSlider({ label='값', min=0, max=10, step=1, value=min, unit='', format, onInput } = {}){
  const id = 'sl-' + Math.random().toString(36).slice(2, 8);
  const wrap = el('div', { class:'sim-slider' });
  wrap.innerHTML = `<label for="${id}"><span>${label}</span><output for="${id}"></output></label>
    <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}">`;
  const input = $('input', wrap), out = $('output', wrap);
  const show = () => {
    const v = parseFloat(input.value);
    out.textContent = format ? format(v) : `${v}${unit}`;
    input.style.setProperty('--p', ((v - min) / (max - min) * 100) + '%');
    input.setAttribute('aria-valuetext', out.textContent);
  };
  input.addEventListener('input', () => { show(); onInput && onInput(parseFloat(input.value)); });
  show();
  return { el:wrap, get:() => parseFloat(input.value), set:(v) => { input.value = v; show(); onInput && onInput(parseFloat(input.value)); } };
}

/**
 * 단계 버튼: createStepper({ steps:['설명1','설명2',...], onStep(index) })
 * [다음 단계] [처음부터] + 단계 점 + 설명 상자 → { el, go, next, reset, index }
 */
function createStepper({ steps=[], onStep } = {}){
  let idx = 0;
  const wrap = el('div', { class:'sim-panel' });
  wrap.innerHTML = `<div class="sim-row">
      <button class="btn" type="button" data-a="reset">⏮ 처음부터</button>
      <button class="btn primary" type="button" data-a="next">다음 단계 ▶</button>
      <div class="step-dots" aria-hidden="true"></div>
    </div>
    <div class="step-caption" aria-live="polite"></div>`;
  const dots = $('.step-dots', wrap), cap = $('.step-caption', wrap), nextBtn = $('[data-a="next"]', wrap);
  steps.forEach((_, i) => dots.appendChild(el('span', { class:'step-dot' }, String(i+1))));
  function go(i){
    idx = Math.max(0, Math.min(steps.length - 1, i));
    [...dots.children].forEach((d, k) => { d.className = 'step-dot' + (k === idx ? ' on' : k < idx ? ' past' : ''); });
    cap.innerHTML = `<b>${idx+1}단계</b> · ${steps[idx] || ''}`;
    renderMath(cap);
    nextBtn.disabled = idx >= steps.length - 1;
    nextBtn.textContent = idx >= steps.length - 1 ? '마지막 단계 ✓' : '다음 단계 ▶';
    onStep && onStep(idx);
  }
  nextBtn.addEventListener('click', () => go(idx + 1));
  $('[data-a="reset"]', wrap).addEventListener('click', () => go(0));
  if(steps.length) go(0);
  return { el:wrap, go, next:() => go(idx + 1), reset:() => go(0), get index(){ return idx; } };
}

/** 재생/일시정지: createPlayButton({ playing, onToggle(isPlaying), playLabel, pauseLabel }) → { el, set, get } */
function createPlayButton({ playing=false, onToggle, playLabel='재생', pauseLabel='일시정지' } = {}){
  let on = playing;
  const b = el('button', { class:'btn', type:'button' });
  const show = () => { b.innerHTML = on ? `⏸ ${pauseLabel}` : `▶ ${playLabel}`; b.setAttribute('aria-pressed', String(on)); };
  b.addEventListener('click', () => { on = !on; show(); onToggle && onToggle(on); });
  show();
  return { el:b, set:(v) => { on = !!v; show(); }, get:() => on };
}

/** 선택 버튼 묶음: createSegmented({ items:[{value,label}], value, onChange }) → { el, set } */
function createSegmented({ items=[], value, onChange, label='선택' } = {}){
  const wrap = el('div', { class:'segmented', role:'group', 'aria-label':label });
  const btns = items.map(it => {
    const b = el('button', { class:'btn', type:'button', 'aria-pressed':String(it.value === value) }, it.label);
    b.addEventListener('click', () => set(it.value, true));
    wrap.appendChild(b); return b;
  });
  function set(v, fire){
    btns.forEach((b, i) => b.setAttribute('aria-pressed', String(items[i].value === v)));
    if(fire && onChange) onChange(v);
  }
  return { el:wrap, set };
}

/* ---------- 작은 입체도형 그림(SVG) ---------- */
function l0IconSVG(kind, n=4){
  const st = 'stroke="#2B3A55" stroke-width="2.2" stroke-linejoin="round"';
  const fmt = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const poly = (pts, fill) => `<polygon points="${fmt(pts)}" fill="${fill}" ${st}/>`;
  let s = '';
  if(kind === 'prism' || kind === 'pyramid'){
    const cx = 50, cy = 72, R = 32, k = 0.42, H = 42;
    const rot = Math.PI/2 + Math.PI/n;
    const ts = Array.from({length:n}, (_, i) => rot + 2*Math.PI*i/n);
    const P = (t, y) => [cx + R*Math.cos(t), cy + R*k*Math.sin(t) - y];
    const bottom = ts.map(t => P(t, 0));
    const faces = ts.map((t, i) => ({ i, depth: Math.sin(t) + Math.sin(ts[(i+1) % n]) })).sort((a, b) => a.depth - b.depth);
    if(kind === 'prism'){
      const top = ts.map(t => P(t, H));
      s += poly(bottom, '#DCE7F5');
      faces.forEach(f => { const j = (f.i+1) % n; s += poly([bottom[f.i], bottom[j], top[j], top[f.i]], f.depth > 0 ? '#BBD7F8' : '#A6C5EC'); });
      s += poly(top, '#E9F2FD');
    }else{
      const apex = [cx, cy - H - 8];
      s += poly(bottom, '#F8DCE6');
      faces.forEach(f => { const j = (f.i+1) % n; s += poly([bottom[f.i], bottom[j], apex], f.depth > 0 ? '#F6C1D3' : '#EBA9C0'); });
    }
  }else if(kind === 'cylinder'){
    s = `<path d="M22 28 V76 A28 9 0 0 0 78 76 V28" fill="#BBD7F8" ${st}/>
         <ellipse cx="50" cy="28" rx="28" ry="9" fill="#E9F2FD" ${st}/>
         <path d="M22 76 A28 9 0 0 1 78 76" fill="none" stroke="#2B3A55" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  }else if(kind === 'cone'){
    s = `<path d="M50 12 L22 76 A28 9 0 0 0 78 76 Z" fill="#F6C1D3" ${st}/>
         <path d="M22 76 A28 9 0 0 1 78 76" fill="none" stroke="#2B3A55" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  }else if(kind === 'sphere'){
    s = `<circle cx="50" cy="52" r="33" fill="#D4CCF5" ${st}/>
         <path d="M17 52 A33 10 0 0 0 83 52" fill="none" stroke="#2B3A55" stroke-width="1.6"/>
         <path d="M17 52 A33 10 0 0 1 83 52" fill="none" stroke="#2B3A55" stroke-width="1.4" stroke-dasharray="4 3"/>
         <circle cx="38" cy="38" r="7" fill="#fff" opacity=".6"/>`;
  }
  return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">${s}</svg>`;
}

  }
