          다면체의 면이 모두 평평한 <button type="button" class="l1-blank" aria-label="빈칸: 눌러서 확인">다각형</button>이라서, 잘린 자리도 선분으로 둘러싸이기 때문이야.</p>
      </div>
      <p class="lead l1-sec-lead">평면을 기울이고 옮겨 보며 다면체의 단면의 모양을 살펴보자.</p>
      <div class="l1-sec-solids"></div>
      <div id="l1-section"></div>
    </section>`;
}

/** 개념 확인하기(낱말 카드 채우기): 복습-개념과 같은 방식. sec 안의 boxSel 상자의 .cw 글자가 빈칸이 된다 */
function setupWordCheck(sec, boxSel, storeKey, title){
  if(!sec) return;
  const box = $(boxSel, sec), chk = $('.l0c-check', sec), checkBtn = $('[data-a="check"]', sec), readBtn = $('[data-a="read"]', sec);
  const original = box.innerHTML;
  const isDone = () => safeStorage.get(storeKey) === '1';
  function read(){
    box.innerHTML = original; box.classList.remove('checking'); chk.hidden = true;
    checkBtn.hidden = false; readBtn.hidden = true; renderMath(box);
  }
  function start(){
    const words = [...box.querySelectorAll('.cw')];
    let pickCard = null, pickSlot = null, filled = 0;
    words.forEach((w, k) => {
      const slot = el('button', { class:'cw-slot', type:'button', 'data-w':w.dataset.w, 'aria-label':`빈칸 ${k + 1}` });
      slot.style.minWidth = Math.max(3.2, (w.dataset.w || w.textContent).length * 1.05 + 1) + 'em';
      slot.innerHTML = '&nbsp;'; slot.dataset.show = w.innerHTML;
      w.replaceWith(slot);
    });
    const slots = [...box.querySelectorAll('.cw-slot')];
    const deck = slots.map(x => ({ w:x.dataset.w, show:x.dataset.show }));
    for(let a = deck.length - 1; a > 0; a--){ const b = Math.floor(Math.random() * (a + 1)); [deck[a], deck[b]] = [deck[b], deck[a]]; }
    const bank = $('.l0c-bank', chk);
    bank.innerHTML = deck.map((d, k) => `<button type="button" class="wcard" draggable="true" data-w="${d.w}" data-c="${k}">${d.show}</button>`).join('');
    const cards = [...bank.querySelectorAll('.wcard')];
    const fb = $('.l0c-fb', chk), prog = $('.l0c-prog', chk);
    const showProg = () => { prog.textContent = `채운 칸 ${filled} / ${slots.length}`; };
    chk.hidden = false; checkBtn.hidden = true; readBtn.hidden = false; box.classList.add('checking');
    showProg(); fb.textContent = ''; fb.className = 'l0c-fb';
    const clearPick = () => { cards.forEach(c => c.classList.remove('pick')); slots.forEach(x => x.classList.remove('pick')); pickCard = pickSlot = null; };
    function tryPlace(card, slot){
      clearPick();
      if(card.dataset.w === slot.dataset.w){
        slot.innerHTML = card.innerHTML; slot.classList.add('ok'); slot.disabled = true; slot.removeAttribute('aria-label');
        card.classList.add('used'); card.disabled = true; card.draggable = false;
        filled++; showProg(); fb.className = 'l0c-fb ok'; fb.textContent = '✓ 딱 맞아!';
        if(filled === slots.length){
          const first = !isDone(); safeStorage.set(storeKey, '1');
          fb.innerHTML = `🎉 <b>${title}</b>의 개념을 모두 채웠어! [📖 내용 다시 보기]로 다시 읽어 봐도 좋아.`;
          if(first){ toast(`✓ ${title} 개념 확인 완료!`); celebrate(); }
        }
      }else{
        slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake', 'ng');
        setTimeout(() => slot.classList.remove('ng'), 700);
        fb.className = 'l0c-fb ng'; fb.innerHTML = `✗ ‘${card.textContent}’은(는) 이 빈칸에 어울리지 않아. 앞뒤 문장을 다시 읽어 보자.`;
      }
    }
    cards.forEach(c => {
      c.addEventListener('click', () => { if(c.disabled) return; if(pickSlot){ tryPlace(c, pickSlot); return; } const was = c === pickCard; clearPick(); if(!was){ pickCard = c; c.classList.add('pick'); } });
      c.addEventListener('dragstart', e => { pickCard = c; e.dataTransfer.setData('text/plain', c.dataset.c); });
    });
    slots.forEach(x => {
      x.addEventListener('click', () => { if(x.disabled) return; if(pickCard){ tryPlace(pickCard, x); return; } const was = x === pickSlot; clearPick(); if(!was){ pickSlot = x; x.classList.add('pick'); } });
      x.addEventListener('dragover', e => { e.preventDefault(); x.classList.add('over'); });
      x.addEventListener('dragleave', () => x.classList.remove('over'));
      x.addEventListener('drop', e => { e.preventDefault(); x.classList.remove('over'); const c = cards[+e.dataTransfer.getData('text/plain')]; if(c && !c.disabled && !x.disabled) tryPlace(c, x); });
    });
  }
  checkBtn.addEventListener('click', start);
  readBtn.addEventListener('click', read);
}

/* =====================================================================
   생각 열기: 주령구 면 세기
   ===================================================================== */
async function l1SetupJury(){
  const box = document.getElementById('l1-jury'); if(!box) return;
  box.innerHTML = `
    <div class="l0-gal-grid">
      <div><div class="l1-jury-viewer"></div></div>
      <div class="l0-side">
        <div class="l0-note l1-jury-guide"><span class="ic" aria-hidden="true">👈</span><div><p class="hd"><b>주령구의 면의 개수를 세어 보자.</b></p>
          <p>주령구의 면을 하나씩 톡 누르면, 누른 면에 색과 번호가 붙어요.</p><p>화면을 드래그하면 뒤쪽 면도 셀 수 있어요.</p></div></div>
        <div class="l1-big" aria-live="polite"><span class="l1-cnt">0</span>개의 다각형</div>
        <div class="l1-legend"><span><svg class="l1-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1" fill="#FFCA28" stroke="#2B3A55" stroke-width="2"/></svg>정사각형 <b class="sq">0</b>개</span><span><svg class="l1-ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2.5 20.2,7.25 20.2,16.75 12,21.5 3.8,16.75 3.8,7.25" fill="#4FC3F7" stroke="#2B3A55" stroke-width="2" stroke-linejoin="round"/></svg>육각형 <b class="hx">0</b>개</span></div>
        <div class="l1-jury-msg l0-note" hidden></div>
        <div class="sim-row l1-jury-reset"><button class="btn" type="button" data-a="reset">↺ 처음부터 다시 세기</button></div>
      </div>
    </div>`;
  const viewer = await create3DViewer($('.l1-jury-viewer', box), { showInfo:false, color:'#E2C08F', tools:['autoRotate', 'reset', 'transparent'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  const J = l1Jury(T);
  const { geometry, triFace } = l1Geometry(T, J.faces);
  viewer.setShape(geometry, { title:'주령구' });
  viewer.setToggle('faceColor', false);
  viewer.setToggle('transparent', false);
  const marks = new T.Group(); viewer.extras.add(marks);
  const counted = [];
  const msg = $('.l1-jury-msg', box);
  function update(){
    $('.l1-cnt', box).textContent = counted.length;
    $('.sq', box).textContent = counted.filter(i => J.types[i] === 'square').length;
    $('.hx', box).textContent = counted.filter(i => J.types[i] === 'hex').length;
    if(counted.length === J.faces.length){
      msg.hidden = false;
      msg.innerHTML = `🎉 <b>면이 모두 14개!</b> 정사각형 6개와 육각형 8개로 이루어져 있어.<br>
        이렇게 <b>다각형인 면으로만 둘러싸인 입체도형</b>을 <b>다면체</b>라고 해. 면이 14개이니까 주령구는 <b>십사면체</b>야.`;
      celebrate();
    }
  }
  l1Pick(viewer, () => triFace, ({ face }) => {
    if(counted.includes(face)){ toast(`이미 센 면이야! (${counted.indexOf(face) + 1}번)`); return; }
    counted.push(face);
    const f = J.faces[face], c = H.centroid(f), nrm = H.normalOf(f); if(nrm.dot(c) < 0) nrm.negate();
    marks.add(H.polyMesh(f, J.types[face] === 'square' ? '#FFCA28' : '#4FC3F7', 0.95, true, 0.004));
    marks.add(H.label2(String(counted.length), c.clone().addScaledVector(nrm, 0.12), 0.9, true));
    viewer.requestRender(); update();
  });
  $('[data-a="reset"]', box).addEventListener('click', () => {
    counted.length = 0; marks.children.slice().forEach(o => { marks.remove(o); l1Dispose(o); });
    msg.hidden = true; update(); viewer.requestRender();
  });
}

/* =====================================================================
   개념 ① 다면체 탐색기
   ===================================================================== */
async function l1SetupExplorer(){
  const box = document.getElementById('l1-explorer'); if(!box) return;
  box.innerHTML = `
    <div class="l0-gal-grid">
      <div><div class="l1-ex-viewer"></div><div class="l1-name l0-note"></div></div>
      <div class="l0-side">
        <div class="l1-ex-shape"></div>
        <ul class="l1-status" aria-live="polite"></ul>
        <div class="l1-ex-findbox"><p class="ttl">🔎 면, 모서리, 꼭짓점 찾기</p><div class="l1-ex-mode"></div></div>
        <div class="sim-row l1-ex-btns"><button class="btn" type="button" data-a="all">👀 모두 보기</button><button class="btn" type="button" data-a="reset">↺ 처음부터</button></div>
      </div>
    </div>`;
  const viewer = await create3DViewer($('.l1-ex-viewer', box), { showInfo:false, color:'#E7ECF4', vertexColor:'#8E24AA', tools:['autoRotate', 'reset', 'transparent'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  viewer.setToggle('faceColor', false);
  const SHAPES = [
    { key:'sq', name:'사각기둥', make:() => l1Prism(T, 4, 1.0, 1.8) },
    { key:'tri', name:'삼각기둥', make:() => l1Prism(T, 3, 1.15, 1.6) },
    { key:'tp', name:'삼각뿔', make:() => l1Pyramid(T, 3, 1.25, 1.6) },
    { key:'qp', name:'사각뿔', make:() => l1Pyramid(T, 4, 1.15, 1.6) },
  ];
  const KIND = { face:{ label:'면', icon:'▢', color:'#FFB300' }, edge:{ label:'모서리', icon:'╱', color:'#E91E63' }, vertex:{ label:'꼭짓점', icon:'●', color:'#1E5BFF' } };   // 꼭짓점: 면(노랑)·모서리(분홍)와 잘 구분되는 파랑
  let shape = SHAPES[0], mode = 'face', data, triFace;
  const found = { face:new Set(), edge:new Set(), vertex:new Set() };
  const layer = new T.Group(); viewer.extras.add(layer);

  const seg = createSegmented({ items:SHAPES.map(s => ({ value:s.key, label:s.name })), value:'sq', label:'다면체 고르기',
    onChange:(v) => { shape = SHAPES.find(s => s.key === v); load(); } });
  $('.l1-ex-shape', box).appendChild(seg.el);
  const modeSeg = createSegmented({ items:Object.entries(KIND).map(([k, v]) => ({ value:k, label:v.label })), value:'face', label:'찾을 것',
    onChange:(v) => { mode = v; } });
  $('.l1-ex-mode', box).appendChild(modeSeg.el);

  function load(){
    data = shape.make();
    data.edges = l1EdgesOf(data.faces); data.vertices = l1VertsOf(data.faces);
    const g = l1Geometry(T, data.faces); triFace = g.triFace;
    viewer.setShape(g.geometry, { title:shape.name });
    Object.values(found).forEach(s => s.clear());
    layer.children.slice().forEach(o => { layer.remove(o); l1Dispose(o); });
    status();
  }
  function total(k){ return k === 'face' ? data.faces.length : k === 'edge' ? data.edges.length : data.vertices.length; }
  function status(){
    $('.l1-status', box).innerHTML = Object.entries(KIND).map(([k, v]) => {
      const done = found[k].size === total(k);
      return `<li class="${done ? 'done' : ''}" style="--pc:${v.color}"><span>${v.icon} ${v.label}</span>
        <b>${done ? `✓ ${total(k)}개 모두 찾았어!` : `${found[k].size}개 찾음`}</b></li>`;
    }).join('');
    const fd = found.face.size === data.faces.length;
    $('.l1-name', box).innerHTML = fd
      ? `🏷️ <b>${shape.name}</b>은(는) 면이 <b>${data.faces.length}개</b>이니까 <b class="l1-hl">${l1Hedron(data.faces.length)}</b>야!`
      : `🏷️ <b>${shape.name}</b>의 면을 모두 찾으면 이 다면체의 이름(○면체)이 나타나.`;
  }
  function mark(k, idx){
    if(k === 'face'){
      const f = data.faces[idx]; const c = H.centroid(f), n = H.normalOf(f); if(n.dot(c) < 0) n.negate();
      layer.add(H.polyMesh(f, KIND.face.color, 0.8));
      layer.add(H.label2(String(found.face.size), c.clone().addScaledVector(n, 0.1), 0.8, true));
    }else if(k === 'edge'){
      const [p, q] = data.edges[idx]; layer.add(H.tube2(p, q, 0.04, KIND.edge.color));
    }else{
      layer.add(H.dot2(data.vertices[idx], 0.085, KIND.vertex.color));
    }
    layer.children.forEach(o => { if(!o.userData.kind) o.userData.kind = k; });   // 어떤 종류의 표시인지 기억 (모두 숨기기용)
    viewer.requestRender();
  }
  l1Pick(viewer, () => triFace, ({ face, point }) => {
    let idx;
    if(mode === 'face') idx = face;
    else if(mode === 'edge'){
      let best = Infinity; data.edges.forEach(([a, b], i) => { const d = l1SegDist(point, a, b); if(d < best){ best = d; idx = i; } });
      if(best > 0.28){ toast('모서리(면과 면이 만나는 선분) 가까이를 눌러 보자!'); return; }
    }else{
      let best = Infinity; data.vertices.forEach((v, i) => { const d = v.distanceTo(point); if(d < best){ best = d; idx = i; } });
      if(best > 0.32){ toast('꼭짓점(모서리와 모서리가 만나는 점) 가까이를 눌러 보자!'); return; }
    }
    if(found[mode].has(idx)){ toast(`이미 찾은 ${KIND[mode].label}이야!`); return; }
    found[mode].add(idx); mark(mode, idx); status();
    if(found[mode].size === total(mode)) toast(`🎉 ${KIND[mode].label}을(를) 모두 찾았어! (${total(mode)}개)`);
  });
  // [모두 보기] ↔ [모두 숨기기]
  const allBtn = $('[data-a="all"]', box);
  const allLabel = () => { const on = found[mode].size === total(mode) && allBtn.dataset.on === mode; allBtn.textContent = on ? '🙈 모두 숨기기' : '👀 모두 보기'; };
  allBtn.addEventListener('click', () => {
    if(allBtn.dataset.on === mode && found[mode].size === total(mode)){
      found[mode].clear();
      layer.children.filter(o => o.userData.kind === mode).forEach(o => { layer.remove(o); l1Dispose(o); });
      allBtn.dataset.on = ''; viewer.requestRender();
    }else{
      for(let i=0;i<total(mode);i++) if(!found[mode].has(i)){ found[mode].add(i); mark(mode, i); }
      allBtn.dataset.on = mode;
    }
    status(); allLabel();
  });
  modeSeg.el.addEventListener('click', () => setTimeout(allLabel, 0));
  $('[data-a="reset"]', box).addEventListener('click', () => { allBtn.dataset.on = ''; load(); allLabel(); });
  seg.el.addEventListener('click', () => setTimeout(() => { allBtn.dataset.on = ''; allLabel(); }, 0));
  load();
}

/* =====================================================================
   개념 ② 다면체인가요? O/X 카드
   ===================================================================== */
function l1SetupOX(){
  const box = document.getElementById('l1-ox'); if(!box) return;
  const ITEMS = [
    { name:'삼각기둥', icon:l0IconSVG('prism', 3), yes:true, why:'삼각형 2개와 사각형 3개, 모두 다각형인 면으로 둘러싸여 있어.' },
    { name:'원기둥', icon:l0IconSVG('cylinder'), yes:false, why:'옆면이 굽은 면이라서 다면체가 아니야.' },
    { name:'사각뿔', icon:l0IconSVG('pyramid', 4), yes:true, why:'사각형 1개와 삼각형 4개로 둘러싸인 오면체야.' },
    { name:'구', icon:l0IconSVG('sphere'), yes:false, why:'굽은 면으로만 둘러싸여 있어서 다면체가 아니야.' },
    { name:'사각뿔대', icon:l1FrustumIcon(4), yes:true, why:'사각형 2개와 사다리꼴 4개로 둘러싸인 육면체야.' },
    { name:'원뿔', icon:l0IconSVG('cone'), yes:false, why:'밑면은 원, 옆면은 굽은 면이라서 다면체가 아니야.' },
    { name:'직육면체', icon:l0IconSVG('prism', 4), yes:true, why:'직사각형 6개로 둘러싸인 육면체야.' },
    { name:'오각기둥', icon:l0IconSVG('prism', 5), yes:true, why:'오각형 2개와 직사각형 5개로 둘러싸인 칠면체야.' },
  ];
  box.innerHTML = `<div class="sim-row l1-ox-top"><span class="l0-score l1-ox-score">0 / ${ITEMS.length}</span></div>
    <div class="l1-ox-grid">${ITEMS.map((it, i) => `
      <div class="l1-ox-card" data-i="${i}">
        ${it.icon}<b class="nm">${it.name}</b>
        <div class="row"><button class="btn ox-btn" type="button" data-v="1" aria-label="${it.name}은 다면체야">${OX_O}</button><button class="btn ox-btn" type="button" data-v="0" aria-label="${it.name}은 다면체가 아니야">${OX_X}</button></div>
        <p class="fb" aria-live="polite"></p>
      </div>`).join('')}</div>
    <div class="sim-row" style="justify-content:flex-end;margin-top:8px"><button class="btn" type="button" data-a="reset">↺ 다시 하기</button></div>`;
  const right = new Set();
  const score = $('.l1-ox-score', box);
  box.querySelectorAll('.l1-ox-card').forEach(card => {
    const it = ITEMS[+card.dataset.i];
    card.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      const ok = (b.dataset.v === '1') === it.yes;
      card.classList.remove('ok', 'ng'); card.classList.add(ok ? 'ok' : 'ng');
      $('.fb', card).innerHTML = (ok ? '✓ 정답! ' : '✗ 다시 생각해 보자. ') + (ok ? it.why : (it.yes ? '면의 모양을 하나씩 살펴보자. 모두 다각형일까?' : '굽은 면이 있는지 살펴보자.'));
      if(ok) right.add(it.name); else right.delete(it.name);
      score.textContent = `${right.size} / ${ITEMS.length}`;
      if(right.size === ITEMS.length) toast('🎉 모두 맞혔어! 굽은 면이 있으면 다면체가 아니야.');
    }));
  });
  $('[data-a="reset"]', box).addEventListener('click', () => {
    right.clear(); score.textContent = `0 / ${ITEMS.length}`;
    box.querySelectorAll('.l1-ox-card').forEach(c => { c.classList.remove('ok', 'ng'); $('.fb', c).textContent = ''; });
  });
}

/* =====================================================================
   개념 ④ 다면체 단면 관찰: 사각기둥·삼각기둥·사각뿔 자르기
   - 오른쪽: 단면으로 나올 수 있는 도형 모두 고르기 → 단면 표시 → 슬라이더 → [리셋] → [단면 확인]
   - [단면 확인]: 3D 화면 아래에 정답 단면, 바로 만들어 보기, 도전! 상자가 나타난다
   ===================================================================== */
async function l1SetupSection(){
  const box = document.getElementById('l1-section'); if(!box) return;
  const sec = box.closest('section');
  const CHOICES = [3, 4, 5, 6, 7, 8, 'circle'];
  const cname = c => c === 'circle' ? '원' : L1_POLYGON[c];
  box.innerHTML = `
    <div class="l0-gal-grid">
      <div>
        <div class="l1-sec-viewer"></div>
        <div class="l1-sec-reveal" hidden>
          <div class="l1-sec-answer l0-note"><div class="l1-sec-ans" aria-live="polite"></div>
            <div class="sim-row l1-sec-presets"></div><div class="l1-sec-ans2"></div></div>
          <div class="l0-note l1-sec-challenge"><b>도전!</b> 슬라이더로 아래 단면을 모두 만들어 보자.<ul class="l1-check"></ul></div>
        </div>
      </div>
      <div class="l0-side">
        <p class="l1-sec-q"><b>단면으로 관찰되는 모든 도형을 선택하세요.</b></p>
        <div class="l1-sec-picks" role="group" aria-label="단면으로 관찰되는 도형 고르기">
          ${CHOICES.map(c => `<button type="button" class="btn l1-pick" data-c="${c}" aria-pressed="false">${cname(c)}</button>`).join('')}
        </div>
        <div class="l1-big l1-sec-shape" aria-live="polite">단면: -</div>
        <div class="l1-sec-sliders"></div>
        <div class="l1-sec-reset"><button class="btn" type="button" data-a="reset">↺ 리셋</button></div>
        <div class="l1-sec-confirm"><button class="btn l0c-checkbtn" type="button" data-a="confirm">✔ 단면 확인</button></div>
      </div>
    </div>`;
  const viewer = await create3DViewer($('.l1-sec-viewer', box), { showInfo:false, tools:['autoRotate', 'reset', 'faceColor', 'transparent'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  const SOLIDS = [
    { key:'sq', name:'사각기둥', make:() => l1Prism(T, 4, 1.15, 1.7), answer:[3, 4, 5, 6] },
    { key:'tri', name:'삼각기둥', make:() => l1Prism(T, 3, 1.25, 1.6), answer:[3, 4, 5] },
    { key:'qp', name:'사각뿔', make:() => l1Pyramid(T, 4, 1.3, 1.7), answer:[3, 4, 5] },
  ];
  const planeMesh = new T.Mesh(new T.PlaneGeometry(3.8, 3.8), H.mat('#42A5F5', 0.2, true)); planeMesh.renderOrder = 6;
  planeMesh.add(new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(3.8, 3.8)), new T.LineBasicMaterial({ color:0x1E88E5, transparent:true, opacity:0.6 })));
  viewer.extras.add(planeMesh);
  const secGroup = new T.Group(); viewer.extras.add(secGroup);
  const st = { tx:0, tz:0, off:50 }, made = new Set(), picked = new Set();
  let solid = SOLIDS[0], faces = [], verts = [], presets = {}, confirmed = false, cheered = false;

  const normalFor = (tx, tz) => new T.Vector3(0, 1, 0).applyEuler(new T.Euler(tx * Math.PI/180, 0, tz * Math.PI/180, 'XYZ')).normalize();
  const range = n => { let lo = Infinity, hi = -Infinity; verts.forEach(v => { const d = v.dot(n); lo = Math.min(lo, d); hi = Math.max(hi, d); }); return [lo, hi]; };
  // 평면의 위치 h(0~100): 평면의 방향으로 입체도형의 한쪽 끝(0)부터 다른 쪽 끝(100)까지.
  // 기울이지 않으면 밑면(0)에서 위 밑면·꼭짓점(100)까지, 곧 입체도형의 높이 전체를 움직인다
  const capFor = (tx, tz, h) => { const n = normalFor(tx, tz); const [lo, hi] = range(n); const d = lo + (hi - lo) * h / 100; return { n, d, cap:l1Clip(T, faces, n, d).cap }; };

  const sl = {
    tx:createSlider({ label:'앞뒤로 기울이기', min:-90, max:90, step:1, value:0, unit:'°', onInput:v => { st.tx = v; update(); } }),
    tz:createSlider({ label:'좌우로 기울이기', min:-90, max:90, step:1, value:0, unit:'°', onInput:v => { st.tz = v; update(); } }),
    off:createSlider({ label:'평면의 위치 (밑면에서)', min:0, max:100, step:1, value:50, format:v => v === 0 ? '밑면' : v === 100 ? (solid.key === 'qp' ? '꼭짓점' : '위 밑면') : `높이의 ${v}%`, onInput:v => { st.off = v; update(); } }),
  };
  $('.l1-sec-sliders', box).append(sl.tx.el, sl.tz.el, sl.off.el);
  const setSliders = (tx, tz, off) => { sl.tx.set(tx); sl.tz.set(tz); sl.off.set(off); st.tx = tx; st.tz = tz; st.off = off; update(); };

  // 입체도형 고르기 (사각기둥 / 삼각기둥 / 사각뿔)
  const solidSeg = createSegmented({ items:SOLIDS.map(x => ({ value:x.key, label:x.name })), value:'sq', label:'단면을 관찰할 입체도형', onChange:v => load(SOLIDS.find(x => x.key === v)) });
  $('.l1-sec-solids', sec).appendChild(solidSeg.el);

  box.querySelectorAll('.l1-pick').forEach(b => b.addEventListener('click', () => {
    if(confirmed) return;
    const c = b.dataset.c === 'circle' ? 'circle' : +b.dataset.c;
    picked.has(c) ? picked.delete(c) : picked.add(c);
    b.setAttribute('aria-pressed', String(picked.has(c)));
  }));
  $('[data-a="reset"]', box).addEventListener('click', () => setSliders(0, 0, 50));
  $('[data-a="confirm"]', box).addEventListener('click', () => {
    if(!picked.size){ toast('단면으로 관찰되는 도형을 먼저 골라 보자!'); return; }
    confirmed = true; reveal();
  });
  // 개념 상자의 빈칸: 눌러서 확인 ([단면 확인]을 눌러도 모두 열림)
  const openBlank = b => { b.classList.add('open'); b.disabled = true; b.removeAttribute('aria-label'); };
  sec.querySelectorAll('.l1-blank').forEach(b => b.addEventListener('click', () => openBlank(b)));

  function reveal(){
    const ans = solid.answer, all = CHOICES;
    let right = 0;
    box.querySelectorAll('.l1-pick').forEach(b => {
      const c = b.dataset.c === 'circle' ? 'circle' : +b.dataset.c, isAns = ans.includes(c), on = picked.has(c);
      b.classList.toggle('ok', isAns); b.classList.toggle('ng', on && !isAns); b.classList.toggle('miss', isAns && !on);
      b.disabled = true; if(isAns === on) right++;
    });
    const perfect = right === all.length;
    $('.l1-sec-ans', box).innerHTML = `<b>✔ 정답 단면</b> — ${solid.name}의 단면: <b>${ans.map(cname).join(', ')}</b>`;
    $('.l1-sec-ans2', box).innerHTML = (perfect ? '🎉 모두 정확하게 골랐어!<br>' : '')
      + `<small>${solid.name}은(는) 면이 ${faces.length}개라서 단면의 변은 최대 ${Math.max(...ans)}개야. 굽은 면이 없으니 원은 생기지 않아.</small>`;
    $('.l1-sec-reveal', box).hidden = false;
    sec.querySelectorAll('.l1-blank').forEach(openBlank);
    $('[data-a="confirm"]', box).disabled = true;
    drawPresets(); update();
  }
  function drawPresets(){
    const host = $('.l1-sec-presets', box); host.innerHTML = '';
    solid.answer.forEach(k => {
      const b = el('button', { class:'btn', type:'button' }, L1_POLYGON[k]);
      b.addEventListener('click', () => { const p = presets[k]; if(p) setSliders(p.tx, p.tz, p.off); });
      host.appendChild(b);
    });
  }
  function load(sd){
    solid = sd;
    const data = sd.make(); faces = data.faces; verts = data.verts;
    // 3D 화면은 도형을 상자 중심으로 옮겨 그리므로 단면 계산도 같은 좌표로 맞춘다
    const bb = new T.Box3().setFromPoints(verts), c = bb.getCenter(new T.Vector3());
    verts.forEach(v => v.sub(c));
    viewer.setShape(l1Geometry(T, faces).geometry, { title:sd.name });
    viewer.setToggle('faceColor', false);
    // 각 단면 모양을 만드는 슬라이더 값 미리 찾기 (반듯하고, 처음 카메라에서 잘 보이는 모양)
    presets = {}; const camDir = new T.Vector3(0.62, 0.48, 0.92).normalize();
    for(let tx=-60;tx<=60;tx+=6) for(let tz=-60;tz<=60;tz+=6) for(let off=5;off<=95;off+=5){
      const { cap } = capFor(tx, tz, off); const k = cap.length; if(k < 3 || k > 8) continue;
      let minE = Infinity; cap.forEach((p, i) => { minE = Math.min(minE, p.distanceTo(cap[(i+1) % k])); });
      const score = minE * (0.3 + Math.abs(normalFor(tx, tz).dot(camDir)));
      if(!presets[k] || score > presets[k].score) presets[k] = { tx, tz, off, score };
    }
    made.clear(); picked.clear(); confirmed = false; cheered = false;
    box.querySelectorAll('.l1-pick').forEach(b => { b.classList.remove('ok', 'ng', 'miss'); b.disabled = false; b.setAttribute('aria-pressed', 'false'); });
    $('.l1-sec-reveal', box).hidden = true; $('[data-a="confirm"]', box).disabled = false;
    setSliders(0, 0, 50);
  }
  function update(){
    const { n, d, cap } = capFor(st.tx, st.tz, st.off);
    planeMesh.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), n);
    planeMesh.position.copy(n).multiplyScalar(d);
    secGroup.children.slice().forEach(o => { secGroup.remove(o); l1Dispose(o); });
    const k = cap.length;
    if(k >= 3){
      secGroup.add(H.polyMesh(cap, '#C62828', 0.88, false, 0));
      cap.forEach((p, i) => { secGroup.add(H.tube2(p, cap[(i+1) % k], 0.022, '#7F0000', false)); secGroup.add(H.dot2(p, 0.04, '#7F0000', false)); });
      made.add(k);
    }
    $('.l1-sec-shape', box).innerHTML = k >= 3 ? `단면: <b>${L1_POLYGON[k] || k + '각형'}</b> <small>(변 ${k}개)</small>` : '단면이 없어';
    $('.l1-check', box).innerHTML = solid.answer.map(m => `<li class="${made.has(m) ? 'done' : ''}">${made.has(m) ? '✓' : '○'} ${L1_POLYGON[m]}</li>`).join('');
    if(confirmed && solid.answer.every(m => made.has(m)) && !cheered){ cheered = true; toast(`🎉 ${solid.name}의 단면을 모두 만들었어! 단면은 모두 다각형이었지?`); }
    viewer.requestRender();
  }
  load(SOLIDS[0]);
}

/* =====================================================================
   시뮬레이션 ① 각뿔을 잘라 각뿔대 만들기 ★
   ===================================================================== */
function l1FaceSVG(T, H, face, tilt){
  const f = l1CleanFace(face, 1e-4); const m = f.length;
  let bi = 0, ti = 0, by = Infinity, ty = -Infinity;
  for(let i=0;i<m;i++){ const y = (f[i].y + f[(i+1) % m].y) / 2; if(y < by){ by = y; bi = i; } if(y > ty){ ty = y; ti = i; } }
  const nrm = H.normalOf(f);
  const u = f[(bi+1) % m].clone().sub(f[bi]).normalize();
  const v = new T.Vector3().crossVectors(nrm, u).normalize(); if(v.y < 0) v.negate();
  const p2 = f.map(p => [p.dot(u), p.dot(v)]);
  const xs = p2.map(p => p[0]), ys = p2.map(p => p[1]);
  const W = 300, HH = 180, pad = 34;
  const sc = Math.min((W - 2*pad) / (Math.max(...xs) - Math.min(...xs)), (HH - 2*pad) / (Math.max(...ys) - Math.min(...ys)));
  const ox = (W - (Math.max(...xs) - Math.min(...xs)) * sc) / 2, oy = (HH - (Math.max(...ys) - Math.min(...ys)) * sc) / 2;
  const P = p => [ox + (p[0] - Math.min(...xs)) * sc, HH - (oy + (p[1] - Math.min(...ys)) * sc)];
  const S = p2.map(P);
  const dB = f[(bi+1) % m].clone().sub(f[bi]).normalize(), dT = f[(ti+1) % m].clone().sub(f[ti]).normalize();
  const parallel = Math.abs(Math.abs(dB.dot(dT)) - 1) < 1e-3;
  const seg = (i, color) => { const a = S[i], b = S[(i+1) % m]; return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${color}" stroke-width="5" stroke-linecap="round"/>`; };
  const chev = (i, dy) => { const a = S[i], b = S[(i+1) % m]; const x = (a[0] + b[0]) / 2, y = (a[1] + b[1]) / 2;
    return `<path d="M${x-6} ${y-6} L${x+3} ${y} L${x-6} ${y+6} M${x+2} ${y-6} L${x+11} ${y} L${x+2} ${y+6}" fill="none" stroke="#1F2A44" stroke-width="2.4"/>
            <text x="${x}" y="${y + dy}" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">${dy > 0 ? '아랫변' : '윗변'}</text>`; };
  const svg = `<svg viewBox="0 0 ${W} ${HH}" role="img" aria-label="펼친 옆면의 모양">
      <polygon points="${S.map(p => p.join(',')).join(' ')}" fill="#FFE0B2" stroke="#E65100" stroke-width="2.5" stroke-linejoin="round"/>
      ${seg(bi, '#3949AB')}${seg(ti, '#3949AB')}
      ${parallel ? chev(bi, 24) + chev(ti, -14) : `<text x="${W/2}" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#C62828">위아래 두 변이 평행하지 않아</text>`}
    </svg>`;
  let text;
  if(!tilt) text = '펼친 옆면은 <b>위아래 두 변이 평행한 사각형</b>, 곧 <b>사다리꼴</b>이야! (▶▶ 표시는 평행하다는 뜻)';
  else if(parallel) text = '이 옆면은 마침 위아래 두 변이 평행해. 하지만 다른 옆면은 그렇지 않고, 무엇보다 <b>두 밑면이 평행하지 않으니</b> 이 도형은 각뿔대가 아니야.';
  else text = '이 옆면은 위아래 두 변이 <b>평행하지 않아</b>서 사다리꼴이 아니야. 기울여 자르면 각뿔대가 생기지 않아!';
  return { svg, text, parallel };
}

async function l1SetupFrustum(wrap){
  wrap.innerHTML = `
    <div class="l0-note l1-fr-msg" aria-live="polite"></div>
    <div class="l0-gal-grid">
      <div>
        <div class="l1-fr-viewer"></div>
      </div>
      <div class="l0-side">
        <div class="l1-big l1-fr-namebox" aria-live="polite"><span class="l1-fr-name">오각뿔</span><small class="l1-fr-sec">단면: 오각형</small></div>
        <div class="l1-fr-sliders"></div>
        <div class="sim-row l1-fr-cutrow">
          <button class="btn primary" type="button" data-a="cut">✂️ 자르기</button>
          <button class="btn" type="button" data-a="undo" disabled>↩️ 되돌리기</button>
        </div>
        <button class="btn ghost l1-tilt" type="button" aria-pressed="false">📐 선택 활동: 기울여 자르기 <span class="tb">꺼짐</span></button>
      </div>
    </div>`;
  const msg = $('.l1-fr-msg', wrap);
  const cutBtn = $('[data-a="cut"]', wrap), undoBtn = $('[data-a="undo"]', wrap), tiltBtn = $('.l1-tilt', wrap);

  const st = { n:5, t:50, tilt:false, cut:false, sep:0, target:0, pendingUncut:false, res:null, triFace:null };
  const sl = {
    n:createSlider({ label:'밑면의 변의 수', min:3, max:8, step:1, value:5, format:v => `${v} (${L0_POLY[v]}뿔)`, onInput:v => { st.n = v; rebuild(); } }),
    t:createSlider({ label:'절단면의 위치', min:25, max:75, step:1, value:50, format:v => `밑면에서 높이의 ${v}%`, onInput:v => { st.t = v; rebuild(); } }),
  };
  $('.l1-fr-sliders', wrap).append(sl.n.el, sl.t.el);

  const viewer = await create3DViewer($('.l1-fr-viewer', wrap), { title:'오각뿔', infoInline:true, showInfo:false, tools:['autoRotate', 'reset', 'faceColor', 'edges', 'vertices', 'transparent'] });
  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T);
  const R = 1.3, HH = 2.2, TILT = 22 * Math.PI / 180;
  const stage = new T.Group(); viewer.extras.add(stage);
  let topGroup = null;
  const ease = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;

  function cutPlane(pyr){
    const yc = -HH/2 + HH * st.t / 100;
    const n = st.tilt ? new T.Vector3(0, Math.cos(TILT), Math.sin(TILT)) : new T.Vector3(0, 1, 0);
    const P0 = new T.Vector3(pyr.apex.x, yc, pyr.apex.z);
    return { n, d:n.dot(P0), P0 };
  }
  function clearStage(){
    stage.children.slice().forEach(o => { stage.remove(o); l1Dispose(o); });
    topGroup = null;
  }
  function rebuild(first){
    clearStage();
    const pyr = l1Pyramid(T, st.n, R, HH);
    const { n, d, P0 } = cutPlane(pyr);
    const res = l1Clip(T, pyr.faces, n, d);
    const poly = L0_POLY[st.n];
    if(!st.cut){
      const g = l1Geometry(T, pyr.faces);
      viewer.setShape(g.geometry, { title:`${poly}뿔`, keepView:!first });
      st.res = null; st.triFace = null;
      const pm = new T.Mesh(new T.PlaneGeometry(3.4, 3.4), H.mat('#42A5F5', 0.2, true));
      pm.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), n); pm.position.copy(P0); pm.renderOrder = 6;
      pm.add(new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(3.4, 3.4)), new T.LineBasicMaterial({ color:0x1E88E5, transparent:true, opacity:0.6 })));
      stage.add(pm);
      if(res.cap.length >= 3){
        stage.add(H.polyMesh(res.cap, '#5E35B1', 0.85, false, 0));
        res.cap.forEach((p, i) => stage.add(H.tube2(p, res.cap[(i+1) % res.cap.length], 0.025, '#311B92', false)));
        const maxX = Math.max(...res.cap.map(p => p.x));
        stage.add(H.label2('단면', new T.Vector3(maxX + 0.45, H.centroid(res.cap).y, 0.2), 0.85));
      }
    }else{
      const g = l1Geometry(T, res.below, pyr.verts);
      viewer.setShape(g.geometry, { title:st.tilt ? '잘린 입체도형' : `${poly}뿔대`, keepView:true });
      st.res = res; st.triFace = g.triFace;
      topGroup = new T.Group();
      const tg = l1Geometry(T, res.above).geometry;
      topGroup.add(new T.Mesh(tg, new T.MeshPhongMaterial({ color:'#D1C4E9', transparent:true, opacity:0.78, side:T.DoubleSide, flatShading:true, depthWrite:false })));
      topGroup.add(new T.LineSegments(new T.EdgesGeometry(tg, 15), new T.LineBasicMaterial({ color:0x4527A0 })));
      topGroup.position.y = ease(st.sep) * 1.1;
      stage.add(topGroup);
    }
    ui(res);
  }
  function ui(res){
    const poly = L0_POLY[st.n], k = res.cap.length;
    const secName = L1_POLYGON[k] || `${k}각형`;
    $('.l1-fr-sec', wrap).textContent = `단면: ${secName}${st.tilt ? ' (밑면과 닮지 않음)' : ' (밑면과 닮은 모양)'}`;
    const done = st.cut && st.target === 1 && st.sep === 1;
    const name = $('.l1-fr-name', wrap);
    const nb = $('.l1-fr-namebox', wrap);
    if(!st.cut){ name.textContent = `${poly}뿔`; nb.className = 'l1-big l1-fr-namebox'; }
    else if(st.tilt){ name.textContent = '✗ 각뿔대가 아니야'; nb.className = 'l1-big l1-fr-namebox bad'; }
    else { name.textContent = `${poly}뿔 ✂️ → ${poly}뿔대`; nb.className = 'l1-big l1-fr-namebox good'; }
    if(!st.cut){
      msg.innerHTML = st.tilt
        ? `절단면이 밑면과 <b>평행하지 않아</b>. 단면이 밑면(${L1_POLYGON[st.n]})과 닮은 모양이 아니지? 이대로 잘라 보면 어떻게 될까?`
        : `절단면이 밑면과 <b>평행</b>해. 단면은 밑면과 닮은 <b>${secName}</b>이야. 절단면을 위아래로 움직여 보고, [✂️ 자르기]를 눌러 보자!`;
    }else if(st.tilt){
      msg.innerHTML = `아래에 남은 도형은 위와 아래의 면이 <b>평행하지 않아서 각뿔대가 아니야</b>. 각뿔대를 만들려면 반드시 <b>밑면에 평행하게</b> 잘라야 해!`;
    }else{
      msg.innerHTML = `✂️ 위쪽의 작은 <b>${poly}뿔</b>이 떨어져 나갔어. 아래에 남은 입체도형이 바로 <b>${poly}뿔대</b>야!<br>
        두 밑면은 서로 평행하고, 위의 밑면이 더 작아. <b>각뿔대 탐색</b>에서 구성 요소와 특징을 자세히 살펴보자.`;
    }
    cutBtn.disabled = st.cut; undoBtn.disabled = !st.cut;
    viewer.setInfoLock && viewer.setInfoLock(!st.cut);   // 개수 보기: 자른 뒤에 켜짐
  }
  viewer.onFrame((dt) => {
    if(st.sep === st.target) return false;
    const step = L0_REDUCED_MOTION ? 1 : dt / 0.9;
    st.sep = st.target > st.sep ? Math.min(st.target, st.sep + step) : Math.max(st.target, st.sep - step);
    if(topGroup) topGroup.position.y = ease(st.sep) * 1.1;
    if(st.sep === 0 && st.pendingUncut){ st.pendingUncut = false; st.cut = false; rebuild(); }
    else if(st.sep === st.target && st.res) ui(st.res);
    return true;
  });
  cutBtn.addEventListener('click', () => { if(st.cut) return; st.cut = true; st.sep = 0; st.target = 1; rebuild(); });
  undoBtn.addEventListener('click', () => {
    if(!st.cut) return;
    st.target = 0; st.pendingUncut = true; viewer.requestRender();
  });
  tiltBtn.addEventListener('click', () => {
    st.tilt = !st.tilt;
    tiltBtn.setAttribute('aria-pressed', String(st.tilt)); $('.tb', tiltBtn).textContent = st.tilt ? '켜짐' : '꺼짐';
    st.cut = false; st.sep = 0; st.target = 0; st.pendingUncut = false; rebuild();
  });
  rebuild(true);
}

  const PARTS = [['bases', '두 밑면', '#FFB300'], ['sides', '옆면', '#00ACC1'], ['height', '높이', '#3949AB'], ['extend', '옆모서리 연장', '#8E24AA']];
  const partBtns = PARTS.map(([k, label, color]) => {

      { q:'옆면은 어떤 모양일까?', opts:['직사각형', '사다리꼴', '삼각형'], a:1, part:'sides',
        why:'옆면은 위아래 두 변이 평행한 사각형, 곧 <b>사다리꼴</b>이야. 옆면을 눌러 펼친 모양도 확인해 봐!' },
      { q:`${poly}뿔대의 옆면은 몇 개일까?`, opts:[`${n}개`, `${n + 1}개`, `${n + 2}개`], a:0, part:'sides',
        why:`밑면의 변 하나마다 옆면이 하나씩 있어서 옆면은 <b>${n}개</b>야. (면은 모두 ${n} + 2 = ${n + 2}개)` },
      { q:'옆모서리를 위로 연장하면 어떻게 될까?', opts:['한 점에서 만난다', '서로 평행하게 나아간다'], a:0, part:'extend',
        why:'옆모서리를 연장하면 잘려 나간 각뿔의 꼭짓점, 곧 <b>한 점</b>에서 모두 만나. 각뿔대가 각뿔에서 나왔다는 증거야!' },
      { q:'두 밑면 사이의 거리를 무엇이라고 할까?', opts:['높이', '모서리'], a:0, part:'height',
        why:'두 밑면에 수직인 선분의 길이, 곧 두 밑면 사이의 거리를 각뿔대의 <b>높이</b>라고 해.' },

        <p class="q"><span class="no">${i + 1}</span>${x.q}</p>

          card.querySelectorAll('[data-j]').forEach(y => { y.disabled = true; if(y === b) y.setAttribute('aria-pressed', 'true'); });
          $('.fb', card).innerHTML = '✓ ' + x.why;
          score.textContent = `${solved.size} / ${F.length}`;
          if(solved.size === F.length) toast('🎉 각뿔대의 특징을 모두 찾았어!');
        }else{
          card.classList.remove('ng'); void card.offsetWidth; card.classList.add('ng');
          $('.fb', card).innerHTML = '✗ 다시 생각해 보자. 3D 화면에서 반짝이는 부분을 돌려 보며 살펴봐!';
        }
      }));
    });
  }
  /* 밑면의 변의 수가 바뀌면 처음 상태로: 생각 상자·특징 살피기 숨기기 */
  function resetExplore(){
    const think = $('.l1-think', wrap); think.hidden = true;
    hint.hidden = true; hintBtn.setAttribute('aria-expanded', 'false'); hintBtn.textContent = '💡 힌트 보기';
    featBox.hidden = true; featBtn.setAttribute('aria-expanded', 'false'); featBtn.textContent = '🔍 특징 확인하기';
    solved.clear(); renderCards();
  }
  $('[data-a="freset"]', wrap).addEventListener('click', () => { solved.clear(); blink.clear(); partBtns.forEach(b => b.setAttribute('aria-pressed', 'false')); renderCards(); });
  build(true); renderCards();
}

/* ---------- 여담: 마스타바 3층 쌓기 ---------- */
async function l1SetupMastaba(holder, btn){
  const viewer = await create3DViewer(holder, { showInfo:false, tools:['autoRotate', 'reset'] });
  if(!viewer.ok) return;
  const T = viewer.THREE;
  const ground = new T.Mesh(new T.BoxGeometry(3, 0.06, 3), new T.MeshPhongMaterial({ color:'#F3E0B5' }));
  ground.position.y = -0.63; viewer.extras.add(ground);
  const L = [[1.15, 0.95, 0.38], [0.82, 0.64, 0.35], [0.56, 0.38, 0.32]];
  const colors = ['#E8C27A', '#E0B566', '#D6A752'];
  let y = -0.6; const layers = [];
  L.forEach(([rb, rt, h], i) => {
    const geo = new T.CylinderGeometry(rt, rb, h, 4, 1).rotateY(Math.PI / 4);
    const m = new T.Mesh(geo, new T.MeshPhongMaterial({ color:colors[i], flatShading:true }));
    m.add(new T.LineSegments(new T.EdgesGeometry(geo), new T.LineBasicMaterial({ color:0x7A5A1E })));
    const rest = y + h / 2; y += h;
    m.userData = { rest, i }; m.position.y = rest + 3; m.visible = false;
    viewer.extras.add(m); layers.push(m);
  });
  viewer.resetView();
  let t = 0, running = true;
  viewer.onFrame(dt => {
    if(!running) return false;
    t += L0_REDUCED_MOTION ? 10 : dt;
    let done = true;
    layers.forEach(m => {
      const local = (t - m.userData.i * 0.8) / 0.7;
      if(local <= 0){ m.visible = false; done = false; return; }
      m.visible = true;
      const k = Math.min(1, local); const e = 1 - Math.pow(1 - k, 3);
      m.position.y = m.userData.rest + 3 * (1 - e);
      if(k < 1) done = false;
    });
    if(done) running = false;
    return true;
  });
  btn.addEventListener('click', () => { t = 0; running = true; viewer.requestRender(); });
}

    <div class="l1-cmp-more" hidden>
    <div class="l1-table-wrap"></div>
    <div class="sim-row l1-cmp-checkrow"><button class="btn" type="button" data-a="clear">↺ 다시 풀기</button><button class="btn primary" type="button" data-a="check">✓ 확인</button></div>
    <div class="l1-cmp-fb" aria-live="polite"></div>
    <div class="l1-discover">
      <h5>🔍 무엇을 발견했니? 표를 보고 <b>맞는 문장을 모두</b> 골라 보자.</h5>
      <div class="l1-disc-list"></div>
      <div class="sim-row l1-disc-row"><button class="btn" type="button" data-a="dreset">↺ 다시 하기</button><button class="btn primary" type="button" data-a="disc">✓ 확인하기</button></div>
      <div class="l1-disc-fb" aria-live="polite"></div>
    </div>
    </div>`;
  const st = { n:4, mode:'solve', focus:false, sync:true };
  const caps = KINDS.map(k => $(`.l1-cmp-cap[data-k="${k.key}"]`, wrap));
  const fb = $('.l1-cmp-fb', wrap);

  /* 표 */
  const ROWS = [
    { key:'base', label:'밑면의 모양과 개수', type:'select',
      opts:n => [['', '고르기'], ['one', `${L1_POLYGON[n]} 1개`], ['same', `${L1_POLYGON[n]} 2개 (합동)`], ['diff', `${L1_POLYGON[n]} 2개 (크기가 다름)`]],
      ans:{ prism:'same', pyr:'one', fr:'diff' } },
    { key:'side', label:'옆면의 모양', type:'select',
      opts:() => [['', '고르기'], ['직사각형', '직사각형'], ['삼각형', '삼각형'], ['사다리꼴', '사다리꼴'], ['정사각형', '정사각형']],
      ans:{ prism:'직사각형', pyr:'삼각형', fr:'사다리꼴' } },
    { key:'F', label:'면의 개수', type:'num', tex:{ prism:'n+2', pyr:'n+1', fr:'n+2' }, f:{ prism:n => n+2, pyr:n => n+1, fr:n => n+2 } },
    { key:'E', label:'모서리의 개수', type:'num', tex:{ prism:'3n', pyr:'2n', fr:'3n' }, f:{ prism:n => 3*n, pyr:n => 2*n, fr:n => 3*n } },
    { key:'V', label:'꼭짓점의 개수', type:'num', tex:{ prism:'2n', pyr:'n+1', fr:'2n' }, f:{ prism:n => 2*n, pyr:n => n+1, fr:n => 2*n } },
  ];
  const focusRows = ['base', 'side', 'F'];
  const answerText = (row, k, n) => row.type === 'select'
    ? row.opts(n).find(o => o[0] === row.ans[k])[1]
    : `$${row.tex[k]}$ → <b>${row.f[k](n)}개</b>`;
  function renderTable(){
    const n = st.n;
    const names = KINDS.map(k => `${L0_POLY[n]}${k.suffix}`);
    let html = `<table class="l1-cmp-table"><caption class="sr-only">${names.join(', ')} 비교표</caption>
      <thead><tr><th scope="col">항목</th>${KINDS.map((k, i) => `<th scope="col">$n$각${k.suffix}<br><small>${names[i]}</small></th>`).join('')}</tr></thead><tbody>`;
    ROWS.forEach(row => {
      const fr = st.focus && focusRows.includes(row.key);
      html += `<tr class="${fr ? 'focus' : ''}" data-row="${row.key}"><th scope="row">${fr ? '📘 ' : ''}${row.label}</th>`;
      KINDS.forEach((k, i) => {
        const id = `l1c-${row.key}-${k.key}`;
        if(st.mode === 'answer') html += `<td class="ans">${answerText(row, k.key, n)}</td>`;
        else if(row.type === 'select'){
          html += `<td data-c="${row.key}|${k.key}"><select id="${id}" aria-label="${names[i]}의 ${row.label}">${row.opts(n).map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select><span class="mk"></span></td>`;
        }else{
          html += `<td data-c="${row.key}|${k.key}"><input id="${id}" type="text" inputmode="numeric" autocomplete="off" placeholder="?" aria-label="${names[i]}의 ${row.label}"><span class="unit">개</span><span class="mk"></span></td>`;
        }
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
    $('.l1-table-wrap', wrap).innerHTML = html;
    renderMath($('.l1-table-wrap', wrap));
    $('[data-a="check"]', wrap).disabled = st.mode === 'answer';
    $('[data-a="clear"]', wrap).disabled = st.mode === 'answer';
    fb.innerHTML = st.mode === 'answer' ? '👀 정답을 보고 있어. 3D 화면의 <b>📋 개수 보기</b>를 켜서 개수를 직접 확인해 봐도 좋아.' : '';
  }
  function check(){
    let right = 0, total = 0, empty = 0;
    wrap.querySelectorAll('td[data-c]').forEach(td => {
      const [rk, kk] = td.dataset.c.split('|'); const row = ROWS.find(r => r.key === rk);
      if(st.focus && !focusRows.includes(rk)) { td.classList.remove('ok', 'ng'); $('.mk', td).textContent = ''; return; }
      const inp = td.querySelector('select, input'); const val = inp.value.trim();
      total++;
      if(!val){ empty++; td.classList.remove('ok', 'ng'); $('.mk', td).textContent = ''; return; }
      const ok = row.type === 'select' ? val === row.ans[kk] : toNumber(normalizeAnswer(val)) === row.f[kk](st.n);
      td.classList.toggle('ok', ok); td.classList.toggle('ng', !ok);
      $('.mk', td).textContent = ok ? '✓' : '✗';
      if(ok) right++;
    });
    if(right === total){
      fb.innerHTML = `🎉 <b>${total}칸 모두 정답!</b> 각기둥·각뿔·각뿔대의 특징을 완벽하게 비교했어.`;
      if(st.focus) celebrate();
    }else{
      fb.innerHTML = `${total}칸 중 <b>${right}칸</b> 정답!${empty ? ` (빈칸 ${empty}개)` : ''} ✗ 표시된 칸을 3D 모델을 돌려 보며 다시 세어 보자.`;
    }
  }
  // [정답 보기]: 누를 때마다 정답 보기 ↔ 직접 풀기
  const ansBtn = $('[data-m="answer"]', wrap);
  ansBtn.addEventListener('click', () => {
    st.mode = st.mode === 'answer' ? 'solve' : 'answer';
    ansBtn.setAttribute('aria-pressed', String(st.mode === 'answer'));
    ansBtn.textContent = st.mode === 'answer' ? '✏️ 다시 풀기로' : '👀 정답 보기';
    renderTable();
  });
  $('[data-a="check"]', wrap).addEventListener('click', check);
  $('[data-a="clear"]', wrap).addEventListener('click', renderTable);

  /* 발견 문장 고르기 */
  const DISC = [
    { t:'각뿔대는 각기둥처럼 밑면이 2개지만, 두 밑면의 크기가 다르다.', ok:true, why:'각뿔대의 위 밑면은 아래 밑면보다 작아.' },
    { t:'각뿔대의 옆면은 모두 사다리꼴이다.', ok:true, why:'두 밑면이 평행해서 옆면의 위아래 변이 평행해.' },
    { t:'$n$각뿔대의 모서리와 꼭짓점의 개수는 $n$각기둥과 같다.', ok:true, why:'모서리 $3n$개, 꼭짓점 $2n$개로 같아.' },
    { t:'$n$각뿔대의 면의 개수는 $n$각뿔보다 1개 많다.', ok:true, why:'$n$각뿔대는 $(n+2)$개, $n$각뿔은 $(n+1)$개야.' },
    { t:'각뿔대의 두 밑면은 서로 합동이다.', ok:false, why:'두 밑면은 평행하지만 크기가 달라서 합동이 아니야.' },
    { t:'각뿔대에도 각뿔처럼 뾰족한 꼭짓점이 하나 있다.', ok:false, why:'뾰족한 꼭대기 부분은 잘려 나가서 없어.' },

    b.classList.remove('ok', 'ng', 'miss'); $('.r', b).textContent = '';
  }));
  $('[data-a="disc"]', wrap).addEventListener('click', () => {
    let good = 0;
    list.querySelectorAll('.l1-disc').forEach(b => {
      const d = DISC[+b.dataset.i], on = b.getAttribute('aria-pressed') === 'true';
      b.classList.remove('ok', 'ng', 'miss');
      let cls, txt;
      if(on && d.ok){ cls = 'ok'; txt = `✓ 맞아! ${d.why}`; good++; }
      else if(on && !d.ok){ cls = 'ng'; txt = `✗ 틀린 문장이야. ${d.why}`; }
      else if(!on && d.ok){ cls = 'miss'; txt = `⚠ 이 문장도 맞아. ${d.why}`; }
      else { cls = ''; txt = ''; good++; }
      if(cls) b.classList.add(cls);
      $('.r', b).innerHTML = txt;
    });
    renderMath(list);
    $('.l1-disc-fb', wrap).innerHTML = good === DISC.length
      ? '🎉 <b>완벽해!</b> 각뿔대는 각기둥과 각뿔의 특징을 조금씩 닮았어.'
      : `${DISC.length}개 중 ${good}개를 바르게 판단했어. 표시를 보고 다시 골라 보자.`;
  });

  /* 3D 뷰어 3개 */
  const slider = createSlider({ label:'밑면의 변의 수 $n$', min:3, max:8, step:1, value:st.n, format:v => `${v} (${L1_POLYGON[v]})`,
    onInput:v => { if(v === st.n) return; st.n = v; draw(); resetObserve(); } });
  $('.l1-cmp-slider', wrap).appendChild(slider.el);
  renderMath(slider.el);
  /* 관찰 확인하기: 누르면 표·발견 문장이 나타남. n을 바꾸면 처음 상태로 */
  const more = $('.l1-cmp-more', wrap), openBtn = $('[data-a="open"]', wrap);
  function setOpen(open){
    more.hidden = !open; openBtn.setAttribute('aria-expanded', String(open));
    openBtn.textContent = open ? '🙈 관찰 확인 닫기' : '🔍 관찰 확인하기';
    openBtn.classList.toggle('l0c-checkbtn', !open); openBtn.classList.toggle('quiz-next', open);   // 닫기: 같은 보라 테두리의 연한 음영
    ansBtn.hidden = !open;
  }
  openBtn.addEventListener('click', () => { setOpen(more.hidden); if(!more.hidden) more.scrollIntoView({ behavior:'smooth', block:'nearest' }); });
  function resetDisc(){
    list.querySelectorAll('.l1-disc').forEach(b => { b.setAttribute('aria-pressed', 'false'); $('.bx', b).textContent = '☐'; b.classList.remove('ok', 'ng', 'miss'); $('.r', b).textContent = ''; });
    $('.l1-disc-fb', wrap).innerHTML = '';
  }
  $('[data-a="dreset"]', wrap).addEventListener('click', resetDisc);
  function resetObserve(){
    setOpen(false);
    st.mode = 'solve'; st.focus = false; ansBtn.setAttribute('aria-pressed', 'false'); ansBtn.textContent = '👀 정답 보기';
    renderTable(); fb.innerHTML = ''; resetDisc();
  }
  renderTable();

  const viewers = await Promise.all(KINDS.map(k => create3DViewer($(`.l1-cmp-v[data-k="${k.key}"]`, wrap), { showInfo:false, tools:['autoRotate', 'reset', 'info'], toolLabels:{ reset:'🎯 처음 위치' } })));
  function draw(first){
    KINDS.forEach((k, i) => {
      caps[i].textContent = `${L0_POLY[st.n]}${k.suffix}`;
      const v = viewers[i]; if(!v || !v.ok) return;
      v.setShape(l1Geometry(v.THREE, k.make(v.THREE, st.n).faces).geometry, { title:`${L0_POLY[st.n]}${k.suffix}`, keepView:!first });
    });
  }
  let syncing = false;
  viewers.forEach((v, i) => {
    if(!v.ok) return;
    v.controls.addEventListener('change', () => {
      if(!st.sync || syncing) return;
      syncing = true;
      viewers.forEach((w, j) => {
        if(j === i || !w.ok) return;
        w.camera.position.copy(v.camera.position); w.controls.target.copy(v.controls.target);
        w.controls.update(); w.requestRender();
      });
      syncing = false;
    });
  });
  const syncBtn = $('.l1-sync', wrap);
  syncBtn.addEventListener('click', () => {
    st.sync = !st.sync; syncBtn.setAttribute('aria-pressed', String(st.sync)); $('.tb', syncBtn).textContent = st.sync ? '켜짐' : '꺼짐';
    toast(st.sync ? '🔗 이제 하나를 돌리면 세 도형이 함께 돌아가!' : '세 도형을 따로따로 돌릴 수 있어.');
  });
  draw(true);
}

/* =====================================================================
   2. 정다면체 (lesson-2)  ※ 전개도·퀴즈는 다음 단계에서 추가
   ---------------------------------------------------------------------
   생각 열기 : 세 다면체 비교(질문 2개 + 꼭짓점 눌러 면 세기) → l2SetupThink()
   개념      : 정다면체의 두 조건 + 생각 상자          → l2SetupWhyNot()
   시뮬레이션: 한 꼭짓점에 정다각형 모으기 ★            → l2SetupVertexSim()
               (면 고르기 → 개수 → 접어 올리기 → 완성하기 → 도전 기록표)
   ===================================================================== */
const L2_POLYS = {
  3:{ name:'정삼각형', angle:60,  color:'#FFB74D', icon:'△' },
  4:{ name:'정사각형', angle:90,  color:'#4FC3F7', icon:'□' },
  5:{ name:'정오각형', angle:108, color:'#AED581', icon:'⬠' },
  6:{ name:'정육각형', angle:120, color:'#F48FB1', icon:'⬡' },
};
const L2_SOLIDS = {
  '3-3':{ name:'정사면체',   kind:'tetra',  faces:4 },
  '3-4':{ name:'정팔면체',   kind:'octa',   faces:8 },
  '3-5':{ name:'정이십면체', kind:'icosa',  faces:20 },
  '4-3':{ name:'정육면체',   kind:'cube',   faces:6 },
  '5-3':{ name:'정십이면체', kind:'dodeca', faces:12 },
};
const L2_ORDER = ['정사면체', '정육면체', '정팔면체', '정십이면체', '정이십면체'];

/* ---------- 다면체 데이터 ---------- */
function l2CenterFaces(T, faces){
  const box = new T.Box3(); faces.flat().forEach(p => box.expandByPoint(p));
  const c = box.getCenter(new T.Vector3());
  const map = new Map();
  return faces.map(f => f.map(p => { if(!map.has(p)) map.set(p, p.clone().sub(c)); return map.get(p); }));
}
function l2ThinkSolids(T){
  // ① 정팔면체
  const r = 1.15, X = [new T.Vector3(r,0,0), new T.Vector3(-r,0,0)], Y = [new T.Vector3(0,r,0), new T.Vector3(0,-r,0)], Z = [new T.Vector3(0,0,r), new T.Vector3(0,0,-r)];
  const octa = [];
  for(const x of X) for(const y of Y) for(const z of Z) octa.push([x, y, z]);
  // ② 정삼각형 6개로 된 쌍삼각뿔
  const s = 1.5, R = s / Math.sqrt(3), h = s * Math.sqrt(2/3);
  const E = [0, 1, 2].map(k => { const a = Math.PI/2 + 2*Math.PI*k/3; return new T.Vector3(R*Math.cos(a), 0, R*Math.sin(a)); });
  const top = new T.Vector3(0, h, 0), bot = new T.Vector3(0, -h, 0);
  const bip = [];
  for(let k=0;k<3;k++){ const j = (k+1) % 3; bip.push([E[k], E[j], top], [E[j], E[k], bot]); }
  // ③ 정사각형 밑면의 각기둥(정육면체) 위에 정삼각형 4개로 된 사각뿔을 올린 모양
  const a = 1.2, V = (x, y, z) => new T.Vector3(x*a/2, y, z*a/2);
  const B = [V(-1,-a/2,-1), V(1,-a/2,-1), V(1,-a/2,1), V(-1,-a/2,1)], U = [V(-1,a/2,-1), V(1,a/2,-1), V(1,a/2,1), V(-1,a/2,1)];
  const apex = new T.Vector3(0, a/2 + a/Math.SQRT2, 0);
  const esp = [B.slice().reverse()];
  for(let k=0;k<4;k++){ const j = (k+1) % 4; esp.push([B[k], B[j], U[j], U[k]]); esp.push([U[k], U[j], apex]); }
  return [l2CenterFaces(T, octa), l2CenterFaces(T, bip), l2CenterFaces(T, esp)];
}
/** 정다면체의 면 목록(한 모서리 길이 = edge) */
function l2Platonic(T, kind, edge=1){
  const src = { tetra:new T.TetrahedronGeometry(1, 0), cube:new T.BoxGeometry(1, 1, 1), octa:new T.OctahedronGeometry(1, 0),
                dodeca:new T.DodecahedronGeometry(1, 0), icosa:new T.IcosahedronGeometry(1, 0) }[kind];
  const g = src.index ? src.toNonIndexed() : src;
  const pos = g.attributes.position, groups = new Map();
  const a = new T.Vector3(), b = new T.Vector3(), c = new T.Vector3();
  for(let i=0;i<pos.count;i+=3){
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i+1); c.fromBufferAttribute(pos, i+2);
    const n = new T.Vector3().crossVectors(b.clone().sub(a), c.clone().sub(a)).normalize();
    const key = [n.x, n.y, n.z, n.dot(a)].map(v => (Math.round(v*1000)/1000 + 0).toFixed(3)).join(',');
    if(!groups.has(key)) groups.set(key, { n, pts:[] });
    groups.get(key).pts.push(a.clone(), b.clone(), c.clone());
  }
  src.dispose(); if(g !== src) g.dispose();
  const faces = [...groups.values()].map(gr => l1SortAround(T, l1Uniq(gr.pts, 1e-4), gr.n));
  const e = faces[0][0].distanceTo(faces[0][1]);
  return faces.map(f => f.map(p => p.multiplyScalar(edge / e)));
}

  const DESC = ['정삼각형 8개', '정삼각형 6개', '정사각형 5개 + 정삼각형 4개'];
  const QUESTIONS = [
    { q:'<b>모든 면이 합동</b>인 다면체인가요?', tag:'모든 면이 합동이다.', ans:[0, 1],
      ok:'맞아! ①은 정삼각형 8개, ②는 정삼각형 6개로 모든 면이 합동이야. ③은 정사각형과 정삼각형이 섞여 있어서 합동이 아니야.' },
    { q:'<b>각 꼭짓점에 모인 면의 개수가 모두 같은</b> 다면체인가요?', tag:'각 꼭짓점에 모인 면의 개수가 같다.', ans:[0],
      ok:'맞아! ①은 어느 꼭짓점이든 면이 4개씩 모여. ②는 3개인 곳과 4개인 곳이, ③은 3개인 곳과 4개인 곳이 있어.' },
  ];
  box.innerHTML = `
    <div class="l2-q-line">
      <div class="l2-q-tabs" role="tablist" aria-label="질문">
        ${QUESTIONS.map((q, i) => `<button role="tab" type="button" class="btn" aria-selected="${i === 0}" data-q="${i}">질문 ${i + 1}</button>`).join('')}
      </div>
      <p class="l2-q-text" aria-live="polite"></p>
      <span class="l2-q-hint" aria-live="polite"></span>
    </div>
    <div class="l1-cmp-grid l2-think-grid">
      ${[0, 1, 2].map(i => `<figure class="l1-cmp-fig l2-think-fig" data-i="${i}">
          <div class="l2-ox" role="group" aria-label="도형 ${'①②③'[i]} 판별"><button class="btn ox-btn" type="button" data-v="1" aria-pressed="false" aria-label="도형 ${'①②③'[i]}: 그래요">${OX_O}</button><button class="btn ox-btn" type="button" data-v="0" aria-pressed="false" aria-label="도형 ${'①②③'[i]}: 아니에요">${OX_X}</button></div>
          <figcaption class="l1-cmp-cap">도형 ${'①②③'[i]} <small>(${DESC[i]})</small></figcaption>
          <p class="l2-vtx-info" aria-live="polite"></p>
          <div class="l2-think-v"></div>
          <div class="l2-tags" aria-live="polite"></div>
        </figure>`).join('')}
    </div>
    <div class="sim-row"><button class="btn primary" type="button" data-a="check">✓ 확인</button></div>
    <div class="l2-think-fb l0-note" aria-live="polite" hidden></div>`;
  let q = 0;
  const answers = [[], []];   // answers[q][i] = true(O) / false(X) / undefined
  const done = [false, false];
  const figs = [...box.querySelectorAll('.l2-think-fig')];
  const fb = $('.l2-think-fb', box);
  function renderQ(){
    $('.l2-q-text', box).innerHTML = QUESTIONS[q].q + (done[q] ? ' <span class="l2-done">✓ 해결</span>' : '');
    box.querySelectorAll('[data-q]').forEach(t => t.setAttribute('aria-selected', String(+t.dataset.q === q)));
    $('.l2-q-hint', box).textContent = q === 0 ? '👇 모든 면을 확인해 보세요.' : '👇 꼭짓점을 클릭해 보세요.';
    figs.forEach((f, i) => {
      const a = answers[q][i];
      f.querySelectorAll('.l2-ox [data-v]').forEach(b => b.setAttribute('aria-pressed', String(a !== undefined && (b.dataset.v === '1') === a)));
      f.classList.toggle('picked', a === true);
      // O를 고른 질문의 성질을 라벨로 붙인다
      $('.l2-tags', f).innerHTML = QUESTIONS.map((Q, k) => answers[k][i] === true ? `<span class="l2-tag${k === q ? ' cur' : ''}">✓ ${Q.tag}</span>` : '').join('');
    });
    fb.hidden = true;
  }
  box.querySelectorAll('[data-q]').forEach(t => t.addEventListener('click', () => { q = +t.dataset.q; renderQ(); }));
  figs.forEach((f, i) => f.querySelectorAll('.l2-ox [data-v]').forEach(b => b.addEventListener('click', () => {
    answers[q][i] = b.dataset.v === '1'; renderQ();
  })));
  $('[data-a="check"]', box).addEventListener('click', () => {
    const want = QUESTIONS[q].ans;
    if(figs.some((_, i) => answers[q][i] === undefined)){ toast('세 도형 모두 O 또는 X를 골라 보자!'); return; }
    const ok = figs.every((_, i) => answers[q][i] === want.includes(i));
    fb.hidden = false;
    fb.className = 'l2-think-fb l0-note ' + (ok ? 'ok' : 'ng');
    if(ok){
      done[q] = true; box.dataset.solved = done.filter(Boolean).length;
      fb.innerHTML = `✓ ${QUESTIONS[q].ok}` + (q === 0 ? '<br>👉 이제 <b>질문 2</b>도 풀어 보자.' : (done[0] ? '<br>🎉 두 질문을 모두 만족하는 것은 <b>①</b>뿐이야. ①은 <b>정팔면체</b>라고 해. 이런 다면체를 정다면체라고 불러!' : ''));
      $('.l2-q-text', box).innerHTML = QUESTIONS[q].q + ' <span class="l2-done">✓ 해결</span>';
    }else{
      fb.innerHTML = q === 0 ? '✗ 다시 살펴보자. 면의 모양과 크기가 모두 같은지 확인해 봐.' : '✗ 다시 살펴보자. 꼭짓점을 하나씩 눌러서 모인 면의 개수가 모두 같은지 세어 봐.';
    }
  });
  renderQ();

  const viewers = await Promise.all(figs.map(f => create3DViewer($('.l2-think-v', f), { showInfo:false, color:'#E7ECF4', tools:['autoRotate', 'reset', 'transparent'], toolLabels:{ reset:'🎯 처음 위치' } })));
  if(!viewers[0].ok) return;
  const T = viewers[0].THREE;
  const solids = l2ThinkSolids(T);
  viewers.forEach((v, i) => {
    if(!v.ok) return;
    const H = l1H(T), faces = solids[i], verts = l1VertsOf(faces);
    const g = l1Geometry(T, faces);
    v.setShape(g.geometry, { title:`도형 ${'①②③'[i]}` });
    v.setToggle('faceColor', false);
    const layer = new T.Group(); v.extras.add(layer);
    const info = $('.l2-vtx-info', figs[i]);
    l1Pick(v, () => g.triFace, ({ point }) => {
      let best = Infinity, vi = -1;
      verts.forEach((p, k) => { const d = p.distanceTo(point); if(d < best){ best = d; vi = k; } });
      if(best > 0.45){ toast('꼭짓점(뾰족한 점) 가까이를 눌러 보자!'); return; }
      const V = verts[vi];
      layer.children.slice().forEach(o => { layer.remove(o); l1Dispose(o); });
      const around = faces.filter(f => f.some(p => p.distanceTo(V) < 1e-4));
      around.forEach((f, k) => {
        layer.add(H.polyMesh(f, ['#FF7043', '#FFCA28', '#66BB6A', '#42A5F5', '#AB47BC'][k % 5], 0.9, true, 0.004));
        const c = H.centroid(f), n = H.normalOf(f); if(n.dot(c) < 0) n.negate();
        layer.add(H.label2(String(k + 1), c.clone().lerp(V, 0.35).addScaledVector(n, 0.08), 0.7, true));
      });
      layer.add(H.dot2(V, 0.08, '#D50000'));
      info.innerHTML = `🔴 이 꼭짓점에 모인 면: <b>${around.length}개</b>`;
      v.requestRender();
    });
  });
}

      const it = ITEMS[i]; if(it.regular) return;
      const got = [...w.querySelectorAll('[data-c][aria-pressed="true"]')].map(b => +b.dataset.c).sort();
      const ok = got.length === it.ans.length && it.ans.every((v, k) => v === got[k]); if(!ok) all = false;
      w.classList.remove('ok', 'ng'); w.classList.add(ok ? 'ok' : 'ng');
      $('.fb', w).innerHTML = ok ? `✓ ${it.why}` : (got.length ? '✗ 다시 생각해 보자. 생각 열기에서 꼭짓점을 눌러 면의 개수를 세어 봐.' : '조건을 하나 이상 골라 보자.');
    });
    const done = $('.l2-why-done', box);
    done.hidden = !all;
    if(all) done.innerHTML = '🎉 두 조건 중 하나라도 만족하지 않으면 정다면체가 아니야. 세 도형 중 정다면체는 <b>도형 ①(정팔면체)</b>뿐이야!';
  });
}

/* =====================================================================
   시뮬레이션: 한 꼭짓점에 정다각형 모으기 ★
   ===================================================================== */
async function l2SetupVertexSim(wrap){
  wrap.innerHTML = `

      <div class="l2-step" data-step="2"><h5><span class="no">2</span>꼭짓점에 모인 면 개수<em class="ck" aria-hidden="true">✓</em></h5>
        <div class="sim-row l2-krow"><button class="btn" type="button" data-a="minus">➖ 빼기</button>
