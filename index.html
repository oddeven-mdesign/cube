<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>입체도형, 그것이 알고 싶다!! · Ⅶ. 입체도형의 성질</title>

<!-- 글꼴: 본문 Pretendard, 제목 Jua (불러오지 못해도 기본 글꼴로 동작) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">

<!-- 수식: KaTeX ($...$ 안의 LaTeX를 교과서처럼 표시) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<!-- 3D: Three.js + OrbitControls (importmap) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
/* =========================================================
   0. 디자인 토큰
   ========================================================= */
:root{
  --bg:#F6F8FC;
  --surface:#FFFFFF;
  --ink:#1F2A44;
  --ink-soft:#56617A;
  --line:#E3E8F2;
  --accent:#FF8A65;          /* 학습별로 바뀌는 포인트 색 */
  --accent-soft:#FFF1EC;
  --ok:#2E7D32;  --ok-bg:#E8F5E9;
  --ng:#C62828;  --ng-bg:#FFEBEE;
  --radius:18px;
  --shadow:0 4px 18px rgba(31,42,68,.08);
  --header-h:68px;
  --sidebar-w:330px;
  --tap:44px;                /* 최소 터치 크기 */
  font-size:17px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.9; font-size:1rem;   /* 본문 줄 간격 (두 단계 넓힘: 1.65 → 1.9) */
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.jua{font-family:"Jua","Pretendard",sans-serif;font-weight:400;letter-spacing:.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1E66F5;outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =========================================================
   1. 상단 바
   ========================================================= */
.app-header{
  position:sticky;top:0;z-index:50;height:var(--header-h);
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.menu-toggle{
  display:none;min-width:var(--tap);min-height:var(--tap);border:1px solid var(--line);
  background:#fff;border-radius:12px;font-size:1.3rem;
}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-logo{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;
  background:linear-gradient(135deg,#FFD3C2,#C9E4FF);
}
.brand h1{margin:0;font-size:1.45rem}
.progress-wrap{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:12px}
.progress-bar{
  flex:1;height:16px;border-radius:99px;background:#EDF1F8;overflow:hidden;border:1px solid var(--line);
}
.progress-bar span{
  display:block;height:100%;width:0;border-radius:99px;transition:width .5s ease;
  /* 줄무늬로 채워진 부분을 색 없이도 구분 */
  background:repeating-linear-gradient(45deg,#7BC6FF 0 10px,#5AB3F5 10px 20px);
}
.progress-text{font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--ink-soft)}
.teacher-badge{
  display:none;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700;
  background:#FFF4CC;border:1px dashed #C99A00;color:#7A5C00;white-space:nowrap;
}
body.teacher .teacher-badge{display:inline-block}

/* =========================================================
   2. 레이아웃 + 사이드 메뉴
   ========================================================= */
.layout{display:flex;min-height:calc(100vh - var(--header-h))}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  display:flex;flex-direction:column;overflow-y:auto;
}
.sidebar-title{margin:18px 18px 8px;font-size:.85rem;color:var(--ink-soft);font-weight:700}
.lesson-nav{list-style:none;margin:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.nav-item{
  width:100%;min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;
  border:1px solid transparent;border-radius:14px;background:transparent;text-align:left;
  border-left:6px solid var(--c);
}
.nav-item:hover{background:#F3F6FB}
.nav-item[aria-current="page"]{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:color-mix(in srgb,var(--c) 45%,#fff);border-left-color:var(--c);font-weight:700}
.nav-icon{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,#fff);font-size:1.05rem}
.nav-label{flex:1;line-height:1.35;font-size:.98rem}
.nav-label small{display:block;font-size:.75rem;color:var(--ink-soft);font-weight:500}
.nav-status{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.nav-status.done{background:var(--ok-bg);color:var(--ok)}
.nav-status.open{background:#EEF3FB;color:var(--ink-soft)}
.nav-status.lock{background:#F0F0F0;color:#777}
.nav-item.locked{opacity:.5;filter:grayscale(.6)}
.nav-item.locked .nav-icon{background:#EEE}

.sidebar-foot{margin-top:auto;padding:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.sidebar-foot .btn{width:100%}

.backdrop{display:none}

.main{flex:1;min-width:0;padding:24px clamp(14px,3vw,40px) 40px}
.lesson{display:none;max-width:980px;margin:0 auto}
.lesson.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* =========================================================
   3. 학습 화면 카드
   ========================================================= */
.lesson-hero{
  border-radius:24px;padding:22px 24px;margin-bottom:18px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 28%,#fff),color-mix(in srgb,var(--accent) 8%,#fff));
  border:1px solid color-mix(in srgb,var(--accent) 35%,#fff);
}
.lesson-hero::after{ /* 캔바 느낌의 장식 도형 */
  content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:40px;
  transform:rotate(25deg);background:color-mix(in srgb,var(--accent) 22%,transparent);
}
.lesson-hero .kicker{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.85rem;
  background:#fff;padding:3px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--accent) 40%,#fff)}
.lesson-hero h2{margin:10px 0 2px;font-size:clamp(1.5rem,3.6vw,2.1rem);position:relative;z-index:1}
.lesson-hero p{margin:0;color:var(--ink-soft);position:relative;z-index:1}
.lesson-hero .done-tag{display:none;margin-left:8px;font-size:.85rem;background:var(--ok-bg);color:var(--ok);padding:2px 10px;border-radius:99px;font-family:"Pretendard",sans-serif;font-weight:700}
.lesson.is-done .lesson-hero .done-tag{display:inline-block}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px;margin-bottom:26px;
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-step{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;
  background:var(--accent);color:#fff;flex-shrink:0;
}
.card-head h3{margin:0;font-size:1.25rem}
.card-head .card-emoji{font-size:1.2rem}

.placeholder{
  border:2px dashed #CBD3E1;border-radius:14px;padding:18px;text-align:center;color:var(--ink-soft);
  background:repeating-linear-gradient(-45deg,#FAFBFD 0 12px,#F3F6FA 12px 24px);
}
.placeholder > b:first-child{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:2px}

/* 교과서식 개념 상자 */
.concept-box{
  position:relative;border:2.5px solid var(--accent);border-radius:14px;padding:22px 18px 16px;margin:14px 0 6px;
  background:color-mix(in srgb,var(--accent) 6%,#fff);
}
.concept-box > .concept-title{
  position:absolute;top:-14px;left:14px;padding:2px 12px;border-radius:8px;
  background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;
}
.concept-box.dashed{border-style:dashed}
.concept-box p{margin:.3em 0}
.tip{border-left:5px solid var(--accent);background:#FAFBFE;padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}

/* =========================================================
   4. 공통 버튼 / 시뮬레이션 조작 UI (최소 44px)
   ========================================================= */
.btn{
  min-height:var(--tap);min-width:var(--tap);padding:8px 16px;border-radius:12px;
  border:1.5px solid #CBD3E1;background:#fff;font-weight:700;font-size:.95rem;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .08s ease,background .2s;
  touch-action:manipulation;
}
.btn:hover{background:#F3F6FB}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-style:dashed}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

.sim-panel{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sim-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
/* 슬라이더 */
.sim-slider{display:flex;flex-direction:column;gap:2px;min-width:220px;flex:1}
.sim-slider label{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.sim-slider output{font-variant-numeric:tabular-nums;background:var(--accent-soft);padding:0 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--accent) 35%,#fff)}
.sim-slider input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:var(--tap);background:transparent;margin:0;touch-action:pan-y;
}
.sim-slider input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p,50%),#E3E8F2 var(--p,50%))}
.sim-slider input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:#E3E8F2}
.sim-slider input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--accent)}
.sim-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sim-slider input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--accent)}
/* 단계 표시 */
.step-dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step-dot{min-width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:.8rem;font-weight:700;border:2px solid #CBD3E1;background:#fff;color:var(--ink-soft)}
.step-dot.on{background:var(--accent);border-color:var(--accent);color:#fff}
.step-dot.past{border-color:var(--accent);color:var(--accent)}
.step-caption{padding:10px 14px;background:#FAFBFE;border:1px solid var(--line);border-radius:12px;min-height:var(--tap)}
/* 선택 버튼 묶음 */
.segmented{display:flex;flex-wrap:wrap;gap:6px}
.segmented .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.segmented .btn[aria-pressed="true"]::before{content:"✓"}

/* =========================================================
   5. 3D 뷰어
   ========================================================= */
.viewer{display:flex;flex-direction:column;gap:10px}
.viewer-stage{
  position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;min-height:260px;
  border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 30% 20%,#FFFFFF,#EEF3FA 70%);
}
.viewer-stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.viewer-stage{touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}   /* 3D를 손가락으로 돌릴 때 화면 전체가 스크롤되지 않게 */
.viewer-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-soft);font-weight:700;text-align:center;padding:20px}
.viewer-hint{position:absolute;left:10px;bottom:10px;font-size:.8rem;background:rgba(255,255,255,.85);padding:3px 10px;border-radius:99px;border:1px solid var(--line);pointer-events:none}
.viewer-info{
  position:absolute;right:10px;top:10px;background:rgba(255,255,255,.94);border:1.5px solid var(--line);
  border-radius:12px;padding:8px 12px;font-size:.92rem;min-width:150px;box-shadow:var(--shadow)
}
.viewer-info h4{margin:0 0 4px;font-size:.95rem;font-family:"Jua",sans-serif;font-weight:400}
.viewer-info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.viewer-info dt{color:var(--ink-soft)}
.viewer-info dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.viewer-info .note{margin-top:4px;font-size:.8rem;color:var(--ink-soft)}
.viewer-toolbar{display:flex;flex-wrap:wrap;gap:6px}
.tool-btn{
  min-height:var(--tap);padding:6px 12px;border-radius:12px;border:1.5px solid #CBD3E1;background:#fff;
  font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;
}
.tool-btn .tb-state{font-size:.72rem;padding:1px 6px;border-radius:6px;background:#EEF1F6;color:#666}
.tool-btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff)}
.tool-btn[aria-pressed="true"] .tb-state{background:var(--accent);color:#fff}

/* =========================================================
   6. 퀴즈
   ========================================================= */
.quiz{display:flex;flex-direction:column;gap:12px}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quiz-count{font-weight:800}
.quiz-type{font-size:.8rem;padding:2px 10px;border-radius:99px;background:#EEF3FB;color:var(--ink-soft);font-weight:700}
.quiz-meter{height:8px;border-radius:99px;background:#EDF1F8;overflow:hidden}
.quiz-meter span{display:block;height:100%;background:var(--accent);transition:width .3s}
.quiz-q{font-size:1.12rem;font-weight:700;margin:4px 0}
.quiz-options{display:grid;gap:8px}
.quiz-opt{
  min-height:52px;text-align:left;padding:10px 14px;border-radius:14px;border:2px solid #D5DCE8;background:#fff;
  display:flex;gap:10px;align-items:center;touch-action:manipulation;
}
.quiz-opt .mark{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#EEF1F6}
.quiz-opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,#fff)}
.quiz-opt[aria-pressed="true"] .mark{background:var(--accent);color:#fff}
.quiz-opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.quiz-opt.is-wrong{border-color:var(--ng);background:var(--ng-bg);border-style:dashed}
.quiz-opt .tag{margin-left:auto;font-size:.8rem;font-weight:800;white-space:nowrap}
.quiz-opt.is-correct .tag{color:var(--ok)}
.quiz-opt.is-wrong .tag{color:var(--ng)}
.quiz-ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quiz-ox .quiz-opt{justify-content:center;font-size:1.25rem;min-height:72px;flex-direction:column;gap:2px}
.quiz-ox .quiz-opt small{font-size:.85rem;color:var(--ink-soft)}
.quiz-input-row{display:flex;gap:8px;flex-wrap:wrap}
.quiz-input{
  flex:1;min-width:180px;min-height:52px;padding:8px 14px;border-radius:14px;border:2px solid #D5DCE8;font-size:1.1rem;
}
.quiz-input:focus{border-color:var(--accent);outline:none}
.quiz-input.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.quiz-input.is-wrong{border-color:var(--ng);background:var(--ng-bg);border-style:dashed}
.pi-btn{font-size:1.25rem;min-width:56px;font-family:"Times New Roman",serif}
.quiz-help{font-size:.85rem;color:var(--ink-soft)}
.quiz-feedback:empty{display:none}
.quiz-feedback{border-radius:14px;padding:12px 14px;border:2px solid}
.quiz-feedback.ok{border-color:var(--ok);background:var(--ok-bg)}
.quiz-feedback.ng{border-color:var(--ng);background:var(--ng-bg);border-style:dashed}
.quiz-feedback .verdict{font-weight:800;font-size:1.05rem;display:block;margin-bottom:2px}
.quiz-feedback.ok .verdict{color:var(--ok)}
.quiz-feedback.ng .verdict{color:var(--ng)}
.quiz-actions{display:flex;gap:8px;flex-wrap:wrap}
.quiz-summary{text-align:center;padding:10px 0}
.quiz-summary .score{font-size:2.2rem;font-family:"Jua",sans-serif}
.quiz-summary .stars{font-size:1.6rem;letter-spacing:4px}
.quiz-summary ul{list-style:none;padding:0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.quiz-summary li{padding:4px 10px;border-radius:99px;font-weight:700;font-size:.9rem}
.quiz-summary li.ok{background:var(--ok-bg);color:var(--ok)}
.quiz-summary li.ng{background:var(--ng-bg);color:var(--ng)}
.quiz-summary .quiz-actions{justify-content:center}
.quiz-passed{padding:8px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700}
.temp-note{font-size:.82rem;color:#8a6d00;background:#FFF8DC;border:1px dashed #E0C060;border-radius:10px;padding:4px 10px;display:inline-block}

/* =========================================================
   7. 아래 이동 버튼, 토스트, 모달, 축하
   ========================================================= */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pager .btn{flex:1;min-height:56px;max-width:48%}
.pager .btn small{display:block;font-weight:500;font-size:.78rem;opacity:.85}
.pager .btn span{display:block;text-align:center;line-height:1.3}
.pager .next.locked{opacity:.6}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:200;
  background:#1F2A44;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.25s;font-weight:700;max-width:92vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%)}

.modal-wrap{position:fixed;inset:0;z-index:300;background:rgba(20,28,45,.45);display:none;place-items:center;padding:16px}
.modal-wrap.open{display:grid}
.modal{background:#fff;border-radius:20px;padding:22px;width:min(400px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:1.3rem}
.modal input{width:100%;min-height:52px;border-radius:12px;border:2px solid #D5DCE8;padding:8px 12px;font-size:1.1rem;margin:10px 0}
.modal .msg{min-height:1.5em;color:var(--ng);font-weight:700;font-size:.9rem}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =========================================================
   8. 반응형: 태블릿·스마트폰은 햄버거 메뉴
   ========================================================= */
@media (max-width:900px){
  :root{--header-h:62px}
  .menu-toggle{display:inline-grid;place-items:center}
  .sidebar{

/* 정보 패널: 도형 이름 옆 작은 '개수 보기' 버튼 */

/* 수식 속 문자 n: 개념 활동과 같은 교과서 글자체 */

/* 시뮬레이션: 이전 소활동 버튼은 다음 버튼 옆에 작게 */

/* 전개도 펼치기: 갤러리와 같은 탭·배치 */

.l0-net > .l0-tabs [role=tab]{min-width:0;min-height:50px;border:2px solid var(--line);border-radius:12px;margin:0;background:#fff;word-break:keep-all;line-height:1.3;padding:6px 4px}
.l0-net > .l0-tabs [role=tab][aria-selected="true"]{border-color:var(--g-gallery);background:color-mix(in srgb,var(--g-gallery) 12%,#fff);color:var(--ink);box-shadow:0 3px 10px color-mix(in srgb,var(--g-gallery) 25%,transparent)}
.l0-net > .l0-tabs [role=tab][aria-selected="true"]::before{content:""}
@media (max-width:640px){.l0-net > .l0-tabs [role=tab]{font-size:.8rem}}
.l0-net .ga-tools .viewer-toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l0-net .ga-tools .tool-btn{min-width:0;justify-content:center;min-height:46px}
.l0-net .l0-net-fold{padding:10px 12px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.l0-net .l0-net-fold .ttl{margin:0;font-weight:800}
.l0-fold-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l0-fold-btns .btn{width:100%;min-width:0}
.l0-net .l0-side .l0-ctl{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.l0-net .l0-side .l0-ctl .segmented{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}

/* 이전 소활동 버튼 테두리: 다음 버튼과 같은 색 */
.l0-simnav .btn:not(.primary){border-color:var(--g-sim)!important;border-width:2px}
/* 전개도 펼치기: 표 없이, 선택 → 펼치기 순서 */
.l0-net .l0-gal-grid2{grid-template-areas:"stage side" "tools side"}
@media (max-width:820px){.l0-net .l0-gal-grid2{grid-template-areas:"stage" "tools" "side"}}
.l0-net .ga-tools .viewer-toolbar{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.l0-net .ga-tools .tool-btn{flex-direction:column;gap:3px;font-size:.8rem;word-break:keep-all;padding:6px 2px}
.l0-net .l0-side{display:flex;flex-direction:column;gap:12px}
.l0-net .l0-side .l0-ctl{margin-top:0}
.l0-net .l0-net-fold.is-off{opacity:.5}
/* 분류 활동: 카드 10장 2행 5열, 다시 하기 오른쪽 */
.l0-sort-cards{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.l0-card{min-width:0;word-break:keep-all;text-align:center}
@media (max-width:640px){.l0-sort-cards{gap:5px;padding:6px}.l0-card{padding:6px 2px;font-size:.72rem;border-radius:10px}.l0-card svg{width:40px;height:40px}}

/* 확인 퀴즈 버튼: 오른쪽 정렬, 제출하기 = 보라(개념 확인하기와 같은 색), 다음 문제·결과 보기 = 같은 색 음영 */
.quiz .quiz-actions{justify-content:flex-end}

.btn.quiz-next{background:#EDE7F6;border:2px solid #7E57C2;color:#5E35B1}

/* 중학교 미리보기 */
.l0-pv-shapes{justify-content:center}
.l0-pv-hint{--accent:#7E57C2;margin:20px 0 12px}
.l0-pv-reveal{justify-content:flex-end}

/* 미리보기 힌트 상자: 버튼보다 작게 */
.l0-pv-hint{display:block;width:fit-content;max-width:100%;margin-left:auto!important;padding:9px 12px 3px;font-size:.8rem;line-height:1.3;margin:18px 0 10px;border-width:2px}
.l0-pv-hint > .concept-title{font-size:.76rem;top:-12px;padding:1px 9px}
.l0-pv-hint p{margin:.1em 0}

/* 1~8 학습 소활동 버튼: 개념은 개념 색, 시뮬레이션은 시뮬레이션 색 */
.subtab-concept{--g-sim:var(--g-concept)}
.subtab-host > .l0-simtabs{margin-top:6px}
.subtab-host > section.l0-sub{margin-bottom:0}
@media (max-width:640px){.subtab-host > .l0-simtabs{gap:5px}.subtab-host .l0-simtab{font-size:.74rem;padding:6px 3px}}

/* 1. 다면체와 각뿔대: 3D 화면 아래 버튼은 화면 폭에 맞춰 균등 */
#lesson-1 .viewer-toolbar{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;width:100%}
#lesson-1 .viewer-toolbar .tool-btn{min-width:0;width:100%;justify-content:center;flex-direction:column;gap:2px;text-align:center;word-break:keep-all;padding:5px 3px;font-size:.84rem;line-height:1.25}
#lesson-1 .viewer-toolbar .tool-btn .tb-state{font-size:.68rem}
/* 생각 열기: 주령구 */
.l1-legend .l1-ic{width:22px;height:22px;vertical-align:-5px;margin-right:5px;flex-shrink:0}
.l1-legend > span{display:inline-flex;align-items:center;gap:4px}
.l1-legend .l1-ic{margin-right:2px!important}
.l1-jury-reset{justify-content:flex-end}
/* 개념 ① 다면체: 낱말 채우기 */
.l1-dm .l1-dm-box .cw{font-weight:800;border-bottom:2px solid var(--accent);padding:0 1px;white-space:nowrap}
.l1-dm .l1-dm-box li{margin:.25em 0}
.l1-dm .l1-dm-box .cw-slot{min-height:30px}

/* 1. 생각 열기: 주령구 안내·개수 */
.l1-jury-guide{display:flex;gap:8px;align-items:flex-start}
.l1-jury-guide .ic{font-size:1.25rem;line-height:1.4}

.l1-jury-guide p.hd{margin-bottom:4px}
#l1-jury .l1-big{text-align:center}
#l1-jury .l1-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#l1-jury .l1-legend > span{justify-content:center;padding:8px 6px}
/* 1. 개념: 다면체 판별 2행 4열, 점수는 위 오른쪽 */
.l1-ox-top{justify-content:flex-end;margin:0 0 8px}
.l1-ox-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}

.l1-ox-card{min-width:0}
@media (max-width:640px){.l1-ox-grid{gap:5px!important}.l1-ox-card{padding:6px 3px;border-radius:12px}.l1-ox-card svg{width:56px!important;height:56px!important}.l1-ox-card .nm{font-size:.78rem;word-break:keep-all}
  .l1-ox-card .row{flex-direction:column;gap:4px;width:100%}.l1-ox-card .row .btn{padding:4px 2px;min-height:36px;font-size:.78rem}.l1-ox-card .fb{font-size:.72rem}}
/* 1. 개념: 다면체 탐색 */
.l1-ex-shape .segmented{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

.l1-ex-findbox{padding:10px 12px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line)}

.l1-ex-findbox .segmented{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.l1-ex-findbox .segmented button{width:100%;min-width:0}
.l1-ex-btns{justify-content:flex-end}
#l1-explorer .l1-name{margin-top:10px}

/* 1. 개념 ④ 다면체 단면 관찰 */
.l1-sec-concept{margin-top:16px}
.l1-blank{display:inline-flex;align-items:center;justify-content:center;min-width:4.2em;min-height:28px;margin:0 2px;padding:0 6px;border-radius:6px;border:2px dashed #90A4AE;background:#F4F6FA;color:transparent;font:inherit;font-weight:800;cursor:pointer;vertical-align:middle}
.l1-blank.open{color:var(--ok);border:2px solid var(--ok);background:var(--ok-bg);cursor:default}
.l1-sec-lead{margin:14px 0 8px!important}
.l1-sec-solids .segmented{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:14px}
.l1-sec-solids .segmented button{width:100%;min-width:0}
.l1-sec-q{margin:0}
.l1-sec-picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

.l1-pick[aria-pressed="true"]{border-color:#7E57C2;background:#EDE7F6;color:#4527A0}
.l1-pick.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important;color:var(--ok)!important;opacity:1}
.l1-pick.ng{border-color:var(--ng)!important;background:var(--ng-bg)!important;color:var(--ng)!important;opacity:1;text-decoration:line-through}

@media (max-width:640px){.l1-sec-picks{grid-template-columns:repeat(4,minmax(0,1fr))}.l1-sec-picks .btn{font-size:.82rem}}

/* 단면 관찰 보완 */
.l1-sec-shape{text-align:center}

/* 시뮬레이션 ① 각뿔대 */
.l1-fd .l1-fd-box .cw{font-weight:800;border-bottom:2px solid var(--accent);padding:0 1px;white-space:nowrap}
.l1-fd .l1-fd-box li{margin:.25em 0}
.l1-fd .l1-aside{margin-top:24px}
/* 각뿔대 만들기: 관찰 버튼 2행 3열 */
#lesson-1 .l1-fr-viewer .viewer-toolbar{grid-auto-flow:row!important;grid-template-columns:repeat(3,minmax(0,1fr))}

.l1-sec-answer .l1-sec-presets{margin:8px 0}

.l1-fx-parts{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l1-fx-parts .btn{width:100%;min-width:0}
.l1-fx-feat{margin-top:22px;padding:14px;border-radius:16px;border:2px solid color-mix(in srgb,var(--accent) 40%,#fff);background:color-mix(in srgb,var(--accent) 4%,#fff)}

@media (max-width:760px){.l1-fx-cards{grid-template-columns:minmax(0,1fr)}}
.l1-fx-card{padding:10px 12px;border-radius:14px;border:2px solid #D5DCE8;background:#fff}
.l1-fx-card .q{margin:0 0 8px;font-weight:800;display:flex;gap:6px;align-items:flex-start}
.l1-fx-card .q .no{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:.8rem}
.l1-fx-card .opts{display:flex;flex-wrap:wrap;gap:6px}

.l1-fx-card .opts .btn[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);opacity:1}
.l1-fx-card .fb{margin:8px 0 0;font-size:.9rem;min-height:1.2em}
.l1-fx-card.ok{border-color:var(--ok);background:var(--ok-bg)}
.l1-fx-card.ng{border-color:var(--ng);border-style:dashed;animation:l0shake .4s}

/* 각뿔대 만들기: 선택 활동은 오른쪽 아래(관찰 버튼과 같은 높이) */
.l1-frustum .l0-gal-grid{align-items:stretch}
.l1-frustum .l0-side .l1-tilt{margin-top:auto;width:100%}
@media (max-width:820px){.l1-frustum .l0-side .l1-tilt{margin-top:6px}}
/* 각뿔대 탐색 */
.l1-fexplore .l1-trap{margin-top:12px}
.l1-fx-open{justify-content:flex-end;margin-top:14px}
.l1-fexplore .l1-think{margin-top:16px}

/* 비교 관찰 */

.act-row{justify-content:flex-end!important}

/* 개념 확인하기(낱말 카드) 공통 */
.wc-box .cw{font-weight:800;border-bottom:2px solid var(--accent);padding:0 1px;white-space:nowrap}

.l2-q-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}

#lesson-2 .viewer-toolbar{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;width:100%}
#lesson-2 .viewer-toolbar .tool-btn{min-width:0;width:100%;justify-content:center;flex-direction:column;gap:2px;text-align:center;word-break:keep-all;padding:5px 3px;font-size:.84rem;line-height:1.25}
#lesson-2 .viewer-toolbar .tool-btn .tb-state{font-size:.68rem}

#lesson-2 .l2-why-fig .viewer-toolbar .tool-btn{font-size:.76rem}
@media (max-width:640px){.l2-why{grid-template-columns:minmax(0,1fr)}.l2-why-fig{max-width:240px;margin:0 auto;width:100%}}

/* 생각 상자: 생각 열기처럼 도형별 세로 칸(2단) — 이름 → 3D 화면 → 관찰 버튼 → 조건 ①② */
.l2-why-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0}
.l2-why-grid .l2-why{display:flex!important;flex-direction:column;gap:8px;margin:0;align-items:stretch}
.l2-why-name{text-align:center;font-family:"Jua",sans-serif;font-weight:400;font-size:1.1rem}
.l2-why-grid .l2-why-fig{max-width:none;margin:0;width:100%}
.l2-why-grid .l2-why-fig .viewer-stage{aspect-ratio:4/3}
.l2-why-opts{display:grid;gap:6px}
.l2-why-opts .btn{width:100%}
@media (max-width:520px){.l2-why-grid{gap:6px}.l2-why-opts .btn{font-size:.8rem;padding:6px 4px}.l2-why-name{font-size:.95rem}}

/* 생각 상자: 세 도형, 1단계 정다면체 찾기 → 2단계 조건 찾기 */
#l2-whynot .l2-why-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){#l2-whynot .l2-why-grid{grid-template-columns:minmax(0,1fr)}#l2-whynot .l2-why-fig{max-width:300px;margin:0 auto}}
.l2-why-name small{font-family:"Pretendard",sans-serif;font-size:.78rem;color:var(--ink-soft)}
.l2-why-step{display:flex;gap:8px;align-items:flex-start;margin:10px 0 4px}
.l2-why-step .no{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:.82rem;font-weight:800}
.l2-why-tag{display:flex;justify-content:center}
.l2-why-tag:empty{display:none}
.l2-why-opts[hidden]{display:none!important}
.l2-why-s2 .sim-row,.l2-why-grid + .sim-row{justify-content:flex-end}
.l2-why-done{margin-top:8px}

/* 2. 시뮬레이션 ① 정다면체 */
.l2-vsim .l2-viewer .viewer-stage{aspect-ratio:16/11;max-height:52vh}
.l2-namebox{text-align:center}
.l2-namebox.good{border-color:var(--ok);background:var(--ok-bg)}
.l2-info .l2-formula:empty,.l2-info .l2-result:empty,.l2-info .l2-done-msg:empty{display:none}
.l2-info .l2-formula{padding:10px 12px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line)}
.l2-info [data-a="reset"]{align-self:flex-end}
.l2-steps{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:900px){.l2-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.l2-steps{gap:6px}.l2-step{padding:8px!important}.l2-step h5{font-size:.82rem!important;gap:5px!important;word-break:keep-all}.l2-step h5 .no{width:22px!important;height:22px!important}.l2-step h5 .ck{width:16px;height:16px;line-height:16px;font-size:.66rem}}
.l2-step{display:flex;flex-direction:column;gap:6px}
.l2-step h5{font-size:.98rem!important}
.l2-step[data-state="active"]{border-width:3.5px!important;box-shadow:none!important}
.l2-step[data-state="active"] h5::after{content:none!important}
.l2-step h5 .ck{display:none;margin-left:auto;font-style:normal;font-size:.8rem;font-weight:900;color:#fff;background:var(--ok);border-radius:99px;width:20px;height:20px;line-height:20px;text-align:center}
.l2-step[data-state="done"] h5 .ck{display:inline-block}
.l2-step[data-state="done"] h5 .no{font-size:.85rem!important;background:var(--ok)}
.l2-step[data-state="done"] h5 .no::before{content:none!important}
.l2-step .btn{width:100%}
.l2-krow{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0}
.l2-krow .l2-k{grid-row:1;grid-column:1 / -1;text-align:center;font-weight:800;font-size:1.15rem}
.l2-krow .btn{grid-row:2;width:100%;min-width:0;padding:6px 2px;font-size:.86rem;white-space:nowrap}
.l2-shapes .segmented .btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,#fff)!important;color:var(--ink)!important;border-color:color-mix(in srgb,var(--accent) 55%,#fff)!important}
.l2-shapes .segmented .btn[aria-pressed="true"]::before{content:none!important}
.l2-shapes .segmented .btn{min-width:0;font-size:.82rem;padding:6px 2px;word-break:keep-all}

/* 정다면체 소활동 보완 */
.l2-step h5 .ck{display:none!important}
.l2-info{gap:8px!important;font-size:.88rem;line-height:1.4}
.l2-info .l2-formula{padding:8px 10px}
.l2-info .l2-formula .katex{font-size:1.02em}
.l2-info .l2-res{margin-top:0;padding:6px 9px;font-size:.86rem;line-height:1.4}
.l2-info .l2-tag{font-size:.74rem}
.l2-namebox{font-size:1.05rem!important;line-height:1.35;padding:8px 10px!important;word-break:keep-all}
.l2-namebox b{color:var(--accent)}

/* 정다면체: 오른쪽 글 상자 높이 맞춤, 기록표 머리줄 */
.l2-info{overflow:hidden}
.l2-info .l2-info-body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line)}
.l2-info .l2-info-body .l2-formula{padding:0;border:none;background:none}
.l2-rec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.l2-rec-head h5{margin:0!important}
.l2-rec-head .l2-found{margin:0 0 0 auto}

/* 정다면체: 이름 상자는 높게, 설명 상자는 낮게 (합은 그대로), 설명 상자 안 작은 상자는 높이에 맞게 */
.l2-info .l2-namebox{display:flex;align-items:center;justify-content:center;font-size:1.15rem!important;min-height:64px}
.l2-info.fixed .l2-namebox{flex:0 0 32%}
.l2-info .l2-info-body{padding:8px;gap:6px;font-size:.82rem;line-height:1.32}
.l2-info.fixed .l2-info-body{flex:1 1 0}
.l2-info .l2-info-body .l2-formula{flex:0 0 auto}
.l2-info.fixed .l2-info-body .l2-result:not(:empty),.l2-info.fixed .l2-info-body .l2-done-msg:not(:empty){flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.l2-info .l2-info-body .l2-res{flex:1 1 auto;margin:0;display:block;padding:5px 8px;font-size:.82rem;line-height:1.32;overflow:auto}
.l2-info .l2-info-body .l2-formula br + .l2-tag{margin-top:2px}

/* 정다면체: 이름 상자 낮게, 세부 설명은 줄 간격을 넓혀 높이에 맞게 */
.l2-info.fixed .l2-namebox{flex:0 0 22%!important}
.l2-info .l2-info-body{line-height:1.6!important;font-size:.86rem!important}
.l2-info .l2-info-body .l2-res{line-height:1.6!important;font-size:.85rem!important}
/* 정다면체 전개도·관찰: 5개 선택 버튼 균등 */
.l2-net-tabs,.l2-obs-tabs{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;border-bottom:none!important;margin-bottom:14px}
.l2-net-tabs [role=tab],.l2-obs-tabs [role=tab]{min-width:0;min-height:48px;border:2px solid var(--line)!important;border-radius:12px;margin:0;background:#fff;word-break:keep-all;line-height:1.3;padding:6px 2px;text-align:center}
.l2-net-tabs [role=tab][aria-selected="true"],.l2-obs-tabs [role=tab][aria-selected="true"]{border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 14%,#fff)}
.l2-net-tabs [role=tab][aria-selected="true"]::before,.l2-obs-tabs [role=tab][aria-selected="true"]::before{content:""!important}
@media (max-width:640px){.l2-net-tabs [role=tab],.l2-obs-tabs [role=tab]{font-size:.74rem}}
/* 정다면체 전개도 */
.l2-net-variants .segmented{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:6px}
.l2-net-variants .segmented .btn{width:100%;min-width:0}
.l2-net-btns{justify-content:flex-end}
.l2-net-side{overflow:hidden}
.l2-net-side .l2-net-info.fixed{flex:1 1 0;min-height:0;overflow:hidden;margin:0}

/* 정다면체 관찰: 다면체 탐색과 같은 배치 */
.l2-observe .l2-obs-fb{margin-top:10px}
.l2-obs-fb.done{border-color:var(--accent)}
.l2-obs-mode .segmented{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.l2-obs-mode .segmented .btn{width:100%;min-width:0}
.l2-fact-open,.l2-fact-checkrow{justify-content:flex-end}
.l2-fact-open{margin-top:12px}
.l2-fact-more{margin-top:10px}

/* 전개도: 펼치기 ↔ 멈춤 (크기 고정, 멈춤일 때 색 바뀜) */
.l2-net-btns .btn{min-width:8.2em;justify-content:center}
.l2-net-btns .btn.is-running{background:#FFF3E0!important;border-color:#FB8C00!important;color:#E65100!important;box-shadow:inset 0 0 0 1px #FB8C00}
/* 관찰: 안내·결과 상자는 오른쪽 위 */
.l2-observe .l0-side .l2-obs-fb{margin:0}

.l2-net-side{gap:8px!important}
.l2-net-side .l2-meet{min-height:40px;padding-top:4px;padding-bottom:4px}
.l2-net-side .l2-net-info.fixed{padding:8px 12px}

.l2-done-btn::before{content:none!important}
.l2-fact-open{margin-top:26px!important}

/* 확인 퀴즈 O/X: 그림만 */
.quiz-ox .quiz-opt .ox-o{width:38px;height:38px}
.quiz-ox .quiz-opt .ox-x{font-size:2rem;line-height:1}

/* 정다면체 관찰: 설명 상자 높이 고정 */
.l2-observe .l0-side .l2-obs-fb.fixed{flex:1 1 0;min-height:0;overflow:hidden;display:block}
.l2-observe .l2-obs-fb .l2-obs-res{margin:4px 0;padding:0;list-style:none;display:grid;gap:4px}
.l2-observe .l2-obs-fb .l2-obs-res li{padding:var(--li-pad,6px) 10px}

/* 3. 회전체 생각 열기: 정다면체 활동과 비슷한 배치 */
#lesson-3 .viewer-toolbar{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;width:100%}
#lesson-3 .viewer-toolbar .tool-btn{min-width:0;width:100%;justify-content:center;flex-direction:column;gap:2px;text-align:center;word-break:keep-all;padding:5px 3px;font-size:.84rem;line-height:1.25}
#lesson-3 .viewer-toolbar .tool-btn .tb-state{font-size:.68rem}
.l3-th-namebox{text-align:center;display:flex;align-items:center;justify-content:center;min-height:72px;font-size:1.2rem!important;word-break:keep-all}
.l3-th-side{gap:12px}
.l3-th-side .l3-th-note{flex:1 1 auto;margin:0}
.l3-speed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.l3-speed .btn{width:100%;min-width:0;padding:6px 4px;font-size:.86rem;word-break:keep-all}
#l3-think .l3-predict{margin-top:16px}

/* 회전체 생각 열기: 회전체 추론 1·2 */
.l3-th-grid{align-items:stretch!important}
.l3-th-side .l3-paper-ui,.l3-th-side .l3-predict{display:flex;flex-direction:column;gap:10px;flex:1 1 auto}
.l3-th-side .l3-paper-ui[hidden],.l3-th-side .l3-predict[hidden],.l3-th-side .l3-pred[hidden]{display:none!important}
.l3-th-side .l3-paper-ui .l3-th-note{flex:1 1 auto}
.l3-th-side .l3-pred{grid-template-columns:90px 1fr;padding:8px}
.l3-th-side .l3-pred .l3-opt svg{width:30px;height:30px}
.l3-th-side .l3-pred .l3-opt{min-height:52px;padding:4px}
.l3-infer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:auto}
.l3-infer .btn{width:100%;min-width:0}
.l3-infer .btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,#fff);box-shadow:inset 0 0 0 1px var(--accent)}

/* 회전체 생각 열기: 추론 */
.l3-th-grid{grid-template-rows:auto auto}
.l3-th-grid > .l3-infer{grid-column:2;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0}
@media (max-width:820px){.l3-th-grid > .l3-infer{grid-column:1}}
.l3-th-side{overflow:hidden}
.l3-th-side .l3-predict{gap:6px!important;min-height:0}
.l3-pred-q{margin:0}
.l3-th-side.fixed .l3-predict .l3-pred{flex:1 1 0;min-height:0;overflow:hidden;align-content:start}
.l3-th-side .l3-pred .fb{margin:0}

.l3-th-side{gap:8px!important}
.l3-th-side .l3-predict{margin-top:-2px}
.l3-th-grid > .l3-infer .btn{white-space:nowrap;font-size:.86rem;padding-left:4px;padding-right:4px}

/* 회전체 만들기: 정다면체 활동처럼 3D 화면 왼쪽 위, 단계는 아래 */
.l3-mk-namebox{text-align:center;display:flex;align-items:center;justify-content:center;min-height:68px;font-size:1.05rem!important;line-height:1.35;word-break:keep-all}
.l3-mk-namebox.good{border-color:var(--ok);background:var(--ok-bg)}
.l3-mk-side{gap:10px}
.l3-mk-side.fixed{overflow:hidden}
.l3-mk-play{justify-content:flex-end}
.l3-mk-side.fixed .l3-mk-result{flex:1 1 0;min-height:0;overflow:auto}
.l3-mk-side .l3-result{font-size:.88rem;line-height:1.5}
.l3-mk-steps{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:14px;align-items:start}
@media (max-width:900px){.l3-mk-steps{grid-template-columns:minmax(0,1fr)}}
.l3-mk-step{padding:10px 12px!important}
.l3-mk-step h5{margin:0 0 8px!important}
.l3-mk-step .l3-cards{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));margin-bottom:0}
.l3-mk-step .l3-card svg{width:52px;height:52px}

.l3-mk-step h5 .no{background:var(--accent)!important}
.l3-mk-side.fixed .l3-mk-result:not(:empty){display:flex;flex-direction:column}
.l3-mk-side.fixed .l3-mk-result .l3-result{flex:1 1 auto}

/* 회전체 만들기: 오른쪽 단 = 평면도형 선택(좌우 넘기기) → 이름 → 회전축 결정, 3D 아래 = 회전 슬라이더·버튼 */
.l3-mk-left{display:flex;flex-direction:column;gap:10px}
.l3-mk-rot{padding:8px 12px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line)}
.l3-mk-rot .l3-mk-play{margin-top:4px}
.l3-mk-result:empty{display:none}
.l3-mk-side .l3-mk-step{margin:0}
.l3-carousel{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:6px;align-items:stretch}
.l3-car-btn{min-width:0!important;padding:0!important;font-size:.9rem}
.l3-car-btn:disabled{opacity:.35}
.l3-car-track{display:flex!important;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0!important;padding:2px}
.l3-car-track::-webkit-scrollbar{display:none}
.l3-car-track .l3-card{flex:0 0 calc((100% - 16px) / 3);scroll-snap-align:start;min-width:0;padding:6px 4px;font-size:.8rem;word-break:keep-all;text-align:center}
.l3-car-track .l3-card svg{width:44px;height:44px}
.l3-car-track .l3-card .big{font-size:1.8rem;line-height:44px}
.l3-mk-side .l3-mk-namebox{min-height:56px}

.l3-mk-side .l3-editor svg{display:block;max-height:280px;width:100%;margin:0 auto}

/* 회전체 만들기: 도형 카드 낮게, 회전축 결정 버튼 한 줄 */
.l3-car-track .l3-card{padding:4px 3px!important;min-height:0!important;justify-content:center}
.l3-car-track .l3-card svg{width:38px!important;height:38px!important}
.l3-car-track .l3-card.noname svg{width:46px!important;height:46px!important}
.l3-car-track .l3-card .big{font-size:1.5rem!important;line-height:38px!important}
.l3-car-track .l3-card b{font-size:.78rem;line-height:1.2}
.l3-mk-side .l3-axis-mode .segmented{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l3-mk-side .l3-axis-mode .segmented .btn{width:100%;min-width:0}
.l3-mk-side .l3-axis-mode .segmented .btn[aria-pressed="true"]::before{content:none!important}

/* 직접 그리기 버튼 한 줄 균등 */
.l3-draw-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.l3-draw-btns .btn{width:100%;min-width:0;padding-left:4px;padding-right:4px;font-size:.84rem;white-space:nowrap}
/* 회전 각도 슬라이더 + 0°로 + 1회전: 한 줄 */
.l3-mk-rot{display:flex;align-items:center;gap:8px}
.l3-mk-rot .l3-mk-angle{flex:1 1 auto;min-width:0}
.l3-mk-rot .l3-mk-play{margin:0!important;flex:0 0 auto;flex-wrap:nowrap;gap:6px}
.l3-mk-rot .l3-mk-play .btn{white-space:nowrap;padding-left:10px;padding-right:10px}
@media (max-width:520px){.l3-mk-rot{gap:5px;padding:6px 8px}.l3-mk-rot .l3-mk-play{gap:4px}.l3-mk-rot .l3-mk-play .btn{padding:4px 6px;font-size:.78rem;min-height:40px}}

.l3-mk-rot .sim-slider{min-width:0!important;max-width:none!important;width:100%}
@media (max-width:520px){.l3-mk-rot .sim-slider label{font-size:.78rem}.l3-mk-rot .sim-slider output{font-size:.78rem;padding:1px 6px}}

.l3-line-slider .sim-slider output{display:none!important}
.l3-rot-no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:.8rem;font-weight:800;margin-right:6px;vertical-align:middle}

/* 교과서처럼 수식 문자 l (KaTeX 수식 글꼴, 기울임) */
.l3-math-l{font-family:KaTeX_Math,"Times New Roman",serif!important;font-style:italic;font-size:20px!important;font-weight:400!important}

/* 회전체: 직선 ℓ 필기체 */
.l3-math-l{font-family:"Times New Roman",serif!important;font-style:normal!important}
/* 회전축 비교: 3단 (회전체 1 · 회전체 2 · 평면도형) */
.l3-compare > .l3-cmp-note{margin:0 0 12px}
.l3-cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:820px){.l3-cmp3{grid-template-columns:minmax(0,1fr)}}
.l3-cmp-fig{margin:0}
.l3-cmp-fig .l1-cmp-cap small{font-family:"Pretendard",sans-serif;font-size:.78rem;color:var(--ink-soft)}
.l3-ax-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ac);margin-right:6px;vertical-align:middle}
.l3-cmp-panel{padding:10px;border-radius:14px;border:1.5px solid var(--line);background:#FAFBFE;display:flex;flex-direction:column;gap:8px}
.l3-cmp-panel .ttl{margin:0;font-weight:800;text-align:center}
.l3-cmp-ex .segmented{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.l3-cmp-ex .segmented .btn{width:100%;min-width:0;padding:6px 2px;font-size:.84rem;word-break:keep-all}
.l3-cmp-ex .segmented .btn[aria-pressed="true"]::before{content:none!important}

/* 퀴즈: 짧은 선택지는 가로로 */
.quiz-options.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.quiz-options.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.scratch{margin:10px 0 0}

/* 예제 문제 해결하기 */
.l5-ex{align-items:stretch!important}
.l5-ex-q{padding:10px 12px;border-radius:12px;background:#FAFBFE;border:1.5px solid var(--line)}
.l5-ex-btns{justify-content:flex-end!important;align-self:stretch}
.l5-ex-steps{list-style:none;padding-left:0!important}
.l5-ex-steps li{display:block;line-height:1.9}
.l5-ex-steps li .l5-stepno{vertical-align:middle;margin-right:4px}
.l5-stepno{display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;line-height:1;padding:3px 5px;border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;background:#fff;flex-shrink:0}

/* 뿔의 부피: 생각 열기 횟수 버튼, 모래 실험 */
.l6-pred-opts{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.l6-pred-opts .btn{width:100%;min-width:0}
.l6-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 14px}
.l6-tab{width:100%;min-width:0;justify-content:center}
.l6-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.l6-side .l6-msg{margin:0;box-sizing:border-box;overflow:hidden}
.l6-countbox{text-align:center;font-family:"Jua",sans-serif}
.l6-countbox b{font-size:1.25em;color:#E65100;font-family:"KaTeX_Main","Times New Roman",serif;margin:0 3px}

/* 뿔의 부피: 소활동 영역 테두리(학습 색), 이동 버튼은 영역 밖 아래 오른쪽 */
.l6-actbox{padding:14px;border-radius:16px;border:2px solid color-mix(in srgb,#EC407A 45%,#fff);background:#fff}
.l6-actbox .l5-act-h .no{background:#EC407A}
#lesson-6-sim .l6-actbox + .l0-simnav{margin-top:24px}
.l6-actbox .l6-pour,.l6-actbox .l6-cube{margin-top:0}
/* 모래 실험 */
.l6-bars{margin-top:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#FAFBFE}
.l6-bars .l6-bar:last-of-type{margin-bottom:4px}
.l6-pbtns{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l6-pbtns .btn{width:100%;min-width:0;justify-content:center;word-break:keep-all}
.l6-bar em small .katex{font-size:.95em}
/* 도형 분할: 식 글상자 */
.l6-cube-eq{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#FAFBFE;font-weight:400}
.l6-cube-eq .katex-display{margin:.2em 0;text-align:left}
.l6-cube-eq .katex-display > .katex{text-align:left}
/* 정리: 생각 상자 확인 → 글상자는 버튼 왼쪽, 위쪽 맞춤 */
.l6-think-row{display:flex;gap:10px;align-items:flex-start;justify-content:flex-end}
.l6-think-row .l1-hint{flex:1 1 auto;min-width:0;margin:0}
.l6-think-row .btn{flex-shrink:0}
.l6-pbtns .btn{padding-left:4px;padding-right:4px;font-size:.92rem;white-space:nowrap}

/* 모래 실험: 부피값 영역 고정 → 막대 길이 일정 */
.l6-bars .l6-bar{grid-template-columns:44px minmax(0,1fr) 7.5em}
.l6-bars .l6-bar em{text-align:right}
/* 도형 분할 식: 수식은 그대로, 한글은 본문 글자체 */
.l6-cube-eq .katex .text,.l6-cube-eq .katex .text *{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif!important}
/* 정리 생각 상자: 풀이 글상자 자리 미리 확보 */
.l6-think-row .l6-hint{visibility:hidden}
.l6-think-row .l6-hint.shown{visibility:visible}
/* 생각이 크는 수학: 관찰 버튼 1열 : 선택지 2열 = 1 : 2 */
.l6-cups-under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px;margin-top:10px;align-items:stretch}
@media (max-width:640px){.l6-cups-under{grid-template-columns:minmax(0,1fr)}}
#lesson-6 .l6-cups-tools .viewer-toolbar{display:grid!important;grid-auto-flow:row!important;grid-template-columns:minmax(0,1fr);grid-auto-columns:auto;gap:6px;width:100%;margin:0}
.l6-cups-box{padding:10px;border-radius:14px;border:1.5px solid var(--line);background:#FAFBFE;display:flex;flex-direction:column;gap:8px}
.l6-cup-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l6-cup{width:100%;min-width:0;border-width:2px;border-color:var(--cc)!important;justify-content:flex-start;gap:6px;word-break:keep-all}
.l6-cup b{color:var(--cc);filter:brightness(.8)}
.l6-cup[aria-pressed="true"]{background:color-mix(in srgb,var(--cc) 16%,#fff);box-shadow:0 0 0 2px var(--cc)}
.l6-cup-msg{margin:0;min-height:1.6em}
.l6-cup-btns{justify-content:flex-end;margin-top:10px}

/* 도형 분할 식: 글자 진하게 */
.l6-cube-eq .katex .text{font-weight:700}
/* 길이 표시(점선 호 + 길이) */
.l3-svg .dimv{font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
/* 수식·기호: 교과서와 같은 글자체 (Times 계열) */
.katex{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif",KaTeX_Main,serif!important}
.katex .mathnormal,.katex .mathit{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif",KaTeX_Math,serif!important;font-style:italic}
.katex .mathrm,.katex .textrm{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif",KaTeX_Main,serif!important}
.tf,.scratch-text textarea,.pi-btn{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif",serif!important}

/* 수식 속 한글은 본문 글자체와 어울리게 (숫자·문자·기호는 Times 계열 그대로) */
.katex{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif","Pretendard","Apple SD Gothic Neo","Malgun Gothic",KaTeX_Main,sans-serif!important}
.katex .mathnormal,.katex .mathit{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif","Pretendard","Apple SD Gothic Neo","Malgun Gothic",KaTeX_Math,sans-serif!important}
.katex .mathrm,.katex .textrm,.katex .text{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif","Pretendard","Apple SD Gothic Neo","Malgun Gothic",KaTeX_Main,sans-serif!important}
.tf,.scratch-text textarea{font-family:"Times New Roman",Times,"Nimbus Roman","Liberation Serif","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif!important}
/* 7·8 학습: 소활동 영역 테두리 */
.l0-actbox{padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff}
#lesson-7 .l0-actbox{border-color:color-mix(in srgb,#66BB6A 50%,#fff)}
#lesson-8 .l0-actbox{border-color:color-mix(in srgb,#5C6BC0 45%,#fff)}
.l0-actbox > h4:first-child{margin-top:0}
.l0-actbox + .l0-simnav{margin-top:24px!important}
#lesson-7 .l0-actbox > h4 .no{background:#66BB6A}
#lesson-8 .l0-actbox > h4 .no{background:#5C6BC0}
.l0-simtab .tt br{display:block}
.l0-simtab .tt{line-height:1.25}
/* 겉넓이 전개도: 크기 입력은 3행으로 정렬 */
.l7-dim-grid{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:6px}
.l7-dim-grid label{display:grid!important;grid-template-columns:minmax(0,1fr) 6.5em;align-items:center;gap:8px}

.l7-calc-area{margin-top:14px;padding:12px;border-radius:14px;border:1.5px dashed color-mix(in srgb,#66BB6A 60%,#fff);background:#FBFEF9;display:flex;flex-direction:column;gap:10px}
.l7-calc-area > *{margin:0!important}

.l7-ind{display:inline-block;padding-left:1.6em}

@media (max-width:760px){.l7-two-info{grid-template-columns:minmax(0,1fr)}}
.l7-two-info > *{margin:0!important}
.l7-tbtns{justify-content:flex-end;align-items:center}
.l7-tbtns small{margin-right:auto}
table.l7-calc tbody th,table.l7-calc thead th:first-child{text-align:center}
.viewer-toolbar .tool-btn.l7-calc-btn{border-color:#66BB6A;color:#2E7D32}

.viewer-toolbar .tool-btn.l7-calc-btn{margin-top:0;width:100%}

.l7-box .l0-gal-grid{align-items:stretch}
.l7-box .l0-side .l7-calc-btn{margin-top:auto!important;align-self:flex-end;width:auto!important;min-height:44px;padding:6px 14px;border:2px solid #66BB6A;color:#2E7D32;border-radius:12px;background:#fff;font-weight:800}
.l7-box .l0-side .l7-calc-btn[aria-pressed="true"]{background:#E8F5E9}

.l7-calc-area .l7-legend{text-align:right}

.l7-tbtns .l7-tfb{margin:0 auto 0 0!important;padding:6px 12px;border-radius:10px;border:1.5px solid currentColor;background:#fff}
.l7-tbtns .l7-tfb.ok{background:var(--ok-bg)} .l7-tbtns .l7-tfb.ng{background:var(--ng-bg)}

.l7-prism .l0-side .l7-calc-btn{margin-top:auto!important;align-self:flex-end;width:auto!important;padding:6px 14px;border:2px solid #66BB6A;color:#2E7D32;border-radius:12px;background:#fff;font-weight:800}
.l7-prism .l0-side .l7-calc-btn[aria-pressed="true"]{background:#E8F5E9}

.l7-formula-b{font-weight:800}

.l7-center{text-align:center}

.l7-two-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}

.l7-face .sw.s{background:repeating-linear-gradient(45deg,#FFB74D 0 4px,#FB8C00 4px 8px)}
.l7-calc-area .l7-two-info{margin-top:8px!important}
.l7-unf .l0-side .l7-choices .segmented{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.l7-unf .l0-side .l7-choices .segmented .btn{width:100%;min-width:0}

/* 롤러: 조작 한 줄, 단계별 탐색 다단 */
.l7-roller .l7-roll-info{margin:10px 0 0}
.l7-roll-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.l7-step-in label{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:6px;font-weight:700}

.l7-step-in input.is-correct{border-color:var(--ok);background:var(--ok-bg)} .l7-step-in input.is-wrong{border-color:var(--ng);background:var(--ng-bg)}

.l7-rows .sim-row{justify-content:flex-end}

.l7-prog{display:none!important}
/* 예제·문제 입력: 3행 정렬, 정답 풀이 글상자 */
.l7-rows .l7-rows-grid{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:6px}
.l7-rows .l7-row{display:grid!important;grid-template-columns:minmax(6em,auto) minmax(0,1fr);align-items:center;gap:8px}

.l7-rows-btns .l7-tfb{margin:0 auto 0 0!important;padding:6px 12px;border-radius:10px;border:1.5px solid currentColor;background:#fff}
.l7-rows-btns .l7-tfb.ok{background:var(--ok-bg)} .l7-rows-btns .l7-tfb.ng{background:var(--ng-bg)}

.l7-roll-top{display:flex;gap:8px;align-items:stretch;margin-top:10px}
