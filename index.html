    { label:'삼각기둥', shape:'rtprism', dims:{ a:3, b:4, h:6 } }, { label:'사각기둥', shape:'rectprism', dims:{ a:4, b:3, h:5 } },
    { label:'오각기둥', shape:'regprism', dims:{ a:2, h:5, n:5 } }, { label:'원기둥', shape:'cylinder', dims:{ r:2, h:5 } }] });
  attachCalc($('.l7-prism', panel), prismP, gPrism, '🧮 겉넓이 계산하기', '🙈 겉넓이 계산 닫기', [], [$('.l7-q-cyl', panel)]);
  const roll = l7SetupRoller($('.l7-roller', panel), () => mark(2));
  const parts = await Promise.all([boxP, prismP, roll]);
  return { refresh:() => parts.forEach(p => p && p.refresh && p.refresh()), prog };
}

/** 페인트 롤러 애니메이션 (반지름 2, 높이 15) */
async function l7SetupRoller(wrap, onSolved){
  wrap.innerHTML = `<div class="l7-v"></div><div class="l7-roll-top"><p class="l0-note l7-roll-info" aria-live="polite">▶ [굴리기]를 눌러 롤러를 한 바퀴 굴려 보자.</p></div>
    <div class="l7-roll-ctl"></div><div class="l7-roll-steps"></div>`;
  const info = $('.l7-roll-info', wrap), r = 2, len = 15, W = 2 * Math.PI * r;
  const st = { t:0, target:0 };
  const slider = createSlider({ label:'굴린 정도', min:0, max:100, step:1, value:0, format:v => `${(v / 100).toFixed(2)}바퀴`, onInput:v => { st.t = st.target = v / 100; if(play.dataset && play.dataset.run){ play.textContent = '🎨 한 바퀴 굴리기'; play.dataset.run = ''; play.classList.remove('is-running'); } pose(); } });
  const play = el('button', { class:'btn primary', type:'button' }, '🎨 한 바퀴 굴리기');
  const back = el('button', { class:'btn', type:'button' }, '↺ 처음으로');
  const ctl = $('.l7-roll-ctl', wrap);
  const sIn = $('input', slider.el), sOut = $('output', slider.el);
  const viewer = await create3DViewer($('.l7-v', wrap), { showInfo:false, tools:['reset'], toolLabels:{ reset:'🎯 처음 위치' } });
  // 처음 위치는 안내 글상자 오른쪽(같은 높이), 아래 줄: 슬라이더 · 처음으로 · 굴리기
  { const tb = $('.l7-v .viewer-toolbar', wrap); if(tb) $('.l7-roll-top', wrap).appendChild(tb); ctl.append(slider.el, back, play); }
  const setPlay = run => { play.textContent = run ? '⏸ 멈춤' : '🎨 한 바퀴 굴리기'; play.dataset.run = run ? '1' : ''; play.classList.toggle('is-running', !!run); };
  let pose = () => {};
  if(viewer.ok){
    const T = viewer.THREE, H = l1H(T), g = new T.Group(), sc = 0.24; g.scale.setScalar(sc); g.position.set(-W / 2 * sc, 0, 0); viewer.extras.add(g);
    const wall = new T.Mesh(new T.PlaneGeometry(W + 8, len + 4), new T.MeshPhongMaterial({ color:0xF5F1E8, side:T.DoubleSide }));
    wall.rotation.x = -Math.PI / 2; wall.position.set(W / 2, -0.01, 0); g.add(wall);
    const paint = new T.Mesh(new T.PlaneGeometry(1, len), new T.MeshPhongMaterial({ color:0xFB8C00, side:T.DoubleSide }));
    paint.rotation.x = -Math.PI / 2; g.add(paint);
    const startL = H.tube2(new T.Vector3(0, 0.02, -len / 2 - 1), new T.Vector3(0, 0.02, len / 2 + 1), 0.07, 0x2B3A55); g.add(startL);
    const endL = H.tube2(new T.Vector3(W, 0.02, -len / 2 - 1), new T.Vector3(W, 0.02, len / 2 + 1), 0.07, 0x9AA6BC); g.add(endL);
    const roller = new T.Group(); g.add(roller);
    const cylG = new T.CylinderGeometry(r, r, len, 48, 1); cylG.rotateX(Math.PI / 2);
    const cyl = new T.Mesh(cylG, new T.MeshPhongMaterial({ color:0xFFB74D, flatShading:false })); roller.add(cyl);
    const stripe = new T.Mesh(new T.BoxGeometry(0.35, 0.12, len + 0.02), new T.MeshPhongMaterial({ color:0xD32F2F })); stripe.position.set(0, -r, 0); roller.add(stripe);
    [-1, 1].forEach(s => { const cap = new T.Mesh(new T.CircleGeometry(r * 1.001, 48), new T.MeshPhongMaterial({ color:0x64B5F6, side:T.DoubleSide })); cap.position.z = s * len / 2; roller.add(cap); });
    const hdl = new T.Group(); g.add(hdl);
    [[new T.Vector3(0, 0, len / 2), new T.Vector3(0, 0, len / 2 + 1.5)], [new T.Vector3(0, 0, len / 2 + 1.5), new T.Vector3(0, 6, len / 2 + 1.5)], [new T.Vector3(0, 6, len / 2 + 1.5), new T.Vector3(0, 9, len / 2 + 4)]]
      .forEach(([p, q], k) => hdl.add(H.tube2(p, q, k === 2 ? 0.5 : 0.22, k === 2 ? 0x5D4037 : 0x78909C)));
    const labW = H.label2(`가로 = 2π×2 = 4π cm`, new T.Vector3(W / 2, 0.3, len / 2 + 2.2), 0.62); labW.scale.divideScalar(sc);
    const labH = H.label2(`세로 = 15 cm`, new T.Vector3(W + 2.6, 0.3, 0), 0.62); labH.scale.divideScalar(sc);
    g.add(labW, labH);
    pose = () => {
      const e = st.t, x = W * e;
      roller.position.set(x, r, 0); roller.rotation.z = -x / r; hdl.position.set(x, r, 0);
      paint.visible = x > 1e-3; paint.scale.x = Math.max(1e-3, x); paint.position.set(x / 2, 0.005, 0);
      labW.visible = labH.visible = e >= 0.999;
      info.innerHTML = e >= 0.999 ? '✓ 한 바퀴! 빨간 줄이 다시 바닥에 닿았어. 아래 질문에 차례로 답해 보자.'
        : e > 0 ? `굴러간 거리: <b>${(W * e).toFixed(2)} cm</b> / 한 바퀴 ${W.toFixed(2)} cm` : '▶ [굴리기]를 눌러 롤러를 한 바퀴 굴려 보자. 빨간 줄이 다시 바닥에 닿으면 한 바퀴야.';
      viewer.requestRender();
    };
    viewer.resetView(); viewer.camera.position.set(0.6, 4.6, 5.2); viewer.controls.target.set(0, 0.3, 0); viewer.controls.update();
    viewer.onFrame(dt => {
      if(st.t === st.target){ if(play.dataset.run) setPlay(false); return false; }
      st.t = Math.min(st.target, st.t + (L0_REDUCED_MOTION ? 1 : dt / 3));
      if(st.t === st.target) setPlay(false);
      sIn.value = Math.round(st.t * 100); sOut.textContent = `${st.t.toFixed(2)}바퀴`; sIn.style.setProperty('--p', st.t * 100 + '%');
      pose(); return true;
    });
    pose();
  }
  play.addEventListener('click', () => {   // 굴리기 ↔ 멈춤 (펼치기와 같은 방식)
    if(play.dataset.run){ st.target = st.t; setPlay(false); return; }
    if(st.t >= 1) st.t = 0; st.target = 1; if(!viewer.ok){ st.t = 1; } else setPlay(true);
    pose(); viewer.requestRender && viewer.requestRender(); });
  back.addEventListener('click', () => { setPlay(false); slider.set(0); });

  /* 단계별 탐색: 모양 → 롤러와의 관계 → 가로·세로와 롤러 → 가로·세로 길이 → 넓이 */
  const STEPS = [
    { q:'칠해진 영역의 모양은?', opts:['직사각형', '원', '부채꼴'], a:0, why:'롤러가 한 바퀴 굴러간 자리는 <b>직사각형</b> 모양이야.' },
    { q:'칠해진 영역은<br>롤러의 어느 부분과 같을까?', opts:['롤러의 밑면', '롤러의 옆면', '롤러의 겉면 전체'], a:1, why:'롤러의 <b>옆면</b>이 벽에 한 번씩 모두 닿으니까 칠해진 영역은 롤러의 옆면과 같아.' },
    { q:'칠해진 영역의 가로, 세로의 길이는<br>롤러의 무엇과 같을까?', opts:['(가로) = (밑면의 둘레), (세로) = (롤러의 높이)', '(가로) = (밑면의 반지름), (세로) = (롤러의 높이)', '(가로) = (롤러의 높이), (세로) = (밑면의 지름)'], a:0,
      why:'한 바퀴 굴러간 거리는 <b>밑면의 둘레</b>와 같고, 세로는 <b>롤러의 높이</b>와 같아.' },
    { q:'칠해진 영역의 가로, 세로 길이는?', inputs:[['가로', l7val(4, true), 'cm', '예) 2π'], ['세로', l7val(15), 'cm', '예) 10']],
      why:'(가로) $= 2\\pi \\times 2 = 4\\pi\\,(\\text{cm})$, (세로) $= 15\\,\\text{cm}$' },
    { q:'칠해진 영역의 넓이는?', inputs:[['넓이', l7val(60, true), 'cm²', '예) 12π']],
      why:'(넓이) $= 4\\pi \\times 15 = 60\\pi\\,(\\text{cm}^2)$ → 롤러(원기둥)의 <b>옆넓이</b>와 같아!' },
  ];
  const box = $('.l7-roll-steps', wrap);
  box.innerHTML = STEPS.map((s, i) => `<div class="l1-fx-card l7-step${i ? ' locked' : ''}" data-i="${i}">
      <p class="q"><span class="no">${i + 1}</span>${s.q}</p>
      ${s.opts ? `<div class="opts">${s.opts.map((o, j) => `<button type="button" class="btn" data-j="${j}">${o}</button>`).join('')}</div>`
        : `<div class="l7-step-in">${s.inputs.map(([lab, , u, ph], k) => `<label><span>${lab}</span><input type="text" autocomplete="off" placeholder="${ph}" data-k="${k}"><em>${u}</em><button class="btn pi-btn l7-pi" type="button" aria-label="파이 기호 넣기">π</button></label>`).join('')}
           <div class="sim-row" style="justify-content:flex-end"><button class="btn primary" type="button" data-a="ck">✓ 확인</button></div></div>`}
      <p class="fb" aria-live="polite"></p></div>`).join('');
  const cards = [...box.querySelectorAll('.l7-step')];
  const pass = i => {
    const c = cards[i]; c.classList.remove('ng'); c.classList.add('ok'); $('.fb', c).innerHTML = '✓ ' + STEPS[i].why; renderMath($('.fb', c));
    c.querySelectorAll('button, input').forEach(x => { x.disabled = true; });
    if(cards[i + 1]) cards[i + 1].classList.remove('locked');
    else { toast('🎨 칠해진 영역의 넓이 60π cm² = 롤러(원기둥)의 옆넓이!', 3200); onSolved && onSolved(); }
  };
  const fail = (i, msg) => { const c = cards[i]; c.classList.remove('ng'); void c.offsetWidth; c.classList.add('ng'); $('.fb', c).innerHTML = '✗ ' + msg; };
  cards.forEach((c, i) => {
    const s = STEPS[i];
    if(s.opts) c.querySelectorAll('[data-j]').forEach(b => b.addEventListener('click', () => {
      if(c.classList.contains('locked')) return;
      if(+b.dataset.j === s.a){ b.setAttribute('aria-pressed', 'true'); pass(i); } else fail(i, '다시 생각해 보자. 3D 화면에서 롤러를 굴려 보며 살펴봐!');
    }));
    else $('[data-a="ck"]', c).addEventListener('click', () => {
      if(c.classList.contains('locked')) return;
      const ok = s.inputs.every(([, v], k) => { const inp = c.querySelector(`input[data-k="${k}"]`), good = l7Check(inp.value, v); inp.classList.toggle('is-correct', good); inp.classList.toggle('is-wrong', !good); return good; });
      ok ? pass(i) : fail(i, '✗ 표시된 칸을 다시 계산해 보자.'.replace(/^✗ /, ''));
    });
  });
  return { refresh:() => pose() };
}

/** 원뿔의 밑면인 원이 부채꼴의 호 위를 굴러가는 애니메이션 (SVG) */
function l7SetupRollCone(wrap, onDone){
  const st = { r:2, l:5, t:0, target:0, raf:0, last:0 };
  wrap.innerHTML = `<div class="l7-rc-grid"><div class="l7-rc-svg"></div>
      <div class="l7-rc-side"><div class="l7-rc-info" aria-live="polite"></div><div class="l7-rc-sl"></div>
        <div class="sim-row l7-rc-btns"><button class="btn" type="button" data-a="back">↺ 처음으로</button><button class="btn primary" type="button" data-a="go">🔄 굴리기</button></div></div></div>
    <div class="concept-box l7-rc-sum" hidden><span class="concept-title">✨ 알게 된 점</span>원이 <b>딱 한 바퀴</b> 굴러서 호를 모두 지나갔어. 그러니까 <b class="l7-hl">(부채꼴의 호의 길이) $=$ (밑면인 원의 둘레) $= 2\\pi r$</b>이야.</div>`;
  const box = $('.l7-rc-svg', wrap), info = $('.l7-rc-info', wrap), sum = $('.l7-rc-sum', wrap);
  renderMath(sum);
  // 3D 원뿔 라벨과 같은 모양의 길이 표시
  const tag = (x, y, t) => { const w = t.length * 7.4 + 14; return `<g><rect x="${x - w / 2}" y="${y - 11}" width="${w}" height="22" rx="6" fill="#E3F2FD" stroke="#2B3A55" stroke-width="1.6"/><text x="${x}" y="${y + 4.5}" text-anchor="middle" style="text-anchor:middle;font:700 13px Pretendard,sans-serif;fill:#1F2A44">${t}</text></g>`; };
  const rS = createSlider({ label:'밑면의 반지름 $r$', min:1, max:3, step:0.5, value:2, unit:' cm', onInput:v => { st.r = v; if(st.l <= v + 0.5) { st.l = v + 1; lS.set(st.l); } st.t = st.target = 0; draw(); } });
  const lS = createSlider({ label:'모선의 길이 $l$', min:2, max:8, step:0.5, value:5, unit:' cm', onInput:v => { if(v <= st.r){ lS.set(st.r + 0.5); return; } st.l = v; st.t = st.target = 0; draw(); } });
  $('.l7-rc-sl', wrap).append(rS.el, lS.el); renderMath($('.l7-rc-sl', wrap));
  function draw(){
    const { r, l, t } = st, Th = 2 * Math.PI * r / l, k = 230 / (l + 2 * r), W = 470, cx = W / 2, cy = 24;
    const a0 = Math.PI / 2 - Th / 2, a = a0 + Th * t;
    const P = (rad, ang) => [cx + k * rad * Math.cos(ang), cy + k * rad * Math.sin(ang)];
    const big = Th > Math.PI ? 1 : 0, [x0, y0] = P(l, a0), [x1, y1] = P(l, a0 + Th), [xa, ya] = P(l, a);
    const [ccx, ccy] = P(l + r, a), phi = a0 + Math.PI + (l + r) / r * (a - a0);
    const mx = ccx + k * r * Math.cos(phi), my = ccy + k * r * Math.sin(phi);
    const H = cy + k * (l + 2 * r) + 12, traced = t > 0.001 ? `<path d="M${x0} ${y0} A${k * l} ${k * l} 0 ${Th * t > Math.PI ? 1 : 0} 1 ${xa} ${ya}" fill="none" stroke="#2E7D32" stroke-width="6" stroke-linecap="round"/>` : '';
    // 원 둘레 중 굴러간 부분(같은 길이)
    const rolledArc = t > 0.001 ? (() => { const s0 = a + Math.PI, s1 = s0 + Th * t * l / r; const [p0x, p0y] = [ccx + k * r * Math.cos(s0), ccy + k * r * Math.sin(s0)];
      const sweep = Th * t * l / r; if(sweep >= 2 * Math.PI - 1e-3) return `<circle cx="${ccx}" cy="${ccy}" r="${k * r}" fill="none" stroke="#2E7D32" stroke-width="5"/>`;
      const [p1x, p1y] = [ccx + k * r * Math.cos(s1), ccy + k * r * Math.sin(s1)];
      return `<path d="M${p0x} ${p0y} A${k * r} ${k * r} 0 ${sweep > Math.PI ? 1 : 0} 1 ${p1x} ${p1y}" fill="none" stroke="#2E7D32" stroke-width="5"/>`; })() : '';
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="l3-svg" role="img" aria-label="밑면인 원이 부채꼴의 호를 따라 굴러가는 모습">
      <path d="M${cx} ${cy} L${x0} ${y0} A${k * l} ${k * l} 0 ${big} 1 ${x1} ${y1} Z" fill="#FFE0B2" stroke="#8D3B1F" stroke-width="2"/>
      ${traced}
      <circle cx="${ccx}" cy="${ccy}" r="${k * r}" fill="#BBDEFB" fill-opacity="0.9" stroke="#0D47A1" stroke-width="2"/>${rolledArc}
      <line x1="${ccx}" y1="${ccy}" x2="${mx}" y2="${my}" stroke="#D32F2F" stroke-width="3"/><circle cx="${mx}" cy="${my}" r="5" fill="#D32F2F"/>
      <circle cx="${x0}" cy="${y0}" r="4" fill="#2B3A55"/><circle cx="${x1}" cy="${y1}" r="4" fill="#2B3A55"/>
      <line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#C62828" stroke-width="3"/>
      <text x="${cx}" y="${cy + k * l * 0.55}" class="lab small" text-anchor="middle">부채꼴(옆면)</text>
      ${tag((cx + x1) / 2 + 26, (cy + y1) / 2 - 16, `${l7f(l)} cm`)}${tag((ccx + mx) / 2, (ccy + my) / 2 - 14, `${l7f(r)} cm`)}</svg>`;
    const rolled = Th * t * l;
    info.innerHTML = `<p class="l0-note">굴러간 거리: <b>${t >= 0.999 ? `$2\\pi \\times ${l7f(r)} = ${l7f(2 * r)}\\pi$ cm (= 호의 길이)` : `${l7f(rolled / Math.PI)}π cm`}</b></p>
      <p class="l0-note">원이 돈 횟수: <b>${t >= 0.999 ? '1바퀴 ✓' : `${t.toFixed(2)}바퀴`}</b><br><span class="l0-muted">(빨간 점이 처음 위치로 돌아오면 1바퀴)</span></p>`;
    renderMath(info);
    if(t >= 0.999){ sum.hidden = false; if(!st.done){ st.done = true; onDone && onDone(); } }
  }
  const loop = now => {
    const dt = st.last ? (now - st.last) / 1000 : 0; st.last = now;
    st.t = Math.min(st.target, st.t + (L0_REDUCED_MOTION ? 1 : dt / 3.5)); draw();
    if(st.t < st.target && wrap.isConnected) st.raf = requestAnimationFrame(loop); else st.raf = 0;
  };
  $('[data-a="go"]', wrap).addEventListener('click', () => { if(st.t >= 1) st.t = 0; st.target = 1; st.last = 0; if(!st.raf) st.raf = requestAnimationFrame(loop); });
  $('[data-a="back"]', wrap).addEventListener('click', () => { cancelAnimationFrame(st.raf); st.raf = 0; st.t = st.target = 0; draw(); });
  wrap._reset = () => { cancelAnimationFrame(st.raf); st.raf = 0; st.r = 2; st.l = 5; rS.set(2); lS.set(5); st.t = st.target = 0; sum.hidden = true; draw(); };
  draw();
}

/* =====================================================================
   7번 시뮬레이션 진입점: 탭과 잠금
   ===================================================================== */
function setupLesson7Sim(container){
  // 소활동(단계): 학습 목표 → 기둥 겉넓이 → 뿔 겉넓이 → 확인 퀴즈
  const sec = document.getElementById('lesson-7'), simCard = document.getElementById('lesson-7-sim-card');
  ['lesson-7-think-card', 'lesson-7-concept-card'].forEach(id => { const c = document.getElementById(id); if(c) c.hidden = true; });
  if(simCard){ $('h3', simCard).textContent = '기둥 겉넓이'; $('.card-emoji', simCard).textContent = '🥫'; delete simCard.dataset.stepLabel; }
  let cardB = document.getElementById('lesson-7-simB-card');
  if(!cardB){
    cardB = el('article', { class:'card', id:'lesson-7-simB-card' }, `<div class="card-head"><span class="card-step">3</span><span class="card-emoji" aria-hidden="true">🎪</span><h3>뿔 겉넓이</h3></div><div class="card-body" id="lesson-7-simB"></div>`);
    (simCard || container).after(cardB);
  }
  container.innerHTML = '';
  const pA = container, pB = $('.card-body', cardB);
  let saved = { A:false, B:false };
  try{ const v = JSON.parse(safeStorage.get(L7_KEY) || 'null'); if(v) saved = { A:!!v.A, B:!!v.B }; }catch(e){}
  const ctrl = {};
  const finish = t => {
    if(saved[t]) return; saved[t] = true; safeStorage.set(L7_KEY, JSON.stringify(saved));
    if(t === 'A'){ celebrate && celebrate(); toast('🎉 기둥 겉넓이 완료! 다음 단계 [뿔 겉넓이]로 가 보자.', 3400); }
    else toast('🎉 뿔 겉넓이 완료! 마지막으로 확인 퀴즈를 풀어 보자.', 3400);
  };
  // 단계가 바뀌어 화면에 나타날 때 3D 화면·그림 크기 다시 맞추기
  [[simCard, 'A'], [cardB, 'B']].forEach(([c, t]) => { if(!c) return;
    new MutationObserver(() => { if(!c.classList.contains('step-off')) requestAnimationFrame(() => { window.dispatchEvent(new Event('resize')); ctrl[t] && ctrl[t].refresh && ctrl[t].refresh(); }); })
      .observe(c, { attributes:true, attributeFilter:['class'] }); });
  const a = l7SetupA(pA, () => finish('A')).then(c => { ctrl.A = c; const nx = $('.l7-next', pA); if(nx) nx.remove(); });
  const b = l7SetupB(pB, () => finish('B')).then(c => { ctrl.B = c; setupSubTabs(pB); alignActionButtons(document.getElementById('lesson-7')); });
  return Promise.all([a, b]);
}

/* =====================================================================
   8. 구의 부피와 겉넓이 (lesson-8)
   ---------------------------------------------------------------------
   생각 열기(구의 부피)  → l8SetupHemi()     반구 모래 3번 = 원기둥 가득 → 정리 한 줄씩
   ★ 부피 비교           → l8SetupCompare()  원뿔·구·원기둥 나란히/겹쳐 보기 + r 슬라이더 + 1:2:3
   물 붓기 실험          → l8SetupWater()    원뿔 3번 / 구 1번(⅔) / 가득 찬 원기둥에 구 넣기
   생각이 크는 수학      → l8SetupArch()     원뿔 1 → 구 2, 원기둥 3 + 아르키메데스의 묘비
   구의 겉넓이           → l8VideoHTML(), l8SetupObserve(), l8SetupOrange()
   예제와 활용           → l8SetupExamples() (반지름 2 cm 구, 지구의 바다 넓이 + 3D 지구본)
   영상 주소는 맨 위 설정값의 SPHERE_VOLUME_VIDEO · SPHERE_SURFACE_VIDEOS 에서 바꾼다.
   ===================================================================== */
const L8_R = 2.4;   // 3D 장면 속 반지름 (장면 단위)
const l8Mat = {
  glass:T => new T.MeshPhongMaterial({ color:'#C5CAE9', transparent:true, opacity:0.22, side:T.DoubleSide, depthWrite:false, shininess:90 }),
  sand:T => new T.MeshPhongMaterial({ color:'#E0B062', shininess:10, side:T.DoubleSide }),
  water:T => new T.MeshPhongMaterial({ color:'#29B6F6', transparent:true, opacity:0.6, depthWrite:false, shininess:90, side:T.DoubleSide }),
};
const l8Clamp = x => Math.max(0, Math.min(1, x));
function l8Lab(H, text, pos, sc, size=0.75){ const l = H.label2(text, pos, size); l.scale.divideScalar(sc); return l; }
/** 유리 원기둥 통 (바닥 y=0, 높이 2R) + 눈금 ⅓ ⅔ 1 */
function l8Cylinder(T, H, R, sc, { ticks=true, color=0x1A237E } = {}){
  const g = new T.Group();
  const shell = new T.Mesh(new T.CylinderGeometry(R, R, 2 * R, 64, 1, true).translate(0, R, 0), l8Mat.glass(T));
  shell.add(l6Edges(T, shell.geometry, color));
  const bottom = new T.Mesh(new T.CircleGeometry(R, 64).rotateX(-Math.PI / 2), l8Mat.glass(T));
  g.add(shell, bottom);
  if(ticks) ['⅓', '⅔', '1'].forEach((t, i) => {
    const y = 2 * R * (i + 1) / 3, x0 = R + 0.05;
    g.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(x0, y, 0), new T.Vector3(x0 + 0.6, y, 0)]), new T.LineBasicMaterial({ color:0xD32F2F })));
    g.add(l8Lab(H, t, new T.Vector3(x0 + 1.35, y, 0), sc, 0.82));
  });
  return g;
}
/** 통 안에 차오르는 모래·물 (scale.y = 높이) */
function l8Fill(T, R, mat){
  const m = new T.Mesh(new T.CylinderGeometry(R * 0.97, R * 0.97, 1, 64, 1).translate(0, 0.5, 0), mat);
  m.scale.y = 1e-4; m.visible = false; return m;
}
function l8SetLevel(m, h){ m.visible = h > 1e-3; m.scale.y = Math.max(1e-4, h); }
/** 모래·물 줄기를 a→b로 잇기 */
function l8Aim(T, m, a, b){
  const d = new T.Vector3().subVectors(b, a), L = d.length();
  if(L < 1e-4){ m.visible = false; return; }
  m.visible = true; m.position.addVectors(a, b).multiplyScalar(0.5); m.scale.set(1, L, 1);
  m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize());
}
/** 그릇을 angle만큼 기울였을 때 입구(mouth)가 desired에 오게 하는 그릇 위치 */
function l8PourPose(T, mouth, angle, desired){ return desired.clone().sub(mouth.clone().applyAxisAngle(new T.Vector3(0, 0, 1), angle)); }

function l8Steps(box, steps){
  box.innerHTML = `<ol class="l5-ex-steps">${steps.map(s => `<li hidden>${s}</li>`).join('')}</ol>
    <div class="sim-row"><button class="btn primary" type="button" data-a="next">풀이 1단계 보기 ▶</button><button class="btn" type="button" data-a="all">전체 풀이</button><button class="btn" type="button" data-a="reset">↺ 처음부터</button></div>`;
  renderMath(box);
  const items = [...box.querySelectorAll('li')], next = $('[data-a="next"]', box); let k = 0;
  const show = () => { items.forEach((li, j) => { li.hidden = j >= k; }); next.disabled = k >= items.length; next.textContent = k >= items.length ? '풀이 끝 ✓' : `풀이 ${k + 1}단계 보기 ▶`; };
  next.addEventListener('click', () => { if(k < items.length){ k++; show(); } });
  $('[data-a="all"]', box).addEventListener('click', () => { k = items.length; show(); });
  $('[data-a="reset"]', box).addEventListener('click', () => { k = 0; show(); });
  show();
}

/** 영상 주소 → { kind:'youtube'|'file', src, watch } (watch?v=, youtu.be, embed, shorts 주소 모두 embed로 바꿈) */
function l8VideoSource(url){
  const u = String(url ?? '').trim();
  if(!u) return null;
  if(/\.(mp4|m4v|webm|ogv|ogg|mov)(?:[?#].*)?$/i.test(u)) return { kind:'file', src:u };
  // Google 드라이브 공유 주소 → 드라이브 재생기(preview)
  const gd = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([A-Za-z0-9_-]{20,})/);
  if(gd) return { kind:'drive', id:gd[1], src:`https://drive.google.com/file/d/${gd[1]}/preview`, watch:`https://drive.google.com/file/d/${gd[1]}/view` };
  let id = null;
  const m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/i);
  if(m) id = m[1]; else if(/^[A-Za-z0-9_-]{11}$/.test(u)) id = u;
  if(!id) return { kind:'file', src:u };             // 확장자 없는 파일 경로 등
  let start = 0; const t = u.match(/[?&#](?:t|start)=([0-9hms]+)/i);
  if(t){
    if(/^\d+$/.test(t[1])) start = +t[1];
    else{ const g = t[1].match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i); if(g) start = (+g[1] || 0) * 3600 + (+g[2] || 0) * 60 + (+g[3] || 0); }
  }
  return { kind:'youtube', id, start,
    src:`https://www.youtube.com/embed/${id}?rel=0&playsinline=1&modestbranding=1${start ? `&start=${start}` : ''}`,
    watch:`https://www.youtube.com/watch?v=${id}${start ? `&t=${start}s` : ''}` };
}

  const fmt = n => n % 3 === 0 ? `${n / 3}\\pi` : `\\dfrac{${n}}{3}\\pi`;     // (n/3)π

      return `<div class="l8-vrow ${s.key}"><span>${s.name}</span><div class="track"><i style="width:${Math.max(1.2, n / max * 100)}%"></i></div>
        <em>$${fmt(n)}$</em><small class="f">$${s.tex}$</small></div>`; }).join('');
    ratio.innerHTML = `<b>(원뿔) : (구) : (원기둥)</b>

      <p class="l0-muted" style="margin:2px 0 0;font-size:.85rem">반지름 $r$을 바꿔도 비는 항상 <b>1 : 2 : 3</b>!</p>`;

  }
  const slider = createSlider({ label:'반지름 r', min:1, max:6, step:1, value:3, unit:' cm', onInput:v => { r = v; draw(); scale3D(); } });
  $('.l8-r', box).appendChild(slider.el);
  draw();
  const setMode = on => {

  if(!viewer.ok) return;
  const T = viewer.THREE, H = l1H(T); viewer.resetView();

  const X = [-2.5, 0, 2.5];

  const sphM = new T.MeshPhongMaterial({ color:'#5C6BC0', transparent:true, opacity:0.9, shininess:60 });
  const cone = new T.Mesh(new T.ConeGeometry(1, 2, 64, 1).translate(0, 1, 0), coneM);
  cone.add(l6Edges(T, cone.geometry, 0x880E4F));

  const labs = SH.map((s, i) => { const l = H.label2(s.name, new T.Vector3(X[i], -0.45, 0), 0.8); world.add(l); return { l, base:l.scale.clone() }; });
  const ovLab = H.label2('원기둥 안에 원뿔과 구가 꼭 맞게!', new T.Vector3(0, 2.6, 0), 0.8); ovLab.visible = false; world.add(ovLab);
  const ovBase = ovLab.scale.clone();
  let u = 0, target = 0;
  scale3D = () => {

        <div class="l8-water-v"></div>

        <div class="l1-big l6-countbox l8-wcount" aria-live="polite"></div>
        <div class="l8-wbars"></div>
        <div class="l8-hemi-btns"><button class="btn ghost" type="button" data-a="reset">↺ 처음으로</button><div class="l8-wbtns"></div></div>
      </div>
    </div>`;
  const R = L8_R, SC = 0.27, cylX = R + 1.0, leftX = -(R + 1.0);
  const MODES = {
    cone:{ label:'🍦 원뿔 모양 그릇으로 붓기', pours:3, per:1 / 3 },
    sphere:{ label:'⚽ 구 모양 그릇으로 붓기', pours:1, per:2 / 3 },

  const capVol = h => { h = Math.max(0, Math.min(2 * R, h)); return Math.PI * h * h * (3 * R - h) / 3; };   // 높이 h인 구의 조각(아래쪽)
  const spillAt = c => capVol(3 * R - c) / VCYL;                                                          // 구 중심 높이 c일 때 넘친 물(원기둥 대비)
  const levelFor = (c, vw) => {   // 물 부피 vw, 구 중심 c일 때 물 높이 (이분법)
    let lo = 0, hi = 2 * R;
    for(let i = 0; i < 40; i++){ const m = (lo + hi) / 2; if(Math.PI * R * R * m - capVol(m - (c - R)) < vw) lo = m; else hi = m; }
    return (lo + hi) / 2;
  };
  const st = { mode:'cone' };
  const seg = createSegmented({ items:Object.entries(MODES).map(([value, m]) => ({ value, label:m.label })), value:'cone', label:'실험 고르기',
    onChange:v => { if(st.phase && st.phase !== 'idle'){ seg.set(st.mode); toast('실험이 끝난 뒤에 바꿀 수 있어!'); return; } st.mode = v; build(); } });
  $('.l8-modes', box).appendChild(seg.el);

  const viewer = await create3DViewer($('.l8-water-v', box), { showInfo:false, tools:['autoRotate', 'reset'] });
  const T = viewer.ok ? viewer.THREE : null, H = T ? l1H(T) : null;
  let world, o = {};
  if(T){ viewer.resetView(); world = new T.Group(); world.scale.setScalar(SC); world.position.y = -1.1; viewer.extras.add(world); }

  function build3D(){
    world.children.slice().forEach(ch => { world.remove(ch); l1Dispose(ch); });
    o = {};
    const cyl = l8Cylinder(T, H, R, SC); cyl.position.x = cylX; world.add(cyl);
    o.water = l8Fill(T, R, l8Mat.water(T)); o.water.renderOrder = 6; cyl.add(o.water);
    o.stream = new T.Mesh(new T.CylinderGeometry(0.09, 0.09, 1, 8), l8Mat.water(T)); o.stream.visible = false; world.add(o.stream);
    world.add(l8Lab(H, '원기둥 그릇', new T.Vector3(cylX, -0.9, 0), SC));
    if(st.mode === 'sink'){
      l8SetLevel(o.water, 2 * R * 0.985);
      const tray = l8Cylinder(T, H, R, SC, { color:0x00838F }); tray.position.x = leftX; world.add(tray);
      o.spill = l8Fill(T, R, l8Mat.water(T)); o.spill.renderOrder = 6; tray.add(o.spill);
      world.add(l8Lab(H, '넘친 물 받는 통', new T.Vector3(leftX, -0.9, 0), SC));
      o.ball = new T.Mesh(new T.SphereGeometry(R * 0.995, 48, 32), new T.MeshPhongMaterial({ color:'#FF8A65', shininess:40 }));
      o.ball.position.set(cylX, C_TOP, 0); world.add(o.ball);
      o.ballLab = l8Lab(H, '꼭 맞는 구', new T.Vector3(cylX, C_TOP + R + 0.7, 0), SC); world.add(o.ballLab);
      o.arcEnd = new T.Vector3(leftX + 0.3 * R, 2 * R + 0.1, 0);
      const curve = new T.QuadraticBezierCurve3(new T.Vector3(cylX - R, 2 * R + 0.05, 0), new T.Vector3(0, 2 * R + 1.8, 0), o.arcEnd.clone());
      o.arc = new T.Mesh(new T.TubeGeometry(curve, 32, 0.09, 8, false), l8Mat.water(T)); o.arc.visible = false; world.add(o.arc);
    }else{
      const isCone = st.mode === 'cone';
      const g = new T.Group(), wg = new T.Group(); g.add(wg); world.add(g); o.src = g; o.srcW = wg;
      if(isCone){   // 원점 = 그릇 입구의 중심, 꼭짓점은 아래 (y = -2R)
        const shell = new T.Mesh(new T.ConeGeometry(R, 2 * R, 64, 1, true).rotateX(Math.PI).translate(0, -R, 0), l8Mat.glass(T));
        shell.add(l6Edges(T, shell.geometry, 0x880E4F)); g.add(shell);
        const wR = R * 0.97, wH = 2 * R * 0.97;
        wg.add(new T.Mesh(new T.ConeGeometry(wR, wH, 64, 1).rotateX(Math.PI).translate(0, wH / 2, 0), l8Mat.water(T)));
        wg.position.y = -2 * R + 0.02;
        o.home = new T.Vector3(leftX, 2 * R, 0); o.mouth = new T.Vector3(R * 0.95, 0, 0); o.ang = -1.95;
      }else{        // 원점 = 구의 중심, 위쪽에 작은 입구
        const th = 0.34;
        g.add(new T.Mesh(new T.SphereGeometry(R, 48, 32, 0, Math.PI * 2, th, Math.PI - th), l8Mat.glass(T)));
        const ring = new T.Mesh(new T.TorusGeometry(R * Math.sin(th), 0.05, 8, 40).rotateX(Math.PI / 2), new T.MeshBasicMaterial({ color:0x1A237E }));
        ring.position.y = R * Math.cos(th); g.add(ring);
        const eq = new T.Mesh(new T.TorusGeometry(R, 0.025, 6, 64).rotateX(Math.PI / 2), new T.MeshBasicMaterial({ color:0x7986CB })); g.add(eq);
        const wR = R * 0.96;
        wg.add(new T.Mesh(new T.SphereGeometry(wR, 40, 28).translate(0, wR, 0), l8Mat.water(T)));
        wg.position.y = -wR;
        o.home = new T.Vector3(leftX, R, 0); o.mouth = new T.Vector3(0, R * Math.cos(th), 0); o.ang = -2.2;
      }
      wg.scale.setScalar(1e-4); wg.visible = false;
      g.position.copy(o.home);
      o.pourPos = l8PourPose(T, o.mouth, o.ang, new T.Vector3(cylX - 0.4 * R, 2.6 * R, 0));
      world.add(l8Lab(H, isCone ? '원뿔 그릇' : '구 그릇', new T.Vector3(leftX, -0.9, 0), SC));
    }
    viewer.requestRender();
  }

  const fr = p => { const k = Math.round(p * 3); return Math.abs(p - k / 3) < 0.004 ? ['0', '⅓', '⅔', '1 (가득)'][k] : Math.round(p * 100) + '%'; };
  function setBar(k, p, txt){
    const row = barsBox.querySelector(`[data-k="${k}"]`); if(!row) return;
    $('.track i', row).style.width = (l8Clamp(p) * 100) + '%'; const em = $('em', row); if(em.dataset.v !== txt){ em.dataset.v = txt; em.innerHTML = l0Fx(txt); }
  }
  function ui(){
    const M = MODES[st.mode], busy = st.phase !== 'idle';
    if(st.mode === 'sink'){
      const main = st.L / (2 * R);
      setBar('main', main, fr(main)); setBar('spill', st.spilled, fr(st.spilled));
      cnt.innerHTML = st.stage === 'out' ? '🌊 물이 <b>가득</b>' : st.stage === 'in' ? '⚽ 구가 <b>쏙!</b>' : l0Fx('💧 남은 물 <b>⅓</b>');
      const bIn = $('[data-a="in"]', btns), bOut = $('[data-a="out"]', btns);
      if(bIn) bIn.disabled = busy || st.stage !== 'out';
      if(bOut) bOut.disabled = busy || st.stage !== 'in';
      if(!busy) msg.innerHTML = st.stage === 'out'
        ? '원기둥 그릇에 물을 <b>가득</b> 채웠어. 이 원기둥에 <b>꼭 맞는 구</b>를 넣으면 물이 얼마나 넘칠까?'
        : st.stage === 'in'
          ? '구가 꼭 맞게 들어가면서 물이 넘쳤어. <b>넘친 물은 원기둥의 $\\dfrac{2}{3}$</b>! 넘친 물의 부피는 구의 부피와 같아. 이제 구를 꺼내 보자.'
          : '🎉 구를 꺼냈더니 <b>남은 물은 원기둥의 $\\dfrac{1}{3}$</b>! 넘친 물 $\\dfrac{2}{3}$ + 남은 물 $\\dfrac{1}{3}$ = 원기둥 1 → (구의 부피) $= \\dfrac{2}{3} \\times$ (원기둥의 부피)';
    }else{
      setBar('main', st.level, fr(st.level));
      cnt.innerHTML = `부은 횟수 <b>${st.count}</b>번`;
      const b = $('[data-a="pour"]', btns); if(b) b.disabled = busy || st.count >= M.pours;
      if(!busy){
        if(st.mode === 'cone') msg.innerHTML = st.count === 0
          ? '원뿔 그릇은 원기둥 그릇과 <b>밑면이 합동</b>이고 <b>높이가 같아</b>. 물을 가득 채워 부어 보자!'
          : st.count < 3 ? `${st.count}번 부었더니 원기둥의 <b>${l0Fx(fr(st.level))}</b>만큼 찼어. 한 번 더!`
          : '🎉 원뿔 그릇으로 <b>3번</b> 부었더니 가득! (원뿔) $= \\dfrac{1}{3} \\times$ (원기둥) — 이제 [⚽ 구 그릇으로 붓기]와 비교해 보자.';
        else msg.innerHTML = st.count === 0
          ? '구 그릇은 원기둥 그릇에 <b>꼭 맞게</b> 들어가는 크기야. 물을 가득 채워 <b>한 번</b> 부어 보자. 원기둥의 어디까지 찰까?'
          : '🎉 구 그릇으로 <b>한 번</b> 부었더니 원기둥의 <b>$\\dfrac{2}{3}$</b>까지 찼어! (구) $= \\dfrac{2}{3} \\times$ (원기둥) $= 2 \\times$ (원뿔)';
      }
    }
    if(!busy) renderMath(msg);
  }
  function build(){
    Object.assign(st, { count:0, phase:'idle', t:0, from:0, level:0, c:C_TOP, spilled:0, stage:'out', L:2 * R });
    btns.innerHTML = st.mode === 'sink'
      ? `<button class="btn primary" type="button" data-a="in">⬇️ 구 넣기</button><button class="btn primary" type="button" data-a="out">⬆️ 구 꺼내기</button>`
      : `<button class="btn primary" type="button" data-a="pour">💧 ${st.mode === 'cone' ? '원뿔' : '구'} 모양 그릇에 물 채워 붓기</button>`;
    btns.querySelectorAll('button').forEach(b => b.addEventListener('click', () => act(b.dataset.a)));
    btns.parentElement.classList.toggle('sink', st.mode === 'sink');   // 구 넣기: [처음으로][구 넣기][구 꺼내기] 한 줄
    barsBox.innerHTML = (st.mode === 'sink' ? [['원기둥 물높이', 'main'], ['넘친 물 높이', 'spill']] : [['원기둥 물높이', 'main']])
      .map(([t, k]) => `<div class="l6-bar ${k === 'spill' ? 'spill' : ''}" data-k="${k}"><span>${t}</span><div class="track"><i></i><b class="seg" style="left:33.3%"></b><b class="seg" style="left:66.6%"></b></div><em></em></div>`).join('');
    if(T) build3D();
    ui();
  }
  function act(a){
    if(st.phase !== 'idle') return;
    const M = MODES[st.mode];
    if(a === 'pour'){
      if(st.count >= M.pours) return;
      if(!T){ st.count++; st.level = Math.min(1, st.count * M.per); ui(); if(st.count >= M.pours) celebrate(); return; }
      st.phase = 'filling'; st.t = 0; st.from = st.level;
      msg.innerHTML = `💧 ${st.mode === 'cone' ? '원뿔' : '구'} 그릇에 물을 채워 붓는 중…`;
    }else if(a === 'in'){
      if(st.stage !== 'out') return;
      if(!T){ st.spilled = 2 / 3; st.stage = 'in'; ui(); return; }
      st.phase = 'down'; st.t = 0; msg.innerHTML = '⬇️ 구를 천천히 넣는 중… 물이 넘쳐서 옆 통으로 모여.';
    }else if(a === 'out'){
      if(st.stage !== 'in') return;
      if(!T){ st.L = 2 * R / 3; st.stage = 'removed'; ui(); celebrate(); return; }
      st.phase = 'up'; st.t = 0; msg.innerHTML = '⬆️ 구를 꺼내는 중… 물이 얼마나 남을까?';
    }
    ui(); viewer.requestRender && viewer.requestRender();
  }
  if(T) viewer.onFrame(dt => {
    if(st.phase === 'idle') return false;
    st.t += L0_REDUCED_MOTION ? 9 : dt;
    const M = MODES[st.mode];
    if(st.phase === 'filling'){
      const k = Math.min(1, st.t / 0.8); o.srcW.visible = true; o.srcW.scale.setScalar(Math.max(1e-4, k));
      if(k >= 1){ st.phase = 'pouring'; st.t = 0; }
    }else if(st.phase === 'pouring'){
      const t = st.t, a = l5Ease(Math.min(1, t / 0.8)), b = l8Clamp((t - 0.8) / 1.4), c = l5Ease(l8Clamp((t - 2.2) / 0.7)), go = a * (1 - c);
      o.src.position.lerpVectors(o.home, o.pourPos, go); o.src.rotation.z = o.ang * go;
      o.srcW.scale.setScalar(Math.max(1e-4, 1 - b)); o.srcW.visible = b < 0.99;
      st.level = Math.min(1, st.from + b * M.per); l8SetLevel(o.water, st.level * 2 * R * 0.985);
      if(b > 0 && b < 1){
        world.updateMatrixWorld(true);
        const m = o.src.localToWorld(o.mouth.clone()); world.worldToLocal(m);
        l8Aim(T, o.stream, m, new T.Vector3(cylX, st.level * 2 * R, 0));
      }else o.stream.visible = false;
      if(t >= 2.9){
        st.phase = 'idle'; st.count++; st.level = Math.min(1, st.count * M.per);
        o.src.position.copy(o.home); o.src.rotation.z = 0; o.stream.visible = false;
        if(st.count >= M.pours) celebrate();
      }
    }else if(st.phase === 'down'){
      const k = l5Ease(Math.min(1, st.t / 3)); st.c = C_TOP + (R - C_TOP) * k;
      o.ball.position.y = st.c; o.ballLab.position.y = st.c + R + 0.7;
      const sp = spillAt(st.c), grow = sp > st.spilled + 1e-6; st.spilled = Math.max(st.spilled, sp);
      l8SetLevel(o.spill, st.spilled * 2 * R * 0.985);
      o.arc.visible = grow;
      if(grow) l8Aim(T, o.stream, o.arcEnd, new T.Vector3(leftX, st.spilled * 2 * R, 0)); else o.stream.visible = false;
      if(k >= 1){ st.phase = 'idle'; st.stage = 'in'; st.spilled = 2 / 3; o.arc.visible = false; o.stream.visible = false; }
    }else if(st.phase === 'up'){
      const k = l5Ease(Math.min(1, st.t / 3)); st.c = R + (C_TOP - R) * k;
      o.ball.position.y = st.c; o.ballLab.position.y = st.c + R + 0.7;
      st.L = levelFor(st.c, (1 - st.spilled) * VCYL); l8SetLevel(o.water, st.L * 0.985);
      if(k >= 1){ st.phase = 'idle'; st.stage = 'removed'; st.L = 2 * R / 3; celebrate(); }
    }
    ui();
    return true;
  });
  $('[data-a="reset"]', box).addEventListener('click', () => { if(st.phase === 'idle') build(); });
  build();
}

/* =====================================================================
   생각이 크는 수학 + 아르키메데스의 묘비

function l8SetupArch(box){
  box.innerHTML = `

      <div class="l8-arch-q"></div>
    </div>
    <div class="sim-row" style="margin-top:8px;justify-content:flex-end"><button class="btn ghost" type="button" data-a="story">📜 아르키메데스 이야기 보기</button></div>
    <div class="l8-tomb" hidden>
      <div class="l8-tomb-fig"><svg viewBox="0 0 200 240" class="l3-svg" role="img" aria-label="원기둥 안에 꼭 맞게 들어간 구가 새겨진 묘비">
        <rect x="10" y="222" width="180" height="14" rx="3" fill="#90A4AE"/>
        <path d="M30 222 V60 Q30 18 100 18 Q170 18 170 60 V222 Z" fill="#CFD8DC" stroke="#78909C" stroke-width="3"/>
        <ellipse cx="100" cy="85" rx="45" ry="10" fill="none" stroke="#455A64" stroke-width="2.5"/>
        <path d="M55 85 V175 A45 10 0 0 0 145 175 V85" fill="none" stroke="#455A64" stroke-width="2.5"/>
        <path d="M55 175 A45 10 0 0 1 145 175" fill="none" stroke="#455A64" stroke-width="1.5" stroke-dasharray="4 3"/>
        <circle cx="100" cy="130" r="45" fill="rgba(92,107,192,.2)" stroke="#283593" stroke-width="2.5"/>
        <ellipse cx="100" cy="130" rx="45" ry="10" fill="none" stroke="#283593" stroke-width="1.2" stroke-dasharray="4 3"/>
        <text x="100" y="205" text-anchor="middle" class="lab small">구 : 원기둥 = 2 : 3</text>
      </svg></div>
      <div>
        <h5>📜 아르키메데스의 묘비</h5>
        <p>고대 그리스의 수학자 <b>아르키메데스</b>(기원전 287년경~기원전 212년)는 원기둥에 꼭 맞게 들어가는 구의 부피가 원기둥 부피의 $\\dfrac{2}{3}$라는 사실을 밝혀냈어.</p>
        <p>그는 이 발견을 무척 자랑스럽게 여겨서, 자신의 묘비에 <b>원기둥에 꼭 맞게 들어간 구</b>의 모양을 새겨 달라고 했대. 100년도 더 지난 뒤, 로마의 키케로가 시라쿠사에서 덤불에 덮여 있던 이 묘비를 찾아냈다는 이야기도 전해져.</p>
        <p class="l0-muted">💡 놀랍게도 겉넓이도 $2 : 3$이야. 구의 겉넓이는 $4\\pi r^2$, 원기둥의 겉넓이는 $2\\pi r^2 + 4\\pi r^2 = 6\\pi r^2$이거든. 구의 겉넓이는 아래 오렌지 실험에서 확인해 보자!</p>

  ], { cols:{ fixed:[{ label:'원뿔의 부피', value:'1' }] }, fbBelow:true, onSolved:() => { showStory(); toast('🏛️ 원뿔 : 구 : 원기둥 = 1 : 2 : 3 — 아르키메데스의 발견!', 3400); },
    steps:['(원뿔) : (구) : (원기둥) $= \\dfrac{2}{3}\\pi r^3 : \\dfrac{4}{3}\\pi r^3 : 2\\pi r^3$',
      '각 부피를 $\\dfrac{2}{3}\\pi r^3$으로 나누면 $1 : 2 : 3$',

function l8SetupObserveV(){
  const box = document.getElementById('l8-observe-v'); if(!box) return;
  const fb = $('.l8-fb', box), bs = [...box.querySelectorAll('[data-n]')];
  bs.forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.n === '2/3';
    bs.forEach(x => { x.setAttribute('aria-pressed', String(x === b)); x.classList.remove('ok', 'ng'); });

function l8SetupOrange(box){

      <g class="o-orange">
        <path class="o-l" d="M${CX} ${CY - r} A${r} ${r} 0 0 0 ${CX} ${CY + r} Z" fill="url(#l8-og)" stroke="#E65100" stroke-width="2"/>
        <path class="o-r" d="M${CX} ${CY - r} A${r} ${r} 0 0 1 ${CX} ${CY + r} Z" fill="url(#l8-og)" stroke="#E65100" stroke-width="2"/>

          ${Array.from({ length:10 }, (_, i) => { const a = i * Math.PI / 5; return `<line x1="${CX}" y1="${CY}" x2="${(CX + (r - 7) * Math.cos(a)).toFixed(1)}" y2="${(CY + (r - 7) * Math.sin(a)).toFixed(1)}" stroke="#FFB74D" stroke-width="2"/>`; }).join('')}

  const q = s => box.querySelector(s);

  const cap1 = q('.o-cap1'), cap2 = q('.o-cap2'), cap3 = q('.o-cap3');
  const circles = [...box.querySelectorAll('.o-circles .c')], rects = [...box.querySelectorAll('.o-pieces rect')];
  const bar = q('.l8-prog i'), barEm = q('.l8-prog em'), track = q('.l8-prog .track');
  function split(u){
    const k = l8Clamp(u / 0.3), s = l5Ease(l8Clamp((u - 0.3) / 0.3)), f = l8Clamp((u - 0.6) / 0.4);
    knife.setAttribute('y2', (CY - r - 16 + (2 * r + 32) * k).toFixed(1));

    face.setAttribute('opacity', String(f)); cap1.setAttribute('opacity', String(f));

    pieces.forEach((p, j) => {

  const D = [2.2, 2.4, 7];
  let stage = 0, raf = 0, ready = false;
  const render = (s, u) => { split(s > 0 ? 1 : u); drawCircles(s > 1 ? 1 : s === 1 ? u : 0); fill(s === 2 ? u : 0); };
  function run(s){
    stage = s; cancelAnimationFrame(raf);

    const t0 = performance.now();
    const loop = now => { const u = l8Clamp((now - t0) / 1000 / D[stage]); render(stage, u); if(u < 1) raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);

  const stepper = createStepper({ steps:[
    '오렌지(구)를 반으로 잘라. 자른 단면은 <b>반지름이 $r$인 원</b>이야.',
    '종이에 <b>단면과 크기가 같은 원 4개</b>를 그려.',
    '껍질을 잘게 잘라 원을 차례로 채워 봐. 껍질이 원 <b>몇 개</b>를 채울까? (아래 진행 막대를 봐)',
  ], onStep:i => { if(ready) run(i); else render(0, 0); } });
  const replay = el('button', { class:'btn ghost', type:'button' }, '▶ 이 단계 다시 보기');
  replay.addEventListener('click', () => run(stepper.index));
  $('.sim-row', stepper.el).appendChild(replay);
  q('.l8-orange-ctl').appendChild(stepper.el);
  ready = true;
  render(0, 0);
  // 화면에 처음 보일 때 1단계 애니메이션 자동 재생
  const io = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)){ io.disconnect(); if(stepper.index === 0) run(0); } }, { threshold:0.4 });
  io.observe(q('svg'));
}

/* =====================================================================
   예제와 활용: 반지름 2 cm인 구 + 지구의 바다 넓이(3D 지구본)
   ===================================================================== */
/** 바다 70% · 육지 30%(구면 넓이 기준)인 모형 지구 무늬 */
function l8EarthTexture(T){
  const W = 512, Hh = 256, SEED = 97531;
  const hash = (i, j, o) => {
    let h = Math.imul(i ^ 0x27d4eb2d, 374761393) ^ Math.imul(j + 0x165667b1, 668265263) ^ Math.imul(o + SEED, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
  };
  const vn = (u, v, f, o) => {   // 가로 방향으로 이어지는 값 잡음
    const x = u * f, y = v * f, i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy), i0 = ((i % f) + f) % f, i1 = (i0 + 1) % f;
    const a = hash(i0, j, o), b = hash(i1, j, o), c = hash(i0, j + 1, o), d = hash(i1, j + 1, o);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
  const val = new Float32Array(W * Hh), wt = new Float32Array(W * Hh);
  for(let y = 0; y < Hh; y++){
    const v = (y + 0.5) / Hh, w = Math.cos((0.5 - v) * Math.PI);
    for(let x = 0; x < W; x++){
      const u = (x + 0.5) / W; let s = 0, amp = 0.55, f = 3;
      for(let o = 0; o < 5; o++){ s += amp * vn(u, v, f, o); amp *= 0.5; f *= 2; }
      val[y * W + x] = s; wt[y * W + x] = w;
    }
  }
  // 넓이(위도별 가중치)로 70%가 되는 값을 바다/육지 경계로
  const idx = Array.from(val.keys()).sort((a, b) => val[a] - val[b]);
  let total = 0; for(let i = 0; i < wt.length; i++) total += wt[i];
  let acc = 0, thr = 0;
  for(const i of idx){ acc += wt[i]; if(acc >= total * 0.7){ thr = val[i]; break; } }
  const c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const ctx = c.getContext('2d'), img = ctx.createImageData(W, Hh);
  const mix = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
  for(let y = 0; y < Hh; y++){
    const lat = Math.abs(0.5 - (y + 0.5) / Hh) * 180;
    for(let x = 0; x < W; x++){
      const k = y * W + x, s = val[k];
      const col = s < thr ? mix([79, 195, 247], [13, 71, 161], Math.min(1, (thr - s) / 0.18))
        : lat > 64 ? [236, 239, 241] : mix([129, 199, 132], [121, 85, 72], Math.min(1, (s - thr) / 0.16));
      img.data[k * 4] = col[0]; img.data[k * 4 + 1] = col[1]; img.data[k * 4 + 2] = col[2]; img.data[k * 4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}

/* =====================================================================
   점검 도구: 3D 모델의 면·모서리·꼭짓점 개수 검사 (선생님 모드 → [🔍 3D 개수 검사])
   ---------------------------------------------------------------------
   앱에서 쓰는 모든 다면체 모양을 뷰어와 똑같은 방법(countSolid)으로 세어
   수학 공식(n각기둥: 면 n+2·모서리 3n·꼭짓점 2n 등)과 비교하고, 오일러 공식 V − E + F = 2도 확인한다.
   콘솔에서 auditSolidCounts() 로도 실행할 수 있다.
   ===================================================================== */
function solidAuditCases(T){
  const S = makeShapes(T), C = [];
  const geo = faces => l1Geometry(T, faces).geometry;
  for(let n = 3; n <= 8; n++){
    const nm = L0_POLY[n];
    C.push({ name:`${nm}기둥 (갤러리·비교)`, g:S.prism(n), exp:[n + 2, 3 * n, 2 * n] });
    C.push({ name:`${nm}뿔 (갤러리·비교)`, g:S.pyramid(n), exp:[n + 1, 2 * n, n + 1] });
    C.push({ name:`${nm}뿔대 (비교)`, g:S.frustum(n), exp:[n + 2, 3 * n, 2 * n] });
    C.push({ name:`${nm}기둥 (면 목록)`, g:geo(l1Prism(T, n).faces), exp:[n + 2, 3 * n, 2 * n] });
    C.push({ name:`${nm}뿔 (면 목록)`, g:geo(l1Pyramid(T, n).faces), exp:[n + 1, 2 * n, n + 1] });
    C.push({ name:`${nm}뿔대 (면 목록)`, g:geo(l1Frustum(T, n).faces), exp:[n + 2, 3 * n, 2 * n] });
    ['prism', 'pyramid'].forEach(k => { const sp = l0ShapeSpec(k, n);
      C.push({ name:`복습 갤러리: ${sp.title}`, g:sp.build(T, S), exp:k === 'prism' ? [n + 2, 3 * n, 2 * n] : [n + 1, 2 * n, n + 1] }); });
    // 각뿔을 밑면에 평행하게 / 비스듬하게 자른 모양 (1번 시뮬레이션)
    const P = l1Pyramid(T, n);
    const cutPar = l1Clip(T, P.faces, new T.Vector3(0, 1, 0), 0.1).below;
    C.push({ name:`${nm}뿔을 평행하게 자른 ${nm}뿔대`, g:geo(cutPar), exp:[n + 2, 3 * n, 2 * n] });
    const cutTilt = l1Clip(T, P.faces, new T.Vector3(0.35, 1, 0.2).normalize(), 0.05).below;
    C.push({ name:`${nm}뿔을 비스듬히 자른 입체`, g:geo(cutTilt), exp:null });
  }
  ['cuboid', 'cube'].forEach(k => { const sp = l0ShapeSpec(k); C.push({ name:`복습 갤러리: ${sp.title}`, g:sp.build(T, S), exp:[6, 12, 8] }); });
  C.push({ name:'직육면체 (면 목록)', g:geo(l1Box(T, 2, 1.2, 1.4).faces), exp:[6, 12, 8] });
  const PL = { tetra:['정사면체', 4, 6, 4], cube:['정육면체', 6, 12, 8], octa:['정팔면체', 8, 12, 6], dodeca:['정십이면체', 12, 30, 20], icosa:['정이십면체', 20, 30, 12] };
  Object.entries(PL).forEach(([k, [nm, f, e, v]]) => C.push({ name:`${nm} (2번 학습)`, g:geo(l2Platonic(T, k)), exp:[f, e, v] }));
  [['tetrahedron', '정사면체'], ['octahedron', '정팔면체'], ['dodecahedron', '정십이면체'], ['icosahedron', '정이십면체']].forEach(([k, nm]) => {
    const r = PL[{ tetrahedron:'tetra', octahedron:'octa', dodecahedron:'dodeca', icosahedron:'icosa' }[k]];
    C.push({ name:`${nm} (기본 모양)`, g:S[k](), exp:[r[1], r[2], r[3]] });
  });
  C.push({ name:'주령구 (1번 생각 열기)', g:geo(l1Jury(T).faces), exp:[14, 36, 24] });
  return C;
}
async function auditSolidCounts({ silent=false } = {}){
  const T = await loadThree();
  const rows = solidAuditCases(T).map(c => {
    const got = countSolid(T, c.g); c.g.dispose();
    const euler = got.vertices - got.edges + got.faces;
    const okExp = !c.exp || (got.faces === c.exp[0] && got.edges === c.exp[1] && got.vertices === c.exp[2]);
    return { 도형:c.name, 면:got.faces, 모서리:got.edges, 꼭짓점:got.vertices, 기대값:c.exp ? c.exp.join(' / ') : '(오일러만)', 'V−E+F':euler, 결과:okExp && euler === 2 ? '✓' : '✗' };
  });
  if(!silent){ console.table(rows); }
  return rows;
}
async function showSolidAudit(){
  let rows;
  try{ rows = await auditSolidCounts(); }catch(e){ toast('3D 도구를 불러오지 못해 검사할 수 없어.'); return; }
  const bad = rows.filter(r => r.결과 !== '✓');
  let wrap = document.getElementById('auditModal');
  if(!wrap){ wrap = el('div', { class:'modal-wrap', id:'auditModal', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'auditTitle' }); document.body.appendChild(wrap);
    wrap.addEventListener('click', e => { if(e.target === wrap || e.target.closest('[data-a="close"]')) wrap.classList.remove('open'); }); }
  wrap.innerHTML = `<div class="modal audit-modal"><h3 id="auditTitle">🔍 3D 개수 검사</h3>
    <p style="margin:0 0 8px">${rows.length}개 모양 중 <b>${rows.length - bad.length}개 통과</b>${bad.length ? ` · <b style="color:var(--ng)">${bad.length}개 불일치</b>` : ' — 정보 패널의 면·모서리·꼭짓점 개수가 모두 수학적인 개수와 같아요.'}</p>
    <div class="audit-scroll"><table class="l0-table"><thead><tr><th>도형</th><th>면</th><th>모서리</th><th>꼭짓점</th><th>기대값</th><th>V−E+F</th><th></th></tr></thead>
    <tbody>${rows.map(r => `<tr><th>${r.도형}</th><td>${r.면}</td><td>${r.모서리}</td><td>${r.꼭짓점}</td><td>${r.기대값}</td><td>${r['V−E+F']}</td><td>${r.결과}</td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" type="button" data-a="close">닫기</button></div></div>`;
  wrap.classList.add('open');
}

/* =====================================================================
   1. 다면체와 각뿔대 확인 퀴즈: 문항 틀 5개 × 여러 변형 (처음부터 다시 풀 때마다 비슷한 다른 문제)
   ===================================================================== */
const L1_QUIZ_LAST = [];
function l1QuizGen(first){
  const pick = (slot, arr) => {
    let k = first ? 0 : Math.floor(Math.random() * arr.length);
    if(!first && arr.length > 1 && k === L1_QUIZ_LAST[slot]) k = (k + 1 + Math.floor(Math.random() * (arr.length - 1))) % arr.length;
    L1_QUIZ_LAST[slot] = k; return arr[k];
  };
  const P = n => L0_POLY[n], HN = f => L1_NUM[f] + '면체';
  const KIND = { pyr:{ s:'뿔', F:n => n + 1, E:n => 2 * n, V:n => n + 1, tF:'n+1', tE:'2n', tV:'n+1', why:n => `밑면 1개와 옆면 ${n}개` },
                 prism:{ s:'기둥', F:n => n + 2, E:n => 3 * n, V:n => 2 * n, tF:'n+2', tE:'3n', tV:'2n', why:n => `밑면 2개와 옆면 ${n}개` },
                 fr:{ s:'뿔대', F:n => n + 2, E:n => 3 * n, V:n => 2 * n, tF:'n+2', tE:'3n', tV:'2n', why:n => `밑면 2개와 옆면 ${n}개` } };
  // ① 몇 면체? (객관식)
  const q1 = [['pyr', 3], ['prism', 4], ['fr', 4], ['pyr', 5], ['prism', 6], ['fr', 6], ['pyr', 7], ['fr', 3]].map(([k, n]) => {
    const K = KIND[k], f = K.F(n), lo = Math.max(4, f - 1 - Math.floor(Math.random() * 2));
    const opts = [lo, lo + 1, lo + 2, lo + 3].map(HN);
    return { type:'choice', question:`${P(n)}${K.s}${k === 'fr' ? '는' : '은'} 몇 면체일까?`, options:opts, answer:opts.indexOf(HN(f)),
      explanation:`${P(n)}${K.s}${k === 'fr' ? '는' : '은'} ${K.why(n)}로, 면이 $${k === 'pyr' ? '1' : '2'}+${n}=${f}$(개)이므로 <b>${HN(f)}</b>야.` };
  });
  // ② 모서리와 꼭짓점의 개수

/** 원래 문항 + 비슷한 문항 중에서 하나씩 (바로 전과 겹치지 않게) */
function makeQuizRegen(orig, variants){
  const last = orig.map(() => 0);
  return () => orig.map((q, i) => {
    const pool = [q, ...(variants[i] || [])];
    if(pool.length < 2) return q;
    let k = Math.floor(Math.random() * pool.length);
    if(k === last[i]) k = (k + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length;
    last[i] = k; return pool[k];
  });
}

/* =====================================================================
   소활동 단계 진행: 학습 목표 → 생각 열기 → … → 확인 퀴즈
   ---------------------------------------------------------------------
   · 활동 제목 아래에 소활동 버튼을 가로로 균등 배열(.step-bar)하고, 한 번에 한 소활동 카드만 보여 준다.
   · 순서대로 진행: 지금까지 연 단계와 바로 다음 단계만 누를 수 있다. (선생님 모드는 모두 열림)
   · 각 카드 아래 [◀ 이전] [다음 ▶] 버튼, 진행 상황은 state.steps에 저장된다.
   · 카드 사이에 끼어 있는 요소(예: 7번 학습의 A/B 탭)는 바로 뒤 카드와 함께 보이고 숨겨진다.
   ===================================================================== */
function lessonStepState(id){
  if(!state.steps[id] || typeof state.steps[id] !== 'object') state.steps[id] = { cur:0, reached:0 };
  return state.steps[id];
}
function collectLessonSteps(sec){
  const steps = []; let pending = [];
  [...sec.children].forEach(ch => {
    if(ch.matches('.lesson-hero, .step-bar, .step-cap')) return;
    if(ch.matches('article.card')){
      if(ch.hidden) return;                       // 학습 설정에서 숨긴 카드는 단계에서 뺀다
      steps.push({ card:ch, extra:pending }); pending = [];
    }else pending.push(ch);
  });
  if(pending.length && steps.length) steps[steps.length - 1].extra.push(...pending);
  return steps;
}
const stepTitle = card => { const h = $('h3', card); return h ? h.textContent.trim() : '활동'; };
const stepLabel = card => card.dataset.stepLabel || stepTitle(card).split(':')[0].trim();   // data-step-label이 있으면 그 이름 사용
const stepEmoji = card => { const e = $('.card-emoji', card); return e ? e.textContent.trim() : '•'; };

function setupLessonSteps(id){
  const sec = document.getElementById(id); if(!sec) return;
  if(!sec._stepsReady){
    sec._stepsReady = true;
    const bar = el('nav', { class:'step-bar', 'aria-label':'소활동 단계' });
    const cap = el('p', { class:'step-cap', 'aria-live':'polite' });
    $('.lesson-hero', sec).after(bar, cap);
    let raf = 0;   // 카드가 나중에 추가·이동되면(시뮬레이션 준비 중) 단계 목록을 다시 만든다
    new MutationObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => refreshLessonSteps(id)); }).observe(sec, { childList:true });
  }

}
/** 단계 열림: 관리자 / 선생님이 연 단계 / 지금까지 연 단계 + (앞 단계를 마쳤으면) 바로 다음 단계 */
function stepOpen(steps, st, i){
  const k = clsLock(steps[i].card.id);
  if(state.teacher || k === 'open') return true;
  if(k === 'lock') return false;
  return i <= st.reached || (i === st.reached + 1 && clsCardDone(steps[st.reached].card));
}
/** 단계(카드)를 떠날 때: 보이던 소활동(또는 카드) 결과 보내기 */
function stepReport(card){
  if(!card || /-quiz-card$/.test(card.id)) return;
  const hosts = [...card.querySelectorAll('.subtab-host')];
  if(hosts.length) hosts.forEach(h => h._report && h._report());
  else if(!clsOwnReport(card)) clsReport(card.id, card);
}
function refreshLessonSteps(id){
  const sec = document.getElementById(id); if(!sec || !sec._stepsReady) return;
  const steps = collectLessonSteps(sec), n = steps.length, st = lessonStepState(id);
  if(!n) return;
  st.cur = Math.max(0, Math.min(st.cur, n - 1)); st.reached = Math.max(st.cur, Math.min(st.reached, n - 1));
  const open = i => stepOpen(steps, st, i);
  const bar = $('.step-bar', sec), cap = $('.step-cap', sec);
  bar.style.setProperty('--n', n);
  bar.innerHTML = steps.map((s, i) => {
    const on = i === st.cur, seen = i <= st.reached && !on, lock = !open(i), label = stepLabel(s.card);
    return `<button type="button" class="step-btn${on ? ' on' : ''}${seen ? ' seen' : ''}${lock ? ' locked' : ''}" data-i="${i}"
      ${on ? 'aria-current="step"' : ''} ${lock ? 'aria-disabled="true"' : ''} aria-label="${i + 1}단계 ${label}${seen ? ', 완료' : lock ? ', 잠김' : ''}" title="${stepTitle(s.card)}">
      <span class="sn" aria-hidden="true">${i + 1}</span><span class="se" aria-hidden="true">${stepEmoji(s.card)}</span><span class="sl">${label}</span>${seen ? '<em class="sbadge ok" aria-hidden="true">✓</em>' : lock ? '<em class="sbadge lock" aria-hidden="true">🔒</em>' : ''}</button>`;
  }).join('');
  bar.querySelectorAll('.step-btn').forEach(b => b.addEventListener('click', () => goStep(id, +b.dataset.i)));
  steps.forEach((s, i) => {
    const on = i === st.cur;
    [s.card, ...s.extra].forEach(e => e.classList.toggle('step-off', !on));
    s.card.classList.toggle('cls-locked', isStudent() && clsLock(s.card.id) === 'lock');
    const num = $('.card-step', s.card); if(num) num.textContent = i + 1;
    let nav = s.card.querySelector(':scope > .step-nav');
    if(!nav){ nav = el('div', { class:'step-nav' }); s.card.appendChild(nav); }
    nav.innerHTML = (i > 0 ? `<button class="btn" type="button" data-go="${i - 1}">◀ 이전: ${stepLabel(steps[i - 1].card)}</button>` : '')
      + (i < n - 1 ? `<button class="btn primary" type="button" data-go="${i + 1}">다음: ${stepLabel(steps[i + 1].card)} ▶</button>` : '');
    nav.hidden = !nav.innerHTML;
    nav.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => goStep(id, +b.dataset.go)));
  });

}
function goStep(id, i, { scroll=true } = {}){
  const sec = document.getElementById(id); if(!sec) return;
  const n = collectLessonSteps(sec).length, st = lessonStepState(id);
  if(i < 0 || i >= n) return;
  const all = collectLessonSteps(sec);
  if(!stepOpen(all, st, i)){ toast(clsLock(all[i].card.id) === 'lock' ? '🔒 활동 시작 전입니다. 이전 활동에 먼저 참여하세요.' : '🔒 지금 활동을 모두 마치면 다음 활동이 열려요. (소활동·세부활동, 빈칸과 문제에 모두 참여해 보자!)'); return; }
  if(i !== st.cur){ stepReport(all[st.cur] && all[st.cur].card); const nc = all[i].card, own = CLS_OWN.find(d => d.card === nc.id);
    if(own) setTimeout(() => { const o = clsOwn(own); if(o){ clsEnter(`${own.card}:${o.cur}`); clsFill(`${own.card}:${o.cur}`, o.secs[o.cur]); clsOwnSync(o); } }, 300);
    else if(!nc.querySelector('.subtab-host')){ clsEnter(nc.id); setTimeout(() => clsFill(nc.id, nc), 60); } }
  st.cur = i; st.reached = Math.max(st.reached, i); saveProgress();
  refreshLessonSteps(id);
  if(scroll){ const bar = $('.step-bar', sec); bar && bar.scrollIntoView({ behavior:'smooth', block:'start' }); }
  const card = collectLessonSteps(sec)[i].card; card.setAttribute('tabindex', '-1'); card.focus({ preventScroll:true });
}

/* =====================================================================
   2~8 학습: 확인·다시 하기 같은 활동 버튼을 그 영역 안에서 오른쪽 정렬
   (활동 화면이 다시 그려져도 맞도록 MutationObserver로 다시 적용)
   ===================================================================== */
const ACTION_RE = /확인|다시|처음부터|초기화|정답|힌트|리셋|채점|되돌리기|지우기|새 문제|제출|비우고/;
function alignActionButtons(sec){
  if(!sec) return;
  const apply = () => {
    sec.querySelectorAll('.btn').forEach(bt => {
      if(bt.dataset.alignDone || bt.closest('.quiz, .step-nav, .l0-simnav, .l0-simtabs, .step-bar, .viewer-toolbar, [role="tablist"], .segmented, .l0c-actions, .l4-cells, .l4-clues')) return;
      if(!ACTION_RE.test(bt.textContent)) return;
      bt.dataset.alignDone = '1';
      const par = bt.parentElement, cs = getComputedStyle(par);
      if(cs.display.includes('flex')){
        if(cs.flexDirection.startsWith('column')) bt.classList.add('act-right');
        else par.classList.add('act-row');
      }else if(cs.display.includes('grid')) bt.classList.add('act-right-grid');
      else { const row = el('div', { class:'sim-row act-row' }); bt.before(row); row.appendChild(bt); }
    });
  };
  apply();
  if(!sec._alignObs){
    let raf = 0;
    sec._alignObs = new MutationObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(apply); });
    sec._alignObs.observe(sec, { childList:true, subtree:true });
  }
}

/* =====================================================================
   교과서 글자체: 5~8 학습의 일반 글자로 쓴 식(숫자·연산 기호)을 수식 글자체로
   ===================================================================== */
const TF_RE = /(?:\([^()\n]{1,24}\)|[0-9A-Za-zπ½²³.]+)(?:\s*[×÷=+−·\-]\s*(?:\([^()\n]{1,24}\)|[0-9A-Za-zπ½²³.]+))+/g;
function tfWrap(root){
  if(!root || root.nodeType !== 1) return;
  const SKIP = 'script,style,svg,textarea,input,select,.katex,.tf,canvas,.l4-board,.no-tf';
  if(root.closest && root.closest(SKIP)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n => {
    const p = n.parentElement; if(!p || p.closest(SKIP)) return NodeFilter.FILTER_REJECT;
    TF_RE.lastIndex = 0; return TF_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const t = n.nodeValue, frag = document.createDocumentFragment(); let last = 0; TF_RE.lastIndex = 0; let m;
    while((m = TF_RE.exec(t))){
      if(!/[×÷=+−·\-]/.test(m[0]) || !/[0-9A-Za-zπ]/.test(m[0])) continue;
      if(/^[A-Za-z]+-[A-Za-z]+$/.test(m[0])) continue;
      frag.appendChild(document.createTextNode(t.slice(last, m.index)));
      const sp = document.createElement('span'); sp.className = 'tf'; sp.textContent = m[0]; frag.appendChild(sp); last = m.index + m[0].length;
    }
    if(!last) return;
    frag.appendChild(document.createTextNode(t.slice(last))); n.replaceWith(frag);
  });
}
function setupTextbookFont(){
  ['lesson-5', 'lesson-6', 'lesson-7', 'lesson-8'].forEach(id => {
    const sec = document.getElementById(id); if(!sec || sec._tfObs) return;
    tfWrap(sec);
    let raf = 0; const pend = new Set();
    sec._tfObs = new MutationObserver(ms => { ms.forEach(m => pend.add(m.target.nodeType === 1 ? m.target : m.target.parentElement)); cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => { const list = [...pend]; pend.clear(); list.forEach(e => e && e.isConnected && tfWrap(e)); }); });
    sec._tfObs.observe(sec, { childList:true, subtree:true, characterData:true });
  });
}

/* =====================================================================
   확인 퀴즈 연습장 (5~8 학습): 손글씨(펜·지우개) + 키보드로 식 쓰기, 열고 닫기
   ===================================================================== */
function addScratchpad(quizBody, opts = {}){
  if(!quizBody || quizBody._pad) return;
  const wrap = el('div', { class:'scratch' }, `
    <div class="scratch-pad" hidden>
      <div class="scratch-tools" role="toolbar" aria-label="연습장 도구">
        <button class="btn" type="button" data-t="pen" aria-pressed="true">✏️ 펜</button>
        <button class="btn" type="button" data-t="eraser" aria-pressed="false">🧽 지우개</button>
        <span class="scratch-colors">${['#1F2A44', '#D32F2F', '#1565C0'].map((c, i) => `<button type="button" class="sw" data-c="${c}" style="--c:${c}" aria-label="펜 색 ${['검정', '빨강', '파랑'][i]}" aria-pressed="${i === 0}"></button>`).join('')}</span>
        <button class="btn" type="button" data-t="clear">🗑️ 모두 지우기</button>
      </div>
      <canvas class="scratch-canvas" aria-label="연습장: 손가락이나 마우스로 식을 써 보자"></canvas>
      <label class="scratch-text"><span>⌨️ 키보드로 식 쓰기</span><textarea rows="3" placeholder="예) (밑넓이) × (높이) = 12 × 5 = 60"></textarea></label>
    </div>`);
  quizBody.after(wrap); quizBody._pad = wrap;
  const pad = $('.scratch-pad', wrap), cv = $('canvas', wrap), ctx = cv.getContext('2d');
  // 열기/닫기 버튼은 [제출하기]와 같은 줄 왼쪽에 (문제가 바뀌어 다시 그려져도 다시 넣음)
  const tg = el('button', { class:'btn scratch-toggle', type:'button', 'aria-expanded':'false' }, '📝 연습장 열기');
  const placeToggle = () => {
    const act = [...quizBody.querySelectorAll('.quiz-actions')].find(a => !a.closest('.quiz-summary'));
    if(act){ if(tg.parentElement !== act) act.prepend(tg); wrap.hidden = false; }
    else { tg.remove(); wrap.hidden = true; }
  };
  if(opts.toggleIn){ opts.toggleIn.prepend(tg); }   // 퀴즈가 아닌 활동: 정해 준 버튼 줄 왼쪽에
  else { new MutationObserver(placeToggle).observe(quizBody, { childList:true }); placeToggle(); }
  const st = { tool:'pen', color:'#1F2A44', drawing:false, last:null, w:0 };
  function fit(){
    const w = Math.round(cv.clientWidth); if(!w || w === st.w) return;
    const dpr = window.devicePixelRatio || 1, h = 260, keep = st.w ? cv.toDataURL() : null;
    st.w = w; cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(keep){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, w, h); img.src = keep; }
  }
  if(window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fit)).observe(cv);
  tg.addEventListener('click', () => {
    pad.hidden = !pad.hidden; tg.setAttribute('aria-expanded', String(!pad.hidden));
    tg.textContent = pad.hidden ? '📝 연습장 열기' : '🙈 연습장 닫기';
    if(!pad.hidden) requestAnimationFrame(fit);
  });
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { st.drawing = true; st.last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    if(!st.drawing) return; const p = pos(e);
    ctx.globalCompositeOperation = st.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = st.color; ctx.lineWidth = st.tool === 'eraser' ? 22 : 2.6; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...st.last); ctx.lineTo(...p); ctx.stroke(); st.last = p;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { st.drawing = false; }));
  wrap.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.t;
    if(t === 'clear'){ ctx.clearRect(0, 0, cv.width, cv.height); $('textarea', wrap).value = ''; return; }
    st.tool = t; wrap.querySelectorAll('[data-t="pen"],[data-t="eraser"]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  wrap.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
    st.color = b.dataset.c; st.tool = 'pen';
    wrap.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    wrap.querySelectorAll('[data-t="pen"],[data-t="eraser"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.t === 'pen')));
  }));
}

function buildLessonContent(i){
  const L = LESSONS[i];
  if(built[L.id]) return;
  built[L.id] = true;
  const C = LESSON_CONTENT[L.id] || {};
  for(const P of PARTS){
    const body = document.getElementById(`${L.id}-${P.key}`);
    if(P.key === 'quiz'){
      if(C.quiz && C.quiz.length){ createQuiz(body, C.quiz, { lessonId:L.id, regen:C.quizGen || (QUIZ_VARIANTS[L.id] ? makeQuizRegen(C.quiz, QUIZ_VARIANTS[L.id]) : null), passOnFinish:!!C.quizPassOnFinish, noNextButton:!!C.quizPassOnFinish });
        if(L.num >= 5) addScratchpad(body); }
      else body.innerHTML = placeholder();
    }else if(P.key === 'sim'){
      if(typeof C.sim === 'function'){
        Promise.resolve(C.sim(body, { lesson:L, create3DViewer, createSlider, createStepper, createPlayButton, createSegmented }))
          .catch(err => { console.error(err); body.innerHTML = placeholder('시뮬레이션을 여는 중 문제가 생겼어.'); })
          .finally(() => {
            if(L.num !== 0) ['concept', 'sim'].forEach(k => setupSubTabs(document.getElementById(`${L.id}-${k}`)));   // 0. 복습은 자체 소활동 버튼
            document.querySelectorAll(`#${L.id} .wc-wrap[data-wordcheck]`).forEach(w => {
              if(w.dataset.wcReady) return; w.dataset.wcReady = '1'; setupWordCheck(w, '.wc-box', w.dataset.wordcheck, w.dataset.title);
              // data-reveal: [개념 확인하기]를 누르면 나타나는 영역(예: 생각 상자)
              if(w.dataset.reveal) $('[data-a="check"]', w).addEventListener('click', () => { const r = document.querySelector(w.dataset.reveal); if(r) r.hidden = false; });
            });
            if(L.num >= 2) alignActionButtons(document.getElementById(L.id));
            if(L.num >= 5) setupTextbookFont();

      }else body.innerHTML = placeholder();
    }else{

    }
    renderMath(body);
  }  setupLessonSteps(L.id);
}

    b.setAttribute('aria-disabled', String(!open));

    st.className = 'nav-status ' + (done ? 'done' : open ? 'open' : 'lock');
    st.textContent = done ? '✓ 완료' : open ? '열림' : '🔒 잠김';
    b.setAttribute('aria-label', `${LESSONS[i].num}. ${LESSONS[i].title}, ${st.textContent}`);
  });
  LESSONS.forEach((L, i) => document.getElementById(L.id).classList.toggle('is-done', isCompleted(i)));

  const doneCount = LESSONS.filter((_, i) => isCompleted(i)).length;
  const pct = Math.round(doneCount / LESSONS.length * 100);

    $('#nextLabel').textContent = `${locked ? '🔒 ' : ''}${LESSONS[c+1].num}. ${LESSONS[c+1].title}`;
  }else{

function goTo(i, { fromHash=false } = {}){
  if(i < 0 || i >= LESSONS.length) return;
  if(!isUnlocked(i)){
    toast('🔒 앞 학습 퀴즈를 먼저 통과해 보자!');
    if(fromHash) setHash('#' + LESSONS[state.current].id);
    return;
  }
  state.current = i; state.view = 'lesson'; $('.pager').hidden = false;
  document.querySelectorAll('.lesson').forEach((s, k) => s.classList.toggle('active', k === i));
  document.documentElement.style.setProperty('--accent', LESSONS[i].color);
  buildLessonContent(i);
  syncViewersToLesson();
  updateNav();
  setHash('#' + LESSONS[i].id);
  closeMenu();
  window.scrollTo({ top:0, behavior:'smooth' });
  $('#main').focus({ preventScroll:true });
}

/** 학습 완료 처리 (퀴즈를 모두 맞혔을 때, 또는 퍼즐 등에서 직접 호출) */
function completeLesson(lessonId){
  const i = LESSONS.findIndex(l => l.id === lessonId);
  if(i < 0) return;
  const first = !state.completed[lessonId];
  state.completed[lessonId] = true;
  saveProgress(); updateNav();
  if(first){
    celebrate();
    if(allLessonsDone()){
      toast('🏆 모든 학습을 완료했어! 잠시 뒤 활동 기록 화면이 열려.', 3500);
      setTimeout(() => { if(state.view !== 'finish') showFinish(); }, 3200);
    }else toast(i < LESSONS.length - 1 ? `🎉 ${LESSONS[i].title} 완료! 다음 학습이 열렸어.` : '🎉 마지막 학습 완료! 아직 끝내지 않은 학습을 마치면 활동 기록 화면이 열려.', 3500);

const clsStore = k => safeStorage.get(k) === '1';
const clsAll = (c, sel, ok) => { const a = [...c.querySelectorAll(sel)]; return a.length > 0 && a.every(x => x.matches(ok)); };

const CLS_TASKS = {

/* 입력·문제가 없는 활동: 아래쪽(다음 버튼 줄)이 화면에 보이면 '살펴봄' */
function clsMarkViewed(){

/* ---------------------------------------------------------------------
   세부활동: 소활동 안에서 하나씩 골라 해 보는 항목(예: 삼각뿔·사각뿔·오각뿔·원뿔)
   학생(자동 모드)은 세부활동을 모두 한 번씩 해 보아야 다음 소활동으로 넘어갈 수 있다.
   소활동 열쇠 → 세부활동 버튼 묶음 (소활동 안에서 찾음)
   --------------------------------------------------------------------- */
const CLS_DETAIL = {

  'lesson-5-sim-card:4':'.segmented',
  'lesson-6-sim:0':'.l6-tabs',
  'lesson-7-sim:1':'.l7-choices', 'lesson-7-simB:0':'.l7-choices', 'lesson-7-simB:1':'.l7-side-btns',
  'lesson-8-sim:1':'.l8-modes', 'lesson-8-sim:2':'.l8-ovbtns',

/* 자체 소활동 버튼을 쓰는 활동(0. 복습 시뮬레이션, 5. 기둥 부피 탐구) */
const CLS_OWN = [
  { card:'lesson-0-sim-card', tabs:'.l0-simtab', secs:'section.l0-simsec', go:'.l0-simnav [data-go]',
    target:(b, o) => b.matches('.l0-simtab') ? o.tabs.indexOf(b) : o.secs.findIndex(x => x.dataset.k === b.dataset.go) },
  { card:'lesson-5-sim-card', tabs:'.l5-tab', secs:'section.l5-act', go:'.l5-nav [data-go]',
    target:(b, o) => b.matches('.l5-tab') ? o.tabs.indexOf(b) : +b.dataset.go },
];
function clsOwn(def){ const card = document.getElementById(def.card); if(!card) return null;
  const secs = [...card.querySelectorAll(def.secs)]; if(!secs.length) return null;
  return { def, card, secs, tabs:[...card.querySelectorAll(def.tabs)], cur:secs.findIndex(x => !x.hidden) }; }
function clsSecKey(sec){
  const h = sec.closest('.subtab-host'); if(h) return `${h.id}:${String(sec.dataset.k || '').replace(/^s/, '')}`;
  for(const d of CLS_OWN){ const o = clsOwn(d); if(o && o.secs.includes(sec)) return `${d.card}:${o.secs.indexOf(sec)}`; }
  return null;
}
function clsDetailGroup(sec){ const sel = CLS_DETAIL[clsSecKey(sec)]; return sel ? sec.querySelector(sel) : null; }
function clsDetailBtns(g){ return g ? [...g.querySelectorAll('button')].filter(b => !b.closest('.l0-simtabs')) : []; }
const clsOn = b => b.getAttribute('aria-pressed') === 'true' || b.getAttribute('aria-selected') === 'true' || b.classList.contains('on');
function clsDetailMark(sec){   // 지금 선택돼 있는 세부활동을 '해 봄'으로 기록
  const key = clsSecKey(sec), bs = clsDetailBtns(clsDetailGroup(sec)); if(!key || !bs.length) return false;
  const done = new Set(cls.detail[key] || []); let ch = false;
  bs.forEach((b, i) => { if(clsOn(b) && !done.has(i)){ done.add(i); ch = true; } });
  if(ch){ cls.detail[key] = [...done]; jset(CLS_KEY.detail, cls.detail); }
  return ch;
}
function clsDetailDone(sec){
  const key = clsSecKey(sec), bs = clsDetailBtns(clsDetailGroup(sec)); if(!key || !bs.length) return true;
  const done = new Set(cls.detail[key] || []); return bs.every((_, i) => done.has(i));
}
function clsDetailLeft(sec){ const done = new Set(cls.detail[clsSecKey(sec)] || []);
  return clsDetailBtns(clsDetailGroup(sec)).filter((_, i) => !done.has(i)).map(b => b.textContent.replace(/^✓\s*/, '').replace(/\s+/g, ' ').trim() || '이름 없는 도형'); }
/* 자체 소활동: 열어 본 것 기록 + 잠금 표시 */
function clsOwnSync(o){
  if(!o || o.cur < 0) return;
  const seen = new Set(cls.seen[o.def.card] || []);
  if(!seen.has('s' + o.cur)){ seen.add('s' + o.cur); cls.seen[o.def.card] = [...seen]; jset(CLS_KEY.seen, cls.seen); }
  clsDetailMark(o.secs[o.cur]);
  o.tabs.forEach((t, j) => t.classList.toggle('locked', !clsOwnOpen(o, j) && j !== o.cur));
  o.secs.forEach((x, j) => x.classList.toggle('cls-locked', isStudent() && clsLock(`${o.def.card}:${j}`) === 'lock'));
}
function clsOwnOpen(o, j){
  const lk = clsLock(`${o.def.card}:${j}`); if(state.teacher || lk === 'open') return true; if(lk === 'lock') return false;
  const seen = new Set(cls.seen[o.def.card] || []);
  return o.secs.slice(0, j).every((x, i) => seen.has('s' + i) && clsDetailDone(x));
}
function clsOwnDone(card){ const d = CLS_OWN.find(x => x.card === card.id); if(!d) return true; const o = clsOwn(d); if(!o) return true;
  const seen = new Set(cls.seen[d.card] || []); return o.secs.every((x, i) => seen.has('s' + i) && clsDetailDone(x)); }
function clsOwnReport(card){ const d = CLS_OWN.find(x => x.card === card.id); const o = d && clsOwn(d); if(!o || o.cur < 0) return false;
  clsReport(`${d.card}:${o.cur}`, o.secs[o.cur]); return true; }
function clsBlockMsg(lock, left){
  return lock ? '🔒 활동 시작 전입니다. 이전 활동에 먼저 참여하세요.'
    : left.length ? `🔒 세부활동을 모두 해 보면 다음 소활동이 열려요. (남은 것: ${left.join(', ')})` : '🔒 앞 소활동을 먼저 살펴보자!';
}
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('button'); if(!t) return;
  // ① 자체 소활동 버튼: 학생은 앞 소활동(세부활동 포함)을 마쳐야 이동
  for(const d of CLS_OWN){
    if(!t.closest('#' + d.card) || !(t.matches(d.tabs) || t.matches(d.go))) continue;
    const o = clsOwn(d); if(!o) return;

    const own = CLS_OWN.find(d => sec.closest('#' + d.card)); if(own) clsOwnSync(clsOwn(own));

/* --- 소활동 결과 계산 (정답 표시가 된 입력 칸·선택 문항 수) --- */
function clsScore(root){
  const ins = [...root.querySelectorAll('input[type="text"], .cw-slot')].filter(e => !e.closest('.scratch, .fin-meta, .l0c-check[hidden]'));
  const okOf = e => { const c = e.closest('.ok, .is-correct'); return !!c && root.contains(c); };
  const groups = [...root.querySelectorAll('[role="group"]')].filter(g => g.querySelector('button'));
  const total = ins.length + groups.length;
  const correct = ins.filter(okOf).length + groups.filter(g => g.querySelector('button.ok, button.is-correct')).length;
  return { correct:Math.min(correct, total), total, score:total ? Math.round(Math.min(correct, total) / total * 100) : null,
    inputs:clsFields(root).map(f => f.value) };
}
/** 소활동 안의 입력 칸(글자 입력·식 쓰기) — 다시 로그인하면 이 순서대로 채워 넣는다 */
function clsFields(root){ return [...root.querySelectorAll('input[type="text"], textarea')].filter(e => !e.closest('.scratch, .fin-meta, .cls-modal-wrap')); }
/** 저장된 입력값을 소활동에 채우기 (빈 칸에만, 화면이 늦게 만들어지면 몇 번 다시 시도) */
function clsFill(key, root, tries=0){
  if(!isStudent() || !root || root._clsFilled) return;
  const r = cls.results[key]; if(!r || !Array.isArray(r.inputs) || !r.inputs.some(v => v)) { root._clsFilled = true; return; }
  const fs = clsFields(root);
  if(!fs.length){ if(tries < 6) setTimeout(() => clsFill(key, root, tries + 1), 700); return; }
  root._clsFilled = true;
  fs.forEach((f, i) => { const v = r.inputs[i]; if(v && !f.value && !f.readOnly && !f.disabled){ f.value = v; f.dispatchEvent(new Event('input', { bubbles:true })); } });
}
/** 소활동 이름: 주제 "8. 구의 부피와 겉넓이" › 활동 "3. 구 부피 탐구" › 소활동 "2) 물 붓기 실험" (번호는 시트 열 순서 정렬용) */
function clsNames(key){
  for(const L of CLS_CATALOG){
    for(const [si, s] of L.steps.entries()){
      const step = `${si + 1}. ${s.label}`;
      if(s.card === key) return { lesson:L.title, step, sub:'' };
      for(const h of s.subs){ const i = +String(key).split(':').pop(); if(key.startsWith(h.host + ':')) return { lesson:L.title, step, sub:`${i + 1}) ${h.items[i] || `소활동 ${i + 1}`}` }; }
    }
    if(key === L.id + ':quiz'){ const qi = L.steps.findIndex(x => /-quiz-card$/.test(x.card)); return { lesson:L.title, step:`${qi >= 0 ? qi + 1 : L.steps.length + 1}. 확인 퀴즈`, sub:'' }; }
  }
  return { lesson:'', step:key, sub:'' };
}
/** 보낼 때마다 모든 소활동 이름을 지금 기준으로 다시 붙인 학습 데이터 */
function clsSnapshot(){ const o = {}; Object.entries(cls.results).forEach(([k, r]) => { o[k] = { ...r, ...clsNames(k), key:k }; }); return o; }
function clsEnter(key){ cls.enter[key] = Date.now(); }
/** 소활동을 마치고 다른 소활동·단계로 넘어갈 때: 결과 저장 + 구글 시트로 전송 */
function clsReport(key, root, extra){
  if(!isStudent() || !key) return;
  const r = extra || (root ? clsScore(root) : { correct:0, total:0, score:null });
  const prev = cls.results[key] || { best:null, time:0, visits:0 };
  const sec = cls.enter[key] ? Math.round((Date.now() - cls.enter[key]) / 1000) : 0; delete cls.enter[key];
  const n = clsNames(key);
  const rec = { ...n, key, correct:r.correct, total:r.total, score:r.score, best:r.score == null ? prev.best : Math.max(prev.best ?? 0, r.score),
    time:(prev.time || 0) + sec, visits:(prev.visits || 0) + 1, done:true, at:new Date().toISOString(),
    inputs:r.inputs || prev.inputs || [] };
  cls.results[key] = rec; jset(CLS_KEY.results, cls.results);
  clsSend({ action:'record', sid:cls.user.sid, name:cls.user.name, sentAt:rec.at, item:rec,
    completedLessons:LESSONS.filter((_, i) => isCompleted(i)).length, snapshot:clsSnapshot(), quiz:state.scores, progress:clsProgress() });
}
/** 이어서 하기용 진행 상태 (구글 시트에 함께 저장 → 같은 학번·이름으로 다시 들어오면 불러옴) */
function clsProgress(){
  let sub = {}; try{ sub = JSON.parse(safeStorage.get(SUBTAB_KEY) || '{}') || {}; }catch(e){}
  return { completed:state.completed, scores:state.scores, steps:state.steps, seen:cls.seen, subtabs:sub, results:cls.results, detail:cls.detail };
}
function clsApplyProgress(pg){
  if(!pg || typeof pg !== 'object') return false;
  safeStorage.set(STORAGE_KEY, JSON.stringify({ completed:pg.completed || {}, scores:pg.scores || {}, steps:pg.steps || {}, savedAt:Date.now() }));
  safeStorage.set(SUBTAB_KEY, JSON.stringify(pg.subtabs || {}));
  jset(CLS_KEY.seen, pg.seen || {}); jset(CLS_KEY.results, pg.results || {}); jset(CLS_KEY.detail, pg.detail || {});
  return true;
}
/** 구글 시트에서 같은 학번·이름의 이전 기록 불러오기 */
async function clsRestore(sid, name){
  const url = clsUrl(); if(!url) return null;
  try{
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + `action=restore&sid=${encodeURIComponent(sid)}&name=${encodeURIComponent(name)}&t=${Date.now()}`);
    const j = await res.json(); return j && j.ok && j.progress ? j.progress : null;
  }catch(e){ return null; }
}
/* --- 전송 (보내지 못하면 모아 두었다가 다시 보냄) --- */
let clsSending = false;
function clsSend(payload){
  const q = jget(CLS_KEY.queue, []); q.push(payload); jset(CLS_KEY.queue, q.slice(-300)); clsFlush();
}
async function clsFlush(){
  const url = clsUrl(); if(!url || clsSending) return;

  try{
    let q = jget(CLS_KEY.queue, []);
    while(q.length){
      await fetch(url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(q[0]) });
      q = jget(CLS_KEY.queue, []); q.shift(); jset(CLS_KEY.queue, q);
    }
  }catch(e){ /* 인터넷이 끊김: 다음에 다시 */ }
  clsSending = false;
}
setInterval(clsFlush, 30000);
window.addEventListener('online', clsFlush);

/* --- 수업 설정 받기·적용 --- */
let clsCfgReady = false;   // 처음 받아 온 설정은 새로 고침 없이 적용
function clsBeforeReload(){

async function clsFetchCfg(){
  const url = clsUrl(); if(!url) return;

    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=config&t=' + Date.now());
    const j = await res.json();
    // 구글 시트의 설정이 기준: 기기마다 시계가 달라도 바뀐 내용이 있으면 그대로 따른다

      if(isStudent() && wasPause !== nc.pause && clsCfgReady){ try{ clsBeforeReload(); location.reload(); return; }catch(e){} }

}
function clsNormCfg(c){ c = c || {}; return { locks:c.locks || {}, buttons:Object.assign({ answer:true, hint:true, pad:true }, c.buttons || {}), pause:!!c.pause, pwHash:c.pwHash || null, updatedAt:c.updatedAt || 0 }; }

/* 정답·풀이 보기, 힌트, 연습장 버튼 잠금 */

/** 로그아웃 확인 팝업 */
function clsAskLogout(){
  const who = isStudent() ? `<b>${clsEsc(cls.user.sid)} ${clsEsc(cls.user.name)}</b>` : '<b>관리자</b>';
  const m = clsModal(`<h3>🚪 로그아웃할까요?</h3>

    <div class="cls-row"><button class="btn" type="button" data-a="no">취소</button><button class="btn primary" type="button" data-a="ok">로그아웃</button></div>`, 'cls-top');

/** 로그아웃: 보낼 기록을 마저 보내고 첫 화면(학생·관리자)으로 */

/* 학번을 바꾸면 이 기기의 학습 기록을 모두 지운다 */
function clsClearRecords(){

    const sid = $('[data-f="sid"]', m).value.trim(), name = $('[data-f="name"]', m).value.trim(), msg = $('[data-p="student"] .cls-msg', m);

    const start = async reload => {
      jset(CLS_KEY.user, { sid, name }); sess.set(CLS_KEY.session, JSON.stringify({ role:'student' }));
      // 이 기기에 내 기록이 없으면: 구글 시트에서 같은 학번·이름의 이전 기록을 불러와 이어서 한다

function clsHasRecords(){ return Object.keys(state.completed || {}).length || Object.keys(state.steps || {}).length || Object.keys(cls.results || {}).length; }

function clsStart(){
  let s = null; try{ s = JSON.parse(sess.get(CLS_KEY.session) || 'null'); }catch(e){}
  cls.role = s ? s.role : null; cls.mode = s ? s.mode || null : null;
  cls.user = jget(CLS_KEY.user, null);
  if(cls.role === 'student' && !cls.user) cls.role = null;
  state.teacher = cls.role === 'admin';
  document.body.classList.toggle('teacher', state.teacher);
  clsApply();
  const L = LESSONS[state.current]; if(L) refreshLessonSteps(L.id);
  if(!isStudent()) clsFetchCfg();   // 관리자 비밀번호·설정도 시트 기준으로 맞춤
  if(!cls.role){ clsLogin(); return; }
  if(isStudent()){ clsFetchCfg(); clsFlush();
    setTimeout(() => { const L = LESSONS[state.current], sec = L && document.getElementById(L.id); if(!sec) return;
      const c = collectLessonSteps(sec)[lessonStepState(L.id).cur]; if(c && !c.card.querySelector('.subtab-host')){ clsEnter(c.card.id); clsFill(c.card.id, c.card); } }, 1500);

    const cur = LESSONS[state.current]; if(cur && !isUnlocked(state.current)) goTo(0); }
}
